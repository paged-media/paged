# Bun configuration for the root workspace (see package.json `workspaces`).
# Bun's version is pinned in /.prototools and in package.json `packageManager`.

[fmt]
# `bun fmt` (tooling/js/fmt.sh; the pinned Bun canary until a stable Bun
# ships it). Prettier 3's defaults, written out so that a later change of a
# default cannot reformat the repository silently. Measured on this code
# (docs/migration/bun-fmt.md): each default rewrites fewer existing lines
# than its alternative (printWidth 80: 34.5k lines; 100: 41.4k; 120: 54.9k).
# What is not formatted, and why: /.prettierignore.
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
jsxSingleQuote = false
quoteProps = "as-needed"
trailingComma = "all"
bracketSpacing = true
bracketSameLine = false
objectWrap = "preserve"
arrowParens = "always"
proseWrap = "preserve"
htmlWhitespaceSensitivity = "css"
embeddedLanguageFormatting = "auto"
endOfLine = "lf"

[install]
# Every package gets its own node_modules with exactly what it declares
# (like pnpm): an undeclared import fails instead of resolving through a
# hoisted copy. Packages live once under node_modules/.bun/.
linker = "isolated"

# A dependency resolves to a workspace package only when it says
# `workspace:`, as with pnpm. Every first-party dependency does: the
# packages reach each other through the workspace and nothing first-party is
# installed from npm (tooling/js/check-workspace-deps.mjs checks the manifests
# and bun.lock). Without this setting, Bun would also link a workspace package
# for a plain version range it happens to satisfy, which would hide a stray
# npm pin instead of failing that check.
linkWorkspacePackages = false
