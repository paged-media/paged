[[test]]
name = "smoke"
path = "tests/smoke.rs"

# The engine workspace's patch of this crate (engine/core/Cargo.toml): a
# `[patch]` belongs to a workspace root, so this root repeats it to build
# the path crates against the same source.
[patch.crates-io]
flo_curves = { git = "https://github.com/drietsch/flo_curves", rev = "b351df8" }

# What ships is a release build: no debug assertions. A dependency's
# `debug_assert!` on a malformed file (avif-parse has them) is not a crash a
# user meets, and it would stop a target at its first input. Overflow checks
# stay on: arithmetic on a size read from a file that wraps is a finding.
# The workflow builds the targets with `cargo fuzz run --release` for the
# same reason (cargo-fuzz turns debug assertions on otherwise).
[profile.dev]
debug-assertions = false
overflow-checks = true

[profile.release]
debug = 1
overflow-checks = true
