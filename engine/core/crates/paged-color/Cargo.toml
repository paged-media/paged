[package]
name = "paged-color"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ICC-based color management. Resolves all paints to linear RGB before GPU handoff."

[lints]
workspace = true

[features]
# The moxcms backend of `cms` (pure Rust, every target): all four intents
# and, through `cms::bpc`, black-point compensation. paged-raster turns it
# on so placed rasters honour both on wasm32; the image module's colour
# adapter uses it for its print lane.
moxcms = ["dep:moxcms"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
# qcms — Mozilla's pure-Rust ICC library that ships in Firefox — is the
# wasm32 paint path and `cms::Backend::Qcms` on every target. Carries CMYK
# + iccv4 behind feature flags.
qcms = { version = "0.3", default-features = false, features = ["cmyk", "iccv4-enabled"] }
moxcms = { version = "0.8.1", optional = true }

# lcms2 is native-only here (C lib via lcms2-sys).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lcms2 = "6"

[dev-dependencies]
paged-test-resources.workspace = true
