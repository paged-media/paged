[package]
name = "paged-color"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ICC-based color management. Resolves all paints to linear RGB before GPU handoff."

[lints]
workspace = true

[features]
# The moxcms backend of `cms` (pure Rust, every target): all four intents
# and, through `cms::bpc`, black-point compensation. paged-raster turns it
# on so placed rasters honour both on wasm32; the image module's colour
# adapter uses it for its print lane.
moxcms = ["dep:moxcms"]

[dependencies]
paged-colour-math = { path = "../paged-colour-math" }
thiserror = { workspace = true }
tracing = { workspace = true }
# qcms — Mozilla's pure-Rust ICC library that ships in Firefox — is the
# wasm32 paint path and `cms::Backend::Qcms` on every target. Carries CMYK
# + iccv4 behind feature flags.
qcms = { version = "0.3", default-features = false, features = ["cmyk", "iccv4-enabled"] }
moxcms = { version = "0.8.1", optional = true }

# lcms2 is native-only here (C lib via lcms2-sys), and always the copy
# lcms2-sys vendors (`static`, engine ADR 003): without it lcms2-sys links
# whatever lcms2 pkg-config finds on the build machine (Homebrew's, a
# distribution's), so the native CMS, and every byte it converts, would
# follow the host instead of Cargo.lock.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lcms2 = { version = "6", features = ["static"] }

[dev-dependencies]
paged-test-resources.workspace = true
