[package]
name = "paged-data-dataset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data variables + data sets (spec §9.9): the named variable declarations (textContent/fileReference/visibility/graphData), captured data sets, and the Illustrator-compatible variable-library XML codec. Clean-room: the wire shape is derived from Adobe's PUBLISHED Variables namespace documentation, never from Illustrator code. Pure model <-> XML; depends ONLY on data-core."

[lib]
# The Rust name it had in modules/data (PM-0014: moved with history; the
# rename to paged_data_dataset is a later mechanical pass).
name = "data_dataset"

[lints]
workspace = true

[dependencies]
paged-data-core = { path = "../paged-data-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
quick-xml = { version = "0.42", default-features = false }