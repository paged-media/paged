[package]
name = "paged-psd-fx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Photoshop at the PSD boundary: layer styles (paged-psd's lfx2 / lmfx model) mapped losslessly onto and off the engine's ordered effect stack (engine ADRs 1008, 1044, 1099), adjustment layers onto RasterOps (engine ADR 1037), and a PSD's layers lowered to page items (engine ADR 1099)."

[lints]
workspace = true

[dependencies]
paged-psd = { path = "../paged-psd" }
paged-model = { path = "../paged-model" }
paged-color = { path = "../paged-color" }
# The 27 blend modes by their PSD keys and model names (engine ADR 1034).
paged-blend = { path = "../paged-blend" }
# A gradient swatch is named by a hash of its stops.
paged-pixel = { path = "../paged-pixel" }
