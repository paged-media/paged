[package]
name = "paged-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "`paged` — the engine on the command line: open, author, render, export, verify."

[[bin]]
name = "paged"
path = "src/main.rs"

[dependencies]
# The document lane. `paged-canvas` brings the CPU rasterizer (its
# default `cpu` feature) and, through it, the renderer, the PDF
# exporter, mutate, store and colour — so this leaf crate can hold every
# subcommand without the dependency cycle that keeps `paged-inspect` and
# `paged-export` in separate binaries.
paged-canvas = { path = "../paged-canvas" }
# The template policy's roles (`template` in the session, engine-serve).
paged-template = { path = "../paged-template" }
# `paged place` names a `PropertyPath` and a `Value` to set the fit and
# the placed image's transform. Both come through `paged-canvas`
# already; naming the crate makes the existing dependency honest rather
# than adding one.
paged-mutate = { path = "../paged-mutate" }
# `paged place --fit` resolves the fit into the image transform with
# `paged_model::fitting`, reading the picture's pixel size from its header
# (`paged_raster::probe`).
paged-model = { path = "../paged-model" }
paged-raster = { path = "../paged-raster" }
# `ElementId::parse` — the address grammar `paged describe` publishes.
paged-wire = { path = "../paged-wire" }
# ADR 132 — `paged set` / `paged get` coerce by the property schemas.
paged-introspect = { path = "../paged-introspect", default-features = false }
# The typed wire door: `WorkerCore::dispatch` is the same code path the
# editor drives, so a CLI built on it cannot express a mutation the
# product cannot.
paged-canvas-wasm = { path = "../paged-canvas-wasm" }
paged-script = { path = "../paged-script" }
paged-color = { path = "../paged-color" }
paged-fidelity = { path = "../paged-fidelity" }
paged-gen = { path = "../paged-gen" }
# Reads the declared `CMYKProfile` off a package's designmap BEFORE the
# load that has to be told about it.
idml-import = { path = "../idml-import" }
clap = { version = "4", features = ["derive"] }
# `paged mcp` and `paged library`: the repository (ADR 180) and the MCP surface.
paged-repo = { path = "../paged-repo" }
paged-mcp = { path = "../paged-mcp" }
# `paged data`: the bindings a document carries, read and applied without
# the data module (core ADR 1014; PM-0015).
paged-data-core = { path = "../paged-data-core" }
paged-data-store = { path = "../paged-data-store" }
paged-data-session = { path = "../paged-data-session" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = "1"
anyhow = { workspace = true }
# `paged data apply --allow-origin`: the image bytes a remote uri names,
# fetched only from the origins a run lists (core ADR 1014, amendment 5).
# A blocking client on rustls with the `ring` provider (no aws-lc-rs: it
# needs cmake and a C toolchain beyond `cc`) and the platform's trust store
# (rustls-native-certs; no bundled root set). Native only: no crate the
# wasm builds depend on reaches these.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[features]
default = ["fetch"]
# Without it the binary has no network client: a remote image stays
# `notHeadless` whatever `--allow-origin` lists.
fetch = ["dep:ureq", "dep:rustls", "dep:rustls-native-certs"]

[dev-dependencies]
paged-test-resources.workspace = true
serde_json = "1"
# `package_folder` reads the packaged IDML back.
zip = { workspace = true }
# `engine_serve` decodes the PNG a render returns.
image = { workspace = true }

[lints]
workspace = true
