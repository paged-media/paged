[package]
name = "paged-data-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data source adapters + capability/consent gate (spec §6.2, §11). The SourceAdapter trait + per-kind adapters, the §11 data-source manifest, and authorize() — the only crate touching network/file capability declarations (spec §4 rule 2). Depends ONLY on data-core."

[lib]
# The Rust name it had in modules/data (PM-0014: moved with history; the
# rename to paged_data_sources is a later mechanical pass).
name = "data_sources"

[lints]
workspace = true

[dependencies]
paged-data-core = { path = "../paged-data-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }