[package]
name = "paged-export-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Print-grade PDF (PDF/X-4) export backend over the resolved display list."

[lints]
workspace = true

[dependencies]
idml-import = { path = "../idml-import" }
paged-compose = { path = "../paged-compose" }
# The CPU rasterizer: Photoshop's blend modes, which PDF cannot name, are
# composited into the raster the page draws instead (engine ADR 1034); the
# effect stack's layer effects (blur, noise, colour adjustment) have no PDF
# operator and are drawn at the export's effect resolution (engine ADR 1008,
# behind `raster-effects`).
paged-gpu = { path = "../paged-gpu", default-features = false, features = ["cpu"] }
paged-renderer = { path = "../paged-renderer", default-features = false }
paged-color = { path = "../paged-color" }
# JPEG sniffing and the frame header of a DCT passthrough (already in the
# tree through paged-renderer).
paged-raster = { path = "../paged-raster" }
paged-model = { path = "../paged-model" }
pdf-writer = "0.15"
subsetter = "0.2"
xmp-writer = "0.3"
ttf-parser = "0.25"
bytes = { workspace = true }
flate2 = "1"
image = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

clap = { version = "4", features = ["derive"], optional = true }
anyhow = { workspace = true, optional = true }
paged-scene = { path = "../paged-scene", optional = true }

[features]
default = ["raster-effects"]
raster-effects = []
# The `paged-export` CLI (kept out of the library consumers' tree —
# paged-canvas links the lib and must not pull clap into wasm).
cli = ["dep:clap", "dep:anyhow", "dep:paged-scene"]

[[bin]]
name = "paged-export"
required-features = ["cli"]

[dev-dependencies]
paged-test-resources.workspace = true
anyhow = { workspace = true }
lopdf = "0.45"
serde_json = "1"
paged-scene = { path = "../paged-scene" }
paged-gen = { path = "../paged-gen" }
zip = { workspace = true }
