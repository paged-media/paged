[package]
name = "paged-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Paged document model — Paged-owned data types + their pure value logic (geometry, token maps); no XML/ZIP parsing."

[lints]
workspace = true

[features]
# Engine ADR 1037 — the `Tsify` and `JsonSchema` derives of the model types
# the wire carries as they are (`RasterOp`); paged-mutate turns them on.
wire = ["dep:tsify-next", "dep:wasm-bindgen"]
schema = ["dep:schemars"]

[dependencies]
paged-pixel = { path = "../paged-pixel" }
# The loss report (capability register C18), re-exported as `report`.
paged-loss = { path = "../paged-loss" }
serde = { workspace = true }
# The theme swatches' colour transforms (engine ADR 1056).
paged-colour-math = { path = "../paged-colour-math" }
# Equations in text: the math tree a paragraph stores (engine ADR 1090).
paged-math = { path = "../paged-math", features = ["serde"] }
base64 = { workspace = true }
# The effect stack's IDML label (engine ADR 1008).
serde_json = "1"
# The wire derives of RasterOp (engine ADR 1037).
tsify-next = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
