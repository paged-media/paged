[package]
name = "paged-loss"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The loss report every importer, exporter and mapper answers with: LossEntry and LossReport. Leaf crate: depends on nothing in the workspace."

[lints]
workspace = true

[features]
# The `Tsify` derives, for a crate whose report rides the wire as it is
# (paged-svg's `SvgReport`).
wire = ["dep:tsify-next", "dep:wasm-bindgen"]

[dependencies]
serde = { workspace = true }
tsify-next = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
