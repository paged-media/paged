[package]
name = "paged-mutate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Operation-based mutation channel for the Paged scene graph. Typed, serializable, invertible Operations + undo/redo + change notification. Consumed by paged-introspect."

[lints]
workspace = true

[features]
# ADR 187 — `schemars::JsonSchema` next to the `Tsify` derive of each type the
# wire's `Mutation` carries; `paged-wire`'s `schema` feature turns it on.
schema = ["dep:schemars"]

[dependencies]
paged-model = { path = "../paged-model" }
paged-scene = { path = "../paged-scene" }
paged-template = { path = "../paged-template" }
serde = { workspace = true }
# Lossless style-delete undo serialises the captured StyleDef to JSON
# (the def is Serialize+Deserialize) and restores it verbatim.
serde_json = "1"
thiserror = { workspace = true }
tsify-next = { workspace = true }
wasm-bindgen = { workspace = true }
schemars = { workspace = true, optional = true }
# Curve-preserving Bezier CSG for Pathfinder ops + foundation for
# future curve-based features (offset / outline-stroke / curve
# simplification). See path_math::bezier_conv for the
# PathAnchor ↔ SimpleBezierPath converters.
# Held at 0.11: kurbo 0.12's new stroker and offsetter change the geometry
# outline stroke and offset path produce (docs/migration/rust-majors.md).
kurbo = "0.11.3"
# Not pinned with `=`: the workspace patches this to a build carrying the
# upstream total-order fix (C-21, see the root Cargo.toml), and an exact pin
# would exclude it. `Cargo.lock` is tracked, so the exact build stays
# reproducible without the `=`.
flo_curves = "0.8"

[dev-dependencies]
idml-import = { path = "../idml-import" }
paged-gen = { path = "../paged-gen" }
paged-renderer = { path = "../paged-renderer" }
paged-compose = { path = "../paged-compose" }
bytes = { workspace = true }
# W1.16 — the anchored-object round-trip test builds an in-memory IDML
# package (anchored frame nested in a story) to drive `Document::open`.
zip = { workspace = true }
# Engine ADR 1018 — the based-on cycle refusal over random style chains.
proptest = { version = "1", default-features = false, features = ["std"] }
