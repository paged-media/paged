[package]
name = "paged-data-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data XLSX reader: one worksheet of an imported .xlsx as a header row plus typed rows, handed to the store (data-store) as typed rows."

[lib]
# The Rust name it had in modules/data (PM-0014: moved with history; the
# rename to paged_data_xlsx is a later mechanical pass).
name = "data_xlsx"

[lints]
workspace = true

[dependencies]
# The one XLSX reader (PM-0017): the workbook's cells, number formats and date
# system come from the sheet model. Without the ODS import.
sheet-xlsx = { path = "../../../../modules/sheet/sheet-xlsx", default-features = false }
sheet-core = { path = "../../../../modules/sheet/sheet-core" }
sheet-format = { path = "../../../../modules/sheet/sheet-format" }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"