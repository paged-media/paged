[package]
name = "paged-perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Realistic performance workloads for the engine: the annual-scale document with real fonts, real images and a threaded story, plus the budget tests and benches that run on it."

[lints]
workspace = true

[dependencies]
paged-canvas = { path = "../paged-canvas" }
paged-gen = { path = "../paged-gen" }
paged-compose = { path = "../paged-compose" }
# The planar-arrangement workload (engine ADR 1019).
paged-model = { path = "../paged-model" }
paged-mutate = { path = "../paged-mutate" }
image = { workspace = true }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }
paged-store = { path = "../paged-store" }
base64 = { workspace = true }
zip = { workspace = true }

[[bench]]
name = "workload"
harness = false

[[bench]]
name = "planar"
harness = false
