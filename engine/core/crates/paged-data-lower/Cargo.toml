[package]
name = "paged-data-lower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data placeholder lowering (spec §9): pure resolved-content -> LoweredContent IR. Variable replacement (§9.1) + single-region dynamic table (§9.3, degraded to tab-text + rules per D-02) + barcode/QR symbol modules (§9.7, the VECTOR lane via data-barcode). Content-space geometry (§9.6 — frame ops honored for free). Pure model->IR; depends on data-core + data-barcode."

[lib]
# The Rust name it had in modules/data (PM-0014: moved with history; the
# rename to paged_data_lower is a later mechanical pass).
name = "data_lower"

[lints]
workspace = true

[dependencies]
paged-data-core = { path = "../paged-data-core" }
paged-data-barcode = { path = "../paged-data-barcode" }
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }