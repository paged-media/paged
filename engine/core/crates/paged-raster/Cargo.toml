[package]
name = "paged-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Raster images: probe, decode and encode (TIFF and DNG through `tiff`'s container, PSD/PSB composites through paged-psd, EPS previews, AVIF, JPEG XL, the web formats through `image`), with colour conversion through paged-color."

[lints]
workspace = true

# The larger decoders, each a feature so a build can leave it out; all on by
# default (the wasm size each costs is in ADR 1005's amendment).
[features]
default = ["avif", "jxl", "exr"]
avif = ["dep:avif-parse", "dep:rav1d"]
jxl = ["dep:jxl-oxide"]
exr = ["image/exr"]

[dependencies]
# TIFF decode and encode (features: the workspace pin).
tiff = { workspace = true }
# PNG, JPEG, WebP, GIF and BMP decode exactly as the renderer always did;
# TGA, QOI, ICO and Radiance HDR are small decoders of the same crate.
image = { workspace = true, features = ["tga", "qoi", "ico", "hdr"] }
# AVIF: the container and the AV1 decoder (feature `avif`).
avif-parse = { workspace = true, optional = true }
rav1d = { workspace = true, optional = true }
# JPEG XL (feature `jxl`).
jxl-oxide = { workspace = true, optional = true }
# JPEG decode that keeps CMYK and YCCK inks (Adobe APP14), and the header
# read the PDF export asks of a JPEG it passes through.
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
# WebP encode with ICC, EXIF and XMP (lossless: image-webp has no lossy
# encoder).
image-webp = { workspace = true }
# The sRGB profile an export embeds (moxcms writes it).
moxcms = { workspace = true }
# PNG iCCP inflation (already in the graph through PNG and TIFF Deflate).
flate2 = { workspace = true }
# CMYK and Lab rasters convert through the engine's one CMS: lcms2 on native,
# moxcms on wasm32 (the `moxcms` feature), both with the frame's intent and
# black-point compensation. Both halves are wasm-safe, see the crate docs.
paged-color = { path = "../paged-color", features = ["moxcms"] }
# PSD/PSB composites and the layer records of PSDs and layered TIFFs.
paged-psd = { path = "../paged-psd" }
# Format sniffing (the leaf crate the IDML writer shares).
paged-sniff = { path = "../paged-sniff" }
# The LZW and DCT decode filters (`filters`): weezl is the LZW of tiff and
# gif, jpeg-decoder the renderer's JPEG decoder (it hands CMYK samples over
# as stored, which a PostScript image's Decode array expects).
weezl = "0.1"
jpeg-decoder = "0.3"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
paged-test-resources.workspace = true
flate2 = { workspace = true }
