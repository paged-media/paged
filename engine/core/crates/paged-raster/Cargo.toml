[package]
name = "paged-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Raster images: probe, decode and encode (TIFF through `tiff`, PSD/PSB composites through paged-psd, the web formats through `image`), with colour conversion through paged-color."

[lints]
workspace = true

[dependencies]
# TIFF decode and encode (features: the workspace pin).
tiff = { workspace = true }
# PNG, JPEG, WebP, GIF and BMP decode exactly as the renderer always did.
image = { workspace = true }
# PNG iCCP inflation (already in the graph through PNG and TIFF Deflate).
flate2 = { workspace = true }
# CMYK and Lab rasters convert through the engine's one CMS: lcms2 on native,
# qcms on wasm32. Both halves are wasm-safe, see the crate docs.
paged-color = { path = "../paged-color" }
# PSD/PSB composites and the layer records of PSDs and layered TIFFs.
paged-psd = { path = "../paged-psd" }
# The LZW and DCT decode filters (`filters`): weezl is the LZW of tiff and
# gif, jpeg-decoder the renderer's JPEG decoder (it hands CMYK samples over
# as stored, which a PostScript image's Decode array expects).
weezl = "0.1"
jpeg-decoder = "0.3"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
paged-test-resources.workspace = true
flate2 = { workspace = true }
