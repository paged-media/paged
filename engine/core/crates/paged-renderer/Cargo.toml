[package]
name = "paged-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Top-level renderer coordinator. The public Rust API surface."

[lints]
workspace = true

[features]
default = ["cpu", "mutate-roundtrip"]
# The `--mutate-roundtrip` conformance hook on the paged-inspect bin.
# OPTIONAL because paged-mutate is an editor crate: the paged-sdk wasm
# (renderer-core only, default-features = false) must never link it —
# the publish-wasm subset audit enforces that boundary.
mutate-roundtrip = ["dep:paged-mutate"]
# Pulls in the CPU rasterizer so `render()` is callable. Disabling this
# leaves only `build()` — useful for WASM builds that rely on a
# different backend. `image` is now a non-optional dep because
# the pipeline decodes placed-image bytes at build_document time.
cpu = ["paged-gpu/cpu"]
# Pulls in the GPU (Vello/wgpu) rasterizer as well, so `paged-inspect
# --backend vello` can render a page through the lane the editor uses
# without a browser. Off by default: it drags wgpu into every build.
gpu = ["paged-gpu/vello-backend"]

[[bin]]
name = "paged-inspect"
path = "src/bin/inspect.rs"
required-features = ["cpu", "mutate-roundtrip"]

[[test]]
name = "inspect_e2e"
required-features = ["mutate-roundtrip"]

[dependencies]
paged-model = { path = "../paged-model" }
# Calendar arithmetic and the English month and day names of the date
# variables (platform/shared/fmt; standard library only).
paged-fmt = { path = "../../../../platform/shared/fmt" }
# Identities only — `PageId`. `default-features = false` keeps
# `paged-mutate` out of this tree, and therefore out of the read-only
# viewer SDK built on it (the publish workflow's subset audit).
paged-wire = { path = "../paged-wire", default-features = false }
idml-import = { path = "../idml-import" }
paged-scene = { path = "../paged-scene" }
# The `.paged` container's native model part (ADR 181): model crates only,
# no mutation engine, so the read-only viewer may open it.
paged-store = { path = "../paged-store" }
paged-flow = { path = "../paged-flow" }
paged-text = { path = "../paged-text" }
paged-color = { path = "../paged-color" }
# Engine ADR 1037 — the image filter stack: the kernel twins, the curve
# spline, the reduction to display size.
paged-kernels = { path = "../paged-kernels" }
paged-pixel = { path = "../paged-pixel" }
paged-resample = { path = "../paged-resample" }
# A placed EPS is drawn from its PostScript (engine ADR 1033).
paged-ps = { path = "../paged-ps" }
paged-compose = { path = "../paged-compose" }
# Live vector effects (engine ADR 1042): an item with vector entries in its
# effect stack is drawn as the item its effected outline describes.
paged-vector-fx = { path = "../paged-vector-fx" }
paged-gpu = { path = "../paged-gpu", default-features = false, features = ["svg"] }
# W3.B2 — IDML save-back, used by the `paged-inspect --roundtrip`
# conformance hook. Lightweight (idml-import + paged-scene + zip +
# quick-xml, all already in the dep graph), no native-only deps.
idml-export = { path = "../idml-export" }
# W4.14 — the operation surface, used by the `paged-inspect
# --mutate-roundtrip` conformance hook (the bin applies one typed
# Operation, saves, and re-verifies it survived). paged-mutate carries
# paged-renderer only as a DEV-dependency, so this regular edge plus its
# dev edge form a dev-only cycle Cargo tolerates.
paged-mutate = { path = "../paged-mutate", optional = true }
# Used by the `paged-inspect --roundtrip` per-entry byte-identity tally
# to walk the re-zipped package. Same wasm-clean config the rest of the
# tree reads zips with.
zip = { workspace = true }
# A placed image whose link is a `data:` URI carries its bytes (ADR 208).
base64 = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
ttf-parser = "0.25"
# A line's drop shadow is cast by its stroke OUTLINE: kurbo strokes the
# centreline into the band the shadow stamps (same version paged-mutate uses).
# Held at 0.11: kurbo 0.12 rewrote the stroker and the curve offsetter, which
# moves the outline-stroke and offset-path geometry paged-mutate writes (the
# draw oracle against Illustrator and the recorded InDesign round trips) and
# the shadow bands drawn here (docs/migration/rust-majors.md).
kurbo = "0.11.3"
# A placed PDF (or Illustrator `.ai`) is interpreted into the display
# list (ADR 154). hayro speaks kurbo 0.13; ours stays on 0.11 (above). Its
# embedded base-14 fonts and CMaps are native-only (below).
hayro-interpret = { version = "0.8", default-features = false }
kurbo13 = { package = "kurbo", version = "0.13" }
serde = { workspace = true }
serde_json = "1"
tsify-next = { workspace = true }
wasm-bindgen = { workspace = true }
image = { workspace = true }
jpeg-decoder = "0.3"
# TIFF decode (and the ICC extraction of JPEG, PNG and TIFF): the decoder
# paged-gpu uses at raster time too, so native and wasm32 agree.
paged-raster = { path = "../paged-raster" }
# SVG parsing; paged-gpu's `svg` feature draws the tree with vello_cpu.
# Pure-Rust, compiles on wasm32. No `text` feature: with no font database
# (the browser sandbox reads no system fonts) usvg drew no SVG text
# anyway, and the feature's shaper cost 0.9 MB in every engine wasm. A
# placed SVG that needs text would take `text` here and in paged-gpu plus
# fonts from the renderer's resolver; most IDML-embedded SVGs are pure
# vector graphics like icons and logos.
usvg = { version = "0.48", default-features = false, features = ["svgz"] }
# The one walk over a usvg tree (engine ADR 1031, plan C9), the raster
# lane's too. No default features: the walk alone.
paged-svg = { path = "../paged-svg", default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# A native build keeps hayro's base-14 fonts and predefined CMaps, so a
# placed PDF that names Helvetica without embedding it still sets its text.
# The browser builds leave them out: they weigh 0.52 MB brotli in the SDK
# wasm, as much again as the interpreter itself (ADR 154).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hayro-interpret = { version = "0.8", default-features = false, features = ["embed-fonts", "embed-cmaps"] }

[dev-dependencies]
paged-test-resources.workspace = true
# The placed-PSD tests write their documents with paged-psd.
paged-psd = { path = "../paged-psd" }
paged-fidelity = { path = "../paged-fidelity" }
paged-flow = { path = "../paged-flow" }
# C1-in-code test (tests/it/c1_no_idml.rs) drives the neutral render pipeline
# (flow -> SceneLayer -> DisplayList -> raster) directly, with no IDML.
paged-compose = { path = "../paged-compose" }
paged-gpu = { path = "../paged-gpu", features = ["cpu"] }
paged-gen = { path = "../paged-gen" }
image = { workspace = true }
zip = { workspace = true }
tempfile = "3"
serde_json = "1"
# Used by the anchored emission test to read the test font's real
# cap-height / x-height / ascent / descent so the vertical-reference
# assertions track the metrics instead of baked magic numbers.
ttf-parser = "0.25"
