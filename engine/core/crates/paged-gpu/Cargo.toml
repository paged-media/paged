[package]
name = "paged-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "wgpu backend and Vello integration. Owns the PathRasterizer trait."

[lints]
workspace = true

[features]
default = ["cpu"]
# The GPU lane: Vello on wgpu. Builds with or without `cpu`; the native
# `paged-inspect --backend vello` and the published wasm (`gpu`) enable it.
vello-backend = ["dep:vello", "dep:wgpu", "dep:image"]
# CPU rasterizer on vello_cpu — the same rendering model as the GPU
# lane (Vello), no GPU required. The path of record: the fidelity gates,
# the CLI, the renderer's pixel tests and the editor's CPU snapshots run
# it.
cpu = ["dep:vello_cpu", "dep:image"]

[dependencies]
paged-compose = { path = "../paged-compose" }
# vello 0.11 / vello_cpu 0.3 / wgpu 30 — current Chrome ships the
# post-2024 WebGPU spec and rejects wgpu < 24's
# `maxInterStageShaderComponents` limit. wgpu is direct-deps so its
# version is explicit; we still use vello for the path rasterizer.
# vello and wgpu move together: each vello release requires one wgpu
# major (0.11 → wgpu ^30), and two wgpu majors in the graph split the
# wgpu types.
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
thiserror = { workspace = true }
tracing = { workspace = true }

vello = { version = "0.11.0", optional = true, default-features = false, features = ["wgpu"] }
# vello_cpu shares vello 0.11's release train: the same peniko 0.6 and
# kurbo 0.13, so one mapping (`vello_map`) feeds both lanes. The u8
# pipeline only (speed, and the smallest wasm); no PNG, no text — the
# display list carries glyphs as outlines.
vello_cpu = { version = "0.3.0", optional = true, default-features = false, features = ["std", "u8_pipeline"] }
image = { workspace = true, optional = true }
wgpu = { version = "30.0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas"] }
# The browser WebGPU backend is gated behind wgpu's `webgpu` feature.
# On wasm32 we always want it on so the worker can talk to
# `navigator.gpu`. Native targets continue using Vulkan / Metal /
# DX12 (wgpu's default features).
wgpu = { version = "30.0.1", optional = true, features = ["webgpu"] }
# Sub-phase D — PNG-readback for offscreen Vello renders (used by the
# fidelity test driver to compare Vello's GPU output against the
# reference PDF). image + futures-channel are wasm-only because
# `surface.rs` is wasm-only.
image = { workspace = true }
futures-channel = { version = "0.3" }

# Build-time WGSL validation for the Vello CMYK-parity compute
# shaders. The cmyk_compute module is gated behind `vello-backend`,
# but cargo doesn't surface a feature-gated `[build-dependencies]`
# table cleanly — the build.rs is a no-op when the shader files are
# absent, so the unconditional dep is benign for non-Vello builds.
[build-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
paged-test-resources.workspace = true
