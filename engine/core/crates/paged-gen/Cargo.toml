[package]
name = "paged-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Test-corpus generator. Emits multi-page mega-files where each page exercises one renderable feature variant; pairs with the InDesign-exported PDF reference + paged-fidelity diff harness."

[lints]
workspace = true

[dependencies]
# The OCF package writer (one owner).
paged-ocf = { path = "../paged-ocf" }
paged-fmt = { path = "../paged-fmt" }
# The oval outline and the circle constant (one owner: paged-geom).
paged-geom = { path = "../paged-geom" }
paged-model = { path = "../paged-model" }
zip = { workspace = true }
flate2 = { workspace = true }
quick-xml = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
blake3 = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
idml-import = { path = "../idml-import" }
paged-scene = { path = "../paged-scene" }
paged-renderer = { path = "../paged-renderer" }
paged-compose = { path = "../paged-compose" }
sha2 = "0.11"

[[bin]]
name = "paged-gen"
path = "src/bin/paged-gen.rs"
