# W0 (paged.web) — standalone on purpose: the Blitz/Stylo tree is huge
# and version-skewed from the workspace; keep it out of our Cargo.lock.
exclude = ["spikes/blitz-wasm", "vendor/vello_shaders"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
needless_pass_by_value = "allow"
too_many_arguments = "allow"

# Shared dependency versions. Individual crates pick what they need.
# Versions are intentionally conservative pins; bump during Phase 0.
[workspace.dependencies]
# Optional test resources (GPU, corpus, profiles, ...): the one skip
# convention, docs/development/testing.md. Dev-dependency only.
paged-test-resources = { path = "../../platform/shared/test-resources" }
thiserror = "2"
anyhow = "1"
bytes = "1"
# zip 9's `deflate` feature turns on flate2's zlib-rs backend (and zopfli),
# and flate2 picks one backend for the whole graph, PDF export and PNG
# included. Take `deflate-flate2` instead and ask for flate2's
# `rust_backend` as zip 2's `deflate` did, so flate2's feature set, and
# with it every deflated byte, stays what it was. Crates that depend on
# `zip` list `flate2` beside it. One crate outside our control adds a
# backend: hayro-syntax (placed PDFs, through paged-renderer) turns on
# flate2's `zlib-rs`, and flate2 prefers zlib-rs to miniz_oxide when both are
# on. So a build that includes paged-renderer (the canvas wasm, paged-cli, a
# workspace test run) deflates with zlib-rs, and one without it
# (`-p idml-export` alone) with miniz_oxide; it was so before zip 9 as well.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
# TIFF decode and encode for paged-raster. The
# features are the ones `image`'s own `tiff` feature turns on (deflate, fax,
# jpeg, lzw), so the graph keeps one build of the crate.
tiff = { version = "0.11", default-features = false, features = ["deflate", "fax", "jpeg", "lzw"] }
base64 = "0.23"
# CRC-32 (PNG chunks, zip entries): the build zip and flate2 already use.
crc32fast = "1.5"
# paged-raster's JPEG decode keeps a CMYK/YCCK JPEG's inks (zune-jpeg, the
# decoder `image` itself uses, so the graph keeps one build of it), its WebP
# encode writes ICC, EXIF and XMP (image-webp, `image`'s WebP crate), and its
# sRGB profile is moxcms's (`image`'s CMS crate). None is a new crate in the
# tree (ADR 1005, amendment of 2026-10-25).
zune-jpeg = "0.5"
zune-core = "0.5"
image-webp = "0.2"
moxcms = "0.8"
# paged-raster's optional decoders (ADR 1005, amendment of 2026-10-24).
# AV1 for AVIF: rav1d (BSD-2-Clause), the Rust port of dav1d, in the build
# published as `sqzer-rav1d`, upstream main with the safe Rust API and a
# wasm32-unknown-unknown build (rav1d 1.1 and re_rav1d do not compile for
# wasm32). No assembly (no nasm), so the default features stay off.
rav1d = { package = "sqzer-rav1d", version = "0.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# The AVIF (HEIF) container (MPL-2.0).
avif-parse = "2.1"
# JPEG XL (MIT OR Apache-2.0); without rayon (wasm32 has no threads).
jxl-oxide = { version = "0.12", default-features = false }
# paged-raster's encoders of WP9.4 (engine ADR 1038). JPEG XL, lossless
# (modular): zune-jpegxl (MIT OR Apache-2.0 OR Zlib), pure Rust, on the
# zune-core already in the tree, without its thread feature (wasm32).
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
# AVIF encode (feature `avif-encode` of paged-raster, off by default):
# ravif (BSD-3-Clause) over rav1e (BSD-2-Clause), without assembly (no
# nasm) and without rayon.
ravif = { version = "0.13", default-features = false }
tsify-next = { version = "0.5", default-features = false, features = ["js"] }
# ADR 187 — the wire's JSON Schema, derived next to the `Tsify` derives behind
# each crate's optional `schema` feature. Never on in a wasm build.
schemars = "1.2.3"
wasm-bindgen = "0.2"
# paged.publish's PDF page reader (pdf-import): the engine's own PDF interpreter
# (engine ADR 154) at the engine's version, hayro's geometry, and the PNGs the
# page's images become. No embedded base-14 fonts or CMaps: the bundle's text
# comes from PDFium.
hayro-interpret = { version = "0.8", default-features = false }
kurbo = "0.13"
png = "0.18"
# The fontations stack, pinned once (engine ADR 1058): shaping (harfrust) and glyph
# outlines and metrics (skrifa) of paged-text, image-js and pptx-fonts.
harfrust = "0.14"
skrifa = "0.48"
# paged.draw's image-trace kernel, the colour clustering, path walking and spline
# fitting under vtracer (MIT/Apache-2.0). It pulls bit-vec, num-traits and
# flo_curves 0.3. READ THIS BEFORE BUMPING: the engine's [patch] below replaces
# flo_curves 0.8 for a real abort (the point sort in `GraphPath::exterior_paths`
# is not a strict weak ordering). That defect is not reachable from here:
# visioncortex touches flo_curves only in `src/point.rs` (trait impls on its own
# Point2) and `src/path/smooth.rs` (`Curve::fit_from_points`, the Schneider
# curve fitter), never a `GraphPath` or a boolean, and 0.3.1 has no epsilon
# `sort_by` at all. The patch needs 0.8, so it does not apply to 0.3 either way.
visioncortex = "0.9.1"
# DXF interchange (draw ADR 364). MIT. Reads ASCII and binary DXF, writes ASCII;
# its own entity model, nothing else of ours depends on it.
dxf = "0.6.2"
console_error_panic_hook = "0.1"
# paged.data's wasm surface and tests (modules/data). serde_json is NOT here:
# data's crates need `float_roundtrip` (every f64 parses back to the exact bits it
# was written from), so they name it themselves and the feature is not unified into
# crates that do not use it.
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
# YAML for the registry rows: the maintained fork of serde_yaml 0.9 (same parser,
# same Value) on unsafe-libyaml-norway; serde_yaml is unmaintained (RUSTSEC-2024-0449).
serde_norway = "0.9"
proptest = "1"
# paged.image (modules/image). The engine's pixel and PSD crates under the names
# the image crates use (image ADR 466).
image-core = { path = "crates/paged-pixel", package = "paged-pixel" }
image-psd = { path = "crates/paged-psd", package = "paged-psd" }
paged-resample = { path = "crates/paged-resample" }
paged-kernels = { path = "crates/paged-kernels" }
paged-raster = { path = "crates/paged-raster" }
paged-color = { path = "crates/paged-color" }
paged-warp = { path = "crates/paged-warp" }
paged-math = { path = "crates/paged-math" }
paged-blend = { path = "crates/paged-blend" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
half = { version = "2", features = ["bytemuck"] }
pollster = "1"
wgpu = "30.0.1"
naga = { version = "30", features = ["wgsl-in"] }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
zune-png = "0.5"
# paged.doc (modules/doc)
docx-core = { path = "../../modules/doc/docx-core" }
docx-import = { path = "../../modules/doc/docx-import" }
docx-lower = { path = "../../modules/doc/docx-lower" }
docx-export = { path = "../../modules/doc/docx-export" }
docx-rtf = { path = "../../modules/doc/docx-rtf" }
docx-odt = { path = "../../modules/doc/docx-odt" }
docx-js = { path = "../../modules/doc/docx-js" }
docx-skeleton = { path = "../../modules/doc/docx-skeleton" }
# paged.slide (modules/slide)
dml-native = { path = "../../platform/shared/dml-native" }
pptx-export = { path = "../../modules/slide/pptx-export" }
pptx-core = { path = "../../modules/slide/pptx-core" }
pptx-import = { path = "../../modules/slide/pptx-import" }
pptx-fonts = { path = "crates/pptx-fonts" }
slide-geom = { path = "../../platform/shared/dml-geom", package = "dml-geom" }
slide-chart = { path = "../../modules/slide/slide-chart" }
slide-sheet = { path = "../../modules/slide/slide-sheet" }
slide-resolve = { path = "../../modules/slide/slide-resolve" }
slide-native = { path = "../../modules/slide/slide-native" }
slide-js = { path = "../../modules/slide/slide-js" }
slide-anim = { path = "../../modules/slide/slide-anim" }
slide-output = { path = "../../modules/slide/slide-output" }
# paged.sheet (modules/sheet)
compact_str = { version = "0.10", features = ["serde"] }
smallvec = "1"
rustc-hash = "2"
plotters = { version = "0.3", default-features = false, features = ["histogram", "line_series", "area_series", "point_series"] }
plotters-backend = { version = "0.3", default-features = false }
ryu = "1"
# W1.24 (audit B17) — benchmark harness (dev-only). `html_reports` is
# off: the bench lane is local + CI-smoke, not a report-publishing gate,
# and the gnuplot/plotters report deps bloat the dev build for no value
# in `make bench`. Declared at the workspace level so any crate that
# grows a bench picks the same pin.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

# The model crates as workspace dependencies, for the IDML adapter crates,
# which name them with `workspace = true`. Paths are relative to this file.
# The other crates spell the same path directly (`path = "../paged-model"`);
# both resolve to the one package.
paged-model = { path = "crates/paged-model" }
paged-loss = { path = "crates/paged-loss" }
paged-scene = { path = "crates/paged-scene" }
paged-store = { path = "crates/paged-store" }
paged-pdf-annots = { path = "crates/paged-pdf-annots" }
paged-pdf-page = { path = "crates/paged-pdf-page" }
# The engine's SVG crate, for paged.draw's one walk over a usvg tree (engine ADR
# 1031, plan item C9) and its paint reader: no default features, so neither the
# mutation engine nor usvg's text shaper is linked. (The engine's own crates
# spell the path directly with their default features.)
paged-svg = { path = "crates/paged-svg", default-features = false }
idml-import = { path = "crates/idml-import" }

# C-21 — flo_curves upstream fix, pinned until it is released.
#
# `GraphPath::exterior_paths()` orders the graph's points with a comparator
# that compares x against a tolerance, which is not transitive — so it is not
# a valid strict weak ordering and `sort_by` panics on it ("user-provided
# comparison function does not correctly implement a total order"). Every
# boolean ends in that call, and `panic = abort` in the wasm worker means we
# cannot catch it. Upstream PR: Logicalshift/flo_curves#33.
#
# The pin also carries a second fix of the same class: `ray_collisions()` (the
# ray casts of `path_remove_interior_points`, so every path offset) ordered its
# collisions with a tolerance-based, non-transitive comparison. Its collisions
# are now sorted by position with `total_cmp` and only runs of coincident
# collisions are settled with an insertion sort. The point snap does not help
# there (the collisions are computed, not input). Fork branch
# fix/ray-collisions-total-order, regression test in paged-vector-fx.
#
# Pinned to a REV, not a branch, so a force-push cannot change what we build.
# REMOVE THIS BLOCK when the fix reaches a crates.io release: drop it, raise
# the `flo_curves` version pin, and re-lock. `paged-mutate`'s BOOLEAN_GRID
# snap stays either way — it is defence in depth, and it is what protects a
# build that does not carry this patch.
[patch.crates-io]
flo_curves = { git = "https://github.com/drietsch/flo_curves", rev = "b351df8" }
# vello_shaders 0.11.0 with one change to `shader/fine.wgsl`: an image is
# sampled in image space and its atlas offset is added to the integer texel
# index, so where Vello's persistent image atlas happens to place a picture
# cannot change its pixels (ADR 209). Upstream adds the offset to the f32
# sample position before taking `fract`, which drops fraction bits as the
# offset grows. REMOVE THIS BLOCK when a vello_shaders release samples in
# image space: drop it and `vendor/vello_shaders`, then re-lock.
vello_shaders = { path = "vendor/vello_shaders" }

# Bench builds keep line tables, so `samply` / Instruments name the
# engine's functions (crates/paged-perf/README.md). Optimisation is
# release's; only debug info is added, and only to benches.
[profile.bench]
debug = 1

# The published wasm packages (publish-wasm.yml: canvas-wasm,
# introspect-wasm, sdk). One codegen unit and whole-program LTO let the
# optimiser see across every crate before `wasm-opt -Oz` runs, which is
# what keeps the editor's whole-app wasm budget. Native release builds
# keep `release` (fast to link, and what the tests and benches use).
# Output lands in `target/wasm32-unknown-unknown/wasm-release/`.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1

# The shipped paged.draw wasm (modules/draw/scripts/build-wasm.sh): size first,
# and no unwinding. A profile applies to the whole build, so it is named, and the
# module's script selects it.
[profile.wasm-data]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.wasm-draw]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The shipped wasm (scripts/build-wasm.sh --profile wasm-sheet). Named, not
# `release`, so the settings stay with this artifact when the module joins the
# one Cargo workspace (docs/development/one-workspace.md): profiles live only
# in the root manifest there, and `release` is the engine's.
[profile.wasm-sheet]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# The shipped wasm (scripts/build-wasm.sh --profile wasm-slide). Named, not
# `release`, so the settings stay with this artifact when the module joins the
# one Cargo workspace (docs/development/one-workspace.md): profiles live only
# in the root manifest there, and `release` is the engine's.
[profile.wasm-slide]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.wasm-slide.package.paged-model]
opt-level = "z"

[profile.wasm-slide.package.paged-scene]
opt-level = "z"

[profile.wasm-slide.package.paged-store]
opt-level = "z"

[profile.wasm-slide.package.slide-native]
opt-level = "z"

# The shipped wasm (scripts/build-wasm.sh). Size-first codegen for ooxmlsdk
# alone, the typed OOXML DOM and its generated (de)serializers, takes the
# artifact under the manifest's `maxBytes` (8 MiB): about 17 % smaller,
# with the same load cost per document (measured on a 4 MB document.xml).
# `opt-level = "z"` for the whole build is only 1 % smaller again and loads
# about a fifth slower.
[profile.wasm-doc]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.wasm-doc.package.ooxmlsdk]
opt-level = "z"

# The native skeleton's model serializer (ADR 606): size-first codegen for
# the engine's model crates, which the skeleton only builds and writes once
# per open.
[profile.wasm-doc.package.paged-model]
opt-level = "z"

[profile.wasm-doc.package.paged-scene]
opt-level = "z"

# The native body builder (doc ADR 625) runs once per open, like the model
# crates it builds: size-first codegen keeps the doc wasm under its manifest
# ceiling.
[profile.wasm-doc.package.docx-skeleton]
opt-level = "z"

[profile.wasm-doc.package.paged-store]
opt-level = "z"
