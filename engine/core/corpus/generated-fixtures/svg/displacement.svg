<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <defs>
    <linearGradient id="ramp" x1="0" x2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#ff80ff"/></linearGradient>
  </defs>
  <!-- A wobble: the art pushed around by noise. -->
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" seed="5" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="12" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- A shear: the art moved up or down by its own red channel. -->
  <filter id="shear" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
    <feDisplacementMap in="SourceGraphic" in2="SourceGraphic" scale="30" xChannelSelector="A" yChannelSelector="R"/>
  </filter>
  <g filter="url(#wobble)"><rect x="15" y="20" width="100" height="80" fill="none" stroke="#205080" stroke-width="6"/><circle cx="65" cy="60" r="14" fill="#e0a020"/></g>
  <g filter="url(#shear)"><rect x="140" y="30" width="80" height="60" fill="url(#ramp)"/></g>
</svg>
