<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <!-- A swatch built from a flood and the art, then repeated over the filter region. -->
  <filter id="tiles" x="0" y="0" width="1" height="1" primitiveUnits="userSpaceOnUse">
    <feFlood flood-color="#88aa44" x="10" y="10" width="18" height="18" result="cell"/>
    <feOffset in="SourceGraphic" dx="0" dy="0" x="10" y="10" width="30" height="30" result="bit"/>
    <feMerge x="10" y="10" width="30" height="30" result="swatch"><feMergeNode in="cell"/><feMergeNode in="bit"/></feMerge>
    <feTile in="swatch"/>
  </filter>
  <filter id="srgb-tiles" x="0" y="0" width="1" height="1" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feFlood flood-color="#cc6644" x="110" y="10" width="14" height="22" result="cell"/>
    <feTile in="cell"/>
  </filter>
  <g filter="url(#tiles)"><rect x="10" y="10" width="80" height="100" fill="none"/><circle cx="25" cy="25" r="7" fill="#663366"/></g>
  <g filter="url(#srgb-tiles)"><rect x="110" y="10" width="80" height="100" fill="#000"/></g>
</svg>
