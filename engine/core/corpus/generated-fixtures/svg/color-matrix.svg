<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="rainbow" x1="0" x2="1">
      <stop offset="0" stop-color="#ff0000"/><stop offset="0.33" stop-color="#ffff00"/>
      <stop offset="0.66" stop-color="#00ccff"/><stop offset="1" stop-color="#cc00ff"/>
    </linearGradient>
    <g id="art">
      <rect width="100" height="60" fill="url(#rainbow)"/>
      <circle cx="30" cy="30" r="18" fill="#33aa33" fill-opacity="0.8"/>
      <rect x="55" y="15" width="30" height="30" fill="#000000" fill-opacity="0.5"/>
    </g>
  </defs>
  <filter id="sepia"><feColorMatrix type="matrix" values="0.393 0.769 0.189 0 0  0.349 0.686 0.168 0 0  0.272 0.534 0.131 0 0  0 0 0 1 0"/></filter>
  <filter id="sat"><feColorMatrix type="saturate" values="0.25"/></filter>
  <filter id="hue"><feColorMatrix type="hueRotate" values="120"/></filter>
  <filter id="luma"><feColorMatrix type="luminanceToAlpha"/></filter>
  <use href="#art" x="10" y="10" filter="url(#sepia)"/>
  <use href="#art" x="130" y="10" filter="url(#sat)"/>
  <use href="#art" x="10" y="90" filter="url(#hue)"/>
  <use href="#art" x="130" y="90" filter="url(#luma)"/>
</svg>
