<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <clipPath id="circle"><circle cx="40" cy="40" r="30"/></clipPath>
    <clipPath id="star" clip-rule="evenodd"><path clip-rule="evenodd" d="M120 10 L138 66 L90 31 L150 31 L102 66 Z"/></clipPath>
    <clipPath id="bbox" clipPathUnits="objectBoundingBox"><rect x="0.1" y="0.1" width="0.8" height="0.35"/><rect x="0.1" y="0.55" width="0.8" height="0.35"/></clipPath>
    <clipPath id="inner"><rect x="170" y="0" width="45" height="80"/></clipPath>
    <clipPath id="nested" clip-path="url(#inner)"><circle cx="200" cy="40" r="32"/></clipPath>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="lum" maskContentUnits="userSpaceOnUse"><rect x="10" y="90" width="100" height="60" fill="url(#fade)"/></mask>
    <mask id="alpha" style="mask-type:alpha"><circle cx="175" cy="120" r="30" fill="#000" fill-opacity="0.6"/><circle cx="175" cy="120" r="14" fill="#000"/></mask>
    <pattern id="checks" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#333"/><rect x="5" y="5" width="5" height="5" fill="#333"/></pattern>
  </defs>
  <rect x="0" y="0" width="80" height="80" fill="url(#checks)" clip-path="url(#circle)"/>
  <rect x="85" y="5" width="70" height="70" fill="#d04040" clip-path="url(#star)"/>
  <g clip-path="url(#nested)"><rect x="160" y="0" width="80" height="80" fill="#4060d0"/></g>
  <rect x="10" y="90" width="100" height="60" fill="#208040" mask="url(#lum)"/>
  <g mask="url(#alpha)" opacity="0.8"><rect x="140" y="85" width="70" height="70" fill="#d08020"/><rect x="175" y="85" width="35" height="70" fill="#8020d0"/></g>
  <rect x="215" y="90" width="20" height="60" fill="#000" clip-path="url(#bbox)"/>
</svg>
