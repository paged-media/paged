<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <defs>
    <g id="mark" fill="none" stroke="#202060" stroke-width="5">
      <path d="M10 50 L30 10 L50 50 M18 34 H42"/>
      <circle cx="80" cy="30" r="18"/>
    </g>
  </defs>
  <filter id="erode" x="-10%" y="-10%" width="120%" height="120%"><feMorphology operator="erode" radius="1.5"/></filter>
  <filter id="dilate" x="-20%" y="-20%" width="140%" height="140%"><feMorphology operator="dilate" radius="3 1"/></filter>
  <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="fat"/>
    <feFlood flood-color="#e04040"/><feComposite in2="fat" operator="in" result="red"/>
    <feMerge><feMergeNode in="red"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <use href="#mark" x="5" y="5" filter="url(#erode)"/>
  <use href="#mark" x="125" y="5" filter="url(#dilate)"/>
  <use href="#mark" x="65" y="62" filter="url(#outline)"/>
</svg>
