<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs><rect id="sq" width="36" height="36" fill="#d03030" fill-opacity="0.85"/></defs>
  <!-- in2: the same square moved and turned blue; in: the source. -->
  <filter id="over" x="-10%" y="-10%" width="160%" height="160%"><feOffset dx="14" dy="14" result="o"/><feColorMatrix in="o" type="hueRotate" values="220" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  <filter id="in" x="-10%" y="-10%" width="160%" height="160%"><feOffset dx="14" dy="14" result="o"/><feColorMatrix in="o" type="hueRotate" values="220" result="b"/><feComposite in="SourceGraphic" in2="b" operator="in"/></filter>
  <filter id="out" x="-10%" y="-10%" width="160%" height="160%"><feOffset dx="14" dy="14" result="o"/><feColorMatrix in="o" type="hueRotate" values="220" result="b"/><feComposite in="SourceGraphic" in2="b" operator="out"/></filter>
  <filter id="atop" x="-10%" y="-10%" width="160%" height="160%"><feOffset dx="14" dy="14" result="o"/><feColorMatrix in="o" type="hueRotate" values="220" result="b"/><feComposite in="SourceGraphic" in2="b" operator="atop"/></filter>
  <filter id="xor" x="-10%" y="-10%" width="160%" height="160%"><feOffset dx="14" dy="14" result="o"/><feColorMatrix in="o" type="hueRotate" values="220" result="b"/><feComposite in="SourceGraphic" in2="b" operator="xor"/></filter>
  <filter id="arith" x="-10%" y="-10%" width="160%" height="160%"><feOffset dx="14" dy="14" result="o"/><feColorMatrix in="o" type="hueRotate" values="220" result="b"/><feComposite in="SourceGraphic" in2="b" operator="arithmetic" k1="0.5" k2="0.6" k3="0.6" k4="0.05"/></filter>
  <use href="#sq" x="10" y="10" filter="url(#over)"/>
  <use href="#sq" x="90" y="10" filter="url(#in)"/>
  <use href="#sq" x="170" y="10" filter="url(#out)"/>
  <use href="#sq" x="10" y="90" filter="url(#atop)"/>
  <use href="#sq" x="90" y="90" filter="url(#xor)"/>
  <use href="#sq" x="170" y="90" filter="url(#arith)"/>
</svg>
