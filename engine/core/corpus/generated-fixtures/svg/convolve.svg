<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80" viewBox="0 0 240 80">
  <defs>
    <g id="pic"><rect width="60" height="60" fill="#3388cc"/><circle cx="30" cy="30" r="20" fill="#ffcc33"/><rect x="22" y="22" width="16" height="16" fill="#cc3333"/></g>
  </defs>
  <filter id="emboss"><feConvolveMatrix order="3" kernelMatrix="-2 -1 0 -1 1 1 0 1 2"/></filter>
  <filter id="edges"><feConvolveMatrix order="3" kernelMatrix="0 1 0 1 -4 1 0 1 0" preserveAlpha="true" bias="0.5"/></filter>
  <filter id="sharpen"><feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" edgeMode="duplicate"/></filter>
  <use href="#pic" x="10" y="10" filter="url(#emboss)"/>
  <use href="#pic" x="90" y="10" filter="url(#edges)"/>
  <use href="#pic" x="170" y="10" filter="url(#sharpen)"/>
</svg>
