# Cargo settings for every Rust workspace in this repository (engine/core,
# modules/*, apps/server, …). Cargo reads this file from the current directory
# upwards, so it applies wherever a build starts below the root.
# Why each setting is here, and how much it saves: docs/development/rust-builds.md.
#
# Linkers and wrappers are set with `linker` / `rustc-wrapper`, never with
# `rustflags`: a RUSTFLAGS environment variable (CI sets `-Dwarnings`) replaces
# config rustflags instead of adding to them, and would silently drop them.
# Relative program paths here resolve against the repository root.

[build]
# sccache when it is installed, plain rustc otherwise.
rustc-wrapper = "tooling/rust/rustc-wrapper"

# macOS: Apple's ld (faster than the toolchain's lld here; PAGED_LINKER=lld
# opts in to lld). Linux: mold when installed (CI installs it). wasm32 keeps
# rust-lld. The link-only numbers: docs/migration/ci-speed.md, lever 5.
[target.aarch64-apple-darwin]
linker = "tooling/rust/cc-macos"

[target.x86_64-apple-darwin]
linker = "tooling/rust/cc-macos"

[target.x86_64-unknown-linux-gnu]
linker = "tooling/rust/cc-mold"

[target.aarch64-unknown-linux-gnu]
linker = "tooling/rust/cc-mold"

# Debug and test builds. The opt-level and codegen-units values are Cargo's
# defaults, stated so the whole profile reads in one place.
[profile.dev]
opt-level = 0
debug = 1 # limited: line tables and functions, no variables; smaller, faster links
codegen-units = 256

# Dependencies are compiled once and then reused, so they get optimised; the
# workspace's own crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# Local, opt-in wasm builds (PAGED_WASM_PROFILE=dev; docs/development/rust-builds.md,
# "Fast local wasm builds"). Nothing in CI or a release uses this profile: the
# wasm build scripts refuse it under CI. Parallel codegen, no cross-crate LTO
# and incremental workspace crates trade size and some speed for a link that is
# not single-threaded. Output lands in `target/wasm32-unknown-unknown/wasm-dev/`.
[profile.wasm-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
debug = false
