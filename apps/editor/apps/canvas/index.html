<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to paged.</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        overflow: hidden;
        /* The page is the editor's (src/entry.tsx mirrors its theme onto
           <html>): its canvas wears the editor's surface, also where an
           element paints past the editor's root. */
        background: hsl(var(--paged-bg));
      }
      @keyframes paged-canvas-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
