name: tests

# Editor Playwright surface → state-matrix evidence (W0.5).
#
# Decision-B model: the engine wasm ships in the published
# `@paged-media/canvas-wasm` package, so `pnpm install` is the whole
# engine setup — no `core` checkout, no build-from-source bridge. The
# vite dev server (spawned by playwright.config's `webServer`) sets the
# COOP/COEP headers SharedArrayBuffer needs; that middleware runs in the
# server process and works headless, so the chromium runner gets a
# cross-origin-isolated context with no extra flags.
#
# Plugin bundles: `apps/canvas/package.json` consumes every plugin package
# (@paged-media/plugin-api, plugin-sdk, draw, web, data, sheet, image,
# publish, pdf) as PUBLISHED npm versions — the historical pnpm `link:`
# sibling chain is gone, so `pnpm install` alone resolves all plugins with
# no sibling checkouts. (The link:-era sibling checkout/install lattice —
# and the build-image-wasm artifact lane — are gone: every published
# bundle is self-contained, @paged-media/image ships its own wasm.)
#
# Scope: the behaviour surface (panels + gesture + e2e op-sandwiches),
# NOT the Envato fidelity gate. That gate needs the 4.4 GB
# `corpus/idml` LFS packs, their InDesign reference PDFs, poppler's
# `pdftoppm`, and the `paged-diff` Rust binary built from a `core`
# checkout — none of which the package-boundary runner carries. It stays
# a local / core-CI concern; `PAGED_CI_LEAN=1` drops `fidelity.spec.ts`
# + `extensive-corpus.spec.ts` from collection (both read the envato
# manifest at import time). The lean surface (~412 tests) still needs the
# small license-clear `corpus/idml/generated` fixtures + `corpus/fonts`, which
# the harness loads — those come from a sparse LFS checkout of the
# private `paged-media/corpus` repo (≈25 MB, not the 4.4 GB envato tier).
#
# Sharding: playwright.config pins workers:1 (snapshot determinism), so
# the ~20-25 min surface is split across 3 shards (~7-9 min each + setup)
# via `--shard`, each emitting a `blob` report. A final job merges the
# blobs into one Playwright JSON and uploads it as the `playwright-results`
# artifact. The private `paged-media/state` repo PULLS that artifact
# (siblings-pull.yml), converts it to contract-v1, applies
# `ingest/test-map.yaml` plus the journeys' inline `@feat:` tags, and
# gates feature ids against the registry. See the step comment at the
# hand-off for why the direction is inverted.

on:
  push:
    # feat/plugin-panel-surfaces added 2026-08-18: main is frozen (standing
    # branch decision, 2026-07-26) while development lives on this branch,
    # so main-only push triggers meant NO fresh playwright-results artifact
    # ever reached the state matrix — every editor evidence lane starved.
    # The state puller accepts this branch via the artifacts.yaml `branch`
    # override. Remove the extra branch here (and there) when the branch
    # merges.
    branches: [main, feat/plugin-panel-surfaces]
  pull_request:
    paths:
      - "apps/canvas/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "eslint.config.mjs"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARDS: 3

jobs:
  # Static guards that need only the editor repo itself — no plugin
  # siblings, no corpus/core checkout, no browser. These scripts all
  # EXISTED but ran in no CI job (audit 02 E8'): the ESLint architecture
  # boundaries (eslint.config.mjs — worker/shell/client/gesture-spine
  # zones) + their self-test, the boot-time cross-origin-isolation check
  # (the COOP/COEP contract SharedArrayBuffer needs), and the
  # fidelity-thresholds JSON schema guard (every gated pack has an entry,
  # so the gate can't silently skip). They're fast (seconds) and depend
  # only on the root devDependencies, so a plain editor checkout + root
  # frozen install is the whole setup.
  checks:
    name: checks (lint + boundaries + boot-coi + thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The editor is checked out at the workspace ROOT here, so
      # action-setup reads its `packageManager: pnpm@9.0.0` directly. Do
      # NOT also pass a `version:` input — pnpm/action-setup@v4 errors
      # ("Multiple versions of pnpm specified: ERR_PNPM_BAD_PM_VERSION")
      # when both a `version` input and a readable `packageManager` field
      # are present. The playwright/publish jobs below DO pass `version: 9`
      # precisely because they check the editor out under `editor/`, where
      # the workspace root has no package.json to read.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install (editor root)
        run: pnpm install --frozen-lockfile

      # ESLint architecture boundaries (eslint.config.mjs is boundaries-only,
      # not style) + the fixtures proving each zone actually fires.
      - name: lint (architecture boundaries)
        run: pnpm lint

      - name: lint boundaries self-test
        run: pnpm lint:boundaries-selftest

      # The COOP/COEP boot contract SharedArrayBuffer needs (pairs with
      # apps/canvas/public/_headers).
      - name: boot cross-origin-isolation check
        run: pnpm test:boot-coi

      # Every gated fidelity pack must carry a threshold entry, or the
      # fidelity gate silently skips it.
      - name: fidelity thresholds schema
        run: pnpm test:thresholds

      # The app-wide wasm budget: 100 MB for the editor AND every plugin
      # together (2026-08-19). Every other wasm ceiling in the platform is
      # per-artifact or per-bundle, so until now nothing measured the sum —
      # eight bundles could each pass their own gate and the app could still
      # ship a quarter of a gigabyte. This job is the only place that sees
      # the whole assembled app, so this is where the sum is checked.
      - name: app-wide wasm budget (100 MB, editor + all plugins)
        # `--json-out` writes the measurement artifact as a SIDE EFFECT and
        # still exits on the budget. Deliberately not `--json | tee`: a pipe
        # replaces this step's exit code with tee's, which would turn the
        # budget gate into a gate that always passes.
        run: pnpm test:wasm-budget --json-out "$RUNNER_TEMP/paged-measurements-wasm.json"

      # The number, kept. The gate above answers "are we under 100 MB today";
      # only a series answers "which way is it moving, and how fast". Uploaded
      # `if: always()` because a FAILING run's number is precisely the one
      # worth having in the trend.
      - name: upload wasm measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paged-measurements-wasm
          path: ${{ runner.temp }}/paged-measurements-wasm.json
          if-no-files-found: warn
          retention-days: 90
      # Every panel / tool / keybinding / menu item the host registers, and
      # every contribution the loaded plugin bundles inject, must be named
      # by some spec or sit under a per-kind ceiling that only ever falls.
      - name: editor surface coverage
        run: pnpm test:surface-coverage
      # A seam may not outlive the gap it names: a capability lands and
      # the UI still says it is missing, which is the same lie as
      # claiming an unbuilt feature works, only harder to notice.
      - name: seam guard
        run: pnpm test:seam-guard
      # One vocabulary for "this doesn't apply here". The four rules that
      # existed were four independent reasonable decisions, which is why
      # no review caught them — there was nothing for them to disagree with.
      - name: applicability vocabulary
        run: pnpm test:applicability

  playwright:
    name: playwright (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # 50, not 30: the COLD (uncached) paged-gen fixture-generator build
    # consumed most of a 30-min budget, leaving no room for the sharded
    # tests. After run 1 `core/target` is cached and the job drops back to
    # ~20-25 min; the headroom only matters on a cold cache.
    #
    # Then 75, not 50: that budget was never actually exercised — the job
    # had never once reached its tests (see the chromium note below), so
    # "~20-25 min" described a job that spent its life in `apt`. A second
    # cold rust build (the paged.doc engine wasm) now shares it too. The
    # long steps carry their OWN bounds — chromium install 10 min, doc
    # wasm 25 min — so a hang still reports as a hang at the step that
    # hung, and this number only buys the tests room to finish. Re-measure
    # and bring it back down once a green run says what the suite costs.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # The editor goes under `editor/` (not the workspace root) so the
      # corpus checkout below can land at `editor/corpus` — the colocated
      # path the vite config prefers — and for path parity with the
      # publish job.
      - name: checkout editor
        uses: actions/checkout@v4
        with:
          path: editor

      # License-clear fixtures the harness loads (corpus/idml/generated/*.idml
      # + corpus/fonts). Sparse + LFS so we pull ~25 MB, not the 4.4 GB
      # envato tier. The editor's vite config + tests resolve the corpus
      # as a sibling of the repo root (`editor/corpus`), so check it out
      # there. `STATE_DISPATCH_TOKEN` already has read scope on the
      # private paged-media siblings (used by plugin-draw for the sdk
      # checkout); fall back to github.token for same-org runs.
      #
      # `envato/overrides` is in the sparse set too: even in lean mode
      # (no fidelity/extensive-corpus specs), the canvas test driver's
      # default-font path reads `envato/overrides/_default/fonts.sh`
      # (tests/fidelity/fonts.ts → loadPackFonts fallback), so without it
      # every canvas-loading spec ENOENTs. The overrides tree is ~84 KB
      # of plain .sh/.jsx (the fonts it names all live in corpus/fonts/);
      # the heavy envato `.zip`/`.idml`/`.pdf` assets stay out of the
      # sparse set entirely, so cone-mode never even checks them out.
      #
      # LFS: smudge ON (`lfs: true`). Cone-mode sparse-checkout only
      # populates the four tiers above, so checkout's native LFS pass
      # downloads just THEIR objects (~25 MB: the generated/samples IDMLs
      # + sample PDFs + the corpus/fonts TTFs), not the 4.4 GB envato
      # tier. The earlier `lfs: false` + manual `git lfs pull --include`
      # fetched zero objects (the smudge filter was off, so the working
      # tree kept LFS *pointers* — the fixtures then parsed as "invalid
      # Zip: Could not find EOCD"). Letting checkout do the smudge against
      # the sparse tree is the reliable path.
      - name: checkout corpus fixtures (sparse + LFS)
        uses: actions/checkout@v4
        with:
          repository: paged-media/corpus
          path: editor/corpus
          token: ${{ secrets.STATE_DISPATCH_TOKEN || github.token }}
          lfs: true
          # Cone entries are TOP-LEVEL directory names and a stale one
          # yields an EMPTY checkout, not an error — the "verify corpus
          # fixtures are materialized" step below is what turns that into
          # a loud failure. `vendor` is deliberately absent: it is the
          # heavy tier (1.3 GB of packs) and no test on this surface
          # reads it.
          # NESTED cone paths — verified working. Naming `idml` whole
          # would drag in idml/packs (1.3 GB of Envato packs) on every
          # shard of every push; these two subtrees are 10 MB. The
          # "verify corpus fixtures are materialized" step below is what
          # catches a stale name, because a wrong cone yields an EMPTY
          # checkout rather than an error.
          sparse-checkout: |
            idml/generated
            idml/samples
            fonts
            config
          sparse-checkout-cone-mode: true

      # The canvas Playwright surface loads ~33 per-feature IDML fixtures
      # from `corpus/idml/generated/*.idml` (61 of the lean specs reference
      # them). Those files are NOT committed to the corpus repo — its
      # `generated/.gitignore` excludes `*.idml` because they are
      # reproducible from `cargo run -p paged-gen` (core). So neither a
      # sparse nor a full corpus checkout carries them, and without a
      # provisioning step the suite fails ~170/shard with ENOENT (file
      # absent) or "invalid Zip: Could not find EOCD" (LFS-pointer parse).
      #
      # Provision them by building the `paged-gen` fixture generator from
      # a `core` checkout and emitting every sample into
      # corpus/idml/generated. This is the same build-from-core pattern the
      # `viewer`/`docs` repos use (their `core.pin`); it does NOT touch
      # the Decision-B *wasm* boundary (the engine still arrives as the
      # published npm package — this only generates test fixtures).
      - name: checkout core (for the paged-gen fixture generator)
        uses: actions/checkout@v4
        with:
          repository: paged-media/core
          path: core
          token: ${{ secrets.STATE_DISPATCH_TOKEN || github.token }}
          # NOT pinned — this deliberately follows core's default branch, so
          # a new paged-gen sample reaches these fixtures without a bump
          # here. (The comment above used to call it "a pinned core
          # checkout"; there has never been a `ref:`.) The cost is a real
          # ordering coupling: a core change this step depends on must be
          # PUSHED BEFORE the editor change that uses it, or the run picks
          # up the older core and fails. That happened on 2026-08-19 with
          # `emit-all` — editor pushed first, and all three shards died on
          # "unrecognized subcommand". If this ever needs to stop moving
          # under the editor, adopt the `core.pin` file docs/viewer use
          # rather than hand-editing a ref here.

      - name: rust toolchain (for paged-gen)
        uses: dtolnay/rust-toolchain@stable

      # Covers BOTH rust builds this job does: paged-gen (fixtures) and the
      # paged.doc engine wasm. Without plugin-doc/target in here the doc
      # wasm is a cold release build of a vendored-ooxmlsdk workspace on
      # every single run — the thing this cache exists to prevent.
      - name: cache cargo + paged-gen build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            core/target
            plugins/plugin-doc/target
          key: paged-rust-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: paged-rust-${{ runner.os }}-

      - name: generate corpus/idml/generated/*.idml from paged-gen
        working-directory: core
        run: |
          cargo build --release -p paged-gen --bin paged-gen
          GEN="$GITHUB_WORKSPACE/editor/corpus/idml/generated"
          mkdir -p "$GEN"
          # `emit-all`, NOT a hand-copied name list. This step used to
          # carry its own copy of paged-gen's sample names — the fourth
          # copy of that list in the project — and it had silently lost
          # `layers-z` and `paste-into`. The guard on the other copies only
          # ever caught an UNKNOWN name; a name left OUT is invisible. The
          # result: four layers-panel specs failed here with "Could not
          # find EOCD", fetching a fixture CI had never emitted, and the
          # suite had never run far enough for anyone to see it.
          ./target/release/paged-gen emit-all --out "$GEN"

      # Guard: the IDML fixtures must now be real bytes on disk, or the
      # whole canvas surface fails with opaque parse errors mid-suite.
      # Fail fast here (existence AND not-a-pointer) if provisioning
      # didn't land.
      - name: verify corpus fixtures are materialized
        working-directory: editor/corpus
        run: |
          # Paths are corpus-root-relative. They said `generated/…` until
          # 2026-08-19, when assets were grouped by format under `idml/`
          # — and this guard is what caught the stale list, before 170
          # specs per shard could fail on a fixture that was simply
          # somewhere else. Keep it that way: it is the only thing
          # standing between a mis-typed sparse cone and a mystery.
          for f in idml/generated/text.idml idml/generated/text-overset.idml \
                   idml/generated/geometry.idml idml/generated/links-broken.idml \
                   idml/samples/sample.idml fonts/Inter.ttf; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — paged-gen provisioning failed"
              exit 1
            fi
            if head -c 64 "$f" | grep -q "git-lfs"; then
              echo "::error::$f is still an LFS pointer — smudge failed"
              exit 1
            fi
          done
          echo "corpus fixtures materialized OK"

      # Pin pnpm: with the editor checked out under editor/ (not at the
      # workspace root), action-setup can't read `packageManager` from a
      # root package.json — match the editor's pnpm@9.0.0 explicitly. v9
      # reads every repo's lockfile-v9 natively.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml

      # @paged-media/doc is the ONE bundle still consumed via a pnpm
      # `link:` — its first publish is pending (user action). The link
      # resolves to ../plugins/plugin-doc relative to the editor root, so
      # check the (public) repo out there and install its deps; without it
      # the dangling link leaves `@paged-media/doc` unresolvable and
      # typecheck fails before a single test runs. DROP both steps when
      # the package publishes and the pin replaces the link.
      - name: checkout plugin-doc (the one link-consumed bundle)
        uses: actions/checkout@v4
        with:
          repository: paged-media/plugin-doc
          path: plugins/plugin-doc

      - name: install plugin-doc (the link target needs its own deps)
        working-directory: plugins/plugin-doc
        run: pnpm install --frozen-lockfile

      # …and its wasm, which `pnpm install` does not produce. Once the
      # chromium hang was fixed and the suite finally reached the dev
      # server, THIS is what it hit: vite dies transforming
      # doc-bundle/src/engine.ts with `Failed to resolve import
      # "../bin/docx_js.js"`. `packages/doc-bundle/bin/*.js` is gitignored
      # (it is a build artifact), so a fresh checkout never has it, and
      # main.tsx imports `@paged-media/doc` at module scope — one missing
      # bundle takes the whole app down, so all 260 tests in the shard
      # fail before the first assertion.
      #
      # engine.ts DOES guard this: a try/catch around the dynamic import
      # that raises "engine wasm not built — run scripts/build-wasm.sh".
      # It cannot fire. Vite resolves the specifier during import-analysis
      # at TRANSFORM time, long before any of that code runs — a guard
      # that is declared but structurally unreachable.
      #
      # Building it is the faithful fix rather than a workaround: the
      # published @paged-media/doc will ship exactly this artifact inside
      # the package, so CI reproduces production instead of dodging it.
      # The toolchain and cargo cache are already here for paged-gen.
      # DROP this together with the checkout above when doc publishes.
      - name: install pinned wasm-bindgen-cli (plugin-doc Cargo.lock version)
        working-directory: plugins/plugin-doc
        timeout-minutes: 15
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          # The cargo cache now covers ~/.cargo/bin, so a warm run already
          # HAS these binaries and a plain `cargo install` dies with
          # "binary `wasm-bindgen` already exists in destination". Skip
          # when the cached version is the one the lockfile pins —
          # cheaper than --force, and it keeps the pin check meaningful
          # (build-wasm.sh hard-fails on a version mismatch).
          if wasm-bindgen --version 2>/dev/null | grep -qw "$V"; then
            echo "wasm-bindgen $V already installed (cache hit)"
          else
            cargo install wasm-bindgen-cli --version "$V" --locked --force
          fi

      # build-wasm.sh runs a hard 8 MiB budget gate and only applies
      # wasm-opt when it is on PATH — without it the artifact lands at
      # 10.9 MiB and the gate correctly refuses. The version is pinned
      # rather than apt-installed: an old binaryen miscompiles
      # wasm-bindgen's externref table grow ("Table.grow failed" at
      # runtime). Same pin plugin-doc's own rust.yml uses; keep them
      # together.
      - name: install pinned binaryen (reftypes-safe wasm-opt)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"

      - name: build the paged.doc engine wasm
        working-directory: plugins/plugin-doc
        timeout-minutes: 25
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/build-wasm.sh
          test -f packages/doc-bundle/bin/docx_js.js \
            || { echo "::error::doc wasm glue absent after build"; exit 1; }

      - name: install editor (engine wasm + all plugin bundles resolve from npm)
        working-directory: editor
        run: pnpm install --frozen-lockfile

      # The Playwright surface runs against the vite DEV server
      # (playwright.config `webServer: npx vite`), so no production build
      # is needed — but typecheck the canvas app so a wire/type break
      # fails fast here rather than as an opaque runtime error mid-suite.
      # (`pnpm -r build` is avoided: the `packages/*` have no build step
      # — they're consumed as workspace TS source — and `apps/devtools`
      # would pull in the unrelated introspect-wasm build.)
      - name: typecheck canvas app
        working-directory: editor
        run: pnpm --filter ./apps/canvas run typecheck

      # NO `--with-deps`. That flag shells out to `apt-get update` as root,
      # and on the ubuntu-24.04 runner that hangs: azure.archive.ubuntu.com
      # answers every index request with `Ign:`, apt falls back to
      # archive.ubuntu.com, and then it simply stops — the last log line is
      # `Get:5 …noble-security InRelease` and nothing follows until the
      # job's 50-minute timeout kills it. Deterministic, not flaky: all
      # three shards hung at the same line in the same run, and this is why
      # `tests.yml` has never once published a green Playwright result (30
      # runs: 18 failure, 12 timed-out-as-cancelled, 0 success). Because
      # the evidence artifact is produced by this job, every downstream
      # consumer starved too — state's coverage gate reports "0 linked
      # tests" for eight features whose specs exist and are tagged.
      #
      # The flag was never needed: the runner image ships Playwright's
      # browser libraries preinstalled. Without it, `playwright install`
      # only fetches the browser from Playwright's own CDN and touches apt
      # never. And if a library IS ever missing, the browser fails to
      # launch with a named error in seconds instead of a silent 50-minute
      # stall — strictly better feedback either way.
      #
      # (`demo-capture.yml` still uses `--with-deps chrome`, which is a
      # different case: installing real Google Chrome genuinely goes
      # through apt. That lane is release-triggered and would hit the same
      # wall; it needs its own fix, not this one.)
      - name: install chromium
        working-directory: editor
        # A browser download is ~1 minute. Bounding the step means a future
        # stall here is reported AS a stall, in ten minutes, instead of
        # eating the job's whole 50-minute budget and surfacing as
        # "cancelled" — which is indistinguishable from a concurrency
        # cancel and is precisely why this went unnoticed.
        timeout-minutes: 10
        run: pnpm --filter ./apps/canvas exec playwright install chromium

      # --project is REQUIRED here, not tidiness. Without it Playwright
      # runs EVERY project in the config, which on a Linux runner means
      # `journeys-gpu` and `demo-capture` — both of which need real Chrome
      # (`channel: "chrome"`), and `journeys-gpu` additionally passes
      # `--use-angle=metal`, a macOS-only flag. playwright.config.ts says
      # of that lane, in its own words, "it cannot run on the Linux CI
      # runners, and no workflow invokes it". That was false: this step
      # invoked it, its one WebGPU test failed for want of an adapter, and
      # because the converter drops the project dimension the failure
      # collided with the SAME test's pass from the CPU `journeys` lane on
      # one test_id — red winning. That single phantom failure is what put
      # THREE features red on state.paged.media (command-palette,
      # context-toolbars, panels.properties — the latter two attached only
      # because the ingest test-map unions them onto every journey spec).
      # Naming the two real gating projects fixes all of it.
      - name: playwright (lean surface, shard ${{ matrix.shard }})
        working-directory: editor/apps/canvas
        env:
          CI: "1"
          PAGED_CI_LEAN: "1"
        run: |
          npx playwright test \
            --project=chromium \
            --project=journeys \
            --shard=${{ matrix.shard }}/${{ env.SHARDS }} \
            --reporter=blob

      # Advisory GPU lane — re-run the journey tier through the WebGPU /
      # Vello present path (headed via xvfb; software Vulkan when present,
      # CPU fallback otherwise). Opt-in (workflow_dispatch only) on one
      # shard, `continue-on-error` so it NEVER gates: the journeys' visual
      # regression is the deterministic CPU readback above — this only
      # smoke-checks that the GPU live-render path runs without crashing.
      - name: journeys (GPU, advisory)
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.shard == 1 }}
        continue-on-error: true
        working-directory: editor/apps/canvas
        env:
          CI: "1"
          PAGED_CI_LEAN: "1"
          BACKEND: gpu
        run: |
          xvfb-run -a npx playwright test \
            --project=journeys \
            --reporter=list

      # Seed/refresh the committed LINUX visual baselines. Opt-in
      # (workflow_dispatch only) on one shard: runs the journey tier with
      # JOURNEY_VISUAL=1 (turns the content + chrome checkpoints ON — they
      # CI-skip by default until baselines exist) and --update-snapshots,
      # then uploads the regenerated PNGs as an artifact for the author to
      # commit. Linux is the gate platform; the {platform} token in
      # playwright.config's snapshotPathTemplate keeps macOS-local
      # baselines (-darwin) separate from these (-linux). Reuses CI's
      # already-working multi-repo install — no local Docker dance.
      # `always()`: the seeding run regenerates baselines and must NOT be
      # skipped just because an unrelated lean-surface test failed in the
      # main sharded step above (steps don't run after a failure by
      # default). It stays `continue-on-error` so it never gates either.
      - name: seed journey visual baselines (Linux, advisory)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && matrix.shard == 1 }}
        continue-on-error: true
        working-directory: editor/apps/canvas
        env:
          CI: "1"
          PAGED_CI_LEAN: "1"
          JOURNEY_VISUAL: "1"
        run: |
          npx playwright test \
            --project=journeys \
            --update-snapshots \
            --reporter=list

      - name: upload regenerated baselines
        if: ${{ always() && github.event_name == 'workflow_dispatch' && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-baselines-linux
          path: "editor/apps/canvas/tests/journey/__screenshots__/**/*-linux.png"
          retention-days: 14
          if-no-files-found: warn

      - name: upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: editor/apps/canvas/blob-report
          retention-days: 7

  publish:
    name: merge reports + publish evidence
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # merge-reports only needs apps/canvas's @playwright/test, so the
      # editor checkout alone suffices here. Keep it under `editor/` for
      # path parity with the playwright job.
      - name: checkout editor
        uses: actions/checkout@v4
        with:
          path: editor

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml

      # Only the canvas app's @playwright/test is needed for merge-reports.
      - name: install (apps/canvas only)
        working-directory: editor
        run: pnpm install --frozen-lockfile --filter ./apps/canvas

      - name: download shard blobs
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-report-*
          merge-multiple: true

      - name: merge shards → single Playwright JSON
        working-directory: editor
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-results.json
        run: |
          pnpm --filter ./apps/canvas exec \
            playwright merge-reports --reporter=json ${{ github.workspace }}/all-blobs \
            > /dev/null
          test -s "${{ github.workspace }}/playwright-results.json"

      # Evidence hand-off, INVERTED (2026-07-25, PR #16 on main; ported to
      # this branch 2026-08-17). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives
      # in the PRIVATE paged-media/state repo, and GitHub refuses to resolve a
      # private repo's action from a public workflow ("Unable to resolve
      # action paged-media/state, not found") — so the job died at SET-UP,
      # before any step ran, and this lane never published a single result.
      # Follow the inverted pattern core/ci.yml and plugin-doc use: upload the
      # results as an artifact and let state PULL it (private state can read a
      # public repo's artifacts). Consumer:
      # state/.github/workflows/siblings-pull.yml (source=editor,
      # suite=playwright-e2e, format=playwright-json).
      - name: upload playwright-e2e results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-results.json
          if-no-files-found: error
          retention-days: 14
