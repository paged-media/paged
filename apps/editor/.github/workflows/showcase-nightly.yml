# The annual/showcase nightly — builds the reference document end to end
# through the real editor and gates on the three-axis coverage ledger.
#
# This lane DELIBERATELY reintroduces a sibling `core` checkout that
# tests.yml removed on purpose: the base fixture is generated by core's
# paged-gen (`corpus/generated/*.idml` is gitignored there), so the
# document build genuinely needs the engine repo beside the editor. That
# stays confined to THIS workflow — the package-boundary posture of the
# main test lanes is unchanged.
#
# macos-14, not ubuntu: the image chapter's kernels are GPU-only WGSL,
# and the Linux runners expose no WebGPU adapter — chapter 070 would
# permanently degrade to notes. Apple silicon + Metal + real Chrome in
# new-headless is the same lane the journeys-gpu project uses locally.
#
# Committed artifacts stay a MANUAL local deliverable; this uploads its
# outputs as workflow artifacts and acts as the regression sentinel
# (coverage ratchet, blank-page gate, part-prefix guard).

name: showcase-nightly

on:
  schedule:
    # 03:17 UTC — off the top of the hour, after the day's merges.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: showcase-nightly
  cancel-in-progress: true

jobs:
  build-annual:
    name: build the reference document (macOS, WebGPU)
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      # Sibling layout: the harness resolves the workspace as the parent
      # of the editor checkout (`apps/canvas/../../..`), so editor and
      # core sit side by side under the runner workspace.
      - uses: actions/checkout@v4
        with:
          path: editor

      - uses: actions/checkout@v4
        with:
          repository: paged-media/core
          path: core

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The editor is under `editor/`, so the workspace root has no
      # package.json for action-setup to read — pass the version
      # explicitly (the inverse of the trap documented in tests.yml).
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml

      - name: generate the base fixture (paged-gen)
        run: bash scripts/regen-fixtures.sh
        working-directory: core

      # Ch.11 (colour management) and the assembly read core's CMYK
      # profile; it is fetched, not committed, so without this step
      # 165-color fails and every later chapter dies for want of its
      # checkpoint (the 2026-10-01 run).
      - name: fetch the CMYK profile
        run: bash scripts/fetch-profiles.sh
        working-directory: core

      # Without it the dev server cannot resolve @paged-media/doc, the app
      # never boots (`__canvas` times out at 30 s) and every chapter fails —
      # every night since 2026-09-11. DROP with the action when doc publishes.
      - name: plugin-doc from source (stopgap until @paged-media/doc publishes)
        uses: ./editor/.github/actions/plugin-doc-from-source

      - name: install (editor)
        run: pnpm install --frozen-lockfile
        working-directory: editor

      - name: install real Chrome
        run: npx playwright install chrome
        working-directory: editor/apps/canvas

      # No retries: a chapter failure is deterministic, and its retry
      # re-ran a 30-minute chapter only to fail the same way.
      - name: build the document (chaptered)
        run: npx playwright test --project=showcase --retries=0
        working-directory: editor/apps/canvas

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-${{ github.run_number }}
          path: |
            editor/apps/canvas/showcase/showcase.paged
            editor/apps/canvas/showcase/showcase.idml
            editor/apps/canvas/showcase/showcase.pdf
            editor/apps/canvas/showcase/showcase.coverage.json
            editor/apps/canvas/showcase/pages/
          retention-days: 21

      - name: upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: annual-traces-${{ github.run_number }}
          path: editor/apps/canvas/test-results/
          retention-days: 7

      # paged.image's performance trend lane: a 200-sample stroke, an Apply
      # and a 20-step opacity drag on a 4000x3000 image, printed to this log
      # and written to test-results/image-perf.json. REPORTED, NOT GATED
      # (continue-on-error), and on this runner because its kernels need
      # Metal. Last on purpose: a Playwright run clears test-results/, where
      # the showcase's failure traces were just uploaded from.
      - name: paged.image perf trend (reported, not gated)
        if: always()
        continue-on-error: true
        run: npx playwright test --project=journeys-gpu tests/journey/plugins/image-perf.journey.spec.ts --retries=0
        working-directory: editor/apps/canvas
