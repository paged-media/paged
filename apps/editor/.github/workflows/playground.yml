name: playground

# Build the live-demo PLAYGROUND (apps/canvas `demo` build) and deploy it to
# Cloudflare Pages at play.paged.media — the real editor that the docs and
# paged.media embed.
#
# The editor consumes the engine and the plugin bundles as PUBLISHED
# @paged-media packages — except @paged-media/doc, still a pnpm `link:` to
# ../plugins/plugin-doc until its first publish. So, like tests.yml, the editor
# is checked out under editor/ and the shared stopgap action builds plugin-doc
# beside it. Without it every deploy since July failed on
# "Cannot find module '@paged-media/doc'". DROP the stopgap (and go back to a
# root checkout) once the package publishes and a pin replaces the link.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [engine-updated]

permissions:
  contents: read

concurrency:
  group: playground
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: editor

      - name: rust toolchain (for the paged.doc engine wasm)
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo + plugin-doc build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            plugins/plugin-doc/target
          key: playground-rust-${{ runner.os }}-${{ github.sha }}
          restore-keys: playground-rust-${{ runner.os }}-

      # The editor is not at the workspace root, so action-setup cannot read
      # `packageManager`: pin the editor's pnpm major explicitly.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml

      - name: plugin-doc from source (stopgap until @paged-media/doc publishes)
        uses: ./editor/.github/actions/plugin-doc-from-source
      - name: plugin-slide from source (stopgap until @paged-media/slide publishes)
        uses: ./editor/.github/actions/plugin-slide-from-source

      - name: install editor
        working-directory: editor
        run: pnpm install --frozen-lockfile

      # PAGED_MODULES_HOSTED: the module door (ADR 223) answers the module
      # host, because the next step hosts every module the build lists.
      - name: build the demo
        working-directory: editor
        env:
          PAGED_MODULES_HOSTED: "1"
        run: pnpm --filter paged-canvas build:demo

      # Wasm modules are hosted, not deployed (ADR 220): every .wasm in the
      # build is uploaded to modules.paged.media (R2, brotli, immutable per
      # package version) if it is not there yet, removed from the deploy, and
      # replaced by a same-origin 302. That also keeps every file under
      # Cloudflare Pages' 25 MiB limit — the engine (~27 MiB) and DuckDB
      # (~34 MiB) are not.
      - name: host the wasm modules
        working-directory: editor/apps/canvas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/modules-sync.mjs dist-demo

      - name: every file fits the Pages size limit
        working-directory: editor/apps/canvas/dist-demo
        run: |
          big=$(find . -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::over Cloudflare Pages' 25 MiB limit: $big"; exit 1; fi

      - name: deploy to Cloudflare Pages
        # npx (not wrangler-action) — its `pnpm add wrangler` fails in a pnpm workspace.
        # Deployed from apps/canvas so wrangler picks up apps/canvas/functions:
        # the same-origin Claude proxy at /api/ai (ADR 221). Its secret and
        # KV binding live on the Pages project, not here.
        working-directory: editor/apps/canvas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy dist-demo --project-name=paged-playground --branch=main
