name: playground

# Build the live-demo PLAYGROUND (apps/canvas `demo` build) and deploy it to
# Cloudflare Pages at play.paged.media.
#
# Now a plain single-repo build: the editor consumes the plugin bundles + SDK as
# PUBLISHED @paged-media packages (with their wasm baked in), so no multi-repo
# checkout and no Rust/wasm toolchain here — just install + build + upload.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [engine-updated]

permissions:
  contents: read

concurrency:
  group: playground
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # reads packageManager (pnpm@9) from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter paged-canvas build:demo
      - name: deploy to Cloudflare Pages
        # npx (not wrangler-action) — its `pnpm add wrangler` fails in a pnpm workspace.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy apps/canvas/dist-demo --project-name=paged-playground --branch=main
