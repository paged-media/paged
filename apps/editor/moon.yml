$schema: '../../.moon/cache/schemas/project.json'

# The editor: one pnpm 9 workspace (apps/canvas, apps/devtools, packages/*).
language: 'typescript'
layer: 'application'
stack: 'frontend'
tags: ['node', 'app']

project:
  title: 'apps/editor'
  description: 'The editor application.'

dependsOn:
  # pnpm `link:` overrides: the editor bundles these two from source.
  - id: 'doc'
    scope: 'production'
  - id: 'slide'
    scope: 'production'
  # Test fixtures (paged-gen), the fidelity lane's paged-diff, engine corpus.
  - id: 'core'
    scope: 'development'
  # vite's dev-only DUCKDB_DIST fallback reads modules/data.
  - id: 'data'
    scope: 'development'

toolchains:
  # The editor's `packageManager` is pnpm@9.0.0 and its CI uses pnpm 9.
  pnpm:
    version: '9.0.0'

tasks:
  js-check:
    description: 'typecheck of apps/*, then the canvas test sources (as editor-tests runs them).'
    script: 'pnpm run typecheck && pnpm --filter ./apps/canvas run typecheck:tests'
    # The linked doc and slide bundles are compiled into the editor from source.
    inputs:
      - project: 'doc'
        filter: ['packages/doc-bundle/**/*']
      - project: 'slide'
        filter: ['packages/slide-bundle/**/*']

  js-lint:
    description: 'ESLint architecture boundaries and their self-test.'
    script: 'pnpm run lint && pnpm run lint:boundaries-selftest'
    inputs:
      - '@group(js-sources)'
      - 'test/eslint-boundaries/**/*'

  js-test:
    description: 'The static guards of the editor-tests `checks` job, in its order.'
    script: >-
      pnpm run test:boot-coi
      && pnpm run test:network-policy
      && pnpm run test:modules
      && pnpm run test:spread-pages
      && pnpm run test:thresholds
      && pnpm run test:wasm-budget
      && pnpm run test:surface-coverage
      && pnpm run test:seam-guard
      && pnpm run test:applicability
      && pnpm run test:solo-profiles
      && pnpm run test:feat-vocabulary
      && pnpm run test:client-catalog
    inputs:
      - project: 'doc'
        filter: ['packages/doc-bundle/**/*']
      - project: 'slide'
        filter: ['packages/slide-bundle/**/*']

  js-build:
    description: 'vite build of apps/* (needs the doc and slide engine wasm).'
    command: 'pnpm run build'
    deps: ['doc:wasm', 'slide:wasm']

  fixtures:
    description: 'paged-gen (engine/core) emits every sample into corpus/idml/generated/, as editor-tests does.'
    toolchains: ['rust']
    script: >-
      cd "$workspaceRoot/engine/core"
      && cargo build --release -p paged-gen --bin paged-gen
      && mkdir -p "$projectRoot/corpus/idml/generated"
      && "${CARGO_TARGET_DIR:-target}/release/paged-gen" emit-all --out "$projectRoot/corpus/idml/generated"
    inputs:
      - project: 'core'
        filter: ['crates/**/*.rs', 'crates/**/Cargo.toml', 'Cargo.lock']
    options:
      cache: false
      runInCI: false

  e2e:
    description: >-
      Playwright, the chromium + journeys projects of editor-tests. Needs the
      private corpus at apps/editor/corpus (a symlink) and a browser
      (`pnpm --filter ./apps/canvas exec playwright install chromium`).
    command: 'pnpm --filter ./apps/canvas exec playwright test --project=chromium --project=journeys'
    deps: ['~:fixtures', 'doc:wasm', 'slide:wasm']
    inputs:
      - '@group(js-sources)'
    options:
      cache: false
      runInCI: false
