[workspace]
resolver = "2"
members = ["crates/paged-server", "crates/paged-sync"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.dependencies]
# The repository format and its governance, and the MCP tool catalog: core's
# crates, the same code the browser and the CLI run. Pinned to a core rev; move
# both together.
paged-repo = { git = "https://github.com/paged-media/core", rev = "b612da5d" }
paged-mcp = { git = "https://github.com/paged-media/core", rev = "b612da5d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
