[package]
name = "paged-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.server: an optional remote for paged repositories on Cloudflare (Worker + Durable Objects + R2)."

[lib]
crate-type = ["cdylib"]

[dependencies]
paged-repo = { workspace = true }
paged-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
aes-gcm = "0.11"
base64 = "0.22"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.4", features = ["wasm_js"] }
hmac = "0.13"
worker = "0.8.7"
wasm-bindgen = "0.2"
