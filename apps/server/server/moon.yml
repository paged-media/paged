$schema: '../../../.moon/cache/schemas/project.json'

# paged.server: the Cargo workspace of the optional remote (paged-server,
# a Cloudflare Worker; paged-sync, its client and integration tests).
language: 'rust'
layer: 'application'
stack: 'backend'
tags: ['rust', 'app']

project:
  title: 'apps/server/server'
  description: 'paged.server, the optional remote for repository-backed documents.'

# Path dependencies on the engine's crates (paged-repo, paged-mcp); the
# engine image (engine/Dockerfile) builds engine/core.
dependsOn:
  - id: 'core'
    scope: 'production'

# Path dependencies into the engine: its crates are inputs here too, so
# `moon ci` re-runs this project when an engine crate it builds changes.
# (Project file groups replace the workspace ones, so the defaults are
# restated.)
fileGroups:
  rust-sources:
    - '**/*.rs'
    - '**/Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain*'
    - '/.cargo/*.toml'
    - '/engine/core/Cargo.toml'
    - '/engine/core/crates/**/*.rs'
    - '/engine/core/crates/**/Cargo.toml'
  rust-tests:
    - '**/*'
    - '!docs/**'
    - '!**/*.md'
    - '/.cargo/*.toml'
    - '/engine/core/Cargo.toml'
    - '/engine/core/crates/**/*.rs'
    - '/engine/core/crates/**/Cargo.toml'


tasks:
  rust-check:
    options:
      # server-rust.yml checks (native + wasm32) and runs the flo_curves
      # guard; `moon ci` runs no Rust task (.moon/tasks/rust.yml).
      runInCI: false

  rust-lint:
    options:
      # No clippy baseline for the server yet.
      runInCI: false

  rust-test:
    # Every paged-sync test talks to a running local worker, so they are an
    # opt-in lane (`#[ignore = "server: …"]`, .config/nextest.toml) and the
    # default nextest run has nothing to run. Run the lane instead: without
    # PAGED_SERVER_URL (README.md) each test reports `unavailable: running
    # server`, and PAGED_REQUIRE_SERVER=1 turns that into a failure.
    script: 'cargo nextest run --profile server --run-ignored only'
    options:
      # There is no CI lane for them.
      runInCI: false
