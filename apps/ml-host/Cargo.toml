[workspace]
resolver = "2"
members = ["crates/paged-ml-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
