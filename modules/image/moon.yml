$schema: "../../.moon/cache/schemas/project.json"

# paged.image: a Cargo workspace (image-* crates) and JS packages
# (glue/, manifest/).
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/image"
  description: "Raster image module: kernels, codecs, PSD, GPU pipeline."

# The Rust workspace path-depends on engine crates (paged-pixel, paged-psd;
# image ADR 466), so it builds after the engine and an engine change runs
# this module's gates. manifest/'s typecheck and test scripts run the
# in-tree paged-plugin bin (plugin-sdk).
dependsOn:
  - id: "core"
    scope: "production"
  - id: "extensions"
    scope: "development"
  - id: "test-kit"
    scope: "development"

# The engine crates the Cargo workspace path-depends on (paged-pixel,
# paged-psd) are inputs here too, so `moon ci` re-runs this project when one
# of them changes. (Project file groups replace the workspace ones, so the
# defaults are restated.)
fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/paged-pixel/**/*.rs"
    - "/engine/core/crates/paged-pixel/Cargo.toml"
    - "/engine/core/crates/paged-psd/**/*.rs"
    - "/engine/core/crates/paged-psd/Cargo.toml"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/paged-pixel/**/*"
    - "/engine/core/crates/paged-psd/**/*"

tasks:
  js-check:
    inputs:
      - project: "extensions"
        filter:
          [
            "packages/plugin-sdk/bin/**/*",
            "packages/plugin-sdk/untyped-commands.baseline.json",
            "packages/plugin-api/src/manifest.schema.json",
          ]

  js-test:
    # The specs boot glue/wasm and wasm-fresh.spec.ts checks it; image-ci
    # builds it first.
    deps: ["~:wasm"]
    inputs:
      - project: "extensions"
        filter:
          [
            "packages/plugin-sdk/bin/**/*",
            "packages/plugin-sdk/untyped-commands.baseline.json",
            "packages/plugin-api/src/manifest.schema.json",
          ]

  wasm:
    description: "image-js wasm into glue/wasm/ and manifest/wasm/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "/tooling/js/source-hash.mjs"
      - "registry/**/*.yaml"
    outputs:
      - "glue/wasm/image_js*"
      - "glue/wasm/SOURCE_HASH"
      - "manifest/wasm/image_js*"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; image-ci builds it
      # (.github/actions/module-wasm).
      runInCI: "skip"
