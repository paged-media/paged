[package]
name = "image-cms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.image color management (spec §10.1): the swappable CmsEngine over the engine's paged-color (qcms display lane, moxcms print lane with intents and BPC), compile-on-CPU / apply-on-GPU LUT baking."

[lints]
workspace = true

[dependencies]
image-core = { path = "../image-core" }
thiserror = { workspace = true }
# The engine's one CMS (ADR 466, PM-0014): both backends are adapters over
# `paged_color::cms` — qcms 0.3 (cmyk + iccv4-enabled, the engine's exact
# build: the display lane agrees with the page by construction) and moxcms
# (the print lane: every intent, BPC through the engine's implementation
# of Adobe's algorithm). On wasm32 paged-color carries no C; natively it
# links lcms2 for the engine's native backend, which this crate never
# selects.
paged-color = { path = "../../../engine/core/crates/paged-color", features = ["moxcms"] }

[dev-dependencies]
# The native differential oracle (spec §10.1 / D-11 §F.4): lcms2 is a
# CI-only ΔE reference for both backends — NEVER selected by this crate.
lcms2 = "6"
# lcms2-sys is already in the graph (transitive dep of lcms2 above); the
# moxcms print-lane test reaches its raw FFI directly to synthesise a
# hermetic LUT-bearing ICC profile (distinct A2B0/A2B1 tables) — the only
# way to prove moxcms honors per-intent LUTs, which lcms2's safe Pipeline
# surface cannot assemble (no stage-insertion entry point). Dev-only.
lcms2-sys = "4"
