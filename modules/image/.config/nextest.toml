# cargo-nextest configuration (mirrors core's .config/nextest.toml).
#
# The `ci` profile emits JUnit XML that the publish-state workflow hands
# to paged-media/state's publish-results action (format: nextest-junit,
# source: plugin-image, suite: nextest). The default profile is
# unchanged — local `cargo nextest run` behaves as before.

[profile.ci]
# Don't stop at the first failure: the state matrix wants every red row.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
report-name = "paged-image-nextest"

# The opt-in private-corpus lanes: every `#[ignore = "corpus: …"]` test
# (docs/development/testing.md at the repository root). Without the corpus
# each reports `unavailable: private corpus: …`; PAGED_REQUIRE_CORPUS=1
# makes that a failure.
#
#   PAGED_CORPUS_DIR=<corpus root> [PAGED_REQUIRE_CORPUS=1] \
#     cargo nextest run --profile corpus --run-ignored only
[profile.corpus]
default-filter = """
binary_id(image-conformance::it) & (
    test(/^psd_composite_oracle::/) | test(/^psd_vector_mask_corpus::/) |
    test(/^real_jpeg_corpus::/) | test(/^real_png_corpus::/) |
    test(/^real_psd_corpus::/) | test(/^real_raster_corpus::/)
)
"""
fail-fast = false

# LANE B of the .abr reader: the ANALYST-owned clean-room mount
# (references/abr-fixtures, or PAGED_ABR_CORPUS_DIR), not the private
# corpus, so it is a lane of its own with its own switch.
#
#   PAGED_ABR_CORPUS=1 cargo nextest run --profile abr --run-ignored only
[profile.abr]
default-filter = "binary_id(image-conformance::it) & test(/^abr_corpus::/)"
fail-fast = false
