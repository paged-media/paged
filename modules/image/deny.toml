# cargo-deny configuration for paged.image.
# Run:  cargo deny check          (CI runs `check licenses bans sources`)
#
# This doubles as the SDK-only rule's Rust half (spec §4 dep rule 3):
# [sources] denies unknown registries/git, so a path/git reach-around
# into core/editor internals cannot land silently.

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# paged is AGPL-3.0-only OR PMEL (ADR PM-0001). Dependencies must be
# permissively licensed (weak copyleft MPL-2.0 at most) so the whole work can
# be distributed under both: the AGPL and the commercial PMEL. No GPL/AGPL
# dependency can pass this gate.
allow = [
    "MPL-2.0",
    # First-party crates this workspace reaches outside itself (from another
    # workspace in this repository, or by git revision from a former
    # repository) carry `AGPL-3.0-only OR LicenseRef-PMEL`, or
    # `MPL-2.0 OR LicenseRef-PMEL` for revisions released before the
    # relicense (ADR PM-0001). SPDX has no id for the Paged Media Enterprise
    # License, hence the LicenseRef form; it satisfies either expression.
    "LicenseRef-PMEL",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    # IJG (Independent JPEG Group) — permissive, NOT copyleft. Reaches us
    # through `jpeg-encoder`, whose `src/fdct.rs` is a Rust port of
    # libjpeg-turbo's forward DCT; hence its `(MIT OR Apache-2.0) AND IJG`
    # expression. The terms grant use "for any purpose, without fee" with
    # no source-disclosure or reciprocal condition. The ONE obligation that
    # binds a binary distribution is attribution — see NOTICE.md, which
    # carries the required wording. Keep that file in sync if the JPEG
    # dependency changes.
    "IJG",
]
exceptions = []

# This workspace's own crates are AGPL-3.0-only OR LicenseRef-PMEL
# (ADR PM-0001). The policy above is for dependencies, so the unpublished
# ones (`publish = false`) are not checked against it; a published one
# passes through LicenseRef-PMEL.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
