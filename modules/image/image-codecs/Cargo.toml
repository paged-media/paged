[package]
name = "image-codecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.image codec adapter contract (ImageSource/ImageTarget over sans-IO ByteSource) + format adapters. Codecs are inherently CPU work (spec §10.2)."

[lints]
workspace = true

[dependencies]
image-core = { workspace = true }
thiserror = { workspace = true }
# The codecs are the engine's (ADR 468, PM-0014): every decoder and encoder
# behind these adapters is paged-raster's. The D-4 bench that once picked
# zune-png over `png` was re-run on 2026-10-25 and reversed (registry
# codecs.yaml), so the adapters carry no codec crate of their own.
paged-raster = { workspace = true }
