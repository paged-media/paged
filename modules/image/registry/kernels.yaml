  gpu_tolerance: { kind: channel_eps_f16, value: 4 }
  oracle: none
  status: implemented
  provenance:
    - "Photoshop's Blend If (layer blending ranges), from Adobe's user guide: per gray/red/green/blue of This Layer and Underlying Layer a black and a white slider, each splittable into a ramp; the coverage is the product of every ramp"
    - "a ramp is clamp(v·k + o, 0, 1) on the unpremultiplied value, k and o encoded by the caller (an unsplit slider is a one-level step, a split one a slope from the low to the high half); gray = 0.3 r + 0.59 g + 0.11 b"
    - "output splatted to rgba so the fold binds it as the next blend's @group(2) mask (only .r is read)"
  tests:
    rust: ["image-conformance/tests/it/family_band.rs"]

