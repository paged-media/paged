    - "elementary pointwise algebra / no reference reading"
    - "premultiplied rgb·fill + neutral·alpha·(1 − fill): the layer fold's fill opacity on Photoshop's eight special blend modes, where fill moves the source toward the mode's neutral colour (it blends to the backdrop unchanged) instead of fading it; Adobe documents that fill and opacity differ on those modes, the neutral-colour model is ours (no Photoshop recording yet)"
  tests:
