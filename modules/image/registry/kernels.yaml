    - "the lattice coordinate is the same construction gen.checker uses (global texel position folded into a cell); only the cell content comes from a texture instead of two literal colours"
    - "the seam is exact because the two bilinear tap indices are Euclidean-modulo'd INDEPENDENTLY after the floor and never clamped, so every tile boundary blends the last column with the first instead of baking a hairline of edge colour into every lattice line"
