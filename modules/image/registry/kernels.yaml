    - "tile_w/tile_h travel in the PARAMS because execute_tile_once_async sizes every input texture at the OUTPUT dims - the tile is uploaded zero-padded and names its real extent, and the shader clamps that extent to the bound texture so it can never read outside"
    - "identity: opacity 0, and the degenerate scale <= 0 guard, both written as negated positive tests so NaN lands on identity deterministically rather than implementation-defined - a clamp(opacity, 0, 1) draft was caught by the predicate-agreement test"
