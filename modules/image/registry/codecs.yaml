# paged.image LOCAL codec registry (spec §10.3 format matrix; M0 lands
# the traits + the M0 adapters, the matrix fills through M1). state_row
# joins onto paged-media/state rows.

- id: image.codec.traits
  state_row: image.codec.traits
  tier: shipped          # M0: frozen + exercised by raw/png adapters
  provenance:
    - "spec §10.2 verbatim trait surface; sans-IO design"
  tests:
    rust: ["image-codecs/src/raw.rs (unit)", "image-conformance/tests/codec_traits.rs"]

- id: image.codec.raw
  state_row: image.codec.traits
  tier: shipped          # M0: decode (in-memory test/bring-up source); M4: RawTarget encode (strip-assembled packed pixels — the to_encoder_async readback the image-js ingest slice hands to the C-1 image scene item)
  provenance:
    - "trivial interleaved buffer adapter; no container"
  tests:
    rust: ["image-codecs/src/raw.rs (unit)", "image-conformance/tests/it/pipeline_async.rs", "image-js/tests/it/ingest.rs"]

- id: image.codec.core-codecs
  state_row: image.codec.core-codecs
  tier: shipped          # WP1.4 (ADR 468, engine ADR 1005 amendment 2026-10-25)
  # The module's codecs ARE the engine's: image-codecs keeps the frozen
  # ImageSource/ImageTarget traits and implements them as thin adapters
  # (RasterSource, RasterTarget) over engine/core/crates/paged-raster. Every
  # decoder and encoder below is paged-raster's; this workspace links no
  # codec crate of its own. Ingest (image-js ingest.rs) accepts every format
  # paged-raster decodes; Export As (image-js export.rs, the bundle's
  # dialog) and the save-back write PNG/JPEG/WebP/TIFF with metadata.
  decision: "paged-raster is the only decoder and encoder (plan C5); zune-png, zune-jpeg and jpeg-encoder left the adapters"
  provenance:
    - "engine ADR 1005 (paged-raster) and its 2026-10-25 amendment; image ADR 468"
  tests:
    rust:
      - "engine/core/crates/paged-raster/tests/it/encode.rs"
      - "image-js/src/export.rs (unit)"
      - "image-js/tests/it/ingest_formats.rs"
    ts:
      - "glue/test/export-as.spec.ts"
      - "glue/test/export-dialog.dom.test.tsx"

- id: image.codec.png
  state_row: image.codec.traits
  tier: shipped          # decode 8/16-bit; encode Gray/RGB ± alpha at 8/16 with iCCP, eXIf, XMP iTXt, pHYs
  # D-4 RE-RUN 2026-10-25 (the original 2026-06 bench chose zune-png). The
  # same synthetic sweep (gradient + checkerboard + noise, release build,
  # Apple M-series, median of 5–20 runs), png 0.18 through `image` 0.25.10
  # against zune-png 0.5.2:
  #   decode 1024² RGB8  : png 5.07 ms  vs zune 8.54 ms
  #   decode 1024² RGBA8 : png 6.30 ms  vs zune 11.22 ms
  #   decode 4000x3000 RGB8 : png 48.7 ms vs zune 93.0 ms
  #   encode 1024² RGB8  : png 4.36 ms (1.04 MB) vs zune 1.72 ms (3.15 MB)
  #   encode 4000x3000 RGB8 : png 52.4 ms (11.5 MB) vs zune 21.1 ms (36.1 MB)
  # png now decodes ~1.8x faster; zune encodes ~2.5x faster but writes
  # files three times the size (it barely deflates) and has no iCCP writer.
  # The single implementation is therefore paged-raster's (png via `image`);
  # zune-png stays only as a bench comparison and test fixture builder.
  decision: "D-4 REVERSED 2026-10-25 → png via paged-raster (faster decode, 1/3 the file size, iCCP); zune-png bench/fixture only"
  provenance:
    - "PNG (W3C PNG 3rd ed.) via paged-raster (`image` 0.25 / png 0.18); iCCP, eXIf, iTXt XML:com.adobe.xmp, pHYs"
  tests:
    rust: ["image-conformance/tests/it/codec_png.rs", "image-conformance/tests/it/codec_png_16bit.rs", "engine/core/crates/paged-raster/tests/it/encode.rs"]

- id: image.codec.jpeg
  state_row: image.codec.traits
  tier: shipped          # decode Gray/YCbCr/RGB/CMYK/YCCK; encode Gray/RGB with quality, APP2 ICC, APP1 EXIF + XMP, APP13 IPTC, JFIF density
  # Decode: paged-raster's JPEG module over zune-jpeg 0.5 (the decoder
  # `image` uses, so one build in the graph). CMYK and YCCK keep their
  # inks; the Adobe APP14 inversion is undone exactly when APP14 is present
  # (the old adapter inverted every 4-component file). Encode: `image`'s
  # JPEG encoder (measured 2026-10-25: same speed as jpeg-encoder, files
  # ~3 % smaller), alpha dropped, 16-bit narrowed. CMYK JPEG encode is not
  # offered (CMYK exports are TIFF). EXIF is written with Orientation 1:
  # ingest auto-orients, so the pixels are already upright.
  decision: "paged-raster (zune-jpeg decode, `image` encode); jpeg-encoder left the adapters (a dev-dependency fixture builder only)"
  provenance:
    - "ITU T.81 / JFIF / Adobe APP14 / EXIF APP1 / XMP APP1 / ICC APP2 / Photoshop APP13 via paged-raster"
  tests:
    rust: ["image-conformance/tests/it/codec_jpeg.rs", "engine/core/crates/paged-raster/tests/it/encode.rs"]

- id: image.codec.tiff
  state_row: image.codec.core-codecs
  tier: shipped          # decode: everything paged-raster reads (strips, tiles, planar, 1–64-bit, Gray/RGB/CMYK/Lab/palette/YCbCr, layered composite); encode Gray/RGB/CMYK 8/16-bit, LZW/Deflate, ICC/XMP/IPTC/resolution
  # CMYK export converts the session's sRGB through a chosen CMYK output
  # profile (or a CMYK source's own) with an intent, via paged-color
  # (lcms2 native, qcms wasm); without one, the naive formula, said so and
  # untagged. The document's CMYK profile is not reachable from a bundle
  # (the contract names it, it does not hand out its bytes).
  provenance:
    - "TIFF 6.0 via paged-raster (`tiff` 0.11)"
  tests:
    rust: ["engine/core/crates/paged-raster/tests/it/matrix.rs", "image-js/src/export.rs (unit)", "image-js/tests/it/ingest_formats.rs"]

- id: image.codec.webp
  state_row: image.codec.core-codecs
  tier: shipped          # decode (lossy and lossless, alpha); encode LOSSLESS only, with ICCP, EXIF, XMP
  # image-webp (the `image` WebP crate) has no lossy (VP8) encoder, so the
  # export is lossless and the dialog and the export notes say so.
  provenance:
    - "WebP container + VP8L via paged-raster (image-webp 0.2)"
  tests:
    rust: ["engine/core/crates/paged-raster/tests/it/encode.rs", "image-js/tests/it/ingest_formats.rs"]

- id: image.codec.small-formats
  state_row: image.codec.core-codecs
  tier: shipped          # decode: GIF (first frame), BMP, TGA, QOI, ICO, Radiance HDR, OpenEXR, DNG, EPS preview; encode (WP9.4): GIF, BMP, TGA
  # HDR, OpenEXR and float TIFF are scene-linear: CLIPPED to 0..1 and
  # sRGB-encoded, no tone mapping, stated by the colour row
  # ("hdr-clipped"). DNG is developed with paged-raster's defaults; an EPS
  # opens its preview. paged-raster's `decode` hands HDR and OpenEXR over
  # as 32-bit float RGB(A) (engine ADR 1038); a deep OpenEXR and one
  # without R, G and B channels are refused by name.
  # Encode (engine ADR 1038, Export As): GIF (256 colours exact, more
  # quantized by NeuQuant, one bit of alpha; the "gif-palette" note), BMP
  # (pels per metre), TGA (RLE); none carries metadata ("no-metadata").
  provenance:
    - "paged-raster's decoders (engine ADR 1005 and amendments) and encoders (engine ADR 1038)"
  tests:
    rust:
      - "engine/core/crates/paged-raster/tests/it/formats.rs"
      - "engine/core/crates/paged-raster/tests/it/encode_tail.rs"
      - "image-js/src/export.rs (unit)"
      - "image-js/tests/it/ingest_formats.rs"
    ts:
      - "glue/test/layered-tiff.spec.ts"
      - "glue/test/export-dialog.dom.test.tsx"

- id: image.codec.layered-tiff
  state_row: image.codec.core-codecs
  tier: shipped          # WP9.4 (engine ADR 1038): a layered PSD session written as a TIFF with its layers in tag 37724
  # File ▸ Export ▸ "TIFF with layers": the session's PSD export (the
  # layered save) handed to paged-raster's psd_to_layered_tiff — the
  # merged composite as the TIFF's image, the layers as ImageSourceData
  # written by paged-psd (Layr + LMsk + the document blocks), the image
  # resources in tag 34377, big-endian (MM) because Photoshop reads the
  # layer data in the TIFF's byte order. 8-bit documents; a session not
  # opened from a PSD, a 16/32-bit document and a PSB are refused by name.
  # Opening a layered TIFF still reads its composite (its layer count is
  # probed); importing the layers is a later step.
  provenance:
    - "Adobe Photoshop TIFF Technical Notes (tag 37724) via paged-psd's layer writer"
  tests:
    rust:
      - "engine/core/crates/paged-raster/tests/it/encode_tail.rs"
      - "engine/core/crates/paged-psd/tests/it/layer_list.rs"
    ts: ["glue/test/layered-tiff.spec.ts"]

- id: image.codec.exif
  state_row: image.codec.exif
  tier: shipped          # decode-side: orientation + DPI + color-space tag, applied at ingest
  # A tiny dependency-free EXIF/TIFF reader (image-codecs/src/exif.rs) over
  # the raw payload codecs already capture (SourceInfo.exif, which starts at
  # the TIFF header — zune-jpeg strips the `Exif\0\0` APP1 prefix). Reads
  # exactly three facts off IFD0 (+ the Exif sub-IFD): Orientation (0x0112),
  # XResolution/YResolution/ResolutionUnit → DPI (0x011A/0x011B/0x0128, cm
  # converted ×2.54, unit "none" → no DPI), and ColorSpace (0xA001: sRGB /
  # Uncalibrated / Other). Both byte orders (II/MM). Lenient by design: any
  # malformed / truncated / unknown structure yields None for that field,
  # never an error — EXIF is advisory and must not fail an otherwise-valid
  # decode.
  #
  # WHY HAND-ROLLED (not kamadak-exif): three tags need a ~150-line bounded
  # IFD walk; a full EXIF crate drags a dependency + a second TIFF reader
  # into a workspace that pins codec deps tightly (§10.3) and watches an
  # 8 MiB wasm budget (I-07). The hand-rolled reader keeps the codec crate
  # dependency-flat and #![forbid(unsafe_code)].
  #
  # APPLY SITE: the decode-to-RGBA bridge in image-js (ingest.rs
  # apply_orientation) auto-orients on the straight-RGBA8 buffer BEFORE the
  # GPU adjustment pipeline. This is the architecturally honest spot: it is
  # a CPU memory reshuffle (transpose/flip) inherent to ingest, not GPU
  # kernel work, and the adjustments + the C-1 composite must see upright,
  # correctly-dimensioned pixels. JPEG/TIFF carry orientation; PNG/PSD
  # don't (parses to None → no-op). The eight CIPA transforms are unit- and
  # e2e-tested (a JPEG with a spliced APP1 Orientation=6 ingests 16×8→8×16).
  #
  # EXPORT-SIDE RULING — N/A (strip-by-construction). The frozen TargetInfo
  # (image-codecs target.rs) carries NO EXIF/orientation channel, and
  # neither encoder writes EXIF. Because ingest auto-orients to canonical
  # upright (TopLeft) pixels, a re-export is ALREADY in the identity
  # orientation — there is nothing to preserve and no tag to strip. The
  # "strip vs preserve" question is therefore moot for orientation on the
  # current export lane; if a future export lane gains an EXIF writer, it
  # must emit Orientation=1 (the pixels are upright), never copy a stale
  # source tag. DPI/color-space round-trip on export is a separate
  # TargetInfo-amendment follow-up (not in scope here).
  provenance:
    - "Exif 2.3 / TIFF 6.0 IFD structure (public spec); tags 0x0112/0x011A/0x011B/0x0128/0x8769/0xA001"
    - "CIPA orientation transform table (the eight values)"
    - "hand-rolled bounded reader — no EXIF crate dependency (8 MiB wasm budget, I-07)"
  tests:
    rust: ["image-codecs/src/exif.rs (unit: 10 tags/endianness/garbage)", "image-js/src/ingest.rs (unit: 6 orientation geometries)", "image-js/tests/it/ingest.rs (e2e: APP1 orientation auto-rotate)"]

- id: image.codec.avif
  state_row: image.codec.avif
  tier: partial          # DECODE shipped through paged-raster (rav1d, WP1.5, engine ADR 1005 amendment); ENCODE in the engine behind a feature, not in this module's wasm
  # The 2026-06 verdict (no permissive pure-Rust AV1 library decoder) was
  # overtaken: paged-raster decodes AVIF with avif-parse + rav1d's safe Rust
  # API (BSD-2), native and wasm32, and the module ingests it through the
  # adapters. Encode: paged-raster's `avif-encode` feature (ravif BSD-3
  # over rav1e BSD-2, no assembly, one thread; engine ADR 1038) is OFF by
  # default, so the module's wasm (8 MiB cap) does not carry it and Export
  # As does not offer AVIF.
  decision: "decode via paged-raster (rav1d); encode in paged-raster behind `avif-encode`, kept out of the module wasm (rav1e size)"
  provenance:
    - "AV1 / ISOBMFF (AVIF) via paged-raster (avif-parse MPL-2.0, rav1d BSD-2-Clause)"
  tests:
    rust: ["engine/core/crates/paged-raster/tests/it/formats.rs"]

- id: image.codec.jxl
  state_row: image.codec.avif
  tier: shipped          # DECODE through paged-raster (jxl-oxide); ENCODE lossless through paged-raster (zune-jpegxl, WP9.4)
  # Decode: jxl-oxide (MIT OR Apache-2.0) in paged-raster (WP1.5). Encode
  # (engine ADR 1038): zune-jpegxl (MIT OR Apache-2.0 OR Zlib), a pure-Rust
  # LOSSLESS (modular) encoder, Gray/RGB ± alpha at 8 and 16 bits, no
  # metadata; Export As offers it ("jxl-lossless", "no-metadata"). A lossy
  # (VarDCT) encoder stays out: the only pure-Rust one is AGPL/commercial
  # and libjxl is C++.
  decision: "decode via paged-raster (jxl-oxide); lossless encode via paged-raster (zune-jpegxl); lossy encode declined (no permissive encoder)"
  provenance:
    - "JPEG XL (ISO/IEC 18181) via paged-raster (jxl-oxide decode, zune-jpegxl lossless encode)"
  tests:
    rust:
      - "engine/core/crates/paged-raster/tests/it/formats.rs"
      - "engine/core/crates/paged-raster/tests/it/encode_tail.rs"
      - "image-js/src/export.rs (unit)"

- id: image.codec.raw_heic
  state_row: image.codec.avif   # placeholder; explicit-NON-GOAL marker, no own state row
  tier: out-of-scope     # explicit NON-GOAL (Phase 9, 2026-06-13) — see base-idea §1.1
  # (DNG is the exception since WP1.5: paged-raster develops it, see
  # image.codec.small-formats.)
  # VERDICT: EXPLICIT NON-GOAL, not a deferral. Camera-RAW (CR2/CR3/NEF/ARW/
  # DNG/…) and HEIC/HEIF are OUT OF paged.image's lane by design, and the
  # dependency landscape confirms it would also break the constitution:
  #   - RAW developing (demosaic, per-sensor color science, highlight
  #     recovery) is a whole subsystem, not a codec. The ecosystem decoders
  #     are libraw (C++, LGPL-2.1/CDDL) and rawloader/rawler (pure-Rust but
  #     LGPL-2.1) — LGPL is NOT on deny.toml's allow-list, and RAW is a
  #     camera-developer product, not an editable-RGBA/PSD lane.
  #   - HEIC/HEIF decode needs libheif (C, LGPL-3) over an HEVC decoder
  #     (libde265 C, or the same AV1 wall as AVIF). C + LGPL → rejected twice
  #     over (no-C-in-default-build §1.1; allow-list).
  # paged.image's lane is the EDITABLE RGBA/PSD pipeline (the published-
  # design raster surface), not a RAW developer or a HEVC/HEIF container
  # reader. If a placed-RAW/HEIC asset must be ingested, that is a
  # DOCUMENT-LINK / external-rasterize concern (a host/native pre-rasterize
  # step handing RGBA in), NOT a codec adapter this crate ships. No build,
  # no dependency, ever — recorded so the question stays closed.
  decision: "EXPLICIT NON-GOAL (2026-06-13). Camera-RAW + HEIC/HEIF are out of the editable-RGBA/PSD lane and need heavy/non-permissive decoders (libraw/rawler LGPL; libheif C/LGPL-3 over HEVC). Not a codec this crate ships; at most a host-side document-link rasterize into RGBA. No build. See base-idea §1.1."
  provenance:
    - "camera-RAW developing + HEIC/HEIF — out of scope (LGPL/C decoders; a developer/container concern, not the editable-RGBA lane)"
  tests:
    rust: []
