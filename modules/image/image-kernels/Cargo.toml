[package]
name = "image-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.image kernel definitions: WGSL source of truth + typed param blocks + metadata (spec §6). Depends ONLY on image-core and paged-kernels (dep rule 1; engine ADR 1013)."
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# The scalar reference twins (test-only golden source, spec §6.3).
# Enabled SOLELY by image-conformance's dev-dependency; a wasm32 release
# build must never activate it (CI cargo-tree guard).
reference = []
# The shipped CPU twins of the adjustment chain (src/cpu.rs), used only
# where no GPU device exists (ADR 465). image-js turns it on.
cpu = []

[dependencies]
image-core = { workspace = true }
paged-kernels = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
# WGSL validation of every assembled kernel module (test-time seam —
# generated WGSL can't be validated in build.rs because assembly lives
# in this crate).
naga = { workspace = true }
