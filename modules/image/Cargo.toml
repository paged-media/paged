# paged.image — Rust workspace. Crates live at REPO TOP LEVEL per the
# spec (§4 of docs/concept.md), not under
# crates/. references/ is NEVER a member (read-only clean-room mounts).
[workspace]
resolver = "2"
members = [
    "image-kernels",
    "image-gpu",
    "image-pipeline",
    "image-graph",
    "image-cms",
    "image-codecs",
    "image-js",
    "image-conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
needless_pass_by_value = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# The pixel types and the PSD reader live in the engine (ADR 466, PM-0014;
# moved in WP1.2 with their history). The module keeps their old names
# through `package` aliases, so `use image_core::…` / `use image_psd::…`
# compile unchanged until a mechanical rename.
image-core = { path = "../../engine/core/crates/paged-pixel", package = "paged-pixel" }
image-psd = { path = "../../engine/core/crates/paged-psd", package = "paged-psd" }
# The CPU resample of the headless and batch actions (ADR 467): a leaf
# engine crate, under its own name.
paged-resample = { path = "../../engine/core/crates/paged-resample" }
# The codecs (ADR 468): every decoder and encoder of the module is the
# engine's raster crate; image-codecs adapts it to the frozen traits.
paged-raster = { path = "../../engine/core/crates/paged-raster" }
# The engine's colour conversions (CIELAB for Match Color; PM-0014 shared capability).
paged-color = { path = "../../engine/core/crates/paged-color" }
thiserror = "2"
anyhow = "1"
bytes = "1"
# `min_const_generics` lifts the Pod/Zeroable derive past the built-in
# small-array impls — `adjust.lut3d`'s params carry a 729-entry cube.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
half = { version = "2", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
pollster = "1"
# The one convention for optional test resources (GPU, corpus, …):
# `unavailable: <reason>`, PAGED_REQUIRE_<X>=1, PAGED_CORPUS_DIR. Test-only:
# a dev-dependency, or image-gpu's `test-support` feature.
paged-test-resources = { path = "../../platform/shared/test-resources" }
wgpu = "30.0.1"
naga = { version = "30", features = ["wgsl-in"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# PNG codec bench crates (D-4, re-run 2026-10-25: `png` through
# paged-raster now beats zune-png on decode and writes files a third the
# size, so zune-png is a bench comparison and a fixture builder only).
zune-png = "0.5"
zune-core = "0.5"
png = "0.18"

# The shipped wasm (scripts/build-wasm.sh). Whole-program LTO in one
# codegen unit lets the optimiser see across every crate before
# `wasm-opt -Oz`: about 13 % smaller at the same optimisation level, so the
# kernels keep their speed. Native release builds keep `release`.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
