[package]
name = "pdf-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The PDF bundle's Rust half: the PDF-blind mapper (Document IR → paged_scene::Document → .paged bytes) and the page reader of place-as-vectors (a PDF or Illustrator page → vector items, through the engine's hayro interpreter)."

[lib]
# cdylib for the wasm-bindgen `--target web` artifact the bundle loads;
# rlib so native `cargo test` exercises the pure mapper.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
paged-scene = { workspace = true }
paged-model = { workspace = true }
paged-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
hayro-interpret = { workspace = true }
kurbo = { workspace = true }
png = { workspace = true }

# The wasm-bindgen surface is target-gated so the pure IR→Document→pgm mapper
# stays native-testable and the binding only compiles for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
zip = { workspace = true }
flate2 = { workspace = true }
# The editor's load path (`CanvasModel::load`) opens `.paged` bytes through
# `idml_import::open_source_archive` and falls back to `import_idml_archive`;
# the round-trip test drives exactly those calls (paged-canvas is not a dep).
idml-import = { workspace = true }
