[package]
name = "pdf-import"
workspace = "../../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The PDF bundle's Rust half: the PDF-blind mapper (Document IR → paged_scene::Document → .paged bytes) and the page reader of place-as-vectors (a PDF or Illustrator page → vector items, through the engine's hayro interpreter)."

[lib]
# cdylib for the wasm-bindgen `--target web` artifact the bundle loads;
# rlib so native `cargo test` exercises the pure mapper.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
paged-pixel = { path = "../../../../engine/core/crates/paged-pixel" }
paged-scene = { workspace = true }
paged-model = { workspace = true }
# The shared loss report (capability register C18).
paged-loss = { workspace = true }
paged-store = { workspace = true }
paged-pdf-annots = { workspace = true }
paged-pdf-page = { workspace = true }
paged-blend = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
hayro-interpret = { workspace = true }
kurbo = { workspace = true }
png = { workspace = true }
# The structure reader's metric fit: a substitute face's advance widths.
skrifa = { workspace = true }
# The structure reader stores opaque photographs as JPEG, not PNG.
image = { workspace = true }

# The wasm-bindgen surface is target-gated so the pure IR→Document→pgm mapper
# stays native-testable and the binding only compiles for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# The structure reader on the command line: a PDF, a recipe and fonts in,
# a `.paged` and its report out (publish ADR 660).
[[bin]]
name = "paged-pdf-import"
path = "src/bin/paged-pdf-import.rs"

[dev-dependencies]
zip = { workspace = true }
flate2 = { workspace = true }
# The editor's load path (`CanvasModel::load`) opens `.paged` bytes through
# `idml_import::open_source_archive` and falls back to `import_idml_archive`;
# the round-trip test drives exactly those calls (paged-canvas is not a dep).
idml-import = { workspace = true }
# The structure reader's tests read InDesign's PDFs of the engine's
# generated samples back and hold them to the samples themselves.
paged-gen = { path = "../../../../engine/core/crates/paged-gen" }
