# cargo-deny configuration for the plugin-publish crates.
# Run:  cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# The same policy as the engine (engine/core): pdf-import ships as wasm in
# the pdf bundle and builds on the engine's model crates, so its
# dependencies meet the engine's license terms.

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MPL-2.0",
    # Our own crates: dual MPL-2.0 OR PMEL (the Paged Media Engine License;
    # SPDX has no id for it, hence the LicenseRef form).
    "LicenseRef-PMEL",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
# The workspace crates refer to each other by path (none is published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git sources: the shared model crates (paged-model, paged-scene,
# paged-store) and idml-import are path dependencies on engine/core.
allow-git = []
