$schema: '../../.moon/cache/schemas/project.json'

# paged.publish: a Cargo workspace (IDML import/export, PDF import) and a
# pnpm workspace without a root package.json (packages/pdf-bundle,
# packages/publish-bundle).
language: 'rust'
layer: 'library'
stack: 'systems'
tags: ['rust', 'node', 'module', 'wasm']

project:
  title: 'modules/publish'
  description: 'Foreign-format publishing: IDML import/export adapters and the PDF bundle.'

# Cargo git dependency on paged-media/core today (pinned rev); a path
# dependency on engine/core after the Cargo git-to-path step.
dependsOn:
  - id: 'core'
    scope: 'production'

tasks:
  rust-build:
    description: 'publish-ci build: every native target, then the wasm32 build of the bundle crates.'
    script: >-
      cargo build --workspace --all-targets
      && cargo build -p idml-import -p idml-export -p pdf-import --target wasm32-unknown-unknown
    options:
      runInCI: true

  js-check:
    command: 'pnpm -r --filter ./packages/* run typecheck'

  js-test:
    description: 'vitest in the packages that declare a test script.'
    command: 'pnpm -r --filter ./packages/* run test'

  js-build:
    command: 'pnpm -r --filter ./packages/* run build'
    outputs:
      - 'packages/*/dist/**/*'
    options:
      runInCI: true

  wasm:
    description: 'pdf-import mapper wasm into packages/pdf-bundle/bin/ (scripts/build-wasm.sh).'
    toolchains: ['rust']
    command: 'bash scripts/build-wasm.sh'
    inputs:
      - '@group(rust-sources)'
      - 'scripts/build-wasm.sh'
    options:
      # The artifact is committed, so it is not a cached output.
      cache: false
      runInCI: 'skip'
