$schema: "../../.moon/cache/schemas/project.json"

# paged.publish: a Cargo workspace (IDML import/export, PDF import) and JS
# packages without a component package.json (packages/pdf-bundle,
# packages/publish-bundle).
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/publish"
  description: "Foreign-format publishing: IDML import/export adapters and the PDF bundle."

# Path dependencies on the engine's crates (paged-model, paged-scene,
# paged-store; idml-import for pdf-import's tests). The IDML adapter itself
# lives in engine/core/crates since PM-0005.
dependsOn:
  - id: "core"
    scope: "production"

# Moon detects the JS toolchains from a package.json in the project root,
# and this one has none (only packages/*), so they are named here.
toolchains:
  javascript: true
  bun: true
  node: true

# Path dependencies into the engine: its crates are inputs here too, so
# `moon ci` re-runs this project when an engine crate it builds changes.
# (Project file groups replace the workspace ones, so the defaults are
# restated.)
fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"

tasks:
  rust-build:
    description: "publish-ci build: every native target, then the wasm32 build of the bundle crates."
    script: >-
      cargo build --workspace --all-targets
      && cargo build -p pdf-import --target wasm32-unknown-unknown
    options:
      # publish-ci.yml builds the same; `moon ci` runs no Rust task.
      runInCI: false

  js-check:
    command: "bun run --filter './packages/*' typecheck"

  js-test:
    description: "bun test in the packages that declare a test script."
    command: "bun run --filter './packages/*' test"
    # pdf-bundle's mapper specs load bin/pdf_import*; publish-ci builds it.
    deps: ["~:wasm"]

  wasm:
    description: "pdf-import mapper wasm into packages/pdf-bundle/bin/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
    outputs:
      - "packages/pdf-bundle/bin/pdf_import*"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; publish-ci builds
      # it (.github/actions/module-wasm).
      runInCI: "skip"
