[workspace]
resolver = "2"
# The IDML adapter (idml-import, idml-export) and its coverage tool moved into
# the engine workspace (engine/core/crates/); pdf-import is what stays here.
members = ["crates/pdf-import"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
needless_pass_by_value = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# The shared Paged model crates, path-depended from the engine workspace in
# this repository (paths relative to this file). They inherit their own
# settings from engine/core's workspace, and pdf-import builds against the
# engine at the same commit.
paged-model = { path = "../../engine/core/crates/paged-model" }
paged-scene = { path = "../../engine/core/crates/paged-scene" }
# The native `.paged` model codec (pgm to_bytes/from_bytes): the PDF import
# builds a Document and persists it natively (no IDML round-trip).
paged-store = { path = "../../engine/core/crates/paged-store" }
# The IDML reader, for pdf-import's round-trip test (a dev-dependency).
idml-import = { path = "../../engine/core/crates/idml-import" }

thiserror = "2"
# zip 9's `deflate` feature selects flate2's zlib-rs backend (plus zopfli),
# and zlib-rs takes precedence over miniz_oxide for EVERY flate2 user in the
# graph. Re-deflated parts must come out byte-for-byte as they did with zip 2,
# so take `deflate-flate2` and keep flate2 on miniz_oxide (`rust_backend`).
# Every crate that depends on `zip` also lists `flate2`, so it builds alone.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
