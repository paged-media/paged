$schema: "../../.moon/cache/schemas/project.json"

# paged.doc: a Cargo workspace (docx-* crates) and JS packages (doc-bundle,
# doc-host-model). apps/editor builds doc-bundle from source. The OOXML
# foundation is the shared platform/shared/ooxml crate (a path dependency).
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/doc"
  description: "Word/DOCX module: import, lowering, save-back."

# validate:manifest runs the in-tree paged-plugin bin (plugin-sdk);
# docx-skeleton builds on the engine's model crates (ADR 606).
dependsOn:
  - id: "core"
    scope: "production"
  - id: "extensions"
    scope: "development"
  # paged-ooxml, a path dependency of the Cargo workspace.
  - id: "ooxml"
    scope: "production"
  # dml-native, the shared DrawingML paint and effect mapper onto the
  # engine model (slide ADR 722, doc ADR 618).
  - id: "dml-native"
    scope: "production"

# Path dependencies into the engine (docx-skeleton / slide-native build on
# paged-model, paged-scene, paged-store; ADR 606 / ADR 708) and into
# platform/shared/ooxml (paged-ooxml, doc ADR 607): their crates are inputs
# here too, so `moon ci` re-runs this project when one it builds changes.
# (Project file groups replace the workspace ones, so the defaults are
# restated.)
fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "/engine/core/Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-native/src/**/*.rs"
    - "/platform/shared/dml-native/Cargo.toml"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-native/src/**/*.rs"
    - "/platform/shared/dml-native/Cargo.toml"

# The doc crates are members of the engine's Cargo workspace (one Cargo
# workspace, docs/development/one-workspace.md): this directory has no
# Cargo.toml, so the Rust tasks run cargo in engine/core and select the module's
# crates with -p.
tasks:
  rust-fmt:
    script: "cd ../../engine/core && cargo fmt -p docx-core -p docx-import -p docx-lower -p docx-export -p docx-rtf -p docx-odt -p docx-js -p docx-skeleton -p docx-conformance --check"
  rust-check:
    script: "cd ../../engine/core && cargo check -p docx-core -p docx-import -p docx-lower -p docx-export -p docx-rtf -p docx-odt -p docx-js -p docx-skeleton -p docx-conformance --all-targets"
  rust-lint:
    script: "cd ../../engine/core && cargo clippy -p docx-core -p docx-import -p docx-lower -p docx-export -p docx-rtf -p docx-odt -p docx-js -p docx-skeleton -p docx-conformance --all-targets -- -D warnings"
  rust-test:
    script: >-
      cd ../../engine/core
      && cargo nextest run -p docx-core -p docx-import -p docx-lower -p docx-export -p docx-rtf -p docx-odt -p docx-js -p docx-skeleton -p docx-conformance
      && cargo test --doc -p docx-core -p docx-import -p docx-lower -p docx-export -p docx-rtf -p docx-odt -p docx-js -p docx-skeleton -p docx-conformance
  rust-build:
    script: "cd ../../engine/core && cargo build -p docx-core -p docx-import -p docx-lower -p docx-export -p docx-rtf -p docx-odt -p docx-js -p docx-skeleton -p docx-conformance"
  wasm:
    description: "docx-js wasm into packages/doc-bundle/bin/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "packages/doc-bundle/manifest.json"
    outputs:
      - "packages/doc-bundle/bin/docx_js*"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; doc-rust and the
      # editor's module-wasm action (.github/actions/module-wasm) build it in CI.
      runInCI: "skip"
