$schema: "../../.moon/cache/schemas/project.json"

# paged.doc: a Cargo workspace (docx-*, paged-ooxml) and JS packages
# (doc-bundle, doc-host-model). apps/editor builds doc-bundle from source.
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/doc"
  description: "Word/DOCX module: import, lowering, save-back."

# validate:manifest runs the in-tree paged-plugin bin (plugin-sdk);
# docx-skeleton builds on the engine's model crates (ADR 606).
dependsOn:
  - id: "core"
    scope: "production"
  - id: "extensions"
    scope: "development"

# Path dependencies into the engine (docx-skeleton / slide-native build on
# paged-model, paged-scene, paged-store; ADR 606 / ADR 708): its crates are
# inputs here too, so `moon ci` re-runs this project when an engine crate it
# builds changes. (Project file groups replace the workspace ones, so the
# defaults are restated.)
fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"

tasks:
  wasm:
    description: "docx-js wasm into packages/doc-bundle/bin/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "packages/doc-bundle/manifest.json"
    outputs:
      - "packages/doc-bundle/bin/docx_js*"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; doc-rust and the
      # editor's module-wasm action (.github/actions/module-wasm) build it in CI.
      runInCI: "skip"
