[package]
name = "docx-core"
workspace = "../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc frozen semantic WordprocessingML view: sections, body blocks (paragraphs/runs/tables), and the style catalog — a thin, plugin-owned model over paged-ooxml's typed DOM, decoupled from ooxmlsdk's enum-vector ergonomics."

[lints]
workspace = true

[dependencies]
serde.workspace = true
# The shared OOXML foundation without its typed DOM: the DrawingML reader's
# authored IR a picture keeps (serde derives on), and the HSL arithmetic of
# Word's theme tint and shade (doc ADR 618).
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["deflate-flate2", "serde"] }
# The DrawingML chart model with paged.slide's paints and text properties
# (doc ADR 628): what `slide-chart` lays out, read by `dml-chart`.
pptx-core.workspace = true
# An authored `a:custGeom` is `dml-geom`'s geometry program (doc ADR 627,
# amendment: one reader and evaluator for slide, doc and sheet).
dml-geom = { path = "../../../platform/shared/dml-geom" }
# The math tree an equation is read into (engine ADR 1090).
paged-math = { workspace = true, features = ["serde"] }
