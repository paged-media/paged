[package]
name = "docx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc frozen semantic WordprocessingML view: sections, body blocks (paragraphs/runs/tables), and the style catalog — a thin, plugin-owned model over paged-ooxml's typed DOM, decoupled from ooxmlsdk's enum-vector ergonomics."

[lints]
workspace = true

[dependencies]
serde.workspace = true
# The shared OOXML foundation without its typed DOM: the DrawingML reader's
# authored IR a picture keeps (serde derives on), and the HSL arithmetic of
# Word's theme tint and shade (doc ADR 618).
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["deflate-flate2", "serde"] }
