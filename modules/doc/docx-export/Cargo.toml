[package]
name = "docx-export"
workspace = "../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc M2 edited save-back: native (edited) Lowered IR + the retained OOXML → a byte-level TARGETED PATCH of word/document.xml (only changed w:t/w:rPr subtrees rewritten; every other part + untouched subtree byte-identical). quick-xml as a locator only — never links the ooxmlsdk serializer."

[lints]
workspace = true

[dependencies]
docx-core.workspace = true
docx-lower.workspace = true
# The one DrawingML crop mapping and picture-effect writer (dml_native::crop, ::picture).
dml-native.workspace = true
# Engine ADR 1096: a Word shape's preset (the model's field), whether the
# canvas's anchors are still what it draws, and `a:custGeom` when not.
paged-model = { path = "../../../engine/core/crates/paged-model" }
paged-preset-geom = { path = "../../../engine/core/crates/paged-preset-geom" }
dml-geom = { path = "../../../platform/shared/dml-geom" }
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["dom", "deflate-flate2"] }
quick-xml = "0.41"
serde.workspace = true
# The new-package writer (doc ADR 616): zip through flate2, as everywhere.
zip.workspace = true
flate2.workspace = true
