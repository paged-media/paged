[package]
name = "docx-skeleton"
workspace = "../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc standalone open (thoughts ADR 029): a Word document's SECTIONS as a page skeleton (a page per section, its margin-box frame, an empty story) built as a native document with the engine's model crates and packaged as .paged for host.nativeDocument.open (ADR 606). The bundle sets each story's grow rule on the wire and pours it afterwards."

[lints]
workspace = true

[dependencies]
docx-core.workspace = true
docx-lower.workspace = true
paged-model.workspace = true
paged-scene.workspace = true
paged-store.workspace = true
# The catalogue (theme, swatches, styles) is applied with the engine's own
# operations (doc ADR 625): the doc wasm grows by this crate.
paged-mutate = { path = "../../../engine/core/crates/paged-mutate" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
docx-conformance = { path = "../docx-conformance" }
docx-import.workspace = true
zip.workspace = true
flate2.workspace = true
