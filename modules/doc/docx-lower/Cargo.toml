[package]
name = "docx-lower"
workspace = "../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc Tier-0 lowering: pure docx-core -> a plugin-local Lowered IR (native stories + synthesized style catalog + swatches + section geometry), the contract the TS doc-host-model turns into host mutations. No SDK; the engine only through the shared DrawingML mapper (dml-native, the model's value types; doc ADR 618)."

[lints]
workspace = true

[dependencies]
# The OOXML units (and, for drawings, the DrawingML paint reader), without
# the typed DOM.
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["deflate-flate2"] }
# The one DrawingML-to-engine mapper of slide, doc and sheet (slide ADR 722,
# doc ADR 618): a picture's look onto native effects. It reaches the
# engine's model crate for its value types only, never the scene or store.
dml-native = { path = "../../../platform/shared/dml-native" }
docx-core.workspace = true
# The math tree of an equation (engine ADR 1090).
paged-math = { workspace = true, features = ["serde"] }
serde.workspace = true
# The shared loss report its diagnostics are (capability register C18).
paged-loss.workspace = true
base64 = { workspace = true }
# Word's charts (doc ADR 628): paged.slide's chart layout from the cached
# values (PowerPoint's, which is Office's), and its chart model.
slide-chart.workspace = true
pptx-core.workspace = true
# DrawingML preset geometry (Annex D's 187 presets, doc ADR 629).
dml-geom = { path = "../../../platform/shared/dml-geom" }
# A line shortened under its heads (doc ADR 629, amendment 1): the
# engine's trim along the curve, on its path anchors.
paged-geom = { path = "../../../engine/core/crates/paged-geom" }
paged-model = { path = "../../../engine/core/crates/paged-model" }

[dev-dependencies]
# Engine ADR 1096: the tests check a Word preset's outline is the engine's
# live preset.
paged-preset-geom = { path = "../../../engine/core/crates/paged-preset-geom" }
