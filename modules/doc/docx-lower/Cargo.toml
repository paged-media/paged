[package]
name = "docx-lower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc Tier-0 lowering: pure docx-core -> a plugin-local Lowered IR (native stories + synthesized style catalog + swatches + section geometry), the contract the TS doc-host-model turns into host mutations. No SDK; the engine only through the shared DrawingML mapper (dml-native, the model's value types; doc ADR 618)."

[lints]
workspace = true

[dependencies]
# The OOXML units (and, for drawings, the DrawingML paint reader), without
# the typed DOM.
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["deflate-flate2"] }
# The one DrawingML-to-engine mapper of slide, doc and sheet (slide ADR 722,
# doc ADR 618): a picture's look onto native effects. It reaches the
# engine's model crate for its value types only, never the scene or store.
dml-native = { path = "../../../platform/shared/dml-native" }
docx-core.workspace = true
serde.workspace = true
base64 = { workspace = true }
