# paged.doc — Cargo workspace.
#
# Crates live at REPO TOP LEVEL (mirrors plugin-sheets §4 layout), not under
# crates/. Every crate is AGPL-3.0-only OR PMEL (the workspace default below).
# The OOXML foundation, `paged-ooxml`, is platform/shared/ooxml, shared with
# slide and sheet (modules ADR 607).
[workspace]
resolver = "2"
# DOC-02 wasm go/no-go spike PASSED 2026-07-23 (ooxmlsdk 0.12 builds for wasm32);
# full member set restored.
members = [
    "docx-core",
    "docx-import",
    "docx-lower",
    "docx-export",
    "docx-js",
    "docx-skeleton",
    "docx-conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.dependencies]
# The shared OOXML foundation: OPC container (with its memory budget) +
# preservation carry-through, and the ooxmlsdk typed part DOM (`dom`; DOC-02:
# committed as the semantic-parse foundation). ooxmlsdk is held at 0.12 there:
# 0.13 makes docx_js 0.8 MB (12 %) larger, which the app-wide wasm budget has
# no room for (docs/migration/rust-majors.md). `deflate` keeps the zip
# backend this workspace always had (zlib-rs).
paged-ooxml = { path = "../../platform/shared/ooxml", features = ["dom", "deflate"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# Shared data plumbing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
# wasm boundary (docx-js only).
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Intra-workspace crates.
docx-core = { path = "docx-core" }
docx-import = { path = "docx-import" }
docx-lower = { path = "docx-lower" }
docx-export = { path = "docx-export" }
docx-js = { path = "docx-js" }
# Optional test resources (docs/development/testing.md): dev-dependency only.
paged-test-resources = { path = "../../platform/shared/test-resources" }
docx-skeleton = { path = "docx-skeleton" }


[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The shipped wasm (scripts/build-wasm.sh). Size-first codegen for ooxmlsdk
# alone, the typed OOXML DOM and its generated (de)serializers, takes the
# artifact under the manifest's `maxBytes` (8 MiB): about 17 % smaller,
# with the same load cost per document (measured on a 4 MB document.xml).
# `opt-level = "z"` for the whole build is only 1 % smaller again and loads
# about a fifth slower.
[profile.wasm-release]
inherits = "release"

[profile.wasm-release.package.ooxmlsdk]
opt-level = "z"
