# paged.doc — Cargo workspace.
#
# Crates live at REPO TOP LEVEL (mirrors plugin-sheets §4 layout), not under
# crates/. `paged-ooxml` is the shared OOXML foundation; every crate, it
# included, is AGPL-3.0-only OR PMEL (the workspace default below).
[workspace]
resolver = "2"
# DOC-02 wasm go/no-go spike PASSED 2026-07-23 (ooxmlsdk 0.12 builds for wasm32);
# full member set restored.
members = [
    "paged-ooxml",
    "docx-core",
    "docx-import",
    "docx-lower",
    "docx-export",
    "docx-js",
    "docx-skeleton",
    "docx-conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.dependencies]
# OOXML typed part DOM (DOC-02: committed as the semantic-parse foundation).
# Held at 0.12: 0.13 makes docx_js 0.8 MB (12 %) larger, which the app-wide
# wasm budget has no room for (docs/migration/rust-majors.md).
ooxmlsdk = { version = "0.12", features = ["mce"] }
# OPC container + preservation carry-through (proven wasm in sheet-xlsx).
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# Shared data plumbing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
compact_str = { version = "0.10", features = ["serde"] }
base64 = "0.23"
# wasm boundary (docx-js only).
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Intra-workspace crates.
paged-ooxml = { path = "paged-ooxml" }
docx-core = { path = "docx-core" }
docx-import = { path = "docx-import" }
docx-lower = { path = "docx-lower" }
docx-export = { path = "docx-export" }
docx-js = { path = "docx-js" }
# Optional test resources (docs/development/testing.md): dev-dependency only.
paged-test-resources = { path = "../../platform/shared/test-resources" }
docx-skeleton = { path = "docx-skeleton" }
# The engine's model crates, path-depended from the engine workspace at the
# same commit (ADR 606): the standalone-open skeleton is built as a
# native `paged_scene::Document` and packaged by core's one `.paged` writer.
paged-model = { path = "../../engine/core/crates/paged-model" }
paged-scene = { path = "../../engine/core/crates/paged-scene" }
paged-store = { path = "../../engine/core/crates/paged-store" }
# The IDML reader, for the skeleton's equivalence test (dev-dependency only).
idml-import = { path = "../../engine/core/crates/idml-import" }


[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The shipped wasm (scripts/build-wasm.sh). Size-first codegen for ooxmlsdk
# alone, the typed OOXML DOM and its generated (de)serializers, takes the
# artifact under the manifest's `maxBytes` (8 MiB): about 17 % smaller,
# with the same load cost per document (measured on a 4 MB document.xml).
# `opt-level = "z"` for the whole build is only 1 % smaller again and loads
# about a fifth slower.
[profile.wasm-release]
inherits = "release"

[profile.wasm-release.package.ooxmlsdk]
opt-level = "z"

# The native skeleton's model serializer (ADR 606): size-first codegen for
# the engine's model crates, which the skeleton only builds and writes once
# per open.
[profile.wasm-release.package.paged-model]
opt-level = "z"

[profile.wasm-release.package.paged-scene]
opt-level = "z"

[profile.wasm-release.package.paged-store]
opt-level = "z"
