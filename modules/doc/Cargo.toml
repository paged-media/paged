# paged.doc — Cargo workspace.
#
# Crates live at REPO TOP LEVEL (mirrors plugin-sheets §4 layout), not under
# crates/. Every crate is AGPL-3.0-only OR PMEL (the workspace default below).
# The OOXML foundation, `paged-ooxml`, is platform/shared/ooxml, shared with
# slide and sheet (modules ADR 607).
[workspace]
resolver = "2"
# DOC-02 wasm go/no-go spike PASSED 2026-07-23 (ooxmlsdk 0.12 builds for wasm32);
# full member set restored.
members = [
    "docx-core",
    "docx-import",
    "docx-lower",
    "docx-export",
    "docx-rtf",
    "docx-odt",
    "docx-js",
    "docx-skeleton",
    "docx-conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.dependencies]
# The shared OOXML foundation: OPC container (with its memory budget) +
# preservation carry-through, and the ooxmlsdk typed part DOM (`dom`; DOC-02:
# committed as the semantic-parse foundation). ooxmlsdk is held at 0.12 there:
# 0.13 makes docx_js 0.8 MB (12 %) larger, which the app-wide wasm budget has
# no room for (docs/migration/rust-majors.md). Its zip goes through flate2
# (`deflate-flate2`), as this workspace's does.
paged-ooxml = { path = "../../platform/shared/ooxml", features = ["dom", "deflate-flate2"] }
# zip 9 deflates through flate2 alone, the declaration of engine/core, sheet,
# publish and the server (and paged-store, which this workspace builds on):
# zip's `deflate` feature would add zopfli (only for compression levels
# above 9, which nothing here asks for) and pick flate2's zlib-rs backend.
# flate2 below names the backend, so every crate that depends on `zip` lists
# `flate2` beside it.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# ooxmlsdk 0.12's `parts` feature (which `mce` needs) also brings zip 8 with
# `deflate-flate2-zlib-rs`, and flate2 prefers zlib-rs to miniz_oxide when
# both are on: the packages are deflated by zlib-rs, as before, byte for byte
# (docs/migration/shared-foundations.md, C5).
quick-xml = "0.41"
# Shared data plumbing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
# wasm boundary (docx-js only).
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Intra-workspace crates.
docx-core = { path = "docx-core" }
docx-import = { path = "docx-import" }
docx-lower = { path = "docx-lower" }
docx-export = { path = "docx-export" }
docx-rtf = { path = "docx-rtf" }
docx-odt = { path = "docx-odt" }
docx-js = { path = "docx-js" }
# Optional test resources (docs/development/testing.md): dev-dependency only.
paged-test-resources = { path = "../../platform/shared/test-resources" }
docx-skeleton = { path = "docx-skeleton" }
# The engine's model crates, path-depended from the engine workspace at the
# same commit (ADR 606): the standalone-open skeleton is built as a
# native `paged_scene::Document` and packaged by core's one `.paged` writer.
paged-model = { path = "../../engine/core/crates/paged-model" }
paged-scene = { path = "../../engine/core/crates/paged-scene" }
paged-store = { path = "../../engine/core/crates/paged-store" }


[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The shipped wasm (scripts/build-wasm.sh). Size-first codegen for ooxmlsdk
# alone, the typed OOXML DOM and its generated (de)serializers, takes the
# artifact under the manifest's `maxBytes` (8 MiB): about 17 % smaller,
# with the same load cost per document (measured on a 4 MB document.xml).
# `opt-level = "z"` for the whole build is only 1 % smaller again and loads
# about a fifth slower.
[profile.wasm-release]
inherits = "release"

[profile.wasm-release.package.ooxmlsdk]
opt-level = "z"

# The native skeleton's model serializer (ADR 606): size-first codegen for
# the engine's model crates, which the skeleton only builds and writes once
# per open.
[profile.wasm-release.package.paged-model]
opt-level = "z"

[profile.wasm-release.package.paged-scene]
opt-level = "z"

[profile.wasm-release.package.paged-store]
opt-level = "z"
