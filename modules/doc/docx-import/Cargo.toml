[package]
name = "docx-import"
workspace = "../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc Tier-0 importer: an OPC package (via paged-ooxml) + the ooxmlsdk WordprocessingML typed DOM -> the docx-core semantic model. A scanner, not a validator: malformed input yields a partial model + an error, never a panic."

[lints]
workspace = true

[dependencies]
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["dom", "deflate-flate2"] }
docx-core.workspace = true
# Word's charts (doc ADR 628): the shared DrawingML chart reader, with
# paged.slide's paint and text property types (the model slide-chart lays
# out).
dml-chart = { path = "../../../platform/shared/dml-chart", features = ["serde"] }
pptx-core.workspace = true
# `a:custGeom` read by the shared DrawingML geometry reader.
dml-geom = { path = "../../../platform/shared/dml-geom" }
# The math tree the shared OMML reader returns (engine ADR 1090).
paged-math.workspace = true
