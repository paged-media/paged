# CI evidence for the state matrix (plugin.draw stage): run the
# machine unit tests and upload the junit as an artifact for the private
# state repo to pull (see the step comment for why the direction is
# inverted). Vitest's junit output carries no @feat: tags — state applies
# its ingest/test-map.yaml bridge at convert time. Cadence is central
# (state ingest/schedules.yaml → scheduler.yml workflow_dispatch); no
# schedule here.
#
# Layout note: the link: chain (draw-* → ../../../sdk/packages/*)
# requires plugin-draw/ and sdk/ as SIBLINGS under the workspace, so
# both checkouts are nested. The editor checkout is NOT needed —
# plugin-api re-exports editor types only (erased at runtime), and
# this job runs tests, not typecheck (wire-compat lives there).
name: vitest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-draw
      - uses: actions/checkout@v4
        with:
          repository: paged-media/sdk
          path: sdk
          token: ${{ secrets.STATE_DISPATCH_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install (sdk sibling satisfies the link chain)
        run: pnpm install --frozen-lockfile --dir plugin-draw
      - name: vitest (junit per package; red results still publish)
        run: |
          pnpm -r --no-bail --dir plugin-draw exec \
            vitest run --reporter=junit --outputFile=junit.xml || true
          cat plugin-draw/packages/*/junit.xml > junit-all.xml
          [ -s junit-all.xml ] # at least one package must have produced results
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-draw,
      # suite=vitest, format=nextest-junit).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: junit-all.xml
          if-no-files-found: error
          retention-days: 14
