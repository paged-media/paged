$schema: "../../.moon/cache/schemas/project.json"

# paged.draw: the image-trace crates (members of the engine's Cargo workspace) and JS packages
# (draw-geometry, draw-tools, draw-bundle).
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/draw"
  description: "Vector drawing module: geometry, tools, image trace."

# draw-rust validates the bundle manifest with the in-tree paged-plugin bin (plugin-sdk).
# The Cargo workspace path-depends on the engine's paged-svg (draw ADR 364),
# so it builds after the engine and an engine change runs this module's gates.
dependsOn:
  - id: "core"
    scope: "production"
  - id: "extensions"
    scope: "development"
  - id: "test-kit"
    scope: "development"

# The engine crate the Cargo workspace path-depends on (paged-svg) is an
# input too, so `moon ci` re-runs this project when it changes. (Project
# file groups replace the workspace ones, so the defaults are restated.)
fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/Cargo.lock"
    - "/engine/core/crates/paged-svg/**/*.rs"
    - "/engine/core/crates/paged-svg/Cargo.toml"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/Cargo.lock"
    - "/engine/core/crates/paged-svg/**/*"

# The draw crates are members of the engine's Cargo workspace (one Cargo
# workspace, docs/development/one-workspace.md): this directory has no
# Cargo.toml, so the Rust tasks run cargo in engine/core and select the crates
# with -p.
tasks:
  rust-fmt:
    script: "cd ../../engine/core && cargo fmt -p draw-trace -p draw-dxf -p trace-js --check"
  rust-check:
    script: "cd ../../engine/core && cargo check -p draw-trace -p draw-dxf -p trace-js --all-targets"
  rust-lint:
    description: "clippy as draw-rust runs it: native, then wasm32."
    script: >-
      cd ../../engine/core
      && cargo clippy -p draw-trace -p draw-dxf -p trace-js --all-targets -- -D warnings
      && cargo clippy -p draw-trace -p draw-dxf -p trace-js --all-targets --target wasm32-unknown-unknown -- -D warnings
  rust-test:
    script: >-
      cd ../../engine/core
      && cargo nextest run -p draw-trace -p draw-dxf -p trace-js
      && cargo test --doc -p draw-trace -p draw-dxf -p trace-js
  rust-build:
    script: "cd ../../engine/core && cargo build -p draw-trace -p draw-dxf -p trace-js"

  js-test:
    # The image-trace specs boot the wasm; draw-vitest.yml builds it first.
    deps: ["~:wasm"]

  manifest:
    description: "paged-plugin validate of the bundle manifest (measures the built wasm)."
    toolchains: ["system"]
    deps: ["~:wasm"]
    command: "bun ../../platform/extensions/packages/plugin-sdk/bin/paged-plugin.mjs validate packages/draw-bundle/manifest.json"
    inputs:
      - "packages/draw-bundle/manifest.json"
      - "packages/draw-bundle/wasm/*"
      - project: "extensions"
        filter:
          [
            "packages/plugin-sdk/bin/**/*",
            "packages/plugin-sdk/untyped-commands.baseline.json",
            "packages/plugin-api/src/manifest.schema.json",
          ]

  wasm:
    description: "trace-js wasm into packages/draw-bundle/wasm/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "packages/draw-bundle/manifest.json"
    outputs:
      - "packages/draw-bundle/wasm/trace_js*"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; draw-rust and
      # draw-vitest build it in CI (.github/actions/module-wasm).
      runInCI: "skip"
