[package]
name = "trace-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.draw wasm-bindgen surface (image trace, DXF interchange, SVG recolour) — the artifact the bundle declares under capabilities.wasm[] and loads in the bundle realm."

[lib]
name = "trace_js"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
draw-trace = { path = "../draw-trace" }
# DXF interchange and the SVG paint reader (draw ADR 364).
draw-dxf = { path = "../draw-dxf" }
paged-svg = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
# The `dxf` crate mints a UUID per drawing (uuid v4); on
# wasm32-unknown-unknown uuid needs a randomness source, and `js` is the
# browser's `crypto.getRandomValues`.
uuid = { version = "1", features = ["js"] }
