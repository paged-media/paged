[package]
name = "trace-js"
workspace = "../../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.draw wasm-bindgen surface (image trace, DXF interchange, SVG recolour, vector Puppet Warp and Liquify) — the artifact the bundle declares under capabilities.wasm[] and loads in the bundle realm."

[lib]
name = "trace_js"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
draw-trace = { path = "../draw-trace" }
# DXF interchange and the SVG paint reader (draw ADR 364).
draw-dxf = { path = "../draw-dxf" }
paged-svg = { workspace = true }
# Puppet Warp and Liquify for the vector tools (one implementation with the
# raster warps).
paged-warp = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# EXACT pin: the wasm-bindgen CRATE and the CLI that post-processes the artifact
# must be the same version or the generated glue does not match the module.
# tooling/rust/build-wasm.sh re-checks this against Cargo.lock and refuses to
# build on a mismatch.
wasm-bindgen = "=0.2.129"
console_error_panic_hook = { workspace = true }
# The `dxf` crate mints a UUID per drawing (uuid v4); on
# wasm32-unknown-unknown uuid needs a randomness source, and `js` is the
# browser's `crypto.getRandomValues`.
uuid = { version = "1", features = ["js"] }
