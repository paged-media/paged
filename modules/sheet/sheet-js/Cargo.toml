[package]
name = "sheet-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.sheet wasm-bindgen surface (spec §4 sheet-js): the SheetHandle the bundle consumes. crate-type cdylib for the wasm artifact."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sheet-core = { path = "../sheet-core" }
# The calendar, the locale table and digit grouping (platform/shared/fmt).
paged-fmt = { path = "../../../platform/shared/fmt" }
sheet-parser = { path = "../sheet-parser" }
sheet-calc = { path = "../sheet-calc" }
sheet-fn = { path = "../sheet-fn" }
sheet-format = { path = "../sheet-format" }
sheet-xlsx = { path = "../sheet-xlsx" }
sheet-lower = { path = "../sheet-lower" }
sheet-grid = { path = "../sheet-grid" }
# The M2 charts track (spec §8.4): sheet-js resolves a parsed chart's series
# RangeRefs to PlotData and calls the pure `sheet_chart::generate` to produce
# the geometry IR that crosses the wasm door (the lowering / grid view consume
# it). Pure leaf crate (deps = core+format), no SDK, no inter-plugin contact.
sheet-chart = { path = "../sheet-chart" }
serde.workspace = true

# wasm-only boundary deps (referenced solely inside #[cfg(target_arch =
# "wasm32")] mod wasm). On the native build (the conformance test target) they
# are unused-but-present — harmless; the cargo-tree guard checks the wasm tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

[features]
# Exposes `perfCounters()` / `resetPerfCounters()` on the wasm (the
# sheet-calc work counters). OFF in the shipped wasm: scripts/build-wasm.sh
# builds with no features; scripts/build-wasm-perf.sh builds this one into
# a separate directory.
perf-counters = ["sheet-calc/perf-counters"]

[dev-dependencies]
# tests/it/wave4_features.rs and wave9_colors.rs build and read packages.
zip.workspace = true
# tests/it/wave6_format.rs reads the TS option spelling through serde.
serde_json.workspace = true
# tests/perf_budgets.rs reads sheet_calc::perf; a dev-dependency feature
# never reaches the wasm build.
sheet-calc = { path = "../sheet-calc", features = ["perf-counters"] }
# Wall-clock benches (benches/): trended, never gated — the gates are the
# count budgets in tests/perf_budgets.rs. No plotters/rayon.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "session"
harness = false
