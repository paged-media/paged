# cargo-nextest configuration (mirrors core's .config/nextest.toml).
#
# The `ci` profile emits JUnit XML that the publish-state workflow hands
# to paged-media/state's publish-results action (format: nextest-junit,
# source: plugin-sheets, suite: nextest). The default profile is
# unchanged — local `cargo nextest run` behaves as before.

[profile.ci]
# Don't stop at the first failure: the state matrix wants every red row.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
report-name = "paged-sheet-nextest"

# The opt-in corpus lane: every `#[ignore = "corpus: xlsx"]` test, which
# reads the private corpus (docs/development/testing.md).
#
#   PAGED_CORPUS_DIR=<corpus root> PAGED_REQUIRE_CORPUS=1 \
#     cargo nextest run --profile corpus --run-ignored only
[profile.corpus]
default-filter = "binary_id(sheet-conformance::it) & (test(/^real_xlsx_corpus::/) | test(=xlsx_recalc_corpus::xlsx_recalc_full_corpus_report))"
fail-fast = false
