# sheet.fn.* (T2/M2) — remaining publishing-relevant misc functions, ONE family
# module (`families/t2misc.rs`). A deliberately SMALL, honest seed (spec §11 T2
# "remaining publishing-relevant functions"); web/RTD functions are EXCLUDED by
# design (spec §1.1) so ENCODEURL and friends are NOT here. Schema: see math.yaml.
#
# STATUS: implemented by the M2 t2misc track. Kernels land in
# `sheet-fn/src/families/t2misc.rs`; direct-dispatch tests in
# `sheet-conformance/tests/it/fn_t2misc.rs` (prefix `sheet_fn_t2misc_<name>`);
# goldens under `corpus/fn-corpus/t2misc/`.
#
# AGGREGATE / SUBTOTAL are aggregation functions over ranges (range_aware) whose
# function_num selector chooses the inner aggregate AND (for AGGREGATE) the
# error/hidden-row handling. ROMAN/ARABIC are scalar text<->number conversions.
# CONVERT does basic unit conversion. HYPERLINK is display-only in T2 — it
# returns its friendly text; the link target is not navigable on the page
# surface (documented ruling, see the kernel module docs).
#
# DOCUMENTED T2 SUBSETS (full subset rationale in `families/t2misc.rs`):
# - AGGREGATE: function_num 1-11 only (AVERAGE/COUNT/COUNTA/MAX/MIN/PRODUCT/
#   STDEV.S/STDEV.P/SUM/VAR.S/VAR.P); options 0/4 (ignore nothing) and 6 (ignore
#   error values). function_num 12-19 (MEDIAN/MODE/LARGE/SMALL/PERCENTILE.INC/
#   QUARTILE.INC and friends) and the HIDDEN-ROW options (1/2/3/5/7) are NOT
#   interpreted in T2 -> #NUM! (bad function_num) / #VALUE! (unsupported
#   option). No row visibility reaches the pure kernel. NESTED-SUBTOTAL
#   exclusion IS implemented (eval-side, see SUBTOTAL note) for every option.
# - SUBTOTAL: function_num 1-11 and 101-111. T2 has no row-visibility metadata
#   in the pure kernel, so 1-11 and 101-111 compute IDENTICALLY (both include all
#   cells). NESTED SUBTOTAL/AGGREGATE results inside a ref ARE EXCLUDED (FINDING
#   3, ECMA-376 §18.17.7): a pure kernel can't see precedent formulas, so the
#   EVALUATOR masks nested-subtotal cells to blank during range materialization
#   (sheet-calc/eval.rs plan_args, gated on the outer call being
#   SUBTOTAL/AGGREGATE) before the kernel runs. Only the direct =SUBTOTAL(...)
#   root counts as a nested result (Excel-matching); a SUBTOTAL buried in a
#   larger expression does not.
# - CONVERT: a documented BASIC unit set only — length (m/ft/in/mi/km), mass
#   (g/kg/lbm), time (s/min/hr/day), temperature (C/F/K). Unknown unit or
#   mismatched dimension -> #N/A.

- id: sheet.fn.math.aggregate
  name: AGGREGATE
  xlfn_prefix: "_xlfn."
  family: t2misc
  arity: { min: 3, max: null }
  volatility: none
  range_aware: true
  rust: t2misc::aggregate
  status: implemented
  provenance: ["Microsoft AGGREGATE (public docs) — function_num 1-19 (12 MEDIAN, 13 MODE.SNGL, 14 LARGE, 15 SMALL, 16/17 PERCENTILE/QUARTILE.INC, 18/19 .EXC take k), options 0-7: 2/3/6/7 skip errors, 1/3/5/7 skip hidden rows (evaluator mask), nested SUBTOTAL/AGGREGATE always skipped (Excel-recorded, fix3/aggregate3)"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_t2misc.rs::sheet_fn_t2misc_aggregate"]
    corpus: ["corpus/fn-corpus/t2misc/aggregate.golden.tsv", "corpus/fn-corpus/fix3/aggregate3.golden.tsv"]

- id: sheet.fn.math.subtotal
  name: SUBTOTAL
  family: t2misc
  arity: { min: 2, max: null }
  volatility: none
  range_aware: true
  rust: t2misc::subtotal
  status: implemented
  provenance: ["ECMA-376 §18.17.7 (SUBTOTAL) — function_num 1-11 skip filter-hidden rows, 101-111 every hidden row (sheet-calc subtotal_mask, W3); nested SUBTOTAL/AGGREGATE results excluded (FINDING 3). Excel-recorded (fix3/subtotal3)"]
  tests:
    rust:
      - "sheet-conformance/tests/it/fn_t2misc.rs::sheet_fn_t2misc_subtotal"
      - "sheet-conformance/tests/it/special_forms.rs::sheet_fn_math_subtotal_excludes_nested"
    corpus: ["corpus/fn-corpus/t2misc/subtotal.golden.tsv", "corpus/fn-corpus/fix3/subtotal3.golden.tsv"]

- id: sheet.fn.math.roman
  name: ROMAN
  family: t2misc
  arity: { min: 1, max: 2 }
  volatility: none
  range_aware: false
  rust: t2misc::roman
  status: implemented
  provenance: ["ECMA-376 §18.17.7 (ROMAN) — arabic -> roman-numeral text in forms 0 (classic) to 4 (simplified), TRUE = 0, FALSE = 4; 0-3999; 0 -> empty text; other -> #VALUE! (Excel-recorded, fix3/roman3)"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_t2misc.rs::sheet_fn_t2misc_roman"]
    corpus: ["corpus/fn-corpus/t2misc/roman.golden.tsv", "corpus/fn-corpus/fix3/roman3.golden.tsv"]

- id: sheet.fn.math.arabic
  name: ARABIC
  xlfn_prefix: "_xlfn."
  family: t2misc
  arity: { min: 1, max: 1 }
  volatility: none
  range_aware: false
  rust: t2misc::arabic
  status: implemented
  provenance: ["Microsoft ARABIC (public docs) — roman-numeral text -> arabic number (inverse of classic ROMAN); empty -> 0; leading '-' negates; non-roman text -> #VALUE!."]
  tests:
    rust: ["sheet-conformance/tests/it/fn_t2misc.rs::sheet_fn_t2misc_arabic"]
    corpus: ["corpus/fn-corpus/t2misc/arabic.golden.tsv"]

- id: sheet.fn.engineering.convert
  name: CONVERT
  family: engineering
  arity: { min: 3, max: 3 }
  volatility: none
  range_aware: false
  rust: units::convert
  status: implemented
  provenance: ["ECMA-376 §18.17.7 + Microsoft function reference (CONVERT) — the full unit table with decimal and binary prefixes; unknown unit, prefix on a unit that takes none, or mismatched dimension -> #N/A (rulings in families/units.rs, Excel-recorded)"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_t2misc.rs::sheet_fn_t2misc_convert"]
    corpus: ["corpus/fn-corpus/t2misc/convert.golden.tsv", "corpus/fn-corpus/eng/convert_units.golden.tsv"]

- id: sheet.fn.lookup.hyperlink
  name: HYPERLINK
  family: t2misc
  arity: { min: 1, max: 2 }
  volatility: none
  range_aware: false
  rust: t2misc::hyperlink
  status: implemented
  provenance: ["Microsoft HYPERLINK (public docs) — link_location, [friendly_name]. T2 RULING: returns the friendly text (or the link text when friendly is absent/blank); the link is DISPLAY-ONLY on the page surface (not navigable). Documented, not faked (ruling in families/t2misc.rs)."]
  tests:
    rust: ["sheet-conformance/tests/it/fn_t2misc.rs::sheet_fn_t2misc_hyperlink"]
    corpus: ["corpus/fn-corpus/t2misc/hyperlink.golden.tsv"]
