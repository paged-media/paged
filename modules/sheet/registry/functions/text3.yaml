# sheet.fn.text.* (W3 additions) — regular expressions, ARRAYTOTEXT /
# VALUETOTEXT, BAHTTEXT, the width and byte variants, PHONETIC, ENCODEURL,
# FILTERXML, EUROCONVERT. Kernels in sheet-fn/src/families/text3.rs (the
# byte variants reuse the text/text2 kernels). Expected values recorded from
# Excel (oracle/excel/recorded/text3.tsv); provenance: Microsoft's public
# function reference, PCRE2 pattern and substitution syntax.

- id: sheet.fn.text.regextest
  name: REGEXTEST
  family: text
  arity: { min: 2, max: 3 }
  volatility: none
  range_aware: false
  rust: text3::regextest
  status: implemented
  provenance: ["Microsoft function reference (REGEXTEST) — PCRE2 via fancy-regex; bad pattern or flag #VALUE!"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_text3.rs::sheet_fn_text3_regextest"]
    corpus: ["corpus/fn-corpus/text3/regextest.golden.tsv"]

