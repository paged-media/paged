- id: sheet.fn.lookup.trimrange
  name: TRIMRANGE
  xlfn_prefix: "_xlfn."
  family: lookup
  arity: { min: 1, max: 3 }
  volatility: none
  range_aware: true
  returns_array: true
  rust: array3::trimrange
  status: implemented
  provenance: ["Microsoft function reference (TRIMRANGE) — leading/trailing blank rows and columns dropped; all blank #REF!"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_array3.rs::sheet_fn_array3_trimrange"]
    corpus: ["corpus/fn-corpus/array3/trimrange.golden.tsv"]

- id: sheet.fn.lookup.areas
  name: AREAS
  family: lookup
  arity: { min: 1, max: 1 }
  volatility: none
  range_aware: false
  ref_args: true
  special_form: true
  status: implemented
  provenance: ["Microsoft function reference (AREAS) — the areas of a union reference; evaluator special form"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_array3.rs::sheet_fn_array3_areas"]
    corpus: ["corpus/fn-corpus/array3/areas.golden.tsv"]

