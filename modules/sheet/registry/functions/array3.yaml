# sheet.fn.lookup.* / array (W3 additions) — EXPAND, WRAPROWS, WRAPCOLS,
# TRIMRANGE (kernels in sheet-fn/src/families/array3.rs), AREAS, GROUPBY,
# PIVOTBY (evaluator special forms: sheet-calc/src/eval/{info,groupby}.rs).
# GROUPBY / PIVOTBY are approved as worksheet functions; the interactive
# pivot table stays preserve-only (ADR 504). Expected values recorded from
# Excel (oracle/excel/recorded/array3.tsv). The trim-reference operators
# `.:` / `:.` need an AST amendment that has not landed (TRIMRANGE covers
# their meaning).

- id: sheet.fn.lookup.expand
  name: EXPAND
  xlfn_prefix: "_xlfn."
  family: lookup
  arity: { min: 2, max: 4 }
  volatility: none
  range_aware: true
  returns_array: true
  rust: array3::expand
  status: implemented
  provenance: ["Microsoft function reference (EXPAND) — pad to a size; smaller #VALUE!, past the grid #NUM!"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_array3.rs::sheet_fn_array3_expand"]
    corpus: ["corpus/fn-corpus/array3/expand.golden.tsv"]

