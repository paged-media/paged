# sheet.fn.math.* (W3 additions) — the modern rounding forms, matrix
# functions, reciprocal trigonometry and paired-array sums. Kernels in
# sheet-fn/src/families/math3.rs (+ linalg.rs). Expected values are recorded
# from Excel (sheet-conformance/oracle/excel/recorded/math3.tsv); provenance:
# Microsoft's public function reference.

- id: sheet.fn.math.ceiling-math
  name: CEILING.MATH
  family: math
  arity: { min: 1, max: 3 }
  volatility: none
  range_aware: false
  rust: math3::ceiling_math
  status: implemented
  provenance: ["Microsoft function reference (CEILING.MATH) — |significance|, mode rounds negatives away from zero; quotient rounded to 15 digits"]
  tests:
    rust: ["sheet-conformance/tests/it/fn_math3.rs::sheet_fn_math3_ceiling_math"]
    corpus: ["corpus/fn-corpus/math3/ceiling_math.golden.tsv"]

