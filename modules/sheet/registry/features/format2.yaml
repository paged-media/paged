# sheet.format.* (M1 additions) — advanced number-format engine features
# (M1 format track, spec §9). The FORMAT2 track implements all six rows in
# sheet-format (additive over the frozen M0 public fns) with golden corpora
# and the sheet-conformance/tests/it/format2.rs registry-pointer tests. Schema:
# id/title/status/provenance/tests.

- id: sheet.format.elapsed-brackets
  title: Elapsed time formats ([h], [mm], [ss]) — bracketed accumulators that exceed a single unit
  ruling: "[h]/[m]/[s] are TOTAL elapsed accumulators over the whole serial, NOT the modular wall-clock component: [h] over a 1.5-day serial renders 36 (not 12), while a modular :mm in the same code keeps its wall-clock 00. [hh]/[mm]/[ss] set a minimum zero-padded field width. Derived via serial::serial_to_elapsed (rounded to the nearest whole second base so [h]/[m]/[s] agree)."
  status: implemented
  provenance: ["ECMA-376 §18.8.31 (elapsed-time codes)"]
  tests:
    rust: ["sheet-conformance/tests/it/format2.rs::sheet_format_elapsed_brackets"]
    corpus: ["corpus/format-corpus/elapsed.golden.tsv"]

- id: sheet.format.fractions
  title: Fraction formats (# ?/?, # ??/??) — denominator fitting
  ruling: "The fitted form shows the LAST continued-fraction convergent of the fraction whose denominator fits 10^den_digits-1 — not the best rational approximation (Excel 16, recorded in the display lane: 3.14159 under # ??/?? shows 3 1/7, although 14/99 is closer). The fixed form (# ?/16) reduces to the literal denominator, not lowest terms. A numerator that rounds up to the denominator carries into the integer (# ??/?? of 2.96 -> 2 24/25). ? slots space-pad to their width, a documented T0 alignment approximation (# ??/?? of 2/3 -> '  2/ 3'); a zero fraction with an integer part blanks the slot to spaces (# ?/? of 4 -> '4    ')."
  status: implemented
  provenance: ["ECMA-376 §18.8.31 (fraction codes)"]
  tests:
    rust: ["sheet-conformance/tests/it/format2.rs::sheet_format_fractions"]
    corpus: ["corpus/format-corpus/fractions.golden.tsv"]

- id: sheet.format.conditional-sections
  title: Conditional format sections ([>=100]...;[<0]...) — comparison-gated section selection
  ruling: "The first conditioned section whose test passes (against the RAW signed value) wins; otherwise the first UNCONDITIONED section is the 'otherwise' default. NO selected section auto-prefixes a minus: a matched conditional section owns its sign, and the unconditioned fallthrough behaves like the negative section (the #,##0;#,##0 minus-suppression rule), so [>=100]0;0 of -5 is '5' and [>=100]0;-0 of -5 is '-5' (the author's own minus, never doubled to '--5'). The lone pathological case (every section conditioned, none matched) best-effort auto-signs over the first section."
  status: implemented
  provenance: ["ECMA-376 §18.8.31 (conditional format brackets)", "Excel #,##0;#,##0 minus-suppression (public docs)"]
  tests:
    rust: ["sheet-conformance/tests/it/format2.rs::sheet_format_conditional_sections"]
    corpus: ["corpus/format-corpus/conditional.golden.tsv"]

- id: sheet.format.color-brackets
  title: Color brackets ([Red], [Blue], [Color12]) carried through to the lowered style
  ruling: "The eight named colors ([Black][Blue][Cyan][Green][Magenta][Red][White][Yellow]) are a SIDECAR: a color bracket never changes the rendered glyphs, only the cell color. The frozen format_value DROPS the color (string byte-identical to M0); the new format_value_styled(v, fmt, ctx) -> (String, Option<FormatColor>) surfaces it. The reported color follows section selection ([Red]0.0;[Blue]0.0 colors negatives blue). [ColorN] (1..56) names the workbook palette at slot N+7, and the eight names are palette entries too ([Black]=[Color1] … [Cyan]=[Color8]), so a workbook <indexedColors> override recolours them. The lowering folds the colour into the cell's text colour on the page table and the live grid alike (a conditional format's font colour still wins)."
  status: implemented
  provenance: ["ECMA-376 §18.8.31 (color codes)"]
  tests:
    rust: ["sheet-conformance/tests/it/format2.rs::sheet_format_color_brackets"]
    corpus: ["corpus/format-corpus/color.golden.tsv"]

- id: sheet.format.padding
  title: Repeat/skip-width tokens (* and _) — fill-to-width and skip-a-char-width padding
  ruling: "The *x repeat-fill char fills a column to its width in Excel. The string APIs (TEXT, format_value) emit the fill char EXACTLY ONCE at its token position, as Excel's TEXT does; format_value_display reports its position (FillSpec), and the lowering splits the cell text there with a tab: the live grid repeats the character across the free width, the page table carries a right tab stop at the cell's inner width with the character as its leader. The companion _x (skip a char width) is approximated as a single space (already an M0 behavior)."
  status: implemented
  provenance: ["ECMA-376 §18.8.31 (* and _ tokens)"]
  tests:
    rust: ["sheet-conformance/tests/it/format2.rs::sheet_format_padding"]
    corpus: ["corpus/format-corpus/padding.golden.tsv"]

- id: sheet.format.locale-currency-token
  title: Locale/currency tokens ([$-409], [$EUR]) parsed and rendered
  ruling: "The grammar is [$<symbol>-<locale-hex>]; we emit exactly the SYMBOL portion (everything between the $ and the first -locale suffix) as a literal at its token position, and DROP the locale id. A pure locale tag [$-409] has an empty symbol (contributes no literal); a bare [$USD] (no -locale) emits the whole 'USD'. Locale-driven separators/decimal marks are NOT applied in T0 (en grouping/decimal only; D-8 v1 locale set still open)."
  status: implemented
  provenance: ["ECMA-376 §18.8.31 (currency/locale tokens)"]
  tests:
    rust: ["sheet-conformance/tests/it/format2.rs::sheet_format_locale_currency_token"]
    corpus: ["corpus/format-corpus/currency.golden.tsv"]

- id: sheet.format.system-formats
  title: System long date / long time ([$-F800], [$-F400], [$-x-sysdate], [$-x-systime])
  ruling: "A section carrying the system-format locale id renders the display locale's own long-date or long-time pattern and ignores the pattern written after the bracket (Excel stores the pattern it showed at save time; it displays the system's). en-US: dddd, mmmm d, yyyy and h:mm:ss AM/PM."
  status: implemented
  provenance: ["ECMA-376 §18.8.31 (locale ids in number formats)", "Microsoft Office number-format documentation (system date/time ids)"]
  tests:
    rust: ["sheet-conformance/tests/it/format2.rs::sheet_format_system_formats"]
