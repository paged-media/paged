# sheet.chart.* (T2/M2, spec §8.4) — charts: model, xlsx chart-part fidelity,
# the pure geometry generator (one generator, two projections), paged.draw
# lowering, the grid view, and live recalc. The IR is FROZEN in the sheet-chart
# crate (M2 Phase A); these rows are the BUILD-CONSUMED status ledger the Phase B
# charts track flips to implemented as each lands.
#
# STATUS: implemented (M2 charts track). The IR is FROZEN in sheet-chart; the
# generator is real for EVERY curated kind (bar/column, stacked column/bar,
# line/area, pie/donut, scatter, radar), the XLSX chart parts parse +
# round-trip-preserve, sheet-js resolves series ranges to geometry (list_charts
# + get_chart_geometry), the TS translator lowers the IR to paged.draw native
# ops, and the bundle contributes a lower-chart command. Taxonomy mirrors
# sheet.xlsx.* for the chart-part rows: parsed -> preserved -> calculated ->
# rendered -> round-trips, with `preserved` the floor for unsupported chart
# types (spec §8.4).
#
# GRAPHS ROW (Illustrator catalog §16.4, 2026-08-05). The nine Illustrator
# graph types are now a SUBSET of the curated set: the three that were missing
# (Stacked Column, Stacked Bar, Radar) landed as ChartKind variants expressed
# entirely in the EXISTING frozen `Primitive` vocabulary, so the paged.draw
# lowering (`chartGeometryToMutations`) needed no change at all. `Axis::title`
# stopped being a modelled-but-dead field. `c:grouping` stopped being ignored
# on import. The catalog's remaining items resolve as: the "graph data editor"
# IS the workbook (sheet.chart.data-editor); "import/paste data" is already
# three shipped doors (xlsx importer, range clipboard, data provider);
# "transpose rows/columns" is sheet.chart.series-orientation; "design markers /
# graph designs" needs a CORE door that does not exist and is filed, not faked
# (sheet.chart.design-markers, RFI S-16).

- id: sheet.chart.model
  title: Chart model (kind, series/category range bindings, axes, legend) — the frozen sheet-chart IR
  status: implemented
  provenance: ["spec §8.4", "sheet-chart/src/model.rs (frozen IR)"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_model"]

- id: sheet.chart.xlsx-part
  title: XLSX chart part (/charts/chartN.xml) parse + preserve into the chart model (preservation invariant, spec §10.2)
  ruling: >
    The chart and drawing parts stay OPAQUE until a chart is edited: a
    zero-edit round-trip is byte-identical. Discovered through the
    worksheet->drawing->chart (and /chartEx) relationship chain. An edited
    chart is spliced into its part (sheet.chart.writer, ADR 519).
  status: implemented
  provenance: ["ECMA-376 §21.2 (DrawingML charts)", "spec §8.4, §10.2", "sheet-xlsx/src/parts/chart.rs"]
  tests:
    rust:
      - "sheet-conformance/tests/it/chart.rs::sheet_chart_xlsx_part"
      - "sheet-conformance/tests/it/chart.rs::sheet_chart_xlsx_part_kind_battery"

- id: sheet.chart.geometry.bar-column
  title: "Geometry: bar/column — axis frame + per-bar Rects with linear value scaling + tick/category labels"
  ruling: "Column scales on Y (bars grow up); Bar transposes — the value axis runs along X (bars grow right), the category axis down the left (sheet-chart/src/geometry.rs::generate_column / generate_bar)."
  status: implemented
  provenance: ["spec §8.4", "sheet-chart/src/geometry.rs"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_geometry_bar_column"]

- id: sheet.chart.geometry.line-area
  title: "Geometry: line/area — polyline series + area fill polygons over the cartesian frame"
  ruling: >
    Line emits a Line polyline per series with Excel's markers (automatic
    symbols unless the series says none; authored lines have none); Area adds
    a closed Polygon to the crossing value. Stacked and percent-stacked lines
    and areas accumulate in series order (W4, ADR 519).
  status: implemented
  provenance: ["spec §8.4", "sheet-chart/src/geometry.rs"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_geometry_line_area"]

- id: sheet.chart.geometry.pie-donut
  title: "Geometry: pie/donut — Wedge primitives (donut = pie with a center hole)"
  ruling: >
    One Wedge per slice with angles proportional to each value's magnitude
    share, clockwise from the first-slice angle. A doughnut draws one ring per
    series as ring segments (the Wedge's optional `innerR`), no longer a pie
    under a page-white disc. A pie draws its first series, as Excel does
    (ruling sheet.chart.kinds.pie-series, ADR 519).
  status: implemented
  provenance: ["spec §8.4", "sheet-chart/src/geometry.rs"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_geometry_pie_donut"]

- id: sheet.chart.geometry.scatter
  title: "Geometry: scatter — point markers in (x,y) value space (no category axis)"
  ruling: >
    A marker per point in (x, y) value space; each series carries its own X
    range (c:xVal), several series per chart, lines unless the series' line is
    none; a series without X plots 1, 2, 3… (ADR 519).
  status: implemented
  provenance: ["spec §8.4", "ECMA-376 §21.2 (c:scatterChart)", "sheet-chart/src/geometry.rs"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_geometry_scatter"]

- id: sheet.chart.geometry.stacked
  title: "Geometry: stacked column / stacked bar — segments share one bar per category over a totals-based value scale"
  ruling: >
    Excel's rule since W4 (ADR 519): the segments share one bar per category;
    positive values stack upward and negative values downward on separate
    running totals; percent-stacked divides each category by the sum of its
    magnitudes on a 0–100% axis. (Before W4 a sub-floor segment had no height;
    that ruling is superseded.)
  status: implemented
  provenance: ["Illustrator capability catalog §16.4 (Stacked Column / Stacked Bar)", "spec §8.4", "sheet-chart/src/geometry.rs::generate_column / generate_bar"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_geometry_stacked"]

- id: sheet.chart.geometry.radar
  title: "Geometry: radar — a polar grid (rings + spokes) with one closed polyline per series"
  ruling: >
    plotters has no polar coordinate system a CUSTOM DrawingBackend can drive,
    so — exactly like pie/donut — the polar layout is emitted DIRECTLY while
    the title and legend still flow through the backend (one text-metrics
    path). Nothing new enters the FROZEN IR: the grid rings, the spokes and
    each series' outline are all `Primitive::Line` polylines closed by
    repeating the first point, so the paged.draw lowering needed no new op.
    Spokes run CLOCKWISE FROM 12 O'CLOCK — the same angular convention
    `Primitive::Wedge` uses, so both projections read one rule. Series are
    STROKED, never filled: a filled radar hides every series drawn under it.
    Fewer than three category axes cannot enclose an area, so the generator
    emits the title/legend only rather than a degenerate polygon.
  status: implemented
  provenance: ["Illustrator capability catalog §16.4 (Radar Graph tool)", "spec §8.4", "sheet-chart/src/geometry.rs::generate_radar"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_geometry_radar"]

- id: sheet.chart.axis-titles
  title: Axis titles reach the geometry (cat_axis.title / val_axis.title were modelled but never drawn)
  ruling: >
    `Axis::title` has been parsed from the chart part since M2 and drew
    NOTHING — a modelled field with no output. It draws now on every cartesian
    kind. PLACEMENT: the frozen `Primitive::Text` carries no rotation angle
    and adding one would break the wire IR every consumer mirrors, so the
    value-axis title is set HORIZONTALLY above its axis (start-anchored at the
    content-box left) rather than rotated up the side, and the category-axis
    title is centered under the category labels. The `Bar` family transposes
    the two (its value axis runs along the bottom). Both are common publishing
    placements; neither fakes a rotation the IR cannot express. Pie/donut/radar
    have no cartesian axes to title and emit nothing.
  status: implemented
  provenance: ["Illustrator capability catalog §16.4 (labels, axes)", "spec §8.4", "sheet-chart/src/geometry.rs::draw_axis_titles"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_axis_titles"]

- id: sheet.chart.xlsx.grouping
  title: XLSX chart part — c:grouping selects the stacked kind; c:radarChart parses
  ruling: >
    `c:grouping` selects the grouping on bar, line and area plots (standard,
    stacked, percent-stacked — all drawn as such since W4, ADR 519), and every
    plot element maps to its own kind (sheet.chart.kinds). The part stays
    opaque, so a zero-edit round-trip is byte-identical.
  status: implemented
  provenance: ["ECMA-376 §21.2.2.78 (c:grouping), §21.2.2.153 (c:radarChart)", "spec §8.4, §10.2", "sheet-xlsx/src/parts/chart.rs"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_xlsx_grouping"]

- id: sheet.chart.kind-set
  title: The advertised chart-kind set is a superset of Illustrator's nine graph types
  ruling: >
    ONE list (`sheet_js::core::CHART_KIND_TAGS`) is the tag vocabulary the
    parser, the printer and the panel all read: one tag per kind and grouping
    (column, stackedColumn, percentStackedColumn, the same for bar, line and
    area, then scatter, bubble, pie, donut, pieOfPie, barOfPie, radar,
    filledRadar, stock, surface, waterfall, funnel, treemap, sunburst,
    histogram, pareto, boxWhisker). The test authors EVERY advertised tag
    against a real workbook and renders it.
  status: implemented
  provenance: ["Illustrator capability catalog §16.4", "sheet-js/src/core.rs::CHART_KIND_TAGS"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_kind_set"]

- id: sheet.chart.authoring
  title: Chart AUTHORING over live data (add_chart) — the model stopped being import-only
  ruling: >
    `add_chart(sheet, values, categories, kind, title, series_in)` builds a
    ChartModel and returns the same index handle `get_chart_geometry` and the
    lowering take. The chart is written into the xlsx on save (a generated
    part, sheet.chart.writer); scatter takes its first column as X, bubble X
    then (Y, size) pairs, the single-series chartEx kinds their first series.
    Legend on with more than one series.
  status: implemented
  provenance: ["spec §8.4", "sheet-js/src/core.rs::add_chart"]
  tests:
    rust:
      - "sheet-conformance/tests/it/chart.rs::sheet_chart_authoring"
      - "sheet-conformance/tests/it/chart_write.rs::every_authored_kind_is_written"

- id: sheet.chart.series-orientation
  title: "Transpose rows/columns — read the values block as one series per column OR per row"
  ruling: >
    `add_chart`'s `series_in` is Illustrator §16.4's transpose control:
    `columns` (the default, and what an empty string means) reads one series
    per COLUMN of the values block, `rows` one per ROW. It re-reads the SAME
    cells the other way round — the workbook is NEVER rewritten to transpose a
    chart. (Transposing the DATA is what the TRANSPOSE worksheet function is
    for; doing it here would edit the user's data to change a picture, which
    the preservation invariant forbids in spirit.) An unknown orientation is a
    boundary error, not a silent default.
  status: implemented
  provenance: ["Illustrator capability catalog §16.4 (transpose rows/columns)", "sheet-js/src/core.rs::add_chart"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_series_orientation"]

- id: sheet.chart.data-editor
  title: "The graph data editor IS the workbook — no second grid is built"
  ruling: >
    Illustrator's graph data editor is a small spreadsheet bolted onto a
    drawing app. paged.sheet IS the spreadsheet: the workbook panel, the
    formula bar and the in-frame K-1 modal edit session (double-click entry →
    cell select → keystroke editor → Enter/Esc, session-scoped undo) already
    edit exactly the cells a chart's series ranges bind to, and
    `get_chart_geometry` re-resolves those ranges against the LIVE model
    (sheet.chart.recalc-live), so an edit updates the chart. Building a second,
    weaker grid inside the chart UI would be a downgrade. This row exists so
    the decision is recorded rather than left as an apparent gap.
  status: implemented
  provenance: ["Illustrator capability catalog §16.4 (graph data editor)", "spec §8.1/§8.4", "packages/sheet-bundle/src/panels/grid-panel.tsx"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_recalc_live"]
    vitest: ["packages/sheet-bundle/test/grid-panel.spec.ts", "packages/sheet-bundle/test/formula-bar.spec.ts"]

- id: sheet.chart.design-markers
  title: "Design markers / graph designs (a user's own art as the bar or the point marker)"
  status: planned
  note: >
    BLOCKED ON A CORE DOOR THAT DOES NOT EXIST — filed, not faked (RFI S-16).
    An Illustrator graph design instantiates an arbitrary piece of user art
    once per data point, scaled/repeated/sliding. Expressing that needs an op
    that INSTANTIATES AN EXISTING DOCUMENT ELEMENT at a transform. The
    protocol's create ops all mint fresh geometry from literal coordinates
    (insertPath / insertOval / insertLine / insertTextFrame / placeImage);
    there is no duplicate-element, place-symbol or instance op, and
    createGroup/setGroupTransform only regroup nodes that already exist. The
    only way to fake it from the bundle would be to READ the donor art's
    geometry and re-emit hundreds of literal insertPath ops per chart — a
    copy, not an instance: it would not track edits to the source art, would
    bloat the document, and would misrepresent a symbol as art. paged.draw
    ships symbols v0, but the ISOLATION CONTRACT (§2.1, superset) forbids
    reaching into another plugin at all, so that is not a route either. What
    IS expressible today and already ships: built-in vector markers (the
    scatter diamond) drawn from the primitive vocabulary. When the core
    instance op lands, this row becomes a mapping from ChartKind + a bound
    element id onto per-point instances.
  provenance: ["Illustrator capability catalog §16.4 (design markers, graph designs)", "spec §2.1 (isolation contract)", "RFI §6 S-16"]

- id: sheet.chart.lower.paged-draw
  title: Lower chart geometry to paged.draw native path ops (insertPath/insertOval/insertLine)
  ruling: "paged.draw is reached as a CORE SDK surface (the TS translator chartGeometryToMutations emits insertPath + insertTextFrame native wire ops), NEVER via another plugin (spec §2.1) — the same two-surface rule as the sheet itself. Rect/Line/Polygon/Wedge lower to insertPath (wedge arc-flattened to a closed ring); Text two-phases through insertTextFrame + insertText. The Rust test proves the geometry IR wire shape the TS translator consumes; the vitest pointer proves the translation. Charts are document-native vector art, regenerated on recalc, never rasterized."
  status: implemented
  provenance: ["spec §8.4, §2.1 (paged.draw is core, not a plugin)", "packages/sheet-host-model/src/chart.ts"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_lower_paged_draw"]
    vitest: ["packages/sheet-host-model/test/chart.spec.ts"]

- id: sheet.chart.grid-view
  title: Chart geometry rendered in the sheets-mode grid view (the same generator, the §8.1 surface)
  ruling: "One generator, two projections (spec §8.4): the grid view consumes the SAME geometry IR the page lowering does. sheet-js's get_chart_geometry resolves a parsed chart's series ranges against the live model and runs sheet_chart::generate (sheet-js/src/core.rs); the bundle facade exposes listCharts + getChartGeometry."
  status: implemented
  provenance: ["spec §8.4, §8.1", "sheet-js/src/core.rs"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_grid_view"]

- id: sheet.chart.recalc-live
  title: Charts are live to recalculation (series ranges re-resolve and the geometry regenerates)
  ruling: "get_chart_geometry resolves the series RangeRefs against the LIVE engine model each call, so editing a value cell regenerates the geometry (the value scale + bars track the recalculated values) — spec §8.4."
  status: implemented
  provenance: ["spec §8.4 (charts live to recalculation)", "sheet-js/src/core.rs"]
  tests:
    rust: ["sheet-conformance/tests/it/chart.rs::sheet_chart_recalc_live"]

- id: sheet.chart.kinds
  title: Every chart kind is drawn as itself — 3-D flagged, chartEx read, never a silent column
  ruling: >
    Each plot element maps to its own kind (bar/col, line, area, pie,
    doughnut, of-pie, scatter, bubble, radar/filled, stock, surface, and the
    chartEx layouts waterfall, funnel, treemap, sunburst, histogram, pareto,
    box & whisker). A 3-D element is its 2-D kind with flattened_3d set; an
    element nothing draws (region map, unknown) is Unsupported, a labelled
    placeholder. The drawing's /chartEx relationship is followed. The opt-in
    corpus lane (sheet-conformance chart_corpus, private corpus) checks 172 of
    172 real charts (ADR 519).
  status: implemented
  provenance: ["ECMA-376 §21.2", "[MS-ODRAWXML] chartEx", "ADR 519", "sheet-xlsx/src/parts/chart.rs"]
  tests:
    rust:
      - "sheet-xlsx/src/parts/chart_tests.rs::every_element_maps_to_its_own_kind"
      - "sheet-xlsx/src/parts/chart_tests.rs::three_d_is_flagged"
      - "sheet-chart/tests/kinds.rs::every_kind_matches_its_snapshot"

- id: sheet.chart.chartex
  title: chartEx parts (cx:chartSpace) — series, data dimensions and layout options read
  ruling: "dml_chart::chart_ex reads each cx:series as a plot (element cx:<layoutId>), its data dimensions by dataId as the series' ranges, and cx:layoutPr (subtotals, binning, statistics, visibility, parent labels) as the plot's ExLayout; a pareto line folds into its owner's pareto layout (ADR 519)."
  status: implemented
  provenance: ["[MS-ODRAWXML] §2.24 (chartEx)", "platform/shared/dml-chart/src/read_ex.rs"]
  tests:
    rust:
      - "sheet-xlsx/src/parts/chart_tests.rs::chart_ex_parts_are_read"
      - "sheet-conformance/tests/it/chart_write.rs::excel_written_chart_ex_reads_back"

- id: sheet.chart.combo
  title: Combo charts — several plots, each with its kind, grouping and axis group; a secondary value axis
  ruling: "ChartModel.plots is a list; a plot whose value axis is not the first plot's is on the secondary axis, drawn on the right with its own scale. Authoring a combo gives each series a kind and axis group; set_series groups consecutive series into plots (ADR 519)."
  status: implemented
  provenance: ["ECMA-376 §21.2.2.145 (c:plotArea)", "ADR 519"]
  tests:
    rust:
      - "sheet-xlsx/src/parts/chart_tests.rs::a_combo_keeps_its_plots"
      - "sheet-chart/src/model.rs::set_series_groups_a_combo"

- id: sheet.chart.stacking
  title: Stacked and 100% stacked bars, lines and areas as Excel draws them
  ruling: "Positive values stack up, negative down, on separate totals; percent-stacked normalises each category to 100% on a 0–100% axis; stacked lines and areas accumulate in series order (ADR 519)."
  status: implemented
  provenance: ["ADR 519", "sheet-chart/src/cartesian.rs"]
  tests:
    rust:
      - "sheet-chart/tests/kinds.rs::percent_stacked_columns_fill_the_axis"
      - "sheet-chart/tests/kinds.rs::stacked_lines_accumulate"

- id: sheet.chart.series-features
  title: Markers, data labels, trendlines (R², equation) and error bars
  ruling: "Excel's marker symbols and automatic sequence; data labels with value/category/series/percent/bubble size, position and number format; trendlines fitted with the function library's least-squares solver (the one behind LINEST): linear, exponential, logarithmic, polynomial 2–6, power, moving average; error bars fixed, percentage, standard deviation (centred on the mean), standard error, custom (ADR 519)."
  status: implemented
  provenance: ["ECMA-376 §21.2.2 (c:marker, c:dLbls, c:trendline, c:errBars)", "ADR 519"]
  tests:
    rust:
      - "sheet-xlsx/src/parts/chart_tests.rs::series_features_are_read"
      - "sheet-chart/src/extras.rs::linear_fit_matches_linest"
      - "sheet-chart/src/extras.rs::every_type_fits_its_own_curve"
      - "sheet-chart/src/extras.rs::error_ends_by_type"

- id: sheet.chart.axes
  title: Axes — Excel's automatic bounds, log scale, reversed, crossing, date axis, number format, gridlines
  ruling: "Automatic bounds with 5% headroom and a 1-2-5 unit, zero included unless the data sit in a narrow band; explicit min/max/unit win; logarithmic and reversed scales; bars grow from the crossing value; date axes by base unit; axis or source number format; major/minor gridlines; legend positions r/l/t/b/tr (ADR 519)."
  status: implemented
  provenance: ["ECMA-376 §21.2.2 (c:valAx, c:dateAx, c:scaling)", "sheet-chart/src/scale.rs"]
  tests:
    rust:
      - "sheet-chart/src/scale.rs::excel_bounds_with_headroom"
      - "sheet-chart/src/scale.rs::log_and_reversed"
      - "sheet-chart/src/scale.rs::overrides_win"

- id: sheet.chart.style-roles
  title: Chart colour and text roles carry document swatch / style references beside the concrete value
  ruling: "The shared ColorRef / TextStyleRef (sheet-core visual, ADR 518) on every role; the geometry carries fillSwatchRef/strokeSwatchRef/colorSwatchRef/paragraphStyle/characterStyle beside the resolved colour; the page lowering references the swatch (never mints it) and applies the style with an auto-sizing label frame. Paged's c:extLst records references; a reference is restored on import only while the concrete value is unchanged (ADR 519)."
  status: implemented
  provenance: ["ADR 519", "packages/sheet-host-model/src/chart.ts"]
  tests:
    rust:
      - "sheet-chart/tests/kinds.rs::style_refs_ride_beside_the_colour"
      - "sheet-xlsx/src/parts/chart_tests.rs::document_references_return_only_while_the_value_holds"
      - "sheet-chart/src/colors.rs::theme_refs_resolve_with_their_swatch"
    vitest: ["packages/sheet-host-model/test/chart.spec.ts"]

- id: sheet.chart.sparklines
  title: Sparklines (x14 line, column, win/loss) read and drawn in a cell box
  ruling: "x14:sparklineGroups in a worksheet's captured extLst become SparklineGroups (colours rgb or theme+tint, markers, high/low/first/last/negative, axis, custom bounds, blanks); sheet_chart::sparkline draws one in its cell's box; the grid scene carries the visible cells' sparklines (GridScene.sparklines) and the frame surface and scene layer paint them; the captured bytes round-trip unchanged. Not drawn on the page yet (ADR 519)."
  status: implemented
  provenance: ["[MS-XLSX] §2.6.86 (sparklineGroup)", "sheet-xlsx/src/parts/sparkline.rs", "sheet-chart/src/sparkline.rs"]
  tests:
    rust:
      - "sheet-xlsx/src/parts/sparkline.rs::reads_groups_colours_and_cells"
      - "sheet-chart/src/sparkline.rs::three_kinds_draw_in_the_cell"
      - "sheet-chart/tests/kinds.rs::sparklines_draw_in_their_cell"
      - "sheet-conformance/tests/it/chart_write.rs::sparklines_draw_in_the_grid_scene"
    vitest: ["packages/sheet-host-model/test/grid-paint.spec.ts"]

- id: sheet.chart.writer
  title: Charts written back into the xlsx — edited charts spliced, authored ones generated, deleted ones removed
  ruling: >
    dml_chart::write generates c:chartSpace / cx:chartSpace parts in schema
    order and patches a part as read (ADR 503 amendment). An edited chart
    replaces only the changed roles; an authored chart gets its part, drawing
    anchor, relationships, overrides and (chartEx) style parts; a deleted one
    leaves the package. Each written chart records its session index so a
    reload keeps every handle. Excel opens every case without a repair and
    reports the chart type Paged wrote (open-check lane, recorded).
  status: implemented
  provenance: ["ECMA-376 §21.2", "[MS-ODRAWXML] chartEx", "ADR 519", "ADR 503 amendment 2026-10-23"]
  tests:
    rust:
      - "sheet-conformance/tests/it/chart_write.rs::every_authored_kind_is_written"
      - "sheet-conformance/tests/it/chart_write.rs::an_edited_chart_is_spliced"
      - "sheet-conformance/tests/it/chart_write.rs::a_kind_change_replaces_the_plot_element"
      - "sheet-conformance/tests/it/chart_write.rs::a_deleted_chart_leaves_the_package"
      - "sheet-conformance/tests/it/chart_write.rs::an_authored_chart_keeps_its_index"
      - "sheet-conformance/tests/it/excel_opencheck.rs::excel_opens_the_charts_paged_writes"
      - "sheet-xlsx/src/chart_write_tests.rs::recorded_indexes_keep_every_handle"

- id: sheet.chart.chartsheets
  title: Chartsheets — a sheet tab that is one chart
  ruling: "A workbook sheet whose relationship is a chartsheet loads as an empty sheet (indexes unchanged) and is reported as a tab kind (list_sheets kind=chartsheet with its chart; list_chartsheets); its chart is flagged chartsheet, drawn, edited and written back like any chart, and never deleted (the tab is the chart). The workbook panel labels the tab; the frame surface does not offer it (a frame shows cells) (ADR 519)."
  status: implemented
  provenance: ["ECMA-376 §18.3.1.12 (chartsheet)", "ADR 519"]
  tests:
    rust: ["sheet-conformance/tests/it/chart_write.rs::a_chartsheet_is_a_tab_kind"]
