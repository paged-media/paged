$schema: "../../.moon/cache/schemas/project.json"

# paged.sheet: a Cargo workspace (sheet-* crates; fuzz/ is a separate
# cargo-fuzz workspace that sheet-fuzz.yml runs) and JS packages.
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/sheet"
  description: "Spreadsheet module: calc engine, formats, XLSX, charts."

# validate:manifest runs the in-tree paged-plugin bin (plugin-sdk).
# sheet-format, sheet-fn and sheet-js take engine/core/crates/paged-fmt by path,
# sheet-xlsx platform/shared/ooxml.
dependsOn:
  - id: "extensions"
    scope: "development"
  - id: "test-kit"
    scope: "development"
  - id: "core"
    scope: "production"
  - id: "ooxml"
    scope: "production"
  # dml-chart, the shared DrawingML chart reader (slide ADR 709).
  - id: "dml-chart"
    scope: "production"
  # dml-native, the shared DrawingML paint and effect mapper onto the
  # engine model (slide ADR 722, sheet ADR 527).
  - id: "dml-native"
    scope: "production"

fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "/engine/core/Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/crates/paged-fmt/src/**/*.rs"
    - "/engine/core/crates/paged-fmt/Cargo.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-chart/src/**/*.rs"
    - "/platform/shared/dml-chart/Cargo.toml"
    - "/platform/shared/dml-native/src/**/*.rs"
    - "/platform/shared/dml-native/Cargo.toml"
    - "/engine/core/crates/paged-model/**/*.rs"
    - "/engine/core/crates/paged-model/Cargo.toml"
    - "/engine/core/crates/paged-image-adjust/**/*.rs"
    - "/engine/core/crates/paged-image-adjust/Cargo.toml"
    - "/engine/core/crates/paged-kernels/**/*.rs"
    - "/engine/core/crates/paged-pixel/**/*.rs"
    - "!fuzz/**"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "!fuzz/**"
    - "/.cargo/*.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-chart/src/**/*.rs"
    - "/platform/shared/dml-chart/Cargo.toml"
    - "/platform/shared/dml-native/src/**/*.rs"
    - "/platform/shared/dml-native/Cargo.toml"
    - "/engine/core/crates/paged-model/**/*.rs"
    - "/engine/core/crates/paged-model/Cargo.toml"
    - "/engine/core/crates/paged-image-adjust/**/*.rs"
    - "/engine/core/crates/paged-image-adjust/Cargo.toml"
    - "/engine/core/crates/paged-kernels/**/*.rs"
    - "/engine/core/crates/paged-pixel/**/*.rs"

# The sheet crates are members of the engine's Cargo workspace (one Cargo
# workspace, docs/development/one-workspace.md): this directory has no
# Cargo.toml, so the Rust tasks run cargo in engine/core and select the module's
# crates with -p.
tasks:
  rust-fmt:
    script: "cd ../../engine/core && cargo fmt -p sheet-core -p sheet-parser -p sheet-calc -p sheet-fn -p sheet-format -p sheet-xlsx -p sheet-lower -p sheet-grid -p sheet-chart -p sheet-js -p sheet-conformance --check"
  rust-check:
    script: "cd ../../engine/core && cargo check -p sheet-core -p sheet-parser -p sheet-calc -p sheet-fn -p sheet-format -p sheet-xlsx -p sheet-lower -p sheet-grid -p sheet-chart -p sheet-js -p sheet-conformance --all-targets"
  rust-lint:
    script: "cd ../../engine/core && cargo clippy -p sheet-core -p sheet-parser -p sheet-calc -p sheet-fn -p sheet-format -p sheet-xlsx -p sheet-lower -p sheet-grid -p sheet-chart -p sheet-js -p sheet-conformance --all-targets -- -D warnings"
  rust-test:
    script: >-
      cd ../../engine/core
      && cargo nextest run -p sheet-core -p sheet-parser -p sheet-calc -p sheet-fn -p sheet-format -p sheet-xlsx -p sheet-lower -p sheet-grid -p sheet-chart -p sheet-js -p sheet-conformance
      && cargo test --doc -p sheet-core -p sheet-parser -p sheet-calc -p sheet-fn -p sheet-format -p sheet-xlsx -p sheet-lower -p sheet-grid -p sheet-chart -p sheet-js -p sheet-conformance
  rust-build:
    script: "cd ../../engine/core && cargo build -p sheet-core -p sheet-parser -p sheet-calc -p sheet-fn -p sheet-format -p sheet-xlsx -p sheet-lower -p sheet-grid -p sheet-chart -p sheet-js -p sheet-conformance"
  js-test:
    # sheet-vitest.yml builds the engine wasm before bun test.
    deps: ["~:wasm"]

  wasm:
    description: "sheet-js wasm into packages/sheet-bundle/bin/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "/tooling/js/source-hash.mjs"
      - "packages/sheet-bundle/manifest.json"
    outputs:
      - "packages/sheet-bundle/bin/sheet_js*"
      - "packages/sheet-bundle/bin/SOURCE_HASH"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; sheet-rust and
      # sheet-vitest build it in CI.
      runInCI: "skip"

  wasm-perf:
    description: "The counting engine wasm (perf-counters) into packages/sheet-bundle/bin-perf/."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm-perf.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm-perf.sh"
      - "/tooling/rust/build-wasm.sh"
    options:
      cache: false
      runInCI: false
