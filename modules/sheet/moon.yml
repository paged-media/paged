$schema: "../../.moon/cache/schemas/project.json"

# paged.sheet: a Cargo workspace (sheet-* crates; fuzz/ is a separate
# cargo-fuzz workspace that sheet-fuzz.yml runs) and JS packages.
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/sheet"
  description: "Spreadsheet module: calc engine, formats, XLSX, charts."

# validate:manifest runs the in-tree paged-plugin bin (plugin-sdk).
# sheet-format, sheet-fn and sheet-js take platform/shared/fmt by path,
# sheet-xlsx platform/shared/ooxml.
dependsOn:
  - id: "extensions"
    scope: "development"
  - id: "test-kit"
    scope: "development"
  - id: "fmt"
    scope: "production"
  - id: "ooxml"
    scope: "production"
  # dml-chart, the shared DrawingML chart reader (slide ADR 709).
  - id: "dml-chart"
    scope: "production"

fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/platform/shared/fmt/src/**/*.rs"
    - "/platform/shared/fmt/Cargo.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-chart/src/**/*.rs"
    - "/platform/shared/dml-chart/Cargo.toml"
    - "!fuzz/**"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "!fuzz/**"
    - "/.cargo/*.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-chart/src/**/*.rs"
    - "/platform/shared/dml-chart/Cargo.toml"

tasks:
  js-test:
    # sheet-vitest.yml builds the engine wasm before bun test.
    deps: ["~:wasm"]

  wasm:
    description: "sheet-js wasm into packages/sheet-bundle/bin/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "/tooling/js/source-hash.mjs"
      - "packages/sheet-bundle/manifest.json"
    outputs:
      - "packages/sheet-bundle/bin/sheet_js*"
      - "packages/sheet-bundle/bin/SOURCE_HASH"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; sheet-rust and
      # sheet-vitest build it in CI.
      runInCI: "skip"

  wasm-perf:
    description: "The counting engine wasm (perf-counters) into packages/sheet-bundle/bin-perf/."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm-perf.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm-perf.sh"
      - "/tooling/rust/build-wasm.sh"
    options:
      cache: false
      runInCI: false
