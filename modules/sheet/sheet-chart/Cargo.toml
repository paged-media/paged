[package]
name = "sheet-chart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.sheet chart model + pure geometry IR generator (spec §8.4, T2/M2). model -> vector primitives in chart-content pt space; the charts track lowers these through paged.draw (a CORE SDK surface, never another plugin)."

[lints]
workspace = true

[dependencies]
# SpreadsheetML's `tint` (and the HSL arithmetic) from the shared OOXML
# colour module, one definition for doc, slide and sheet.
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["deflate-flate2"] }
# The one DrawingML-to-engine mapper of slide, doc and sheet (slide ADR 722,
# sheet ADR 527): chart fills and effects onto native page items.
dml-native = { path = "../../../platform/shared/dml-native" }
sheet-core = { path = "../sheet-core" }
sheet-format = { path = "../sheet-format" }
# Trendlines fit with the function library's least-squares solver (the one
# behind LINEST), so a trendline equals LINEST on its data.
sheet-fn = { path = "../sheet-fn" }
serde = { workspace = true }
compact_str = { workspace = true }
# The chart-layout engine: plotters drives the axis/scale/segmented-category
# coordinate math; sheet-chart's GeomBackend (a custom DrawingBackend) turns
# its draw calls into the frozen ChartGeometry IR. plotters-core only — no
# bitmap/svg/font backends (see the workspace dep comment). MIT/Apache-2.0
# (deny.toml allowlist).
plotters = { workspace = true }
plotters-backend = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
