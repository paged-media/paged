$schema: "../../.moon/cache/schemas/project.json"

# paged.data: a Cargo workspace (data-* crates) and JS packages
# (data-bundle, data-host-model).
language: "rust"
layer: "library"
stack: "data"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/data"
  description: "Database publishing module: DSL, bindings, the Turso query store."

# validate:manifest runs the in-tree paged-plugin bin (plugin-sdk).
# The engine crates (engine/core/crates/paged-data-*, PM-0015) and
# engine/core/crates/paged-fmt are path dependencies.
dependsOn:
  - id: "core"
    scope: "production"
  - id: "extensions"
    scope: "development"
  - id: "test-kit"
    scope: "development"
  # paged-data-xlsx reads a workbook through sheet-xlsx (W5): the sheet
  # project and what its XLSX reader builds on.
  - id: "sheet"
    scope: "production"
  - id: "ooxml"
    scope: "production"
  - id: "dml-chart"
    scope: "production"
  - id: "dml-native"
    scope: "production"

fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/crates/paged-fmt/src/**/*.rs"
    - "/engine/core/crates/paged-fmt/Cargo.toml"
    - "/engine/core/crates/paged-data-*/**/*.rs"
    - "/engine/core/crates/paged-data-*/Cargo.toml"
    - "/engine/core/crates/paged-data-core/functions/*.yaml"
    - "/engine/core/crates/paged-action/**/*.rs"
    - "/engine/core/crates/paged-action/Cargo.toml"

# The data crates are members of the engine's Cargo workspace (one Cargo
# workspace, docs/development/one-workspace.md): this directory has no
# Cargo.toml, so the Rust tasks run cargo in engine/core and select the module's
# crates with -p.
tasks:
  rust-fmt:
    script: "cd ../../engine/core && cargo fmt -p data-js -p data-conformance --check"
  rust-check:
    script: "cd ../../engine/core && cargo check -p data-js -p data-conformance --all-targets"
  rust-lint:
    script: "cd ../../engine/core && cargo clippy -p data-js -p data-conformance --all-targets -- -D warnings"
  rust-test:
    script: >-
      cd ../../engine/core
      && cargo nextest run -p data-js -p data-conformance
      && cargo test --doc -p data-js -p data-conformance
  rust-build:
    script: "cd ../../engine/core && cargo build -p data-js -p data-conformance"

  js-test:
    # data-vitest.yml builds the engine wasm (the query store is inside it)
    # before bun test.
    deps: ["~:wasm"]

  wasm:
    description: "data-js wasm into packages/data-bundle/bin/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "/tooling/js/source-hash.mjs"
      - "packages/data-bundle/manifest.json"
    outputs:
      - "packages/data-bundle/bin/data_js*"
      - "packages/data-bundle/bin/SOURCE_HASH"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; data-rust and
      # data-vitest build it in CI.
      runInCI: "skip"
