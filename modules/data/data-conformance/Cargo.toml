[package]
name = "data-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data conformance harness (spec §12): the coverage gate + property/security tests. TEST-ONLY — never a ship dependency (cargo tree proves no test code reaches the wasm release build)."

[lints]
workspace = true

[[bin]]
name = "coverage-gate"
path = "src/bin/coverage_gate.rs"

[dependencies]
paged-data-core = { path = "../../../engine/core/crates/paged-data-core" }
paged-data-expr = { path = "../../../engine/core/crates/paged-data-expr" }
paged-data-sources = { path = "../../../engine/core/crates/paged-data-sources" }
paged-data-query = { path = "../../../engine/core/crates/paged-data-query" }
paged-data-bind = { path = "../../../engine/core/crates/paged-data-bind" }
paged-data-lower = { path = "../../../engine/core/crates/paged-data-lower" }
paged-data-barcode = { path = "../../../engine/core/crates/paged-data-barcode" }
paged-data-dataset = { path = "../../../engine/core/crates/paged-data-dataset" }
paged-data-automation = { path = "../../../engine/core/crates/paged-data-automation" }
data-js = { path = "../data-js" }
paged-data-store = { path = "../../../engine/core/crates/paged-data-store" }
serde.workspace = true
serde_norway.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
# An independent QR decoder for the barcode round-trip oracle (MIT OR Apache-2.0).
rqrr = "0.11"
# Wall-clock benches over the perf workloads (benches/engine.rs) — trended,
# never gated; the gated budgets are the counts in tests/perf_counts.rs.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false
