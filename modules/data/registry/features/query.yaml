# paged.data feature registry — query engine / result shaping (spec §6,
# §12.3 data.query.*). The engine is the store (data-store, Turso, ADR 561);
# these rows cover the RecordSet seam it reads into.

- id: data.query.shape
  title: Result shapes (record-stream / single / scalar / grouped)
  spec: plugin-data data-query/src/lib.rs (base-idea §6)
  status: implemented
  provenance: ["own code over the RecordSet interchange"]
  tests:
    rust: ["data-conformance/tests/it/query.rs::data_query_shape"]

- id: data.query.order
  title: Injected deterministic ordering (permutation-invariant; stable identity)
  spec: plugin-data data-query/src/lib.rs (base-idea §6.1, §8)
  status: implemented
  provenance: ["stabilises a query's unordered iteration before binding"]
  tests:
    rust: ["data-conformance/tests/it/query.rs::data_query_order"]

- id: data.query.content-hash
  title: Content hashing for the ResolveStamp invalidation key
  spec: plugin-data data-query/src/lib.rs (base-idea §8)
  status: implemented
  provenance: ["FNV-1a over schema + values; bit-stable"]
  tests:
    rust: ["data-conformance/tests/it/query.rs::data_query_content_hash"]

- id: data.query.arrow-ipc
  title: Raw Arrow-IPC decode in Rust (so the boundary takes IPC, not JSON)
  spec: plugin-data data-query (base-idea §6.1 — the M1 seam)
  status: planned

- id: data.transforms
  title: Transforms — JavaScript over tables, stored in the recipe, run sandboxed before the queries (ADR 562)
  spec: paged-data-session run_transforms over paged-action's JS actions (core ADR 1015)
  status: implemented
  provenance:
    [
      "a transform is (tables, params) => rows; its rows go through the store's JSON reader, so key order is column order and types are inferred as an import infers them",
      "bare Boa context (no host functions, loop and recursion budget, fixed clock); a failure is reported and its table left out",
    ]
  tests:
    rust:
      - "engine:paged-data-session/tests/transforms.rs::a_transform_joins_two_tables_into_a_derived_table__feat__data_transforms"
      - "engine:paged-data-session/tests/transforms.rs::transforms_round_trip_with_the_recipe__feat__data_transforms"
      - "engine:paged-data-session/tests/transforms.rs::a_failing_transform_is_reported_and_reaches_nothing__feat__data_transforms"
    vitest: ["packages/data-bundle/test/data-door-real-core.spec.ts"]
