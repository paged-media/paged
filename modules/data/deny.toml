# cargo-deny configuration for paged.data.
# Run:  cargo deny check          (CI runs `check licenses bans sources`)
#
# This doubles as the SDK-only rule's Rust half (spec §2.1 / §4 dep rule
# 3): [sources] denies unknown registries/git, so a path/git reach-around
# into core/editor internals — or into another plugin — cannot land
# silently. The §3 license-boundary gate is ENFORCED here too: only
# permissive licenses are allowed, so a source-available/ELv2/SSPL data
# engine cannot be pulled in (it would fail the [licenses] allow-list).
# Apache-2.0 is allowed for the Arrow interchange line (arrow-rs lands at
# the M1 Arrow-IPC seam); MIT covers the vendored DuckDB-WASM artifact
# (vendored as a built artifact, NOT compiled in-tree — see vendor/).

[advisories]
version = 2
ignore = [
    # `paste` (proc-macro, pulled in via boa_engine) is UNMAINTAINED, not
    # vulnerable — RUSTSEC-2024-0436 is informational. Pre-existing; revisit
    # when boa moves off it. No license/security boundary impact.
    "RUSTSEC-2024-0436",
    # zip 8.6.0 reaches this workspace only through `calamine` 0.36.1, which no
    # release has moved to zip >= 9 yet. All three advisories (2026-10-09/10)
    # are about `ZipArchive::extract` / `ZipStreamReader::extract` writing an
    # archive to the file system (SUID/SGID bits kept, symlinks escaping the
    # destination, permissions applied through symlinks). Neither this
    # workspace nor calamine 0.36.1 calls either function: calamine reads the
    # XLSX in memory, entry by entry. Remove these three when calamine
    # depends on zip >= 9. Recorded 2026-10-17.
    { id = "RUSTSEC-2026-0367", reason = "zip 8 via calamine only; extract() is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 via calamine only; extract() is never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 via calamine only; extract() is never called" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Dependencies must be permissively licensed (weak copyleft MPL-2.0 at
# most) so they combine into this AGPL-3.0 OR PMEL distribution and stay
# relicensable under PMEL. NO source-available / ELv2 /
# SSPL engine can pass this gate (spec §3).
allow = [
    "MPL-2.0",
    # First-party crates this workspace reaches outside itself (from another
    # workspace in this repository, or by git revision from a former
    # repository) carry `AGPL-3.0-only OR LicenseRef-PMEL`, or
    # `MPL-2.0 OR LicenseRef-PMEL` for revisions released before the
    # relicense (ADR PM-0001). SPDX has no id for the Paged Media Enterprise
    # License, hence the LicenseRef form; it satisfies either expression.
    "LicenseRef-PMEL",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
exceptions = []

# This workspace's own crates are AGPL-3.0-only OR LicenseRef-PMEL
# (ADR PM-0001). The policy above is for dependencies, so the unpublished
# ones (`publish = false`) are not checked against it; a published one
# passes through LicenseRef-PMEL.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
