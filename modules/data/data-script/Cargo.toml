[package]
name = "data-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data constrained scripting surface (spec §10): a sandboxed Boa (Rust JS) context exposing the binding/build API for scriptable queries + templated runs — NOT arbitrary host access. Native-only (Boa is far too large for the wasm budget); used by the batch CLI."

[lints]
workspace = true

[dependencies]
# boa 0.22 turned `temporal` on by default; the sandbox keeps the feature
# set 0.21's defaults gave it.
boa_engine = { version = "0.22", default-features = false, features = ["float16", "xsum"] }
paged-data-core = { path = "../../../engine/core/crates/paged-data-core" }
paged-data-automation = { path = "../../../engine/core/crates/paged-data-automation" }
data-js = { path = "../data-js" }
serde.workspace = true
serde_json.workspace = true
