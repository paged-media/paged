[package]
name = "data-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data wasm-bindgen surface (spec §4): the DataEngine the bundle consumes, a thin shim over the plain-Rust DataSession of the engine crate paged-data-session (load source manifest, define queries/bindings, ingest results, resolve, lower, sync, round-trip). crate-type cdylib for the wasm artifact."

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
paged-data-core = { path = "../../../engine/core/crates/paged-data-core" }
paged-data-bind = { path = "../../../engine/core/crates/paged-data-bind" }
paged-data-lower = { path = "../../../engine/core/crates/paged-data-lower" }
paged-data-query = { path = "../../../engine/core/crates/paged-data-query" }
paged-data-store = { path = "../../../engine/core/crates/paged-data-store" }
paged-data-session = { path = "../../../engine/core/crates/paged-data-session" }
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

[features]
# The engine work counters (data-query/src/perf.rs) behind `perfCounters()`.
# ON by default, so the shipped wasm and the perf budgets measure the same
# artifact. Measured 2026-10-05 (docs/design/perf-baseline-2026-10-05.md):
# +404 bytes of wasm (0.06 %), and a 10k-row table resolve in wasm at
# 30.5–31.1 ms on vs 30.7 ms off — inside the noise. Natively the counters
# cost 2–5 % on the criterion benches, which is why the CRATES keep them off by
# default and only this boundary crate turns them on.
default = ["perf-counters"]
perf-counters = [
    "paged-data-bind/perf-counters",
    "paged-data-query/perf-counters",
    "paged-data-session/perf-counters",
]
