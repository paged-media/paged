[package]
name = "slide-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.slide: the wasm-bindgen surface (one module for import and export)."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
paged-ooxml.workspace = true
pptx-core.workspace = true
pptx-import.workspace = true
serde.workspace = true
serde_json.workspace = true
slide-native.workspace = true
slide-sheet.workspace = true
pptx-export.workspace = true
slide-output.workspace = true
slide-resolve.workspace = true
slide-anim.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
# The zip-bomb builders and the peak-allocation counter (tests/zip_budget.rs).
paged-ooxml = { workspace = true, features = ["testing"] }
# The live-chart tests (tests/live_charts.rs).
slide-chart.workspace = true
