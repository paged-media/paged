[package]
name = "pptx-core"
workspace = "../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.slide: the format-level IR of a .pptx deck (PresentationML + DrawingML as authored, inheritance unresolved)."

[lints]
workspace = true

[dependencies]
slide-geom.workspace = true
# The DrawingML paint IR (colours, fills, lines, effects), read once for
# doc, slide and sheet (slide ADR 722).
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["deflate-flate2", "serde"] }
# The chart model (`chart`), with this crate's paints and text properties.
dml-chart = { path = "../../../platform/shared/dml-chart", features = ["serde"] }
serde.workspace = true
# The math tree of an equation (engine ADR 1090).
paged-math = { workspace = true, features = ["serde"] }
# Pictures PowerPoint cannot open, written as PNG (`transcode`, ADR 723):
# the PNG writer's deflate, and WebP's decoder (the engine's own, pure Rust).
flate2.workspace = true
crc32fast.workspace = true
image-webp = "0.2"

[dev-dependencies]
serde_json.workspace = true
