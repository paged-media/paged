[package]
name = "slide-resolve"
workspace = "../../../engine/core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.slide: PowerPoint's inheritance rules applied — theme, master, layout, placeholder, colour, font — to a resolved deck in points."

[lints]
workspace = true

[dependencies]
paged-geom = { path = "../../../engine/core/crates/paged-geom" }
# DrawingML colour arithmetic (HSL, linear-light tint and shade).
paged-ooxml = { path = "../../../platform/shared/ooxml", features = ["deflate-flate2", "serde"] }
pptx-core.workspace = true
slide-geom.workspace = true
slide-chart.workspace = true
serde.workspace = true
# The math tree of an equation (engine ADR 1090).
paged-math = { workspace = true, features = ["serde"] }
# The Design gallery's themes (themes/gallery.json).
serde_json.workspace = true

[dev-dependencies]
paged-test-resources.workspace = true
pptx-import.workspace = true
