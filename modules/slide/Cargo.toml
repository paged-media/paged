# paged.slide — Cargo workspace.
#
# Crates live at REPO TOP LEVEL (as in plugin-doc). Every crate is
# AGPL-3.0-only OR PMEL (the workspace default below). The OOXML foundation,
# `paged-ooxml`, is platform/shared/ooxml, shared with doc and sheet
# (modules ADR 607, which supersedes the vendored copy of ADR 701).
[workspace]
resolver = "2"
members = [
    "pptx-core",
    "pptx-import",
    "pptx-fonts",
    "slide-geom",
    "slide-chart",
    "slide-resolve",
    "slide-native",
    "pptx-export",
    "slide-js",
    "slide-shaders",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.dependencies]
# The shared OOXML foundation: the OPC container (with its memory budget),
# rels, the XML helpers and DrawingML colour. Without its `dom` feature, so
# this workspace never compiles ooxmlsdk (slide reads parts as an element
# tree, ADR 702). Its zip goes through flate2 (`deflate-flate2`), as this
# workspace's does.
paged-ooxml = { path = "../../platform/shared/ooxml", features = ["deflate-flate2", "serde"] }
# The one DrawingML-to-engine mapper (slide ADR 722): paged-ooxml's
# resolved paint onto paged-model, shared with doc.
dml-native = { path = "../../platform/shared/dml-native" }
# The DrawingML chart model and reader, shared with sheet (slide ADR 709);
# PowerPoint's chart layout stays in slide-chart.
dml-chart = { path = "../../platform/shared/dml-chart", features = ["serde"] }
# zip 9 deflates through flate2 alone, the declaration of engine/core, sheet,
# publish and the server (and paged-store, which this workspace builds on):
# zip's `deflate` feature would add zopfli (only for compression levels
# above 9, which nothing here asks for) and pick flate2's zlib-rs backend.
# flate2 below names the backend, so every crate that depends on `zip` lists
# `flate2` beside it.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# With ooxmlsdk gone from this graph (C1), nothing turns zlib-rs on, so the
# packages are deflated by miniz_oxide: the parts are the same bytes, the
# deflated streams are not (docs/migration/shared-foundations.md, C5).
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
# wasm boundary (slide-js only).
wasm-bindgen = "0.2"

# Intra-workspace crates.
pptx-export = { path = "pptx-export" }
pptx-core = { path = "pptx-core" }
pptx-import = { path = "pptx-import" }
pptx-fonts = { path = "pptx-fonts" }
slide-geom = { path = "slide-geom" }
slide-chart = { path = "slide-chart" }
slide-resolve = { path = "slide-resolve" }
slide-native = { path = "slide-native" }
slide-js = { path = "slide-js" }
# WGSL front end and validator: slide-shaders' tests check every slide
# transition shader (slide ADR 721), as the browser would compile it. The
# version modules/image and the engine's wgpu use.
naga = { version = "30", features = ["wgsl-in"] }
# Optional test resources (docs/development/testing.md): dev-dependency only.
paged-test-resources = { path = "../../platform/shared/test-resources" }
# The engine's model crates, path-depended from the engine workspace at the
# same commit (ADR 708): a deck is built as a native `paged_scene::Document`
# and packaged by core's one `.paged` writer.
paged-model = { path = "../../engine/core/crates/paged-model" }
paged-scene = { path = "../../engine/core/crates/paged-scene" }
paged-store = { path = "../../engine/core/crates/paged-store" }

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The native deck's model serializer (ADR 708): size-first codegen for the
# engine's model crates and the builder, which build and write a deck once
# per open. The wasm is built with this profile (scripts/build-wasm.sh).
[profile.release.package.paged-model]
opt-level = "z"

[profile.release.package.paged-scene]
opt-level = "z"

[profile.release.package.paged-store]
opt-level = "z"

[profile.release.package.slide-native]
opt-level = "z"
