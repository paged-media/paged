# paged.slide — Cargo workspace.
#
# Crates live at REPO TOP LEVEL (as in plugin-doc). `vendor/paged-ooxml` is a
# vendored copy of plugin-doc's shared OOXML foundation (ADR 701); every crate
# is AGPL-3.0-only OR PMEL (the workspace default below).
[workspace]
resolver = "2"
members = [
    "vendor/paged-ooxml",
    "pptx-core",
    "pptx-import",
    "pptx-fonts",
    "slide-geom",
    "slide-chart",
    "slide-resolve",
    "slide-idml",
    "slide-native",
    "pptx-export",
    "slide-js",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false

[workspace.dependencies]
# OOXML typed part DOM (PresentationML, DrawingML main/chart/diagram/picture).
# Held at 0.12: 0.13 makes docx_js 0.8 MB (12 %) larger, which the app-wide
# wasm budget has no room for (docs/migration/rust-majors.md).
ooxmlsdk = { version = "0.12", features = ["mce"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
compact_str = { version = "0.10", features = ["serde"] }
base64 = "0.23"
# wasm boundary (slide-js only).
wasm-bindgen = "0.2"

# Intra-workspace crates.
paged-ooxml = { path = "vendor/paged-ooxml" }
pptx-export = { path = "pptx-export" }
pptx-core = { path = "pptx-core" }
pptx-import = { path = "pptx-import" }
pptx-fonts = { path = "pptx-fonts" }
slide-geom = { path = "slide-geom" }
slide-chart = { path = "slide-chart" }
slide-resolve = { path = "slide-resolve" }
slide-idml = { path = "slide-idml" }
slide-native = { path = "slide-native" }
slide-js = { path = "slide-js" }
# Optional test resources (docs/development/testing.md): dev-dependency only.
paged-test-resources = { path = "../../platform/shared/test-resources" }
# The engine's model crates, path-depended from the engine workspace at the
# same commit (ADR 708): a deck is built as a native `paged_scene::Document`
# and packaged by core's one `.paged` writer.
paged-model = { path = "../../engine/core/crates/paged-model" }
paged-scene = { path = "../../engine/core/crates/paged-scene" }
paged-store = { path = "../../engine/core/crates/paged-store" }
# The IDML reader, for the equivalence test (dev-dependency only).
idml-import = { path = "../../engine/core/crates/idml-import" }

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
