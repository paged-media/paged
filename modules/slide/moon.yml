$schema: "../../.moon/cache/schemas/project.json"

# paged.slide: a Cargo workspace (pptx-*, slide-* crates) and a JS package
# (slide-bundle). apps/editor builds slide-bundle from source. The OOXML
# foundation is the shared platform/shared/ooxml crate (a path dependency).
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "node", "module", "wasm"]

project:
  title: "modules/slide"
  description: "PowerPoint/PPTX module: import, export, charts."

# validate:manifest runs the in-tree paged-plugin bin (plugin-sdk).
#
# slide-native and pptx-export build on the engine's model crates (ADR 708, ADR 711).
dependsOn:
  - id: "core"
    scope: "production"
  - id: "extensions"
    scope: "development"
  - id: "test-kit"
    scope: "development"
  # paged-ooxml, a path dependency of the Cargo workspace.
  - id: "ooxml"
    scope: "production"
  # dml-chart, the shared DrawingML chart reader (slide ADR 709).
  - id: "dml-chart"
    scope: "production"
  # dml-geom, the shared DrawingML geometry (slide ADR 717, PM-0014).
  - id: "dml-geom"
    scope: "production"
  # slide-chart labels through sheet-format (and sheet-core, whose build
  # reads sheet's function registry), which read platform/shared/fmt (ADR 710);
  # slide-sheet's live charts through sheet's workbook engine (ADR 715).
  - id: "sheet"
    scope: "production"
  - id: "fmt"
    scope: "production"

# Path dependencies into the engine (docx-skeleton / slide-native build on
# paged-model, paged-scene, paged-store; ADR 606 / ADR 708) and into
# platform/shared/ooxml (paged-ooxml, doc ADR 607) and platform/shared/dml-geom
# (slide ADR 717), and into modules/sheet's
# sheet-format and sheet-core and platform/shared/fmt (slide-chart, ADR 710)
# and its workbook engine (sheet-xlsx, sheet-calc, sheet-chart and what they
# build on; slide-sheet, ADR 715):
# their crates are inputs here too, so `moon ci` re-runs this project when
# one it builds changes.
# (Project file groups replace the workspace ones, so the defaults are
# restated.)
fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-chart/src/**/*.rs"
    - "/platform/shared/dml-chart/Cargo.toml"
    - "/platform/shared/dml-geom/src/**/*.rs"
    - "/platform/shared/dml-geom/data/*.xml"
    - "/platform/shared/dml-geom/Cargo.toml"
    - "/modules/sheet/Cargo.toml"
    - "/modules/sheet/sheet-core/**/*"
    - "/modules/sheet/sheet-format/**/*"
    - "/modules/sheet/sheet-fn/**/*"
    - "/modules/sheet/sheet-parser/**/*"
    - "/modules/sheet/sheet-calc/**/*"
    - "/modules/sheet/sheet-chart/**/*"
    - "/modules/sheet/sheet-lower/**/*"
    - "/modules/sheet/sheet-xlsx/**/*"
    - "/modules/sheet/registry/functions/*.yaml"
    - "/platform/shared/fmt/src/**/*.rs"
    - "/platform/shared/fmt/Cargo.toml"
  rust-tests:
    - "**/*"
    - "!docs/**"
    - "!**/*.md"
    - "/.cargo/*.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/**/*.rs"
    - "/engine/core/crates/**/Cargo.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/platform/shared/dml-chart/src/**/*.rs"
    - "/platform/shared/dml-chart/Cargo.toml"
    - "/platform/shared/dml-geom/src/**/*.rs"
    - "/platform/shared/dml-geom/data/*.xml"
    - "/platform/shared/dml-geom/Cargo.toml"
    - "/modules/sheet/Cargo.toml"
    - "/modules/sheet/sheet-core/**/*"
    - "/modules/sheet/sheet-format/**/*"
    - "/modules/sheet/sheet-fn/**/*"
    - "/modules/sheet/sheet-parser/**/*"
    - "/modules/sheet/sheet-calc/**/*"
    - "/modules/sheet/sheet-chart/**/*"
    - "/modules/sheet/sheet-lower/**/*"
    - "/modules/sheet/sheet-xlsx/**/*"
    - "/modules/sheet/registry/functions/*.yaml"
    - "/platform/shared/fmt/src/**/*.rs"
    - "/platform/shared/fmt/Cargo.toml"

tasks:
  js-test:
    # slide-bundle's bun test boots the engine wasm; build it first.
    deps: ["~:wasm"]

  wasm:
    description: "slide-js wasm into packages/slide-bundle/bin/ (scripts/build-wasm.sh)."
    toolchains: ["rust"]
    command: "bash scripts/build-wasm.sh"
    inputs:
      - "@group(rust-sources)"
      - "scripts/build-wasm.sh"
      - "/tooling/rust/build-wasm.sh"
      - "packages/slide-bundle/manifest.json"
    outputs:
      - "packages/slide-bundle/bin/slide_js*"
    options:
      # Needs wasm-bindgen-cli at the Cargo.lock version; slide-bundle and
      # the editor's module-wasm action (.github/actions/module-wasm) build it in CI.
      runInCI: "skip"
