name: module wasm
description: >-
  Builds the engine wasm of one built-in module (doc, slide, sheet, data or
  web) into its bundle's gitignored bin/, or restores it from the cache when
  the module's Rust sources are unchanged.

# The editor depends on every bundle through `workspace:*` and consumes its
# source, so a job that runs the editor's Vite (Playwright, the playground and
# showcase builds) or measures its wasm needs each bundle's build output. For
# sheet, web and doc, Vite's import analysis resolves `../bin/<glue>.js` at
# transform time, and the app does not boot without it; data and slide load
# theirs at runtime. draw, image and pdf commit theirs.
#
# Replaces the plugin-doc-from-source and plugin-slide-from-source stopgaps.
#
# Prerequisites: the repository checked out at the workspace root, Node on
# PATH, and for `data` the root `bun install` first (scripts/vendor-duckdb.sh
# bundles the DuckDB JS API with the installed apache-arrow).
#
# The cache key hashes the module's tracked files except its JS packages and docs
# (git's blob ids, so it costs no reads) plus web's Rust crate under
# packages/web-render, .cargo/config.toml, the wasm-bindgen/binaryen pins and,
# for data, the apache-arrow resolution in bun.lock.

inputs:
  module:
    description: "The module: doc, slide, sheet, data or web."
    required: true

runs:
  using: composite
  steps:
    - name: module wasm (${{ inputs.module }}) — resolve
      id: m
      shell: bash
      env:
        M: ${{ inputs.module }}
      run: |
        set -euo pipefail
        BUILD_ARGS=""
        PATHS="modules/$M/packages/$M-bundle/bin"
        case "$M" in
          doc)   GLUE=docx_js.js ;;
          slide) GLUE=slide_js.js ;;
          sheet) GLUE=sheet_js.js ;;
          data)  GLUE=data_js.js; PATHS="$PATHS"$'\n'"modules/data/vendor/duckdb-wasm" ;;
          # The Blitz engine build, as web-vitest and web-publish build it.
          web)   GLUE=blitz_web.js; BUILD_ARGS=--engine ;;
          *) echo "::error::module-wasm: unknown module '$M' (doc, slide, sheet, data, web)"; exit 1 ;;
        esac
        CRATE="modules/$M"
        [ "$M" = web ] && CRATE=modules/web/packages/web-render
        # modules/<m>/rust-toolchain.toml; web-render has none, and web-vitest
        # pins 1.93.0 for it.
        TOOLCHAIN=1.93.0
        if [ -f "modules/$M/rust-toolchain.toml" ]; then
          TOOLCHAIN=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "modules/$M/rust-toolchain.toml" | head -1)
        fi
        inputs() {
          git ls-files -s -- "modules/$M" ":(exclude)modules/$M/packages" ":(exclude)modules/$M/docs"
          if [ "$M" = web ]; then git ls-files -s -- modules/web/packages/web-render; fi
          git ls-files -s -- .cargo/config.toml
          grep -E '^(WASM_BINDGEN|BINARYEN)=' tooling/bootstrap.sh
          if [ "$M" = data ]; then grep -E '"apache-arrow"' bun.lock; fi
          echo "$BUILD_ARGS $TOOLCHAIN"
        }
        # Node, not sha256sum: the showcase nightly runs on macOS.
        KEY=$(inputs | node -e '
          const h = require("crypto").createHash("sha256");
          process.stdin.on("data", (d) => h.update(d)).on("end", () => console.log(h.digest("hex").slice(0, 40)));
        ')
        {
          echo "glue=modules/$M/packages/$M-bundle/bin/$GLUE"
          echo "crate=$CRATE"
          echo "args=$BUILD_ARGS"
          echo "toolchain=$TOOLCHAIN"
          echo "key=module-wasm-v1-$M-${{ runner.os }}-${{ runner.arch }}-$KEY"
          echo "paths<<EOF"
          echo "$PATHS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: module wasm (${{ inputs.module }}) — restore
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.m.outputs.paths }}
        key: ${{ steps.m.outputs.key }}

    # ---- a miss: build ------------------------------------------------------
    - name: module wasm (${{ inputs.module }}) — Rust toolchain
      if: steps.restore.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.m.outputs.toolchain }}
        targets: wasm32-unknown-unknown

    - name: module wasm (${{ inputs.module }}) — mold (Linux)
      if: steps.restore.outputs.cache-hit != 'true' && runner.os == 'Linux'
      uses: rui314/setup-mold@v1

    - name: module wasm (${{ inputs.module }}) — Rust dependency cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ steps.m.outputs.crate }} -> target
        prefix-key: v0-rust-${{ inputs.module }}-wasm
        shared-key: module-wasm

    - name: module wasm (${{ inputs.module }}) — wasm-bindgen-cli and binaryen
      if: steps.restore.outputs.cache-hit != 'true'
      uses: ./.github/actions/wasm-tools

    - name: module wasm (${{ inputs.module }}) — build
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      working-directory: modules/${{ inputs.module }}
      env:
        ARGS: ${{ steps.m.outputs.args }}
        # The same flags in every job (the cache entry is shared; see engine-wasm).
        RUSTFLAGS: ""
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # ARGS is empty or one flag
        bash scripts/build-wasm.sh $ARGS
        if [ "${{ inputs.module }}" = data ]; then
          bash scripts/vendor-duckdb.sh
        fi

    - name: module wasm (${{ inputs.module }}) — save
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.m.outputs.paths }}
        key: ${{ steps.m.outputs.key }}

    # ---- always -------------------------------------------------------------
    - name: module wasm (${{ inputs.module }}) — present
      shell: bash
      run: |
        test -f "${{ steps.m.outputs.glue }}" \
          || { echo "::error::${{ steps.m.outputs.glue }} is absent after the build"; exit 1; }
        ls -la "$(dirname "${{ steps.m.outputs.glue }}")"
