name: plugin-slide from source
description: >-
  STOPGAP until @paged-media/slide is consumed without a build output. The
  editor depends on the workspace package modules/slide/packages/slide-bundle
  (`workspace:*`), so every workflow that runs the editor needs its engine wasm
  built. DELETE this action (and every `uses:` of it) once the editor stops
  consuming a build output of modules/slide.

# Same layout and prerequisites as plugin-doc-from-source: the repository
# checked out at the workspace root (modules/slide in place, no checkout here),
# rustup + node on PATH, the root workspace installed by the caller.
# Pre-monorepo this action checked out
# paged-media/plugin-slide at plugins/plugin-slide.

runs:
  using: composite
  steps:
    # Its own root, not ~/.cargo/bin: modules/doc pins a different
    # wasm-bindgen, and sharing the binary would make the two actions
    # reinstall each other's version on every run.
    - name: install pinned wasm-bindgen-cli (modules/slide Cargo.lock version)
      shell: bash
      working-directory: modules/slide
      run: |
        V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
        ROOT="$RUNNER_TEMP/wasm-bindgen-slide"
        cargo install wasm-bindgen-cli --version "$V" --locked --root "$ROOT"
        echo "WASM_BINDGEN=$ROOT/bin/wasm-bindgen" >> "$GITHUB_ENV"

    # bin/*.js is gitignored and Vite resolves it at transform time, so the
    # app does not boot without it (the same reason as plugin-doc's).
    - name: build the paged.slide engine wasm
      shell: bash
      working-directory: modules/slide
      run: |
        rustup target add wasm32-unknown-unknown
        bash scripts/build-wasm.sh
        test -f packages/slide-bundle/bin/slide_js.js \
          || { echo "::error::slide wasm glue absent after build"; exit 1; }
