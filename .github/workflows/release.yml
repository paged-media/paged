name: release

# The repository's one release workflow (docs/adr/PM-0008). Two jobs, chosen
# by what triggered the run:
#
#   npm     A tag v0.<protocol>.<patch>[-prerelease] (pushed, or a dispatch
#           on the tag's ref): the three public npm packages at the tag's
#           version (PM-0008, amendment 3) — @paged-media/paged (the engine
#           and the `paged` bin), @paged-media/viewer and
#           @paged-media/plugin-sdk (with the contract as ./api). It builds
#           the engine wasm fresh, runs the checks, assembles and packs the
#           packages with the workspace resolved, installs the tarballs in a
#           clean room, and publishes them with provenance.
#   deploy  A push to main that changes what the editor consumes, a dispatch
#           on main, or the engine-updated repository_dispatch: the editor
#           playground (apps/canvas `demo` build) to Cloudflare Pages
#           (play.paged.media), its wasm hosted on modules.paged.media.
#
# TRUSTED PUBLISHING is keyed on this file's NAME: npm matches the OIDC claims
# (repository paged-media/paged, workflow release.yml, no environment) against
# each package's Trusted Publisher entry. Renaming this file, or publishing the
# packages from another workflow, breaks it. npm takes a Trusted Publisher
# entry only for a package that exists, so the FIRST release of the two new
# names (paged, viewer) goes through the NPM_TOKEN secret: the auth gate below
# needs trusted publishing ready for all three, or a token that authenticates.
# After that publish the owner registers the three entries and deletes the
# secret (docs/migration/npm-release-runbook.md).
#
# Versions: the tag is the version of all three packages. Its minor must be the
# engine's protocol (packages/paged's committed 0.<protocol>.0-dev); the release
# version exists only in this run's checkout, never in a commit. A `-suffix`
# publishes under the `next` dist-tag, anything else under `latest`. Check the
# remote's tags and npm before naming a version: two releases have raced.
#
# Replaces core-publish-wasm.yml, extensions-publish.yml, editor-playground.yml
# and the per-module *-publish.yml workflows.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Branch pushes only: GitHub does not evaluate path filters for tags.
    # Everything the editor consumes through the workspace (see
    # editor-tests.yml): the module bundles, the extension contract and ai,
    # and the engine's wasm packages with what builds them.
    paths:
      - "apps/editor/**"
      - "modules/**"
      - "platform/extensions/packages/**"
      - "engine/core/crates/**"
      # The shared formatting crate (platform/shared/fmt), compiled into the engine.
      - "platform/shared/fmt/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      # The shared module wasm build every scripts/build-wasm.sh calls.
      - "tooling/rust/**"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/module-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/release.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!apps/editor/docs/**/*.md"
      # Module prose (B3a made every module an editor input).
      - "!modules/*/docs/**/*.md"
  workflow_dispatch:
  repository_dispatch:
    types: [engine-updated]

# Declaring this block sets every unlisted scope to none; each job widens
# only what it needs.
permissions:
  contents: read

jobs:
  npm:
    name: npm (the three public packages)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token trusted publishing exchanges, and provenance
    # One release at a time, never cancelled: a second tag waits.
    concurrency:
      group: release-npm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The version is the tag. A dispatch accepts any ref; from a branch it
      # would version a release "main", so only a tag ref passes.
      - name: the version is the tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::ref ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}, not a tag — nothing to version a release from."
            exit 1
          fi
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The dist-tag rider (engine/core/docs/reference/protocol-governance.md,
          # Release coupling): a prerelease never becomes `latest`.
          if [[ "$V" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release $V under the npm dist-tag $TAG"

      # Node and Bun at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"

      # The tag's minor against packages/paged's committed 0.<protocol>.0-dev
      # (tooling/release/stage.mjs checks it again when it stages), and the
      # committed versions against PROTOCOL_VERSION.
      - name: the tag carries the engine's protocol
        run: |
          set -euo pipefail
          node engine/core/scripts/check-wasm-package-versions.mjs
          node --input-type=module -e '
            const { versionProblem } = await import("./tooling/release/stage.mjs");
            const p = versionProblem(process.argv[1]);
            if (p) { console.error("::error::" + p); process.exit(1); }
            console.log("protocol OK for " + process.argv[1]);
          ' "${{ steps.ver.outputs.version }}"

      # A re-run of a tag publishes what the first run did not (a partial
      # release is fixed by re-running, never by re-tagging); a tag that is
      # already on npm in full has nothing left to do.
      - name: what npm already has
        id: have
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          MISSING=0
          for PKG in paged viewer plugin-sdk; do
            if npm view "@paged-media/$PKG@$V" version >/dev/null 2>&1; then
              echo "already on npm: @paged-media/$PKG@$V"
            else
              echo "to publish:     @paged-media/$PKG@$V"
              MISSING=$((MISSING + 1))
            fi
          done
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" = 0 ]; then
            echo "::notice::all three packages are on npm at $V — nothing to publish."
          fi

      # OIDC trusted publishing needs npm >= 11.5.1. The Node of /.prototools
      # bundles an older npm, and `npm install -g` lands beside proto's shim,
      # which keeps answering with the bundled one (v0.74.2's first run printed
      # 10.9.9 after the upgrade). So the pinned npm goes into a prefix of its
      # own, put first on PATH for the later steps, and the step fails unless
      # that is the npm they will run.
      - name: npm new enough for trusted publishing
        if: steps.have.outputs.missing != '0'
        run: |
          set -euo pipefail
          new_enough() { node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$1"; }
          NPM=$(npm --version)
          if new_enough "$NPM"; then
            echo "npm $NPM"
            exit 0
          fi
          echo "npm $NPM is older than 11.5.1; installing npm 11.6.2 into its own prefix"
          PREFIX="$RUNNER_TEMP/npm-11"
          npm install --prefix "$PREFIX" --no-audit --no-fund npm@11.6.2
          BIN="$PREFIX/node_modules/.bin"
          GOT=$("$BIN/npm" --version)
          new_enough "$GOT" || { echo "::error::the installed npm reports $GOT"; exit 1; }
          echo "$BIN" >> "$GITHUB_PATH"
          echo "npm $GOT at $BIN, first on PATH from the next step"

      - name: npm on PATH is the one trusted publishing needs
        if: steps.have.outputs.missing != '0'
        run: |
          set -euo pipefail
          NPM=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$NPM" \
            || { echo "::error::npm on PATH is $NPM ($(command -v npm)), older than 11.5.1"; exit 1; }
          echo "npm $NPM ($(command -v npm))"

      # Is trusted publishing ready for each package? It asks npm's token
      # exchange directly, because npm's own OIDC helper is SILENT on every
      # failure path (it logs at verbose/silly and falls back to a configured
      # token), which once made "trusted publishing never happened" read as
      # npm's E404-on-PUT, "package missing". The claims it prints are the
      # values the npmjs.com form must match. Claims only, never the token.
      - name: trusted publishing — readiness of the three packages
        id: oidc
        if: steps.have.outputs.missing != '0'
        run: |
          set -euo pipefail
          AUD="npm:registry.npmjs.org"
          ID_TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" | jq -r '.value // empty')"
          if [ -z "$ID_TOKEN" ]; then
            echo "::warning::No OIDC id-token for ${AUD}: trusted publishing is not available in this run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PAYLOAD="$(printf '%s' "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="${PAYLOAD}==";; 3) PAYLOAD="${PAYLOAD}=";; esac
          printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq '{repository, repository_owner, workflow_ref, job_workflow_ref, event_name, ref, environment, sub, aud}' \
            || echo "  (could not decode claims)"
          READY=true
          for PKG in paged viewer plugin-sdk; do
            CODE="$(curl -sS -o /tmp/exch.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@paged-media%2f${PKG}")"
            # The exchange answers 201 Created with the token (v0.74.2's first
            # run read 201 as "not ready"); any 2xx with a token is ready.
            if [ "${CODE:0:1}" = "2" ] && [ -n "$(jq -r '.token // empty' /tmp/exch.json)" ]; then
              echo "  OK         @paged-media/${PKG}"
            else
              MSG="$(jq -r '.message // .error // empty' /tmp/exch.json 2>/dev/null || true)"
              echo "  NOT READY  @paged-media/${PKG}: HTTP ${CODE} — ${MSG:-no message}"
              READY=false
            fi
            rm -f /tmp/exch.json
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" = true ]; then
            echo "::notice::All three packages authenticate via OIDC. Once this release is on npm, the NPM_TOKEN secret can be deleted."
          else
            echo "::notice::Each package needs its own Trusted Publisher entry: organization paged-media, repository paged, workflow release.yml, no environment. A package not on npm yet (the first release of paged and viewer) cannot have one: that release publishes with NPM_TOKEN."
          fi

      # THE AUTH GATE, before anything expensive: trusted publishing ready for
      # all three, or a token that authenticates (the first release: the two
      # new names have no Trusted Publisher entry yet). A bad token costs two seconds
      # and names itself (E401) instead of arriving as E404-on-PUT after the
      # build (four releases went missing that way). A throwaway userconfig
      # keeps the runner's ~/.npmrc untouched.
      - name: auth gate — trusted publishing or a working token
        if: steps.have.outputs.missing != '0'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.oidc.outputs.ready }}" = "true" ]; then
            echo "trusted publishing is ready for all three packages."
            if [ -n "${NPM_TOKEN}" ]; then
              echo "::notice::NPM_TOKEN is still set; npm uses OIDC first. Delete the secret after this release."
            fi
            exit 0
          fi
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::Trusted publishing is not ready for every package and NPM_TOKEN is not set: nothing could authorize the publish."
            exit 1
          fi
          RC="$(mktemp)"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "$RC"
          if ! WHO=$(NPM_CONFIG_USERCONFIG="$RC" npm whoami --registry https://registry.npmjs.org/ 2>&1); then
            rm -f "$RC"
            echo "::error::NPM_TOKEN does not authenticate against the npm registry: ${WHO}"
            echo "::error::Mint a granular token with read+write on the @paged-media scope and re-set the secret, or register the Trusted Publishers."
            exit 1
          fi
          rm -f "$RC"
          echo "npm authenticated by token as: ${WHO}"

      - name: bun install (root workspace)
        if: steps.have.outputs.missing != '0'
        run: bun install --frozen-lockfile

      # A release never takes wasm from a cache: the four parts are built
      # from this tag (the `wasm-release` profile, wasm-bindgen --target web,
      # wasm-opt -Oz) into canvas-wasm and the viewer's wasm/; packages/paged
      # is assembled from canvas-wasm below.
      - name: engine wasm (built fresh)
        if: steps.have.outputs.missing != '0'
        uses: ./.github/actions/engine-wasm
        with:
          cache: "false"
          artifact: "false"

      # "Sibling, not a shrunk app": paged-sdk's crate graph links no editor
      # crate. verify-tarballs repeats the file half on the packed viewer.
      - name: viewer subset audit (crate graph and the built session)
        if: steps.have.outputs.missing != '0'
        working-directory: engine/core
        run: node scripts/viewer-subset-audit.mjs web/idml-viewer

      - name: viewer — typecheck, test, build
        if: steps.have.outputs.missing != '0'
        working-directory: engine/core/web/idml-viewer
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run build

      # Build BEFORE the suite: react-free-import.spec.ts asserts on the
      # SHIPPED artifact and skips itself when dist/ is absent. The vendored
      # wire and capability catalog must match the engine this tag builds.
      - name: plugin-api and plugin-sdk — typecheck, build (./api inlined), test, wire and catalog lockstep
        if: steps.have.outputs.missing != '0'
        working-directory: platform/extensions
        run: |
          set -euo pipefail
          bun run --filter './packages/plugin-*' typecheck
          bun run --filter './packages/plugin-*' build
          bun run --filter './packages/plugin-*' test
          bun scripts/sync-wire.mjs --check
          bun scripts/sync-catalog.mjs --check

      # The paged package: the engine's built files and the CLI bundled into
      # dist/paged.js (one file, node: builtins only, its notices beside it),
      # and the CLI's own checks of `paged mcp` and of that bundle.
      - name: "@paged-media/paged — the CLI's mcp parity and bundle specs, assemble"
        if: steps.have.outputs.missing != '0'
        run: |
          set -euo pipefail
          ( cd apps/cli && bun run test test/mcp-parity.spec.ts test/npm-bundle.spec.ts )
          ( cd packages/paged && bun run build )

      # The three tarballs at the release version, with workspace: and catalog:
      # resolved; stage.mjs runs verify-tarballs.mjs (names, versions, licence,
      # repository, access, every entry point present, nothing private
      # depended on, the bin's imports, ./api type-only, and the viewer subset
      # audit of the packed files).
      - name: pack the three packages at the release version
        if: steps.have.outputs.missing != '0'
        run: bun tooling/release/stage.mjs "${{ steps.ver.outputs.version }}" "$RUNNER_TEMP/npm" --keep

      # Install the tarballs into empty projects under Node (npm) and Bun,
      # import every entry and subpath, run the paged bin (paged mcp
      # included) and the paged-plugin bin (init included), typecheck a
      # consumer with nodenext and bundler resolution.
      - name: clean-room consumer test
        if: steps.have.outputs.missing != '0'
        run: bash tooling/release/consumer-test.sh "$RUNNER_TEMP/npm" "$RUNNER_TEMP/consumer"

      - name: keep the tarballs
        if: steps.have.outputs.missing != '0'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 30

      # In dependency order, each skipped when npm has it already. npm tries
      # OIDC first and, when that is not configured, falls back to the token
      # (written to the userconfig only when the secret is set). --loglevel
      # verbose because npm reports every OIDC failure at verbose and falls
      # back silently. A package configured wrongly on npmjs.com stops the run
      # with the earlier ones published: configure it and re-run the tag.
      - name: publish (provenance, trusted publishing)
        if: steps.have.outputs.missing != '0'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc-publish"
          printf '%s\n' "registry=https://registry.npmjs.org/" > "$NPM_CONFIG_USERCONFIG"
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            printf '%s\n' "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
          fi
          for PKG in paged viewer plugin-sdk; do
            if npm view "@paged-media/$PKG@$V" version >/dev/null 2>&1; then
              echo "skip @paged-media/$PKG@$V (already on npm)"
              continue
            fi
            TGZ="$RUNNER_TEMP/npm/paged-media-$PKG-$V.tgz"
            test -f "$TGZ" || { echo "::error::$TGZ was not staged"; exit 1; }
            echo "publish @paged-media/$PKG@$V under $TAG"
            npm publish --provenance --access public --tag "$TAG" --loglevel verbose "$TGZ"
          done

      - name: dist-tags of the three packages
        run: node tooling/release/assert-dist-tags.mjs "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.tag }}"

  deploy:
    name: deploy (editor playground)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Deploys run one at a time and are never cancelled; a newer deploy that
    # arrives while one runs waits, and replaces any older one still waiting.
    concurrency:
      group: release-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/editor
    steps:
      - uses: actions/checkout@v4

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # The engine's wasm packages and the bundles' engine wasm (build
      # outputs; the editor consumes the workspace packages). Vite resolves
      # the bundles' relative wasm glue (sheet, web, doc, draw, image, pdf)
      # at build time.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
        with: { artifact: "false" }
      - name: module wasm (doc)
        uses: ./.github/actions/module-wasm
        with: { module: doc }
      - name: module wasm (slide)
        uses: ./.github/actions/module-wasm
        with: { module: slide }
      - name: module wasm (sheet)
        uses: ./.github/actions/module-wasm
        with: { module: sheet }
      - name: module wasm (data)
        uses: ./.github/actions/module-wasm
        with: { module: data }
      - name: module wasm (web)
        uses: ./.github/actions/module-wasm
        with: { module: web }
      - name: module wasm (draw)
        uses: ./.github/actions/module-wasm
        with: { module: draw }
      - name: module wasm (image)
        uses: ./.github/actions/module-wasm
        with: { module: image }
      - name: module wasm (publish)
        uses: ./.github/actions/module-wasm
        with: { module: publish }

      # PAGED_MODULES_HOSTED: the module door (ADR 223) answers the module
      # host, because the next step hosts every module the build lists.
      - name: build the demo
        env:
          PAGED_MODULES_HOSTED: "1"
        run: bun run --filter paged-canvas build:demo

      # The module upload. Wasm modules are hosted, not deployed (ADR 220):
      # every .wasm in the build is uploaded to modules.paged.media (R2,
      # brotli, immutable per package version) if it is not there yet,
      # removed from the deploy, and replaced by a same-origin 302. That also
      # keeps every file under Cloudflare Pages' 25 MiB limit — the engine
      # (~27 MiB) and DuckDB (~34 MiB) are not.
      - name: host the wasm modules (modules.paged.media)
        working-directory: apps/editor/apps/canvas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/modules-sync.mjs dist-demo

      - name: every file fits the Pages size limit
        working-directory: apps/editor/apps/canvas/dist-demo
        run: |
          big=$(find . -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::over Cloudflare Pages' 25 MiB limit: $big"; exit 1; fi

      - name: deploy to Cloudflare Pages (play.paged.media)
        # npx (not wrangler-action, which adds wrangler to the workspace).
        # Deployed from apps/canvas so wrangler picks up apps/canvas/functions:
        # the same-origin Claude proxy at /api/ai (ADR 221). Its secret and
        # KV binding live on the Pages project, not here.
        working-directory: apps/editor/apps/canvas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages deploy dist-demo --project-name=paged-playground --branch=main
