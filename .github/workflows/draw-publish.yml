name: draw / publish

# Disabled in the monorepo: built-in modules are no longer published separately (PM-0008). Kept for reference until wave D.
#
# MONOREPO (step A3): ported from paged-media/plugin-draw .github/workflows/
# publish.yml with `on: workflow_dispatch` only. Paths are ported so the file
# stays readable as a reference; the npm Trusted Publisher it names is bound
# to the OLD repo and file name, so a dispatch could not publish anyway.
#
# Publish @paged-media/draw to npm via OIDC TRUSTED PUBLISHING (tokenless).
# Requires a Trusted Publisher on npm: org paged-media, repo plugin-draw,
# workflow publish.yml. Pre-1.0 -canary.N; unchanged versions skip.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: modules/draw

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - run: bun run --filter './packages/*' typecheck
      # Nothing publishes from a red suite. `bun run test` is the
      # contract-import lint plus every package's vitest, against the real
      # engine wasm the bundle pins as a devDependency.
      - run: bun run test
      - run: bun run --filter './packages/*' build
      - name: publish via OIDC (canary)
        run: |
          set -e
          for dir in packages/draw-bundle; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            tgz="$RUNNER_TEMP/$(echo "$name" | sed 's#@##; s#/#-#')-${version}.tgz"
            node "$GITHUB_WORKSPACE/tooling/js/pack.mjs" "$dir" "$RUNNER_TEMP" >/dev/null
            echo "publish $name@$version via OIDC"
            npm publish "$tgz" --tag canary --access public
          done
