name: web / rust
concurrency:
  # A newer push to a pull request cancels the older run. Every other run
  # (main, dispatch) has a group of its own: never cancelled, never queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The web-render crate (packages/web-render): formatting, clippy and the Rust
# test suite. Until this workflow the crate's tests (the lowering, the
# real-Blitz capture and the whole flow-fragmentation ladder) ran in no
# workflow at all: the vitest lane only BUILT the crate to wasm.
#
# The crate is its own workspace with its own Cargo.lock (the Blitz tree pins
# its own kurbo/peniko/stylo), so every step runs inside it.
#
# MONOREPO (step A3): ported from paged-media/plugin-web
# .github/workflows/rust.yml; the crate is now modules/web/packages/web-render.
on:
  push:
    branches: [main]
    paths:
      - "modules/web/**"
      - ".github/workflows/web-rust.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/web/docs/**/*.md"
  pull_request:
    paths:
      - "modules/web/**"
      - ".github/workflows/web-rust.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/web/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/web/packages/web-render

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/web/packages/web-render -> target
          prefix-key: v0-rust-web
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      # Both feature sets: the default build is the pure lowering lane, the
      # `blitz` build adds the capture layer and the flow fragmentation.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features blitz -- -D warnings
      - run: cargo clippy --all-targets --features blitz,perf-counters -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/web/packages/web-render -> target
          prefix-key: v0-rust-web
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # No `|| true`: a red test reddens the job; the JUnit still uploads
      # (the step below runs under !cancelled()). `--features blitz` is the
      # superset — the default-feature tests run in it too.
      - name: cargo nextest (blitz — lowering, capture, flow fragmentation)
        run: cargo nextest run --features blitz --profile ci
      - name: cargo test (default features — the pure lowering build)
        run: cargo test --no-fail-fast
      # Count budgets (docs/design/perf-baseline-2026-10-05.md): a pinned
      # count that moves fails here; wall-clock is printed, never gated.
      - name: cargo test (perf budgets — engine work counts)
        run: cargo test --features blitz,perf-counters --test perf_budgets
      - name: upload nextest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: modules/web/packages/web-render/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
      # A silent fallback to the default linker fails here: mold stamps
      # the .comment section of what it links.
      - name: mold linked the test binaries
        if: runner.os == 'Linux'
        run: |
          bin=$(find "${CARGO_TARGET_DIR:-target}/debug/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.so' | head -1)
          test -n "$bin" || { echo "::error::no test binary in target/debug/deps"; exit 1; }
          readelf -p .comment "$bin" | grep -q mold || { echo "::error::$bin was not linked by mold"; exit 1; }
          echo "mold linked $bin"
