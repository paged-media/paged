name: slide / publish

# Disabled in the monorepo: built-in modules are no longer published separately (PM-0008). Kept for reference until wave D.
#
# MONOREPO (step A3): ported from paged-media/plugin-slide .github/workflows/
# publish.yml with `on: workflow_dispatch` only (it already was dispatch-only). Paths are ported so the
# file stays readable as a reference; the npm Trusted Publisher it names is
# bound to the OLD repo and file name, so a dispatch could not publish anyway.
#
# Publish @paged-media/slide to npm via OIDC TRUSTED PUBLISHING (tokenless).
# Requires a Trusted Publisher on npm: org paged-media, this repo, workflow
# publish.yml. Pre-1.0 -canary.N under the `canary` dist-tag; unchanged skip.
#
# Manual until the package exists: trusted publishing cannot create a
# package, so the first version is published by hand (`bun run build` in
# packages/slide-bundle after scripts/build-wasm.sh, then `npm publish
# --tag canary --access public` of the tarball `node tooling/js/pack.mjs
# packages/slide-bundle <dir>` makes) and the trusted publisher configured on
# npm. Then
# add `push: branches: [main]` here.
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for trusted publishing
  contents: read

defaults:
  run:
    working-directory: modules/slide

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/slide -> target
          prefix-key: v0-rust-slide
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: binaryen (prebuilt wasm-opt; pinned — old apt binaryen breaks externref)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_126/bin" >> "$GITHUB_PATH"
      - name: build wasm
        run: bash scripts/build-wasm.sh
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - run: bun run --filter './packages/*' build
      - name: publish via OIDC (canary)
        run: |
          set -e
          for dir in packages/slide-bundle; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            # The packed tarball, not the directory: npm does not apply
            # publishConfig (main/types/exports -> dist/) nor resolve
            # workspace:/catalog: specifiers; tooling/js/pack.mjs does.
            tgz=$(node "$GITHUB_WORKSPACE/tooling/js/pack.mjs" "$dir" "$RUNNER_TEMP")
            npm publish "$tgz" --provenance --tag canary --access public
          done
