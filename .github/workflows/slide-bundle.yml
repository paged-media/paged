name: slide / bundle
# MONOREPO (step A3): ported from paged-media/plugin-slide
# .github/workflows/bundle.yml; runs in modules/slide.
on:
  push:
    branches: [main]
    paths:
      - "modules/slide/**"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/slide-bundle.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
  pull_request:
    paths:
      - "modules/slide/**"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/slide-bundle.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slide-bundle-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modules/slide

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/slide -> target
          prefix-key: v0-rust-slide
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_126/bin" >> "$GITHUB_PATH"
      - name: build the engine wasm (100 MB app-wide budget gate)
        run: bash scripts/build-wasm.sh
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # The engine's wasm packages (canvas-wasm and the rest, workspace:*),
      # which the real-engine specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: contract-import lint
        run: node scripts/check-contract-imports.mjs
      - name: typecheck
        run: bun run --filter './packages/*' typecheck
      - name: validate manifest
        run: node "$GITHUB_WORKSPACE/platform/extensions/packages/plugin-cli/bin/paged-plugin.mjs" validate packages/slide-bundle/manifest.json
      # Red results still upload (the cockpit wants the failures too); the
      # last step fails the job.
      - name: vitest (importer + conformance against the real engine)
        run: |
          set -uo pipefail
          bun run --filter './packages/*' test --reporter=default --reporter=junit --outputFile.junit=junit.xml \
            || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          cat packages/*/junit.xml > junit-all.xml 2>/dev/null || true
          [ -s junit-all.xml ]
      - name: upload vitest JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/slide/junit-all.xml
          if-no-files-found: error
          retention-days: 14
      - name: tests failed
        if: ${{ env.TS_FAILED == '1' }}
        run: exit 1
