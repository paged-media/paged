name: slide / bundle
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MONOREPO (step A3): ported from paged-media/plugin-slide
# .github/workflows/bundle.yml; runs in modules/slide.
on:
  push:
    branches: [main]
    paths:
      - "modules/slide/**"
      # slide-chart labels through paged.sheet's number-format engine (ADR 710):
      # path dependencies on sheet-format and sheet-core (whose build reads the
      # function registry); platform/shared/fmt is listed with the engine below.
      - "modules/sheet/Cargo.toml"
      - "modules/sheet/sheet-core/**"
      - "modules/sheet/sheet-format/**"
      - "modules/sheet/registry/functions/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The internal shared code the bundle uses (workspace:*).
      - "platform/shared/wasm-boot/**"
      - "platform/shared/helpers/**"
      # The shared OOXML foundation the engine wasm builds from.
      - "platform/shared/ooxml/**"
      # The shared DrawingML chart reader, a path dependency (slide ADR 709).
      - "platform/shared/dml-chart/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      # The shared formatting crate (platform/shared/fmt), compiled into the engine.
      - "platform/shared/fmt/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      # The shared module wasm build every scripts/build-wasm.sh calls.
      - "tooling/rust/build-wasm.sh"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/slide-bundle.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/slide/docs/**/*.md"
  pull_request:
    paths:
      - "modules/slide/**"
      # slide-chart labels through paged.sheet's number-format engine (ADR 710):
      # path dependencies on sheet-format and sheet-core (whose build reads the
      # function registry); platform/shared/fmt is listed with the engine below.
      - "modules/sheet/Cargo.toml"
      - "modules/sheet/sheet-core/**"
      - "modules/sheet/sheet-format/**"
      - "modules/sheet/registry/functions/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The internal shared code the bundle uses (workspace:*).
      - "platform/shared/wasm-boot/**"
      - "platform/shared/helpers/**"
      # The shared OOXML foundation the engine wasm builds from.
      - "platform/shared/ooxml/**"
      # The shared DrawingML chart reader, a path dependency (slide ADR 709).
      - "platform/shared/dml-chart/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      # The shared formatting crate (platform/shared/fmt), compiled into the engine.
      - "platform/shared/fmt/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      # The shared module wasm build every scripts/build-wasm.sh calls.
      - "tooling/rust/build-wasm.sh"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/slide-bundle.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/slide/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/slide

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/slide -> target
          prefix-key: v0-rust-slide
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-bindgen-cli and binaryen at the pins in tooling/bootstrap.sh
      # (prebuilt; the build script checks the CLI against Cargo.lock).
      - uses: ./.github/actions/wasm-tools
      - name: build the engine wasm (100 MB app-wide budget gate)
        run: bash scripts/build-wasm.sh
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # The engine's wasm packages (canvas-wasm and the rest, workspace:*),
      # which the real-engine specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run --filter './packages/*' typecheck
      - name: validate manifest
        run: bun "$GITHUB_WORKSPACE/platform/extensions/packages/plugin-sdk/bin/paged-plugin.mjs" validate packages/slide-bundle/manifest.json
      # Red results still upload (the cockpit wants the failures too); the
      # last step fails the job.
      # The main task, then the DOM task (happy-dom preloaded) for the
      # *.dom.test.tsx panel specs.
      - name: bun test (importer + conformance against the real engine; panels in happy-dom)
        run: |
          set -uo pipefail
          bun run --filter './packages/*' test --reporter=junit --reporter-outfile=junit.bun.xml \
            || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          ( cd packages/slide-bundle && bun run test:dom \
            --reporter=junit --reporter-outfile=junit-dom.bun.xml ) \
            || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          # bun's reports, rewritten into the vitest shape the evidence has always
          # had (tooling/js/bun-junit.mjs): the artifact keeps its name and test ids.
          bun ../../tooling/js/bun-junit.mjs --out junit-all.xml packages/*/junit.bun.xml packages/slide-bundle/junit-dom.bun.xml \
            || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          [ -s junit-all.xml ]
      - name: upload JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/slide/junit-all.xml
          if-no-files-found: error
          retention-days: 14
      - name: tests failed
        if: ${{ env.TS_FAILED == '1' }}
        run: exit 1
