# The performance TREND: wall-clock benches on the annual-scale workload
# (crates/paged-perf), every night, compared with the previous night.
#
# Deterministic WORK budgets (crates/paged-perf/tests/perf_budgets.rs) run
# in the ordinary `cargo test` of ci.yml and gate every push. Wall-clock
# time is noisy on a shared runner, so here a bench more than 20 % slower
# than the previous successful run, with confidence intervals that do not
# overlap, is FLAGGED in the job summary, not failed. Promote it to a gate
# once a few weeks of history show the noise band.
#
# macos-latest: the same runner class as the gpu lane, kept fixed so runs
# compare like with like.

# Ported from paged-media/core .github/workflows/perf-nightly.yml (step A3).

name: core / perf-nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

# The token reads the repository, and the previous run's results artifact
# (`gh run list` / `gh run download` in the bench job); nothing else.
permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: engine/core

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    name: resolve pinned toolchain
    runs-on: ubuntu-latest
    # A bound on a hang (the default is six hours); generous for a cold cache.
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.pin.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: pin
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"

  bench:
    name: workload benches
    needs: toolchain
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-28
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine/core -> target
          prefix-key: v0-rust-core

      - name: previous results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow core-perf-nightly.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then
            gh run download "$id" -n perf-results -D previous || echo "no previous results"
          fi

      - name: bench
        run: cargo bench -p paged-perf --bench workload

      - name: summary
        run: |
          python3 scripts/perf/criterion-summary.py perf-results.json previous/perf-results.json >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-results
          path: engine/core/perf-results.json
          retention-days: 90

  # A scheduled run that fails has no commit to turn red: it opens (or
  # updates) an issue instead, and the first green night closes it
  # (.github/workflows/scheduled-failure-issue.yml). Scheduled runs only.
  notify:
    name: issue on a failing scheduled run
    needs: [toolchain, bench]
    if: ${{ always() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure-issue.yml
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
