name: core / fidelity
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ported from paged-media/core .github/workflows/fidelity.yml (step A3).
on:
  push:
    branches: [main]
    paths:
      - "engine/core/**"
      - ".github/workflows/core-fidelity.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # The test-resources dev-dependency (the skip convention).
      - "platform/shared/test-resources/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!engine/core/docs/**/*.md"
  pull_request:
    paths:
      - "engine/core/crates/**"
      - "engine/core/corpus/**"
      # A toolchain or dependency update can change rendered output without
      # touching a crate.
      - "engine/core/rust-toolchain.toml"
      - "engine/core/Cargo.toml"
      - "engine/core/Cargo.lock"
      - ".github/workflows/core-fidelity.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # The test-resources dev-dependency (the skip convention).
      - "platform/shared/test-resources/**"

defaults:
  run:
    working-directory: engine/core

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    name: corpus diff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain from rust-toolchain.toml (audit B21), read here
      # rather than in a job of its own that this one had to wait for.
      - id: pin
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/core -> target
          prefix-key: v0-rust-core
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install poppler-utils (pdftoppm) — Ubuntu
        if: runner.os == 'Linux'
        # Bounded, and apt only when the tool is actually absent.
        # 2026-08-19: GitHub's Ubuntu runners were intermittently unable
        # to reach the archive — azure.archive.ubuntu.com answers `Ign:`
        # and apt then waits indefinitely. Three unbounded calls hung
        # that day (editor's playwright --with-deps for its job's full
        # 50-minute timeout on EVERY run for a month; core's wasm-size
        # gate for 70 minutes against a <3-minute norm; this one for 32
        # against 5-7). In two of the three the package was already on
        # the image, so the call was pure risk for no benefit.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if command -v pdftoppm >/dev/null 2>&1; then
            echo "pdftoppm already present ($(command -v pdftoppm)) — skipping apt"
          else
            # The Azure mirror is the actual fault. On 2026-08-19 it
            # answered `Ign:` to every index request while
            # archive.ubuntu.com responded normally, and apt then sat
            # there — hanging the editor's Playwright lane for a MONTH
            # and two core jobs for 70 and 32 minutes. Point sources at
            # archive.ubuntu.com before updating, so a sick regional
            # mirror cannot stall the build.
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
                /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      - name: install poppler (pdftoppm) — macOS
        if: runner.os == 'macOS'
        run: brew list poppler >/dev/null 2>&1 || brew install poppler

      - name: build paged-diff + paged-inspect + paged-gen
        run: cargo build --release
          -p paged-fidelity --bin paged-diff
          -p paged-renderer --bin paged-inspect
          -p paged-gen --bin paged-gen

      - name: golden-snapshot regression gate
        # Renders the seed_hello fixture and ΔE-diffs every page
        # against the pinned PNGs in corpus/seeds/hello/golden/.
        # Drift past the test's epsilon fails the run.
        # A filter that matches no test passes `cargo test`, so the lane
        # report checks that this one ran.
        run: |
          set -o pipefail
          cargo test -p paged-renderer --test it seed_hello::seed_hello_matches_golden_snapshot \
            2>&1 | tee "$RUNNER_TEMP/golden.log"
          python3 ../../tooling/rust/skip-report.py --lane "golden snapshot" --cargo-log "$RUNNER_TEMP/golden.log"

      - name: generated-corpus fidelity gate (hard; needs Coated FOGRA39, unavailable without it)
        # Hard regression gate over corpus/generated/*.idml + *.pdf.
        # diff.sh regenerates each IDML, renders it, rasterises the
        # paired InDesign PDF via pdftoppm, runs paged-diff, and
        # asserts every gated page stays under the per-fixture
        # tolerances in corpus/generated/fidelity-thresholds.json.
        # Failure here blocks the merge.
        #
        # Exit 3 is a THIRD state, added 2026-08-19: "inconclusive".
        # The reference PDFs were exported by InDesign in Coated
        # FOGRA39, and no runner has that profile — Adobe's is not
        # redistributable. Without it pdftoppm rasterises in poppler's
        # SWOP default while paged-inspect falls back to naive CMYK
        # math, so the two sides sit in different colour spaces and
        # every page reads ~4.16 dE p99. That is not a regression and
        # must not be reported as one; equally it must not be silently
        # swallowed, which is precisely what this step did for months
        # (it skipped itself entirely and went green).
        #
        # So: 0 passes, 1 blocks, 3 reports the gate unavailable (a named
        # skip, in the step name, the log, the annotation and the job
        # summary) and continues. Give a runner a FOGRA39 profile via
        # PAGED_CMYK_PROFILE and set PAGED_REQUIRE_FOGRA39=1 on it: then 3
        # cannot happen, and diff.sh fails instead (docs/development/testing.md).
        run: |
          set +e
          ./corpus/generated/diff.sh
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            msg="unavailable: FOGRA39 profile: no Coated FOGRA39 on this runner, so the pixel gate measured nothing (every fixture skipped; not a regression). The text-layer gate below still gates."
            echo "$msg"
            echo "::warning title=fidelity gate unavailable (FOGRA39)::$msg"
            echo "### Fidelity pixel gate: unavailable (FOGRA39)" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

      - name: text-layer gate (hard for opted-in fixtures)
        # The pixel gate above cannot see missing words: twelve glyphs on
        # an A4 page move neither its mean ΔE nor its p99. This compares
        # WHAT is printed — pdftotext of InDesign's reference against the
        # lines the engine laid out — page by page, for every fixture with
        # "text_gate" in fidelity-thresholds.json. Colour-independent, so
        # it gates even where the pixel gate is inconclusive.
        run: ./corpus/generated/text-diff.sh

      - name: upload generated-corpus heatmaps on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-corpus-diff-${{ matrix.os }}
          # cand-NNN.png + ref-NNN.png + heat-NNN.png + report.json +
          # gate.json per fixture — enough to triage any regression.
          path: /tmp/idml-generated-diff
          if-no-files-found: warn
          retention-days: 14

      # Bun at the version in /.prototools (the repo scripts run on Bun).
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # ── The gate's numbers, kept ────────────────────────────────────
      # Everything above uploads only `if: failure()`, so every PASSING
      # run's ΔE2000 and SSIM was computed and thrown away, and the gate's
      # per-fixture verdict (`gate.json` `passed`) never reached cockpit:
      # the `core/fidelity-*` lanes it declares stayed empty. This writes
      # the verdicts as contract-v1 evidence and the numbers as
      # measurements (worst page per fixture), JSON only.
      - name: derive fidelity evidence + measurements
        if: always()
        run: |
          bun scripts/measurements-from-fidelity.mjs \
            --in /tmp/idml-generated-diff \
            --out-dir "$RUNNER_TEMP" \
            --commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --os "${{ matrix.os }}"

      - name: upload fidelity evidence + measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paged-fidelity-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/paged-results-fidelity.json
            ${{ runner.temp }}/paged-measurements-fidelity.json
          if-no-files-found: warn
          # Longer than the heatmaps': these are the trend inputs.
          retention-days: 90

      - name: third-party sample diff (advisory)
        # Runs ./corpus/generated/render-diff.sh against any third-party
        # IDML pair (idml + matching pdf) under corpus/samples/.
        # Those files are gitignored and only present when a dev
        # has staged one locally; CI no-ops when none exist.
        # Intentionally `|| true` — these aren't license-cleared
        # for redistribution and the per-page numbers gate nothing
        # automatically. Useful as an artifact for inspection.
        run: |
          shopt -s nullglob
          for idml in corpus/samples/*.idml; do
            name=$(basename "$idml" .idml)
            pdf="corpus/samples/$name.pdf"
            [ -f "$pdf" ] || continue
            echo "==> diff for $name"
            ./corpus/generated/render-diff.sh "$name" || true
          done
