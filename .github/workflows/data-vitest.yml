name: data / vitest
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MONOREPO (step A3): ported from paged-media/plugin-data
# .github/workflows/vitest.yml. The old lane checked the repo out under
# plugin-data/ and ran every command from its parent; it now checks the
# monorepo out at the root and runs in modules/data, so `plugin-data/<x>`
# became `<x>` and `--dir plugin-data` was dropped.
on:
  push:
    branches: [main]
    paths:
      - "modules/data/**"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/data-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/data/docs/**/*.md"
  # Pre-merge gate: a PR that breaks the bundle goes red BEFORE it lands
  # (this lane used to run on push to main only).
  pull_request:
    paths:
      - "modules/data/**"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/data-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/data/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/data

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      # The plugin contract and the engine come from the workspace
      # (`workspace:*`): plugin-api and plugin-sdk as source, the engine's
      # wasm packages from the engine-wasm step below.
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # ------------------------------------------------------------------
      # REAL-ENGINE artifact (audit P4). This lane used to run vitest with
      # no wasm artifact, so data-bundle's engine-real.spec.ts skipIf gate
      # skipped the real boot on EVERY CI — every other bundle test runs
      # against fake hosts/engines. Build it here (the exact recipe of
      # rust.yml's `wasm` job: pinned toolchain, Cargo.lock-pinned
      # wasm-bindgen-cli, pinned binaryen) so the real boot actually runs;
      # REQUIRE_REAL_ENGINE=1 below makes a missing artifact FAIL, not skip.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/data -> target
          prefix-key: v0-rust-data
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_126/bin" >> "$GITHUB_PATH"
      - name: build the engine wasm artifact (100 MB app wasm budget gate)
        run: bash scripts/build-wasm.sh
      # Fail-not-skip belt at the JOB level too: a missing artifact reddens
      # the job HERE, before any spec can skip.
      - name: real-engine artifact guard (fail, never skip)
        run: test -f packages/data-bundle/bin/data_js_bg.wasm
      # The real query engine. DuckDB-WASM is vendored by this script (MIT,
      # prebuilt, never compiled in-tree), which also stages the eh variant
      # as the governed bin/duckdb-engine.wasm. REQUIRE_REAL_DUCKDB=1 below
      # turns every "DuckDB not vendored" skip into a failure.
      # The engine's wasm packages (canvas-wasm and the rest, workspace:*),
      # which the real-engine specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      # after install: vendor-duckdb.sh bundles the DuckDB JS API with the
      # installed apache-arrow (scripts/bundle-duckdb-api.mjs)
      - name: vendor DuckDB-WASM (MIT prebuilt)
        run: bash scripts/vendor-duckdb.sh
      - name: real-DuckDB artifact guard (fail, never skip)
        run: test -f packages/data-bundle/bin/duckdb-engine.wasm
      # ------------------------------------------------------------------
      - name: contract-import lint (fail fast)
        run: node scripts/check-contract-imports.mjs
      - name: typecheck
        run: bun run --filter './packages/*' typecheck
      # A red spec FAILS this job. It used to end in `|| true` (so red
      # results would still be published as evidence), which also meant the
      # TS lane could never go red: a failing spec merged green. Evidence
      # still ships: the JUnit steps below run under `!cancelled()`.
      # The real-BROWSER DuckDB lane (test/duckdb-browser.spec.ts): the
      # shipped eh worker + engine in headless Chrome under the editor's
      # headers. The Node lane cannot see what only the browser worker does
      # (the json_serialize_sql guard passed every Node spec and trapped on
      # every refresh in the editor). The runner's preinstalled Chrome —
      # no browser download, no apt.
      - name: browser for the DuckDB browser lane (fail, never skip)
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          test -n "$CHROME"
          echo "PAGED_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
      - name: vitest (junit per package)
        env:
          # The spec-level half of the dual gate (engine-real.spec.ts,
          # wasm-fresh.spec.ts): under this env a missing artifact FAILS the
          # suite instead of letting the skipIf gate silently pass a vacuous
          # run. REQUIRE_REAL_DUCKDB does the same for the DuckDB specs.
          REQUIRE_REAL_ENGINE: "1"
          REQUIRE_REAL_DUCKDB: "1"
          REQUIRE_REAL_CORE: "1"
          REQUIRE_REAL_BROWSER: "1"
        run: |
          bun run --filter './packages/*' test \
            --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: collect junit
        if: ${{ !cancelled() }}
        run: |
          cat packages/*/junit.xml > junit-all.xml
          [ -s junit-all.xml ]
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-data,
      # suite=vitest, format=nextest-junit).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/data/junit-all.xml
          if-no-files-found: error
          retention-days: 14
