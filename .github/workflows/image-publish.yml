name: image / publish

# Disabled in the monorepo: built-in modules are no longer published separately (PM-0008). Kept for reference until wave D.
#
# MONOREPO (step A3): ported from paged-media/plugin-image .github/workflows/
# publish.yml with `on: workflow_dispatch` only (its workflow_run trigger on `ci` is removed). Paths are ported so the
# file stays readable as a reference; the npm Trusted Publisher it names is
# bound to the OLD repo and file name, so a dispatch could not publish anyway.
#
# Publish @paged-media/image to npm via OIDC TRUSTED PUBLISHING (tokenless).
# Requires a Trusted Publisher on npm: org paged-media, this repo, workflow
# publish.yml (keep this FILE NAME: the trusted publisher is bound to it).
# Pre-1.0 -canary.N under the `canary` dist-tag; unchanged skip.
#
# Runs only after `ci` succeeded on main, on exactly the commit ci tested,
# and runs the bundle tests against the wasm it just built before packing.
# It used to run on every push in parallel with ci and test nothing, so a
# commit that failed ci could still reach npm.
on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for trusted publishing
  contents: read

defaults:
  run:
    working-directory: modules/image

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/image -> target
          prefix-key: v0-rust-image
      # The version is READ FROM Cargo.lock, not written here. It used to
      # be hardcoded three times in this step with a comment saying it
      # "must match Cargo.lock", which is a rule a comment cannot keep:
      # an ordinary `cargo update` moved the lock to 0.2.128 and this
      # step kept installing 0.2.122, so `build-wasm.sh`'s pin check —
      # doing its job — failed the publish. Same rule the script
      # enforces, read from the same place, so they cannot disagree.
      - name: wasm-bindgen (prebuilt; version from Cargo.lock)
        run: |
          set -euo pipefail
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          test -n "$WB" || { echo "could not read wasm-bindgen from Cargo.lock"; exit 1; }
          echo "wasm-bindgen $WB (from Cargo.lock)"
          curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/$WB/wasm-bindgen-$WB-x86_64-unknown-linux-musl.tar.gz" | tar xz
          echo "$PWD/wasm-bindgen-$WB-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: binaryen (prebuilt wasm-opt; pinned — old apt binaryen breaks externref)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_126/bin" >> "$GITHUB_PATH"
      - name: build wasm
        run: bash scripts/build-wasm.sh
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      # The bundle tests against the wasm built above (wasm-fresh.spec.ts
      # proves it is the one these sources build). glue only: the
      # manifest package validates through a sibling plugin-sdk checkout,
      # which ci has and this job does not.
      - name: test
        run: bun run --cwd glue test
        env:
          REQUIRE_REAL_WASM: "1"
      - run: bun run --filter './glue' --filter './manifest' build
      - name: publish via OIDC (canary)
        run: |
          set -e
          for dir in glue; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            tgz="$RUNNER_TEMP/$(echo "$name" | sed 's#@##; s#/#-#')-${version}.tgz"
            node "$GITHUB_WORKSPACE/tooling/js/pack.mjs" "$dir" "$RUNNER_TEMP" >/dev/null
            echo "publish $name@$version via OIDC"
            npm publish "$tgz" --tag canary --access public
          done
