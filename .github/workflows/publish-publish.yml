# Canary publish of the paged.publish plugin bundles (@paged-media/publish +
# @paged-media/pdf).
#
# Disabled in the monorepo: built-in modules are no longer published separately (PM-0008). Kept for reference until wave D.
#
# MONOREPO (step A3): ported from paged-media/plugin-publish .github/workflows/
# publish.yml with `on: workflow_dispatch` only. Paths are ported so the
# file stays readable as a reference; the npm Trusted Publisher it names is
# bound to the OLD repo and file name, so a dispatch could not publish anyway.
#
#
# AUTH: OIDC TRUSTED PUBLISHING (tokenless) — same lane as plugin-image/
# plugin-web/plugin-sdk. Requires a Trusted Publisher on npm for EACH
# package: org paged-media, this repo, workflow publish.yml. Until that
# npm-side config exists the publish step fails visibly (2026-08-18: the
# legacy NPM_TOKEN here died of expiry — E404-on-PUT is auth — so the
# tokenless lane replaces it rather than rotating a second secret).
#
# Why pack -> npm publish: tooling/js/pack.mjs applies publishConfig
# (repointing main/types to dist, as `pnpm pack` did) and resolves workspace:
# and catalog: specifiers (`bun pm pack`); npm does the authenticated upload.
#
# Pre-1.0: every version is a -canary.N prerelease under the `canary`
# dist-tag. An unchanged version skips; bump a bundle's package.json to
# release.
name: publish / publish

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for trusted publishing
  contents: read

defaults:
  run:
    working-directory: modules/publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - run: bun run --filter './packages/*' typecheck
      - run: bun run --filter './packages/*' build # produce dist (packing skips prepublishOnly)
      - name: publish each bundle whose version is new (canary, via OIDC)
        run: |
          set -e
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            node "$GITHUB_WORKSPACE/tooling/js/pack.mjs" "$dir" "$RUNNER_TEMP" >/dev/null
            tgz="$RUNNER_TEMP/$(echo "$name" | sed 's#@##; s#/#-#')-${version}.tgz"
            echo "publish $name@$version ($tgz) via OIDC"
            npm publish "$tgz" --tag canary --access public
          done
