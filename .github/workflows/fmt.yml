name: fmt / bun fmt

# `bun fmt --check` over the whole repository, root files included:
# bunfig.toml [fmt] (Prettier 3's defaults) minus what /.prettierignore
# lists, through tooling/js/fmt.sh and the Bun canary pinned in
# tooling/js/bun-canary-version (docs/migration/bun-fmt.md). Exit 1 (a file
# needs formatting) and exit 2 (a file could not be formatted: a syntax
# error, or an invalid config) both fail the job. Rust is checked by
# `cargo fmt --check` in the component workflows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: bun fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Bun at the version in /.prototools, installed by proto; bunx then
      # fetches the pinned canary that has `bun fmt`.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"

      - name: bun fmt --check
        run: bash tooling/js/fmt.sh --check
