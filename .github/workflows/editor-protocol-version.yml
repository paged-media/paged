name: editor / protocol-version

# Decision-B package-boundary model.
#
# Pre-flip, this workflow rebuilt the engine wasm from a sibling `core`
# checkout and `git diff --exit-code` on the vendored
# `packages/client/src/wasm/*.d.ts` to catch wire-format drift. After
# the package boundary, the wire types + engine wasm ship in the
# published `@paged-media/canvas-wasm` package, so there is nothing to
# regenerate. Since 2026-10-01 there is no drift guard either: the TS
# side READS `PROTOCOL_VERSION` from the installed canvas-wasm version
# (convention `0.<protocol>.<patch>`, packages/client/src/protocol.ts), so
# there is one number. What is left here is the plugin-pin check.
#
# MONOREPO (step A3): ported from paged-media/editor .github/workflows/
# protocol-version.yml; paths prefixed with apps/editor.

on:
  pull_request:
    paths:
      - "apps/editor/packages/client/src/protocol.ts"
      - "apps/editor/packages/client/package.json"
      - "apps/editor/apps/canvas/package.json"
      - "apps/editor/scripts/check-plugin-pins.mjs"
      - ".github/workflows/editor-protocol-version.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/editor

jobs:
  protocol-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"

      # The installed @paged-media/canvas-wasm version is what protocol.ts reads.
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # No protocol-version / package agreement step: protocol.ts READS
      # the protocol from the installed package's version, so there is no
      # second number to agree with.

      # Release-lane half of the pins story (audit 17082026 E6): with no
      # sibling checkouts in CI the script self-SKIPs (exit 0) — honest,
      # because repo-ahead-of-pin is the normal in-flight state and only a
      # RELEASE reconciles it. Running it here still catches the cheap
      # mistakes (a pin referencing an unpublished version fails the
      # install step above first; a malformed pin fails the script), and
      # `bun run check:pins` is the local release-time gate where the
      # siblings DO exist.
      # In the monorepo the bundles are in-tree, so the check no longer skips.
      # It is a release-time gate by design (an in-tree bundle ahead of the
      # editor's npm pin is the normal in-flight state), so CI reports drift
      # without failing, as the skipped check never failed before. Removed
      # with the pins themselves when the editor moves to workspace:* (B3).
      - name: Report plugin pin drift (release-time gate; report only in CI)
        run: node scripts/check-plugin-pins.mjs --warn-only
