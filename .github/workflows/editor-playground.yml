name: editor / playground
concurrency:
  # Deploys run one at a time and are never cancelled; a newer deploy that
  # arrives while one runs waits, and replaces any older one still waiting.
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Build the live-demo PLAYGROUND (apps/canvas `demo` build) and deploy it to
# Cloudflare Pages at play.paged.media — the real editor that the docs and
# paged.media embed.
#
# The editor consumes the engine and every plugin bundle as workspace
# packages (`workspace:*`), so the engine-wasm and module-wasm actions build
# their wasm (or restore it from the cache) before the build.
#
# MONOREPO (step A3): ported from paged-media/editor .github/workflows/
# playground.yml. One repository checkout at the root; a change to anything
# the editor consumes redeploys the playground too.
on:
  push:
    branches: [main]
    paths:
      - "apps/editor/**"
      # Everything the editor consumes through the workspace (see
      # editor-tests.yml): the module bundles, the extension contract and
      # ai, and the engine's wasm packages with what builds them.
      - "modules/**"
      - "platform/extensions/packages/**"
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/module-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/editor-playground.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!apps/editor/docs/**/*.md"
      # Module prose (B3a made every module an editor input).
      - "!modules/*/docs/**/*.md"
  workflow_dispatch:
  repository_dispatch:
    types: [engine-updated]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/editor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # The engine's wasm packages and the bundles' engine wasm (build
      # outputs; the editor consumes the workspace packages). Vite resolves
      # sheet's, web's and doc's `../bin/<glue>.js` at build time.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
        with: { artifact: "false" }
      - name: module wasm (doc)
        uses: ./.github/actions/module-wasm
        with: { module: doc }
      - name: module wasm (slide)
        uses: ./.github/actions/module-wasm
        with: { module: slide }
      - name: module wasm (sheet)
        uses: ./.github/actions/module-wasm
        with: { module: sheet }
      - name: module wasm (data)
        uses: ./.github/actions/module-wasm
        with: { module: data }
      - name: module wasm (web)
        uses: ./.github/actions/module-wasm
        with: { module: web }

      # PAGED_MODULES_HOSTED: the module door (ADR 223) answers the module
      # host, because the next step hosts every module the build lists.
      - name: build the demo
        env:
          PAGED_MODULES_HOSTED: "1"
        run: bun run --filter paged-canvas build:demo

      # Wasm modules are hosted, not deployed (ADR 220): every .wasm in the
      # build is uploaded to modules.paged.media (R2, brotli, immutable per
      # package version) if it is not there yet, removed from the deploy, and
      # replaced by a same-origin 302. That also keeps every file under
      # Cloudflare Pages' 25 MiB limit — the engine (~27 MiB) and DuckDB
      # (~34 MiB) are not.
      - name: host the wasm modules
        working-directory: apps/editor/apps/canvas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/modules-sync.mjs dist-demo

      - name: every file fits the Pages size limit
        working-directory: apps/editor/apps/canvas/dist-demo
        run: |
          big=$(find . -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::over Cloudflare Pages' 25 MiB limit: $big"; exit 1; fi

      - name: deploy to Cloudflare Pages
        # npx (not wrangler-action, which adds wrangler to the workspace).
        # Deployed from apps/canvas so wrangler picks up apps/canvas/functions:
        # the same-origin Claude proxy at /api/ai (ADR 221). Its secret and
        # KV binding live on the Pages project, not here.
        working-directory: apps/editor/apps/canvas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy dist-demo --project-name=paged-playground --branch=main
