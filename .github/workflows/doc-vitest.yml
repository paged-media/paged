name: doc / bun test
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MONOREPO (step A3): ported from paged-media/plugin-doc
# .github/workflows/vitest.yml; runs in modules/doc. Push-only, as before.
on:
  push:
    branches: [main]
    paths:
      - "modules/doc/**"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/doc-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/doc/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/doc

jobs:
  vitest:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # The engine's wasm packages (canvas-wasm and the rest, workspace:*),
      # which the real-engine specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run --filter './packages/*' typecheck
      # CI never checks out ../plugin-sdk (that path only exists in the local
      # sibling-clone layout), so validate through the PUBLISHED plugin-cli —
      # the same way plugin-publish/ci.yml validates its manifests.
      - name: validate manifest
        run: node "$GITHUB_WORKSPACE/platform/extensions/packages/plugin-cli/bin/paged-plugin.mjs" validate packages/doc-bundle/manifest.json
      # Red results must still upload (the state matrix wants the ✗), so the
      # run does not abort here — the gate at the end fails the job once the
      # artifact is safely uploaded.
      - name: bun test (junit per package; red results still upload)
        run: |
          set -uo pipefail
          bun run --filter './packages/*' test \
            --reporter=junit --reporter-outfile=junit.bun.xml \
            || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          # bun's reports, rewritten into the vitest shape the evidence has always
          # had (tooling/js/bun-junit.mjs): the artifact keeps its name and test ids.
          bun ../../tooling/js/bun-junit.mjs --out junit-all.xml packages/*/junit.bun.xml \
            || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          [ -s junit-all.xml ]
      # plugin-doc is a PUBLIC repo and the publish-results action lives in the
      # PRIVATE paged-media/state repo. GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found"), which failed this job at SET-UP — before
      # any step ran — on all 18 runs since the workflow was added. So we follow
      # core/ci.yml's inverted pattern: upload the JUnit as an artifact, and let
      # state pull it (private state CAN read a public repo's artifacts).
      - name: upload JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/doc/junit-all.xml
          if-no-files-found: error
          retention-days: 14
      - name: tests failed
        if: ${{ env.TS_FAILED == '1' }}
        run: exit 1
