# Canary publish via OIDC TRUSTED PUBLISHING (tokenless). No NPM_TOKEN: the
# runner mints a short-lived OIDC token (id-token: write) that npm trusts because
# each package has this repo+workflow configured as a Trusted Publisher on npmjs.
#
# Why pack → npm publish: OIDC trusted publishing is an npm-CLI feature
# (>= 11.5.1), while tooling/js/pack.mjs is what converts workspace:* and
# catalog: deps (`bun pm pack`) and applies publishConfig (as `pnpm pack` did).
# So we pack with it (correct tarball) and upload with npm (OIDC).
#
# Pre-1.0: every version is a -canary.N prerelease under the `canary` dist-tag.
# Unchanged versions skip; bump a package's version to release it.
#
# One-time npm setup per package (plugin-api, plugin-sdk, plugin-cli, cli):
#   npmjs.com → package → Trusted Publisher → GitHub Actions →
#     org: paged-media, repo: plugin-sdk, workflow: publish.yml, action: npm publish
#
# MONOREPO (step A3): ported from paged-media/plugin-sdk
# .github/workflows/publish.yml; runs in platform/extensions. MANUAL
# (workflow_dispatch) ONLY for now: the npm Trusted Publishers of
# plugin-api, plugin-sdk, plugin-cli, ai and cli are registered for
# repo plugin-sdk / workflow publish.yml, and this run presents repo `paged`
# / workflow `extensions-publish.yml`, so OIDC publishing fails until each
# package's Trusted Publisher is re-registered for paged-media/paged +
# extensions-publish.yml (a USER action on npmjs.com). Restore
# `push: branches: [main]` (with a platform/extensions/** path filter) after.
name: extensions / publish

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for trusted publishing
  contents: read

defaults:
  run:
    working-directory: platform/extensions

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      # The engine's wasm packages (workspace:*): the harness specs boot
      # canvas-wasm, and the wire check below reads its .d.ts.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
        with:
          artifact: "false"
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - run: bun run --filter './packages/*' typecheck
      # Build BEFORE the suite: react-free-import.spec.ts asserts on the
      # SHIPPED artifact and skips itself when `dist` is absent, so building
      # afterwards left that guard inert on every publish. Packing does NOT
      # run prepublishOnly, so this step produces the published dist too.
      - run: bun run --filter './packages/*' build
      - run: bun run --filter './packages/*' test
      # The vendored wire and capability catalog against their sources in
      # this checkout: the .d.ts of the canvas-wasm workspace package built
      # above, and engine/core's catalog.json. They used to be checked
      # against the npm package at the wire's version stamp; the stamp is
      # now the workspace version (0.<protocol>.0-dev), which is not on npm.
      # sync-catalog still enforces catalog.provenance.json in both
      # directions (an unexplained difference fails, and so does a stale
      # "leads the publish" marker).
      - name: wire and catalog vendoring lockstep (hard gate)
        run: |
          bun scripts/sync-wire.mjs --check
          bun scripts/sync-catalog.mjs --check
      - name: publish changed versions via OIDC (canary)
        run: |
          set -e
          for dir in packages/plugin-api packages/plugin-sdk packages/plugin-cli packages/ai packages/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            tgz="$RUNNER_TEMP/$(echo "$name" | sed 's#@##; s#/#-#')-${version}.tgz"
            bun "$GITHUB_WORKSPACE/tooling/js/pack.mjs" "$dir" "$RUNNER_TEMP" >/dev/null
            echo "publish $name@$version via OIDC ($tgz)"
            npm publish "$tgz" --tag canary --access public
          done
