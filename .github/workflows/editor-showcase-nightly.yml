# The annual/showcase nightly — builds the reference document end to end
# through the real editor and gates on the three-axis coverage ledger.
#
# The base fixture is generated by core's paged-gen
# (`corpus/generated/*.idml` is gitignored there), so the document build
# genuinely needs the engine beside the editor. Pre-monorepo that was a
# sibling `core` checkout; now it is the in-tree engine/core — but the
# harness still finds core as `<editor>/../core` (tests/showcase/chapter.ts
# WORKSPACE/CORE, 900-assemble.spec.ts, assets/gen-*.py) and needs the
# path rewiring of step A4 to look in engine/core instead.
#
# MONOREPO (step A3): ported from paged-media/editor .github/workflows/
# showcase-nightly.yml; schedule + dispatch only, so no path filters.
#
# macos-14, not ubuntu: the image chapter's kernels are GPU-only WGSL,
# and the Linux runners expose no WebGPU adapter — chapter 070 would
# permanently degrade to notes. Apple silicon + Metal + real Chrome in
# new-headless is the same lane the journeys-gpu project uses locally.
#
# Committed artifacts stay a MANUAL local deliverable; this uploads its
# outputs as workflow artifacts and acts as the regression sentinel
# (coverage ratchet, blank-page gate, part-prefix guard).

name: editor / showcase-nightly

on:
  schedule:
    # 03:17 UTC — off the top of the hour, after the day's merges.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: editor-showcase-nightly
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/editor

jobs:
  build-annual:
    name: build the reference document (macOS, WebGPU)
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      # One checkout of the repository: editor (apps/editor) and engine
      # (engine/core) are both in it.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/core -> target
          prefix-key: v0-rust-editor

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: generate the base fixture (paged-gen)
        run: bash scripts/regen-fixtures.sh
        working-directory: engine/core

      # Ch.11 (colour management) and the assembly read core's CMYK
      # profile; it is fetched, not committed, so without this step
      # 165-color fails and every later chapter dies for want of its
      # checkpoint (the 2026-10-01 run).
      - name: fetch the CMYK profile
        run: bash scripts/fetch-profiles.sh
        working-directory: engine/core

      - name: install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # The engine's wasm packages and the bundles' engine wasm (build
      # outputs; the editor consumes the workspace packages). Without them
      # the dev server cannot resolve the bundles' relative wasm glue (sheet,
      # web, doc, draw, image, pdf), the app never boots (`__canvas` times out at
      # 30 s) and every chapter fails, as every night from 2026-09-11 until
      # doc's wasm was built here.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
        with: { artifact: "false" }
      - name: module wasm (doc)
        uses: ./.github/actions/module-wasm
        with: { module: doc }
      - name: module wasm (slide)
        uses: ./.github/actions/module-wasm
        with: { module: slide }
      - name: module wasm (sheet)
        uses: ./.github/actions/module-wasm
        with: { module: sheet }
      - name: module wasm (data)
        uses: ./.github/actions/module-wasm
        with: { module: data }
      - name: module wasm (web)
        uses: ./.github/actions/module-wasm
        with: { module: web }
      - name: module wasm (draw)
        uses: ./.github/actions/module-wasm
        with: { module: draw }
      - name: module wasm (image)
        uses: ./.github/actions/module-wasm
        with: { module: image }
      - name: module wasm (publish)
        uses: ./.github/actions/module-wasm
        with: { module: publish }

      - name: install real Chrome
        run: npx playwright install chrome
        working-directory: apps/editor/apps/canvas

      # No retries: a chapter failure is deterministic, and its retry
      # re-ran a 30-minute chapter only to fail the same way.
      - name: build the document (chaptered)
        run: npx playwright test --project=showcase --retries=0
        working-directory: apps/editor/apps/canvas

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-${{ github.run_number }}
          path: |
            apps/editor/apps/canvas/showcase/showcase.paged
            apps/editor/apps/canvas/showcase/showcase.idml
            apps/editor/apps/canvas/showcase/showcase.pdf
            apps/editor/apps/canvas/showcase/showcase.coverage.json
            apps/editor/apps/canvas/showcase/pages/
          retention-days: 21

      - name: upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: annual-traces-${{ github.run_number }}
          path: apps/editor/apps/canvas/test-results/
          retention-days: 7

      # paged.image's performance trend lane: a 200-sample stroke, an Apply
      # and a 20-step opacity drag on a 4000x3000 image, printed to this log
      # and written to test-results/image-perf.json. REPORTED, NOT GATED
      # (continue-on-error), and on this runner because its kernels need
      # Metal. Last on purpose: a Playwright run clears test-results/, where
      # the showcase's failure traces were just uploaded from.
      - name: paged.image perf trend (reported, not gated)
        if: always()
        continue-on-error: true
        run: npx playwright test --project=journeys-gpu tests/journey/plugins/image-perf.journey.spec.ts --retries=0
        working-directory: apps/editor/apps/canvas
