name: site / cf-events-setup

# One-shot setup of paged.media's cookieless measurement on its Cloudflare
# Pages project (website ADR 865, decision 5; website docs/measurement.md), run
# in CI with the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID org secrets like
# editor-cf-setup.yml and editor-cf-ai-setup.yml. Idempotent, safe to re-run:
#
#   1. binds the Workers Analytics Engine dataset paged_site_events as EVENTS
#      to the paged-website project, production and preview (a PATCH merges
#      per key, so the project's other settings stay);
#   2. Cloudflare Web Analytics: lists the account's sites and reports the one
#      for paged.media; where there is none, creates it, with automatic setup
#      when the token can read the zone. A token without the Web Analytics
#      permission is reported, not failed;
#   3. retries the latest production deployment, because bindings apply only
#      to new deployments.
#
# Afterwards the website's check:live reads X-Paged-Event: written from
# /api/event (not-bound before).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: paged-website
      DATASET: paged_site_events
      HOST: paged.media
    steps:
      - name: bind EVENTS to the Analytics Engine dataset
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$A"
          show='import json,sys
          d=json.load(sys.stdin)
          if not d.get("success"): print("  errors:", d.get("errors")); sys.exit(1)
          for env in ("production", "preview"):
              c = d["result"]["deployment_configs"][env]
              print("  " + env + ": analytics_engine_datasets =", c.get("analytics_engine_datasets", {}))'
          echo "== $PROJECT before"
          curl -sS "$api/pages/projects/$PROJECT" -H "Authorization: Bearer $T" | python3 -c "$show"
          body=$(python3 -c 'import json,os
          cfg={"analytics_engine_datasets":{"EVENTS":{"dataset":os.environ["DATASET"]}}}
          print(json.dumps({"deployment_configs":{"production":cfg,"preview":cfg}}))')
          echo "== PATCH $PROJECT"
          curl -sS -X PATCH "$api/pages/projects/$PROJECT" -H "Authorization: Bearer $T" \
            -H "Content-Type: application/json" -d "$body" | python3 -c "$show"

      - name: Cloudflare Web Analytics for paged.media
        continue-on-error: true
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$A"
          echo "== Web Analytics sites"
          list=$(curl -sS "$api/rum/site_info/list?per_page=100" -H "Authorization: Bearer $T")
          # Only the site for $HOST is printed: this log is public, and the
          # account's other sites are none of this repository's business.
          echo "$list" | python3 -c 'import json,os,sys
          d=json.load(sys.stdin); h=os.environ["HOST"]
          if not d.get("success"):
              print("  cannot list Web Analytics sites (the token needs Account Analytics / Web Analytics):", d.get("errors")); sys.exit(0)
          mine=[s for s in (d.get("result") or []) if s.get("host")==h or (s.get("ruleset") or {}).get("zone_name")==h]
          for s in mine:
              r = s.get("ruleset") or {}
              print("  site for", h, "| auto_install", s.get("auto_install"), "| ruleset enabled", r.get("enabled"))
          if not mine: print("  none for", h)'
          found=$(echo "$list" | python3 -c 'import json,os,sys
          d=json.load(sys.stdin); h=os.environ["HOST"]
          print(next((s["site_tag"] for s in (d.get("result") or []) if s.get("host")==h or (s.get("ruleset") or {}).get("zone_name")==h), ""))' 2>/dev/null || true)
          if [ -n "$found" ]; then echo "== a site for $HOST exists; nothing to create"; exit 0; fi
          zone=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=$HOST" -H "Authorization: Bearer $T" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);r=d.get("result") or [];print(r[0]["id"] if d.get("success") and r else "")' 2>/dev/null || true)
          if [ -n "$zone" ]; then
            echo "== create the site for $HOST with automatic setup (zone readable)"
            body="{\"zone_tag\":\"$zone\",\"auto_install\":true}"
          else
            echo "== create the site for $HOST without automatic setup (the token cannot read the zone): the site adds the snippet"
            body="{\"host\":\"$HOST\",\"auto_install\":false}"
          fi
          curl -sS -X POST "$api/rum/site_info" -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" \
            | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          if not d.get("success"): print("  errors:", d.get("errors")); sys.exit(0)
          s=d["result"]; print("  created the site | auto_install", s.get("auto_install"))'

      - name: redeploy (bindings apply to new deployments)
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/$PROJECT"
          id=$(curl -sS "$api/deployments?env=production&per_page=1" -H "Authorization: Bearer $T" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);r=d["result"];print(r[0]["id"]);print("  latest", r[0]["id"], r[0].get("deployment_trigger",{}).get("metadata",{}).get("commit_hash","")[:7], file=sys.stderr)')
          echo "== retry $id"
          curl -sS -X POST "$api/deployments/$id/retry" -H "Authorization: Bearer $T" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print("  ok", d["result"]["id"]) if d.get("success") else (print("  errors:", d.get("errors")), sys.exit(1))'
