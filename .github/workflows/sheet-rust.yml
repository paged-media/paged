name: sheet / rust
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MONOREPO (step A3): ported from paged-media/plugin-sheets
# .github/workflows/rust.yml; runs in modules/sheet.
on:
  push:
    branches: [main]
    paths:
      - "modules/sheet/**"
      - ".github/workflows/sheet-rust.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # The test-resources dev-dependency (the skip convention).
      - "platform/shared/test-resources/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/sheet/docs/**/*.md"
  # Pre-merge gate (audit finding: this lane was push-main-only, so a PR
  # could land red and only redden main afterwards).
  pull_request:
    paths:
      - "modules/sheet/**"
      - ".github/workflows/sheet-rust.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # The test-resources dev-dependency (the skip convention).
      - "platform/shared/test-resources/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/sheet/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/sheet

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/sheet -> target
          prefix-key: v0-rust-sheet
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Each guard fails explicitly. They used to be two `! (… | grep …)`
      # lines: bash's errexit ignores a `!`-negated command, so only the
      # LAST line's status reached the step and the sheet-fn guard could
      # never fail.
      - name: dependency guards (spec §4 rules)
        run: |
          if cargo tree -p sheet-fn --edges normal | grep -E 'sheet-(calc|parser|xlsx|lower|js)'; then
            echo "LEAK: sheet-fn depends on a calc/parser/xlsx/lower/js crate"; exit 1
          fi
          if cargo tree -p sheet-js --target wasm32-unknown-unknown | grep -E 'sheet-conformance|proptest'; then
            echo "LEAK: the wasm tree pulls a test-only crate"; exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: modules/sheet/Cargo.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/sheet -> target
          prefix-key: v0-rust-sheet
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # No `|| true` here (audit P2 / June V18): a red suite must redden the
      # job. The junit artifact still publishes on failure — the upload step
      # below runs under `if: ${{ !cancelled() }}`, so state still ingests
      # red results.
      - name: nextest (junit; red results still publish via !cancelled upload)
        id: nextest
        # Tests that miss a resource append `unavailable: …` to the skip
        # log; the lane report marks them <skipped> in the JUnit and fails a
        # run that executed nothing (docs/development/testing.md).
        run: |
          echo "PAGED_SKIP_LOG=$RUNNER_TEMP/paged-skips.tsv" >> "$GITHUB_ENV"
          PAGED_SKIP_LOG="$RUNNER_TEMP/paged-skips.tsv" \
            cargo nextest run --workspace --profile ci --no-tests=fail
      - name: lane report
        if: ${{ !cancelled() && steps.nextest.outcome != 'skipped' }}
        run: python3 ../../tooling/rust/skip-report.py --lane "sheet nextest" --junit target/nextest/ci/junit.xml
      - name: coverage gate (the §12.2 verification invariant)
        run: cargo run -p sheet-conformance --bin coverage-gate
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-sheets,
      # suite=nextest, format=nextest-junit).
      - name: upload nextest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: modules/sheet/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
      # A silent fallback to the default linker fails here: mold stamps
      # the .comment section of what it links.
      - name: mold linked the test binaries
        if: runner.os == 'Linux'
        run: |
          bin=$(find "${CARGO_TARGET_DIR:-target}/debug/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.so' | head -1)
          test -n "$bin" || { echo "::error::no test binary in target/debug/deps"; exit 1; }
          readelf -p .comment "$bin" | grep -q mold || { echo "::error::$bin was not linked by mold"; exit 1; }
          echo "mold linked $bin"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/sheet -> target
          prefix-key: v0-rust-sheet
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_126/bin" >> "$GITHUB_PATH"
      - name: build + budget gate (100 MB app-wide)
        run: bash scripts/build-wasm.sh
