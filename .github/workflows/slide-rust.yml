name: slide / rust
# MONOREPO (step A3): ported from paged-media/plugin-slide
# .github/workflows/rust.yml; runs in modules/slide.
on:
  push:
    branches: [main]
    paths:
      - "modules/slide/**"
      - ".github/workflows/slide-rust.yml"
  pull_request:
    paths:
      - "modules/slide/**"
      - ".github/workflows/slide-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slide-rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modules/slide

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/slide -> target
          prefix-key: v0-rust-slide
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: vendored paged-ooxml has not drifted (ADR 701)
        run: bash scripts/sync-ooxml.sh --check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: modules/slide/Cargo.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/slide -> target
          prefix-key: v0-rust-slide
      - uses: taiki-e/install-action@nextest
      # Red results must still upload (the cockpit wants the failure), so the
      # run does not abort here; the last step fails the job.
      - name: nextest (junit; red results still upload)
        run: |
          set -uo pipefail
          cargo nextest run --workspace --profile ci \
            || echo "RUST_FAILED=1" >> "$GITHUB_ENV"
          test -s target/nextest/ci/junit.xml
      - name: upload nextest JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: modules/slide/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: tests failed
        if: ${{ env.RUST_FAILED == '1' }}
        run: exit 1
      # A silent fallback to the default linker fails here: mold stamps
      # the .comment section of what it links.
      - name: mold linked the test binaries
        if: runner.os == 'Linux'
        run: |
          bin=$(find "${CARGO_TARGET_DIR:-target}/debug/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.so' | head -1)
          test -n "$bin" || { echo "::error::no test binary in target/debug/deps"; exit 1; }
          readelf -p .comment "$bin" | grep -q mold || { echo "::error::$bin was not linked by mold"; exit 1; }
          echo "mold linked $bin"
