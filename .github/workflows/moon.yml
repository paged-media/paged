name: moon / ci
concurrency:
  # A newer push to a pull request cancels the older run. Every other run
  # (main, dispatch) has a group of its own: never cancelled, never queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `moon ci` over the projects a pull request affects (see .moon/ and
# docs/adr/PM-0006-proto-moon-mcp.md).
#
# NON-BLOCKING for now: it runs beside the per-component workflows, which
# stay the required checks, so its result and timings can be compared with
# theirs before CI switches over. The engine's wasm packages come from
# .github/actions/engine-wasm (a cache restore, or a build on a miss). What it
# does not run yet: the modules' wasm builds (`runInCI: skip`), so JS suites
# that use a module's built engine skip those specs here; Playwright; the GPU,
# fidelity and corpus lanes. No remote
# cache and no Rust cache: every run builds from scratch.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  moon-ci:
    name: moon ci (affected projects)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # `moon ci` diffs the pull request against its base branch.
          fetch-depth: 0

      # The engine's debug test binaries outgrow the hosted runner's free
      # disk (as in core-ci).
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # proto, then every tool in /.prototools (moon, bun, node) at the
      # pinned versions; Moon installs the root Bun workspace (bun.lock)
      # once, before the first JS task. Rust comes from rustup and each
      # workspace's rust-toolchain.toml.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"

      # The engine's wasm packages (workspace:*): the JS projects' typechecks
      # and tests build against canvas-wasm and introspect-wasm. The module
      # wasm builds stay out (`runInCI: skip`).
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
        with: { artifact: "false" }

      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: moon ci
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: moon ci --base "origin/$BASE_REF" --head HEAD --summary normal

      # The report (per-action timings) is the measurement the CI-speed step
      # compares against the per-component workflows.
      - name: upload moon ci report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: moon-ci-report
          path: .moon/cache/ciReport.json
          if-no-files-found: warn
          retention-days: 30
