name: sheet / vitest
concurrency:
  # A newer push to a pull request cancels the older run. Every other run
  # (main, dispatch) has a group of its own: never cancelled, never queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MONOREPO (step A3): ported from paged-media/plugin-sheets
# .github/workflows/vitest.yml. The old lane checked the repo out under
# plugin-sheets/ beside a paged-media/sdk checkout and ran from their parent.
# Nothing read the sdk sibling any more (the bundle takes the published
# contract), so that checkout is gone; the lane runs in modules/sheet and
# `plugin-sheets/<x>` / `--dir plugin-sheets` became cwd-relative.
on:
  push:
    branches: [main]
    paths:
      - "modules/sheet/**"
      - ".github/workflows/sheet-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/sheet/docs/**/*.md"
  # Pre-merge gate: a PR that breaks the bundle goes red BEFORE it lands
  # (this lane used to run on push to main only).
  pull_request:
    paths:
      - "modules/sheet/**"
      - ".github/workflows/sheet-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/sheet/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/sheet

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # ------------------------------------------------------------------
      # REAL-ENGINE artifact (audit P3). This lane used to run vitest with
      # no wasm artifact, so sheet-bundle's engine-real.spec.ts skipIf gate
      # skipped the real boot on EVERY CI — the rust lane builds the
      # artifact but never runs vitest. Build it here (the exact recipe of
      # rust.yml's `wasm` job: pinned toolchain, Cargo.lock-pinned
      # wasm-bindgen-cli, pinned binaryen) so the real boot actually runs;
      # REQUIRE_REAL_ENGINE=1 below makes a missing artifact FAIL, not skip.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/sheet -> target
          prefix-key: v0-rust-sheet
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_126/bin" >> "$GITHUB_PATH"
      - name: build the engine wasm artifact (100 MB app wasm budget gate)
        run: bash scripts/build-wasm.sh
      # Fail-not-skip belt at the JOB level too: a missing artifact reddens
      # the job HERE, before any spec can skip.
      - name: real-engine artifact guard (fail, never skip)
        run: test -f packages/sheet-bundle/bin/sheet_js_bg.wasm
      # ------------------------------------------------------------------
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: contract-import lint (fail fast)
        run: node scripts/check-contract-imports.mjs
      # A red spec FAILS this job. It used to end in `|| true` (so red
      # results would still be published as evidence), which also meant the
      # TS lane could never go red: a failing spec merged green. Evidence
      # still ships — the JUnit steps below run under `!cancelled()`.
      - name: vitest (junit per package)
        env:
          # The spec-level half of the dual gate (engine-real.spec.ts,
          # wasm-fresh.spec.ts, session-persist.spec.ts): under this env a
          # missing artifact FAILS the suite instead of letting the skipIf
          # gate silently pass a vacuous run.
          REQUIRE_REAL_ENGINE: "1"
        run: |
          bun run --filter './packages/*' test \
            --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: collect junit
        if: ${{ !cancelled() }}
        run: |
          cat packages/*/junit.xml > junit-all.xml
          [ -s junit-all.xml ]
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-sheets,
      # suite=vitest, format=nextest-junit).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/sheet/junit-all.xml
          if-no-files-found: error
          retention-days: 14
