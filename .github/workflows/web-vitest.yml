# The TS lane: web-model + web-bundle bun test against the REAL engine wasm,
# built here from the checkout. A red spec fails the job; the JUnit results
# are still uploaded (under `!cancelled()`) for the private evidence pull.
#
# One checkout: the bundle resolves @paged-media/plugin-api / plugin-sdk
# through the workspace, so no sibling repository is needed.
name: web / bun test
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  # A re-dispatch on the same wip/* branch cancels its older dispatched run,
  # running or not: only a work branch's newest commit needs checking.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/wip/')) }}

# MONOREPO (step A3): ported from paged-media/plugin-web
# .github/workflows/vitest.yml; runs in modules/web.
on:
  push:
    branches: [main]
    paths:
      - "modules/web/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The internal shared code the bundle uses (workspace:*).
      - "platform/shared/wasm-boot/**"
      - "platform/shared/helpers/**"
      - "platform/shared/panel-kit/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      # The shared formatting crate (engine/core/crates/paged-fmt), compiled into the engine.
      - "engine/core/crates/paged-fmt/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      # The shared module wasm build every scripts/build-wasm.sh calls.
      - "tooling/rust/**"
      # The source hash the wasm is stamped with and its wasm-fresh spec checks.
      - "tooling/js/source-hash.mjs"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/web-vitest.yml"
      # The tool versions (Bun, Node, moon) every job installs.
      - ".prototools"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/web/docs/**/*.md"
  # Pre-merge gate: a PR that breaks the bundle goes red BEFORE it lands.
  pull_request:
    paths:
      - "modules/web/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      # The extension contract the bundle builds against (workspace:*).
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      # The internal shared code the bundle uses (workspace:*).
      - "platform/shared/wasm-boot/**"
      - "platform/shared/helpers/**"
      - "platform/shared/panel-kit/**"
      # The engine wasm packages this workflow builds against (workspace:*),
      # and what builds them, so an engine change re-tests its consumers.
      - "engine/core/crates/**"
      # The shared formatting crate (engine/core/crates/paged-fmt), compiled into the engine.
      - "engine/core/crates/paged-fmt/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      # The shared module wasm build every scripts/build-wasm.sh calls.
      - "tooling/rust/**"
      # The source hash the wasm is stamped with and its wasm-fresh spec checks.
      - "tooling/js/source-hash.mjs"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/web-vitest.yml"
      # The tool versions (Bun, Node, moon) every job installs.
      - ".prototools"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/web/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  # .github/actions/engine-wasm asks for the `engine / wasm` run of the commit
  # (it waits for that build instead of building the engine a second time).
  actions: read

defaults:
  run:
    working-directory: modules/web

jobs:
  vitest:
    name: bun test
    runs-on: ubuntu-latest
    # A bound on a hang (the default is six hours); generous for a cold cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # ------------------------------------------------------------------
      # REAL-ENGINE artifact: the Blitz engine wasm the specs boot, built
      # from THIS checkout (wasm-fresh.spec.ts proves it). Pinned toolchain,
      # wasm-bindgen-cli matched to the crate's Cargo.lock (build-wasm.sh
      # refuses a mismatch), pinned binaryen (old apt binaryen breaks
      # wasm-bindgen externref table grow).
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-28
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: modules/web/packages/web-render -> target
          prefix-key: v0-rust-web
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-bindgen-cli and binaryen at the pins in tooling/bootstrap.sh
      # (prebuilt; the build script checks the CLI against Cargo.lock).
      - uses: ./.github/actions/wasm-tools
      - name: build the Blitz ENGINE wasm artifact (manifest maxBytes budget gate; stamps bin/SOURCE_HASH)
        run: bash scripts/build-wasm.sh --engine
      # ------------------------------------------------------------------
      # The engine's wasm packages (canvas-wasm and the rest, workspace:*),
      # which the real-engine specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      # The bundle, the model and the conformance package with their tests
      # (no job typechecked them on push until 2026-11-28).
      - name: typecheck
        run: bun run --filter './packages/*' typecheck
      # A red spec FAILS this job. It used to end in `|| true` (so red
      # results would still be published as evidence), which also meant the
      # lane could never go red. Evidence still ships — the JUnit steps below
      # run under `!cancelled()`.
      - name: bun test (junit per package)
        env:
          # Under this env a missing engine artifact FAILS the real-engine
          # suites (engine, conformance, wasm-fresh) instead of skipping.
          REQUIRE_REAL_ENGINE: "1"
        run: |
          bun run --filter './packages/*' test \
            --reporter=junit --reporter-outfile=junit.bun.xml
      # web-bundle's DOM task (happy-dom preloaded): the *.dom.test.tsx panel specs.
      - name: bun test (panels in happy-dom)
        working-directory: modules/web/packages/web-bundle
        env:
          REQUIRE_REAL_ENGINE: "1"
        run: bun run test:dom --reporter=junit --reporter-outfile=junit-dom.bun.xml
      # bun's reports, rewritten into the vitest shape the evidence has always
      # had (tooling/js/bun-junit.mjs): the artifact keeps its name and test ids.
      - name: collect junit
        if: ${{ !cancelled() }}
        run: |
          bun ../../tooling/js/bun-junit.mjs --out junit-all.xml packages/*/junit.bun.xml packages/web-bundle/junit-dom.bun.xml
          [ -s junit-all.xml ]
      # Evidence hand-off: upload the results as an artifact for the private
      # evidence repository to PULL (a public workflow cannot call a private
      # repository's action).
      - name: upload JUnit results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-junit
          path: modules/web/junit-all.xml
          if-no-files-found: error
          retention-days: 14
