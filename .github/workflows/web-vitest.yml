# The TS lane: web-model + web-bundle vitest against the REAL engine wasm,
# built here from the checkout. A red spec fails the job; the JUnit results
# are still uploaded (under `!cancelled()`) for the private evidence pull.
#
# One checkout: the bundle resolves @paged-media/plugin-api / plugin-sdk
# from npm (exact devDependency pins, asserted by test/sdk-pin.spec.ts), so
# no sibling repository is needed.
name: web / vitest
concurrency:
  # A newer push to a pull request cancels the older run. Every other run
  # (main, dispatch) has a group of its own: never cancelled, never queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MONOREPO (step A3): ported from paged-media/plugin-web
# .github/workflows/vitest.yml; runs in modules/web.
on:
  push:
    branches: [main]
    paths:
      - "modules/web/**"
      - ".github/workflows/web-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/web/docs/**/*.md"
  # Pre-merge gate: a PR that breaks the bundle goes red BEFORE it lands.
  pull_request:
    paths:
      - "modules/web/**"
      - ".github/workflows/web-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/web/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: modules/web

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # ------------------------------------------------------------------
      # REAL-ENGINE artifact: the Blitz engine wasm the specs boot, built
      # from THIS checkout (wasm-fresh.spec.ts proves it). Pinned toolchain,
      # wasm-bindgen-cli matched to the crate's Cargo.lock (build-wasm.sh
      # refuses a mismatch), pinned binaryen (old apt binaryen breaks
      # wasm-bindgen externref table grow).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/web/packages/web-render -> target
          prefix-key: v0-rust-web
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install pinned wasm-bindgen-cli (web-render Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' packages/web-render/Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_126/bin" >> "$GITHUB_PATH"
      - name: build the Blitz ENGINE wasm artifact (manifest maxBytes budget gate; stamps bin/SOURCE_HASH)
        run: bash scripts/build-wasm.sh --engine
      # ------------------------------------------------------------------
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: contract-import lint (fail fast)
        run: node scripts/check-contract-imports.mjs
      # A red spec FAILS this job. It used to end in `|| true` (so red
      # results would still be published as evidence), which also meant the
      # lane could never go red. Evidence still ships — the JUnit steps below
      # run under `!cancelled()`.
      - name: vitest (junit per package)
        env:
          # Under this env a missing engine artifact FAILS the real-engine
          # suites (engine, conformance, wasm-fresh) instead of skipping.
          REQUIRE_REAL_ENGINE: "1"
        run: |
          bun run --filter './packages/*' test \
            --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: collect junit
        if: ${{ !cancelled() }}
        run: |
          cat packages/*/junit.xml > junit-all.xml
          [ -s junit-all.xml ]
      # Evidence hand-off: upload the results as an artifact for the private
      # evidence repository to PULL (a public workflow cannot call a private
      # repository's action).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/web/junit-all.xml
          if-no-files-found: error
          retention-days: 14
