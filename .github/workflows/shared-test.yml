# The internal shared TypeScript packages of the built-ins
# (platform/shared/*, docs/adr/PM-0002) that need no engine: their typecheck
# and their own tests. Each consumer's workflow lists the shared packages it
# uses in its paths, so a change here also re-tests the modules. The test kit
# (platform/shared/test-kit) boots the engine and rides
# extensions-vitest.yml.
#
# wasm-boot's own suite also scans every module's sources for a wasm boot
# outside its single flight, so a module source change runs it too.
name: shared / bun test
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - "platform/shared/wasm-boot/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      - "modules/*/packages/*/src/**"
      - "modules/image/glue/src/**"
      - ".github/workflows/shared-test.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "tooling/js/bun-test-setup.ts"
  pull_request:
    paths:
      - "platform/shared/wasm-boot/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      - "modules/*/packages/*/src/**"
      - "modules/image/glue/src/**"
      - ".github/workflows/shared-test.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "tooling/js/bun-test-setup.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: typecheck + bun test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: bun install (root workspace)
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run --filter './platform/shared/wasm-boot' typecheck
      - name: bun test
        run: bun run --filter './platform/shared/wasm-boot' test
