name: editor / tests
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Editor Playwright surface → state-matrix evidence (W0.5).
#
# Workspace model: the editor depends on the engine's wasm packages
# (engine/core/packages/*), every module bundle, the extension contract and
# ai through `workspace:*`, and consumes them from this checkout. Their build
# outputs are gitignored, so the jobs build them first:
# .github/actions/engine-wasm fills the engine's packages and
# .github/actions/module-wasm the bundles' engine wasm (doc, slide, sheet,
# data, web, draw, image and publish's pdf mapper; pdf's pdfium is a
# committed third-party prebuilt). Both
# restore from actions/cache when their sources are unchanged. The vite dev
# server (spawned by playwright.config's `webServer`) sets the COOP/COEP
# headers SharedArrayBuffer needs; that middleware runs in the server
# process and works headless, so the chromium runner gets a
# cross-origin-isolated context with no extra flags.
#
# Scope: the behaviour surface (panels + gesture + e2e op-sandwiches),
# NOT the Envato fidelity gate. That gate needs the 4.4 GB
# `corpus/idml` LFS packs, their InDesign reference PDFs, poppler's
# `pdftoppm`, and the `paged-diff` Rust binary built from a `core`
# checkout — none of which the package-boundary runner carries. It stays
# a local / core-CI concern: the per-pack sweep is the root
# tests/fidelity project, which no CI step selects, and `PAGED_CI_LEAN=1`
# drops `extensive-corpus.spec.ts` from collection (it reads the envato
# manifest at import time). The lean surface (~412 tests) still needs the
# small license-clear `corpus/idml/generated` fixtures + `corpus/fonts`, which
# the harness loads — those come from a sparse LFS checkout of the
# private `paged-media/corpus` repo (≈25 MB, not the 4.4 GB envato tier).
#
# Sharding: playwright.config pins workers:1 (snapshot determinism), so
# the surface is split across 4 shards (3 until 2026-10-20, when a loaded
# runner put shard 1 past the 55-minute global timeout with every test green)
# via `--shard`, each emitting a `blob` report. A final job merges the
# blobs into one Playwright JSON and uploads it as the `playwright-results`
# artifact. The private `paged-media/state` repo PULLS that artifact
# (siblings-pull.yml), converts it to contract-v1, applies
# `ingest/test-map.yaml` plus the journeys' inline `@feat:` tags, and
# gates feature ids against the registry. See the step comment at the
# hand-off for why the direction is inverted.
#
# MONOREPO (step A3): ported from paged-media/editor .github/workflows/
# tests.yml. The repository is checked out at the workspace root, so the
# editor is apps/editor (the default working directory below); core's
# paged-gen and the doc/slide link targets are in-tree (engine/core,
# modules/doc, modules/slide) instead of sibling checkouts. The path filters
# therefore also name the in-tree inputs the jobs build from: modules/doc and
# modules/slide (the two composite actions build them for the link
# overrides) and engine/core/crates/paged-gen (the fixture generator).

on:
  push:
    # `feat/plugin-panel-surfaces` was added here 2026-08-18, when main
    # was frozen and development lived on that branch, so main-only push
    # triggers meant no fresh playwright-results ever reached the state
    # matrix. The instruction left with it was "remove the extra branch
    # here (and there) when the branch merges".
    #
    # It merged into main on 2026-08-23 (d93be6e) and last ran
    # 2026-08-22. Removed 2026-09-09, with the `branch` override in
    # state's ingest/artifacts.yaml that paired with it — where the same
    # stale pin had become the thing starving the lane it was added to
    # feed, because the puller kept looking at a branch nothing pushed to.
    branches: [main]
    paths:
      - "apps/editor/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      # Everything the editor consumes through the workspace: every module
      # bundle (and the Rust it builds its wasm from), the extension
      # contract and ai, and the engine's wasm packages with what builds
      # them (paged-gen, the fixture generator, is under crates/ too).
      - "modules/**"
      - "platform/extensions/packages/**"
      # The internal test kit (the tools' gesture DSL, the headless editor).
      - "platform/shared/**"
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      # The shared module wasm build every scripts/build-wasm.sh calls.
      - "tooling/rust/**"
      - "tooling/bootstrap.sh"
      - "tooling/js/check-workspace-deps.mjs"
      - "tooling/js/react-compiler.mjs"
      - "tooling/js/bun-react-compiler.ts"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/module-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/editor-tests.yml"
      - "tests/integration/**"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!apps/editor/docs/**/*.md"
      # Module prose (B3a made every module an editor input).
      - "!modules/*/docs/**/*.md"
  pull_request:
    paths:
      - "apps/editor/apps/canvas/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      - "apps/editor/packages/**"
      - "apps/editor/package.json"
      - "apps/editor/scripts/**"
      # Everything the editor consumes through the workspace: every module
      # bundle (and the Rust it builds its wasm from), the extension
      # contract and ai, and the engine's wasm packages with what builds
      # them (paged-gen, the fixture generator, is under crates/ too).
      - "modules/**"
      - "platform/extensions/packages/**"
      # The internal test kit (the tools' gesture DSL, the headless editor).
      - "platform/shared/**"
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      # The shared module wasm build every scripts/build-wasm.sh calls.
      - "tooling/rust/**"
      - "tooling/bootstrap.sh"
      - "tooling/js/check-workspace-deps.mjs"
      - "tooling/js/react-compiler.mjs"
      - "tooling/js/bun-react-compiler.ts"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/module-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/workflows/editor-tests.yml"
      - "tests/integration/**"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Module prose (B3a made every module an editor input).
      - "!modules/*/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/editor

env:
  SHARDS: 4

jobs:
  # Static guards that need only the editor repo itself — no plugin
  # siblings, no corpus/core checkout, no browser. These scripts all
  # EXISTED but ran in no CI job (audit 02 E8'): the boot-time
  # cross-origin-isolation check (the COOP/COEP contract SharedArrayBuffer
  # needs) and the fidelity-thresholds JSON schema guard (every gated pack
  # has an entry, so the gate can't silently skip). They're fast (seconds)
  # and depend only on the root devDependencies, so a plain editor checkout
  # + root frozen install is the whole setup. The import boundaries that
  # were linted here are lint rules for the whole repository now, run by
  # lint.yml.
  checks:
    name: checks (boot-coi + thresholds + guards)
    runs-on: ubuntu-latest
    # Seconds of checks; a cold engine or module wasm build (a cache miss)
    # takes the rest.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # Nothing first-party resolves from npm: every manifest names the
      # workspace packages with `workspace:`, and bun.lock resolves them to
      # the workspace.
      - name: first-party packages come from the workspace
        working-directory: .
        run: bun tooling/js/check-workspace-deps.mjs

      # The engine's wasm packages and the bundles' engine wasm: the
      # typecheck reads canvas-wasm's .d.ts, and the wasm budget and the
      # module door measure the wasm the app ships.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
      - name: module wasm (doc)
        uses: ./.github/actions/module-wasm
        with: { module: doc }
      - name: module wasm (slide)
        uses: ./.github/actions/module-wasm
        with: { module: slide }
      - name: module wasm (sheet)
        uses: ./.github/actions/module-wasm
        with: { module: sheet }
      - name: module wasm (data)
        uses: ./.github/actions/module-wasm
        with: { module: data }
      - name: module wasm (web)
        uses: ./.github/actions/module-wasm
        with: { module: web }
      - name: module wasm (draw)
        uses: ./.github/actions/module-wasm
        with: { module: draw }
      - name: module wasm (image)
        uses: ./.github/actions/module-wasm
        with: { module: image }
      - name: module wasm (publish)
        uses: ./.github/actions/module-wasm
        with: { module: publish }

      # The editor's typecheck. It ran only in the Playwright job, after the
      # private corpus checkout, which a missing repository secret stops;
      # here it gates every run. The packages/* have no build step (they
      # are consumed as workspace TS source).
      - name: typecheck canvas app
        run: bun run --filter ./apps/canvas typecheck

      # The TEST TREE, which was outside every static gate until
      # 2026-08-24. `apps/canvas/tsconfig.json` includes only `src` and
      # `vite.config.ts`, so several hundred Playwright specs compiled
      # nowhere and the first thing able to notice a broken one was the
      # runner. That cost a red main: a CLEAN auto-merge (no conflict on
      # either side) deleted a `const after = …` in one commit while
      # another added a line that read it, and typecheck + build both
      # passed on code that could not run.
      - name: typecheck canvas tests
        run: bun run --filter ./apps/canvas typecheck:tests

      # @paged-media/editor (docs/adr/PM-0013): its public types against the
      # embedding API's sources, the package build, and check-dist (no
      # private package left, no engine copy, every named file present, the
      # size budget). What the release publishes, checked on every change.
      - name: "@paged-media/editor — typecheck, build, check-dist"
        run: |
          set -euo pipefail
          bun run --filter ./packages/editor typecheck
          bun run --filter ./packages/editor build

      # The COOP/COEP boot contract SharedArrayBuffer needs (pairs with
      # apps/canvas/public/_headers).
      - name: boot cross-origin-isolation check
        run: bun run test:boot-coi

      # The D-03 network wall (ADR 218): exact build-time data origins only,
      # and the committed _headers floor in lock-step with the module.
      - name: network policy (connect-src)
        run: bun run test:network-policy

      # Trusted Types (ADR 240): the policy header the dev server and the
      # committed _headers send, and the default policy's script-URL rule.
      - name: trusted types policy
        run: bun run test:trusted-types

      # The module door (ADR 223): what the editor answers host.modules, and
      # the build-time module manifest it answers from.
      - name: module door (module manifest)
        run: bun run test:modules

      # Selection chrome on the pasteboard: where a page sits in its spread,
      # from the page summaries (engine 0.71.13) or the older fallback.
      - name: pasteboard placement (spread pages)
        run: bun run test:spread-pages

      # Where the bun test lanes below write their JUnit (bun does not
      # create the directory); collected at the end of the job.
      - name: JUnit report directory
        run: mkdir -p "$RUNNER_TEMP/editor-junit/compiled"

      # The local library (ADR 225) against the repository wasm of this
      # revision: import, versions, restore, history in and out. Its
      # server tests (remote.test.ts) skip without PAGED_SERVER_URL.
      - name: local library (packages/repository)
        run: bun run test:repository --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/repository.bun.xml"

      # The built-in tools' gesture handlers, driven through the gesture
      # DSL against the test kit's recording fake editor (no engine, no
      # browser): previews, modifier semantics, the exact mutation, the
      # one-gesture-one-commit and cancel invariants.
      - name: tool gesture handlers (packages/tools)
        run: bun run test:tools --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/tools.bun.xml"

      # The shell's registries, stores and settings (packages/shell) and
      # the canvas app's built-in command handlers (apps/canvas/test/unit):
      # the command layer, against the test kit's fake editor.
      - name: shell registries and stores (packages/shell)
        run: bun run test:shell --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/shell.bun.xml"
      - name: shell stores and settings, DOM lane (packages/shell)
        run: bun run test:shell-dom --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/shell-dom.bun.xml"
      - name: built-in command handlers (apps/canvas unit)
        run: bun run test:canvas-unit --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/canvas-unit.bun.xml"

      # The canvas app's DOM lane (every *.dom.test.tsx under apps/canvas):
      # each built-in panel rendered in happy-dom over the real engine wasm
      # (docs/reference/testing-panels.md), its states, the exact mutation
      # each control sends, and the basics of keyboard and name reach.
      - name: panels and components, DOM lane (apps/canvas)
        run: bun run test:dom --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/canvas-dom.bun.xml"

      # The same two DOM lanes on COMPILED code (ADR 229): the shell's and
      # the canvas's sources through the React Compiler, with the build's
      # own options (tooling/js/bun-react-compiler.ts). `bun test` above runs
      # the sources as written; the app ships them compiled, and a component
      # that reads a registry, a store or a module variable during render
      # behaves differently once compiled. This is where that shows.
      - name: react-live (platform/shared/react-live, the views of mutable sources)
        working-directory: platform/shared/react-live
        run: bun run test
      - name: shell DOM lane, compiled (React Compiler)
        run: bun run --filter ./packages/shell test:dom:compiled --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/compiled/shell-dom.bun.xml"
      - name: panels and components, DOM lane, compiled (React Compiler)
        run: bun run --filter ./apps/canvas test:dom:compiled --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/compiled/canvas-dom.bun.xml"

      # The production build, with the React Compiler (ADR 229). Its check
      # (tooling/js/react-compiler.mjs) fails the build unless every module
      # the compiler memoized imports react/compiler-runtime, there is one
      # copy of it, and every chunk with compiled code reaches it; the
      # report says how many components and hooks were compiled and skipped.
      - name: production build (compiled chunks import react/compiler-runtime)
        working-directory: apps/editor/apps/canvas
        env:
          PAGED_REACT_COMPILER_REPORT: ${{ runner.temp }}/react-compiler-build.json
        run: bunx --bun vite build
      - name: upload the React Compiler build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-compiler-build
          path: ${{ runner.temp }}/react-compiler-build.json
          if-no-files-found: warn
          retention-days: 30

      # Every gated fidelity pack must carry a threshold entry, or the
      # fidelity gate silently skips it.
      - name: fidelity thresholds schema
        run: bun run test:thresholds

      # The app-wide wasm budget: 120 MB for the editor AND every plugin
      # together (2026-08-19). Every other wasm ceiling in the platform is
      # per-artifact or per-bundle, so until now nothing measured the sum —
      # eight bundles could each pass their own gate and the app could still
      # ship a quarter of a gigabyte. This job is the only place that sees
      # the whole assembled app, so this is where the sum is checked.
      - name: app-wide wasm budget (120 MB, editor + all plugins)
        # `--json-out` writes the measurement artifact as a SIDE EFFECT and
        # still exits on the budget. Deliberately not `--json | tee`: a pipe
        # replaces this step's exit code with tee's, which would turn the
        # budget gate into a gate that always passes.
        run: bun run test:wasm-budget --json-out "$RUNNER_TEMP/paged-measurements-wasm.json"

      # The number, kept. The gate above answers "are we under 120 MB today";
      # only a series answers "which way is it moving, and how fast". Uploaded
      # `if: always()` because a FAILING run's number is precisely the one
      # worth having in the trend.
      - name: upload wasm measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paged-measurements-wasm
          path: ${{ runner.temp }}/paged-measurements-wasm.json
          if-no-files-found: warn
          retention-days: 90
      # The surface-conformance gate runs in its own job (`surface`, below):
      # it is static and needs none of the wasm this job builds.
      # The two-way manifest check (ADR 226), the BundleHost contract and the
      # nine built-ins in the headless editor are the repository's root tests
      # (tests/contracts, tests/system): the `tests` workflow runs them.
      # The headless editor (apps/canvas/tests/headless): the shell, the
      # client and the real engine under bun test, no browser. Commands,
      # editor.* automation, Boa scripts and plugin hosts asserted against
      # the canonical model dump, and the cross-surface parity suite.
      - name: headless editor
        run: bun run test:headless --reporter=junit --reporter-outfile="$RUNNER_TEMP/editor-junit/headless.bun.xml"
      # A seam may not outlive the gap it names: a capability lands and
      # the UI still says it is missing, which is the same lie as
      # claiming an unbuilt feature works, only harder to notice.
      - name: seam guard
        run: bun run test:seam-guard
      # One vocabulary for "this doesn't apply here". The four rules that
      # existed were four independent reasonable decisions, which is why
      # no review caught them — there was nothing for them to disagree with.
      - name: applicability vocabulary
        run: bun run test:applicability
      # Editor profile presets (solo is one) are ALLOW-lists, which is the
      # right direction (a deny-list leaks every new host panel into every
      # preset) and buys
      # the opposite failure: a panel renamed host-side silently DROPS
      # OUT and the app just boots one panel poorer. This resolves every
      # id against the code that registers it. Written after a first
      # draft named a draw "layers" panel that has never existed.
      - name: profile presets resolve
        run: bun run test:profile-presets
      # A `@feat:` tag that matches no registry row covers NOTHING, and
      # says so nowhere: the join files it as drift in another repo and
      # the spec still passes. Twenty ids in this tree were in that state
      # on 2026-09-09, fourteen of them in the plugin-surface tier — the
      # one tier that asserts capability x surface reachability. The
      # vocabulary is vendored (scripts/feat-vocabulary.json) rather than
      # read across the repo boundary, because both repos are private and
      # a token-gated read degrades to a skip. state's
      # `sync-feat-vocabulary.mjs --check` keeps the copy current.
      - name: feature-id vocabulary (@feat tags resolve)
        run: bun run test:feat-vocabulary
      # A flaky test is quarantined, not retried until it passes (ADR 228):
      # apps/canvas/tests/quarantine.json names it with an owner, a reason
      # and an expiry, and the spec carries `{ tag: "@quarantine" }`. This
      # fails an entry past its expiry, and a list that disagrees with the
      # tags in either direction (the Playwright listing reads the specs).
      - name: quarantine (owner, expiry, list = tags)
        run: bun run test:quarantine
      # `packages/client` is the programmable SDK — the write surface the
      # read-only viewer SDK deliberately is not. Its api-catalog.json is
      # GENERATED from the source, so this step is two assertions at once:
      # the artifact is current, and no public member ships without a doc
      # comment to generate a summary from.
      - name: client SDK catalog is current
        run: bun run test:client-catalog
      # The feature ids a host's profile may switch (ADR 275) are a
      # contract once hosts use them; the inventory is generated and must
      # be current.
      - name: feature-id inventory is current
        run: bun run test:feature-ids
      # The editor mounts as an instance (plan task E1): no new module-level
      # mutable state in the app or the shell, and what stays says why.
      - name: no new module-level editor state
        run: bun run test:instance-guard
      # The theme tokens a host may set (handle.setTheme) are a contract
      # too; the table is generated from theme.css and must be current.
      - name: theme-token contract is current
        run: bun run test:theme-tokens

      # The bun test lanes above as evidence: bun's reports, rewritten into
      # the vitest shape (tooling/js/bun-junit.mjs) with each spec path made
      # repository-relative (--prefix), since the lanes span five packages.
      # The compiled DOM lanes run the same specs as the plain ones, so they
      # are a second artifact rather than duplicate test ids in the first.
      # Uploaded from a red run too: a failing lane's report is the one that
      # names what failed.
      - name: collect the bun test JUnit
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          set -uo pipefail
          in="$RUNNER_TEMP/editor-junit"
          out="$RUNNER_TEMP/editor-junit-out"
          mkdir -p "$out/plain" "$out/compiled"
          convert() { # <report, without .bun.xml> <package dir> <out dir>
            [ -s "$in/$1.bun.xml" ] || { echo "no report: $1"; return 0; }
            bun tooling/js/bun-junit.mjs --prefix "$2" --out "$3/$(basename "$1").xml" "$in/$1.bun.xml"
          }
          convert repository apps/editor/packages/repository "$out/plain"
          convert tools apps/editor/packages/tools "$out/plain"
          convert shell apps/editor/packages/shell "$out/plain"
          convert shell-dom apps/editor/packages/shell "$out/plain"
          convert canvas-unit apps/editor/apps/canvas "$out/plain"
          convert canvas-dom apps/editor/apps/canvas "$out/plain"
          convert headless apps/editor/apps/canvas "$out/plain"
          convert compiled/shell-dom apps/editor/packages/shell "$out/compiled"
          convert compiled/canvas-dom apps/editor/apps/canvas "$out/compiled"
      - name: upload the bun test JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: editor-checks-junit
          path: ${{ runner.temp }}/editor-junit-out/plain/*.xml
          if-no-files-found: error
          retention-days: 14
      - name: upload the compiled DOM lanes' JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: editor-checks-compiled-junit
          path: ${{ runner.temp }}/editor-junit-out/compiled/*.xml
          if-no-files-found: error
          retention-days: 14

  # THE SURFACE-CONFORMANCE GATE (apps/editor/docs/reference/
  # surface-conformance.md): every command, panel, tool, menu item,
  # keybinding, setting, CLI command and script function is asserted by a
  # test under covers() in the layers its kind requires, or acknowledged
  # with a reason; a ratchet both ways. Static (no wasm, no browser, no
  # secrets), so it runs on its own and answers in a minute.
  surface:
    name: surface conformance (covers() ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: the gate's own tests (readers, layers, evaluator)
        run: bun test ./scripts/surface-coverage.test.mjs
      # `--json-out` / `--md-out` write the report as a side effect and the
      # exit code is still the gate's (no pipe).
      - name: surface conformance
        run: >-
          bun scripts/surface-coverage.mjs --quiet --summary
          --json-out "$RUNNER_TEMP/surface-conformance.json"
          --md-out "$RUNNER_TEMP/surface-conformance.md"
      - name: upload the surface-conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-conformance
          path: |
            ${{ runner.temp }}/surface-conformance.json
            ${{ runner.temp }}/surface-conformance.md
          if-no-files-found: warn
          retention-days: 90

  playwright:
    name: playwright (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 50, not 30: the COLD (uncached) paged-gen fixture-generator build
    # consumed most of a 30-min budget, leaving no room for the sharded
    # tests. After run 1 `core/target` is cached and the job drops back to
    # ~20-25 min; the headroom only matters on a cold cache.
    #
    # Then 75, not 50: that budget was never actually exercised — the job
    # had never once reached its tests (see the chromium note below), so
    # "~20-25 min" described a job that spent its life in `apt`. A second
    # cold rust build (the paged.doc engine wasm) now shares it too. The
    # long steps carry their OWN bounds — chromium install 10 min, doc
    # wasm 25 min — so a hang still reports as a hang at the step that
    # hung, and this number only buys the tests room to finish. Re-measure
    # and bring it back down once a green run says what the suite costs.
    # Measured 2026-10-11: shard 1 (lean surface + GPU journeys + baseline
    # seeding) runs 77-80 min with every step green, and the 75 cut it
    # off in its last uploads. 90 gives it room.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The whole repository at the workspace root: the editor is
      # apps/editor, core's paged-gen is engine/core, and the doc/slide link
      # targets are modules/doc + modules/slide — no sibling checkouts.
      - name: checkout repository
        uses: actions/checkout@v4

      # License-clear fixtures the harness loads (corpus/idml/generated/*.idml
      # + corpus/fonts). Sparse + LFS so we pull ~25 MB, not the 4.4 GB
      # envato tier. The editor's vite config + tests resolve the corpus
      # colocated in the editor first (`<editor>/corpus`, then
      # `<editor>/../corpus`), so it is checked out at apps/editor/corpus.
      # That path also stays valid once the editor's default moves to
      # `<repo root>/corpus` (step A4): the colocated copy is kept as the
      # fallback there. (It is the PRIVATE corpus repo, hence the token.)
      # `STATE_DISPATCH_TOKEN` already has read scope on the
      # private paged-media siblings (used by plugin-draw for the sdk
      # checkout); fall back to github.token for same-org runs.
      #
      # `envato/overrides` is in the sparse set too: even in lean mode
      # (no fidelity/extensive-corpus specs), the canvas test driver's
      # default-font path reads `envato/overrides/_default/fonts.sh`
      # (tests/fidelity/fonts.ts → loadPackFonts fallback), so without it
      # every canvas-loading spec ENOENTs. The overrides tree is ~84 KB
      # of plain .sh/.jsx (the fonts it names all live in corpus/fonts/);
      # the heavy envato `.zip`/`.idml`/`.pdf` assets stay out of the
      # sparse set entirely, so cone-mode never even checks them out.
      #
      # LFS: smudge ON (`lfs: true`). Cone-mode sparse-checkout only
      # populates the four tiers above, so checkout's native LFS pass
      # downloads just THEIR objects (~25 MB: the generated/samples IDMLs
      # + sample PDFs + the corpus/fonts TTFs), not the 4.4 GB envato
      # tier. The earlier `lfs: false` + manual `git lfs pull --include`
      # fetched zero objects (the smudge filter was off, so the working
      # tree kept LFS *pointers* — the fixtures then parsed as "invalid
      # Zip: Could not find EOCD"). Letting checkout do the smudge against
      # the sparse tree is the reliable path.
      - name: checkout corpus fixtures (sparse + LFS)
        uses: actions/checkout@v4
        with:
          repository: paged-media/corpus
          path: apps/editor/corpus
          token: ${{ secrets.STATE_DISPATCH_TOKEN || github.token }}
          lfs: true
          # Cone entries are TOP-LEVEL directory names and a stale one
          # yields an EMPTY checkout, not an error — the "verify corpus
          # fixtures are materialized" step below is what turns that into
          # a loud failure. `vendor` is deliberately absent: it is the
          # heavy tier (1.3 GB of packs) and no test on this surface
          # reads it.
          # NESTED cone paths — verified working. Naming `idml` whole
          # would drag in idml/packs (1.3 GB of Envato packs) on every
          # shard of every push; these two subtrees are 10 MB. The
          # "verify corpus fixtures are materialized" step below is what
          # catches a stale name, because a wrong cone yields an EMPTY
          # checkout rather than an error.
          sparse-checkout: |
            idml/generated
            idml/samples
            fonts
            config
          sparse-checkout-cone-mode: true

      # The canvas Playwright surface loads ~33 per-feature IDML fixtures
      # from `corpus/idml/generated/*.idml` (61 of the lean specs reference
      # them). Those files are NOT committed to the corpus repo — its
      # `generated/.gitignore` excludes `*.idml` because they are
      # reproducible from `cargo run -p paged-gen` (core). So neither a
      # sparse nor a full corpus checkout carries them, and without a
      # provisioning step the suite fails ~170/shard with ENOENT (file
      # absent) or "invalid Zip: Could not find EOCD" (LFS-pointer parse).
      #
      # Provision them by building the `paged-gen` fixture generator from
      # the in-tree engine (engine/core) and emitting every sample into
      # corpus/idml/generated. It only generates test fixtures; the engine's
      # wasm comes from the engine-wasm step below.
      #
      # Pre-monorepo this was an UNPINNED checkout of paged-media/core's
      # default branch, with an ordering coupling (a core change had to be
      # pushed before the editor change that used it — the 2026-08-19
      # `emit-all` breakage). In the monorepo paged-gen comes from the same
      # revision as the editor, so that coupling is gone.

      - name: rust toolchain (for paged-gen)
        uses: dtolnay/rust-toolchain@stable
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      # paged-gen's build. The engine and module wasm builds have caches of
      # their own (the engine-wasm and module-wasm actions).
      - name: cache cargo + paged-gen build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            engine/core/target
          key: paged-rust-${{ runner.os }}-${{ hashFiles('engine/core/Cargo.lock') }}
          restore-keys: paged-rust-${{ runner.os }}-

      - name: generate corpus/idml/generated/*.idml from paged-gen
        working-directory: engine/core
        run: |
          cargo build --release -p paged-gen --bin paged-gen
          GEN="$GITHUB_WORKSPACE/apps/editor/corpus/idml/generated"
          mkdir -p "$GEN"
          # `emit-all`, NOT a hand-copied name list. This step used to
          # carry its own copy of paged-gen's sample names — the fourth
          # copy of that list in the project — and it had silently lost
          # `layers-z` and `paste-into`. The guard on the other copies only
          # ever caught an UNKNOWN name; a name left OUT is invisible. The
          # result: four layers-panel specs failed here with "Could not
          # find EOCD", fetching a fixture CI had never emitted, and the
          # suite had never run far enough for anyone to see it.
          ./target/release/paged-gen emit-all --out "$GEN"

      # Guard: the IDML fixtures must now be real bytes on disk, or the
      # whole canvas surface fails with opaque parse errors mid-suite.
      # Fail fast here (existence AND not-a-pointer) if provisioning
      # didn't land.
      - name: verify corpus fixtures are materialized
        working-directory: apps/editor/corpus
        run: |
          # Paths are corpus-root-relative. They said `generated/…` until
          # 2026-08-19, when assets were grouped by format under `idml/`
          # — and this guard is what caught the stale list, before 170
          # specs per shard could fail on a fixture that was simply
          # somewhere else. Keep it that way: it is the only thing
          # standing between a mis-typed sparse cone and a mystery.
          for f in idml/generated/text.idml idml/generated/text-overset.idml \
                   idml/generated/geometry.idml idml/generated/links-broken.idml \
                   idml/samples/sample.idml fonts/Inter.ttf; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — paged-gen provisioning failed"
              exit 1
            fi
            if head -c 64 "$f" | grep -q "git-lfs"; then
              echo "::error::$f is still an LFS pointer — smudge failed"
              exit 1
            fi
          done
          echo "corpus fixtures materialized OK"

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # One install for the whole root workspace (bun.lock).
      - name: install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # The engine and the bundles' engine wasm, as in `checks` (restored
      # from the cache that job, or an earlier run, saved). The Playwright
      # surface runs against the vite DEV server (playwright.config
      # `webServer: bunx --bun vite`), whose import analysis resolves the bundles'
      # relative wasm glue (sheet, web, doc, draw, image, pdf) at transform
      # time. The typecheck runs in `checks`.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
        with: { artifact: "false" }
      - name: module wasm (doc)
        uses: ./.github/actions/module-wasm
        with: { module: doc }
      - name: module wasm (slide)
        uses: ./.github/actions/module-wasm
        with: { module: slide }
      - name: module wasm (sheet)
        uses: ./.github/actions/module-wasm
        with: { module: sheet }
      - name: module wasm (data)
        uses: ./.github/actions/module-wasm
        with: { module: data }
      - name: module wasm (web)
        uses: ./.github/actions/module-wasm
        with: { module: web }
      - name: module wasm (draw)
        uses: ./.github/actions/module-wasm
        with: { module: draw }
      - name: module wasm (image)
        uses: ./.github/actions/module-wasm
        with: { module: image }
      - name: module wasm (publish)
        uses: ./.github/actions/module-wasm
        with: { module: publish }

      # NO `--with-deps`. That flag shells out to `apt-get update` as root,
      # and on the ubuntu-24.04 runner that hangs: azure.archive.ubuntu.com
      # answers every index request with `Ign:`, apt falls back to
      # archive.ubuntu.com, and then it simply stops — the last log line is
      # `Get:5 …noble-security InRelease` and nothing follows until the
      # job's 50-minute timeout kills it. Deterministic, not flaky: all
      # three shards hung at the same line in the same run, and this is why
      # `tests.yml` has never once published a green Playwright result (30
      # runs: 18 failure, 12 timed-out-as-cancelled, 0 success). Because
      # the evidence artifact is produced by this job, every downstream
      # consumer starved too — state's coverage gate reports "0 linked
      # tests" for eight features whose specs exist and are tagged.
      #
      # The flag was never needed: the runner image ships Playwright's
      # browser libraries preinstalled. Without it, `playwright install`
      # only fetches the browser from Playwright's own CDN and touches apt
      # never. And if a library IS ever missing, the browser fails to
      # launch with a named error in seconds instead of a silent 50-minute
      # stall — strictly better feedback either way.
      - name: install chromium
        # A browser download is ~1 minute. Bounding the step means a future
        # stall here is reported AS a stall, in ten minutes, instead of
        # eating the job's whole 50-minute budget and surfacing as
        # "cancelled" — which is indistinguishable from a concurrency
        # cancel and is precisely why this went unnoticed.
        timeout-minutes: 10
        working-directory: apps/editor/apps/canvas
        run: bunx --no-install playwright install chromium

      # --project is REQUIRED here, not tidiness. Without it Playwright
      # runs EVERY project in the config, which on a Linux runner means
      # `journeys-gpu` and `showcase` — both of which need real Chrome
      # (`channel: "chrome"`), and `journeys-gpu` additionally passes
      # `--use-angle=metal`, a macOS-only flag. playwright.config.ts says
      # of that lane, in its own words, "it cannot run on the Linux CI
      # runners, and no workflow invokes it". That was false: this step
      # invoked it, its one WebGPU test failed for want of an adapter, and
      # because the converter drops the project dimension the failure
      # collided with the SAME test's pass from the CPU `journeys` lane on
      # one test_id — red winning. That single phantom failure is what put
      # THREE features red on state.paged.media (command-palette,
      # context-toolbars, panels.properties — the latter two attached only
      # because the ingest test-map unions them onto every journey spec).
      # Naming the real gating projects fixes all of it (`integration`,
      # the root tests/integration round trips, joined them in T1).
      #
      # A hang must not eat the runner. The first run with the corpus
      # (2026-10-20) had shard 1 still in this step after 80 minutes: five
      # tests waited out the 5-minute test timeout, twice each with the
      # retry, so the shard never finished and never wrote its report. Three
      # bounds now, innermost first: CI's per-test timeout (playwright.config,
      # 3 minutes; the slowest passing test measured 72 s), Playwright's own
      # --global-timeout (55 minutes: it stops, marks the rest "did not run"
      # and still writes the blob, which the upload below keeps), and this
      # step's timeout-minutes as the last resort if Playwright itself wedges.
      - name: playwright (lean surface, shard ${{ matrix.shard }})
        working-directory: apps/editor/apps/canvas
        timeout-minutes: 65
        env:
          CI: "1"
          PAGED_CI_LEAN: "1"
        # Three shards lost their runner to a shutdown signal on 2026-10-20,
        # each after a minute of silence mid-suite: the signature of a runner
        # out of memory. Every 30 s the step logs the memory left and the
        # largest processes, so the next loss shows what grew.
        run: |
          (while sleep 30; do
            echo "::group::memory $(date -u +%H:%M:%S)"
            free -m | sed -n 2p
            ps -eo rss=,comm= --sort=-rss | head -5 | awk '{printf "%7.0f MB %s\n", $1/1024, $2}'
            echo "::endgroup::"
          done) >&2 &
          logger=$!
          set +e
          npx playwright test \
            --project=chromium \
            --project=journeys \
            --project=integration \
            --grep-invert @quarantine \
            --shard=${{ matrix.shard }}/${{ env.SHARDS }} \
            --global-timeout=3300000 \
            --reporter=blob
          status=$?
          kill "$logger"
          exit "$status"

      # The quarantined tests (apps/canvas/tests/quarantine.json, ADR 228)
      # still run, apart and advisory: with retries, so their flake rate
      # keeps being measured (the publish job reports it), and so a fix
      # shows up as a quarantine that has gone green. Never gating, never
      # in the playwright-results evidence.
      - name: quarantined tests (advisory)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        timeout-minutes: 15
        working-directory: apps/editor/apps/canvas
        env:
          CI: "1"
          PAGED_CI_LEAN: "1"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-quarantine
        run: |
          npx playwright test \
            --project=chromium \
            --project=journeys \
            --project=integration \
            --grep @quarantine \
            --retries=2 \
            --pass-with-no-tests \
            --reporter=blob

      - name: upload quarantine blob report
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-quarantine
          path: apps/editor/apps/canvas/blob-quarantine
          retention-days: 7
          if-no-files-found: ignore

      # No step here tests the editor on a GPU. A "journeys (GPU, advisory)"
      # step used to re-run the journey tier with BACKEND=gpu under xvfb, but
      # this runner has no Vulkan driver and the bundled Chromium no WebGPU
      # adapter, the `journeys` project ignores the specs that assert the GPU
      # is active, and nothing checked for an adapter: it could only exercise
      # the CPU fallback the step above already runs, while its name claimed
      # GPU coverage (docs/development/gpu-audit-2026-10.md, L-4). The WebGPU
      # path runs end to end in the local `journeys-gpu` project and the macOS
      # showcase nightly; a CI lane for it must require an adapter and fail
      # without one (docs/development/testing.md).

      # Seed/refresh the committed LINUX visual baselines. Opt-in
      # (workflow_dispatch only) on one shard: runs the journey tier with
      # JOURNEY_VISUAL=1 (turns the content + chrome checkpoints ON — they
      # CI-skip by default until baselines exist) and --update-snapshots,
      # then uploads the regenerated PNGs as an artifact for the author to
      # commit. Linux is the gate platform; the {platform} token in
      # playwright.config's snapshotPathTemplate keeps macOS-local
      # baselines (-darwin) separate from these (-linux). Reuses CI's
      # already-working multi-repo install — no local Docker dance.
      # `always()`: the seeding run regenerates baselines and must NOT be
      # skipped just because an unrelated lean-surface test failed in the
      # main sharded step above (steps don't run after a failure by
      # default). It stays `continue-on-error` so it never gates either.
      - name: seed journey visual baselines (Linux, advisory)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && matrix.shard == 1 }}
        continue-on-error: true
        working-directory: apps/editor/apps/canvas
        env:
          CI: "1"
          PAGED_CI_LEAN: "1"
          JOURNEY_VISUAL: "1"
        run: |
          npx playwright test \
            --project=journeys \
            --update-snapshots \
            --reporter=list

      - name: upload regenerated baselines
        if: ${{ always() && github.event_name == 'workflow_dispatch' && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-baselines-linux
          path: "apps/editor/apps/canvas/tests/journey/__screenshots__/**/*-linux.png"
          retention-days: 14
          if-no-files-found: warn

      - name: upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/editor/apps/canvas/blob-report
          retention-days: 7

  publish:
    name: merge reports + publish evidence
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # merge-reports only needs apps/canvas's @playwright/test; the
      # repository checkout carries it under apps/editor.
      - name: checkout repository
        uses: actions/checkout@v4

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # merge-reports needs only apps/canvas's @playwright/test; the root
      # workspace installs as one.
      - name: install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # all-blobs/ and playwright-results.json stay at the WORKSPACE root:
      # the merge step addresses both through ${{ github.workspace }}.
      - name: download shard blobs
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-report-*
          merge-multiple: true

      - name: merge shards → single Playwright JSON
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-results.json
        working-directory: apps/editor/apps/canvas
        run: |
          bunx --no-install playwright merge-reports --reporter=json ${{ github.workspace }}/all-blobs \
            > /dev/null
          test -s "${{ github.workspace }}/playwright-results.json"

      # The flake rate per run (ADR 228): flaky / tests that ran, from the
      # merged report, plus the quarantined tests' own outcome. Its own
      # artifact, never inside playwright-results (cockpit parses every
      # file there as a Playwright report). With retries 1 and
      # failOnFlakyTests in CI, a flaky gating test also reddens its shard.
      - name: download quarantine blobs
        id: quarantine-blobs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: blob-quarantine
          path: quarantine-blobs
      - name: merge quarantined tests → their own JSON
        if: ${{ steps.quarantine-blobs.outcome == 'success' && hashFiles('quarantine-blobs/**') != '' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/playwright-quarantine.json
        working-directory: apps/editor/apps/canvas
        run: |
          bunx --no-install playwright merge-reports --reporter=json ${{ github.workspace }}/quarantine-blobs \
            > /dev/null
      # Only over a merged report: when the shards produced none, the merge
      # step above is the red, and a rate over nothing would be a number
      # that means nothing.
      - name: flake rate
        if: ${{ !cancelled() && hashFiles('playwright-results.json') != '' }}
        run: |
          reports=("$GITHUB_WORKSPACE/playwright-results.json")
          if [ -s "$GITHUB_WORKSPACE/playwright-quarantine.json" ]; then
            reports+=("$GITHUB_WORKSPACE/playwright-quarantine.json")
          fi
          bun scripts/flake-rate.mjs "${reports[@]}" \
            --json-out "$GITHUB_WORKSPACE/flake-rate.json" \
            --md-out "$GITHUB_STEP_SUMMARY"
      - name: upload the flake rate
        if: ${{ !cancelled() && hashFiles('flake-rate.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-flake-rate
          path: |
            flake-rate.json
            playwright-quarantine.json
          if-no-files-found: warn
          retention-days: 90

      # Evidence hand-off, INVERTED (2026-07-25, PR #16 on main; ported to
      # this branch 2026-08-17). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives
      # in the PRIVATE paged-media/state repo, and GitHub refuses to resolve a
      # private repo's action from a public workflow ("Unable to resolve
      # action paged-media/state, not found") — so the job died at SET-UP,
      # before any step ran, and this lane never published a single result.
      # Follow the inverted pattern core/ci.yml and plugin-doc use: upload the
      # results as an artifact and let state PULL it (private state can read a
      # public repo's artifacts). Consumer:
      # state/.github/workflows/siblings-pull.yml (source=editor,
      # suite=playwright-e2e, format=playwright-json).
      - name: upload playwright-e2e results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-results.json
          if-no-files-found: error
          retention-days: 14
