name: core / licenses
concurrency:
  # A newer push to a pull request cancels the older run. Every other run
  # (main, dispatch) has a group of its own: never cancelled, never queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependency-license + supply-chain audit. paged is AGPL-3.0-only OR PMEL
# (ADR PM-0001); the commercial PMEL side means every transitive dependency
# must be permissively licensed (see deny.toml).
#
# Ported from paged-media/core .github/workflows/licenses.yml (step A3). The
# action is a `uses:` step (no working-directory), so it is pointed at the
# engine workspace by manifest-path; cargo-deny then reads the deny.toml next
# to that manifest (engine/core/deny.toml).
on:
  push:
    branches: [main]
    paths:
      - "engine/core/**"
      - ".github/workflows/core-licenses.yml"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!engine/core/docs/**/*.md"
  pull_request:
    paths:
      - "engine/core/**"
      - ".github/workflows/core-licenses.yml"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!engine/core/docs/**/*.md"

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/core/Cargo.toml
          # advisories MUST be listed explicitly (audit B22): naming a
          # subset of checks makes cargo-deny run ONLY those, so the prior
          # `licenses bans sources` silently skipped the RUSTSEC advisory
          # scan even though deny.toml has an [advisories] section. All
          # four checks now run: vulnerabilities + license policy +
          # dup/wildcard bans + registry/source allowlist.
          command: check advisories licenses bans sources
