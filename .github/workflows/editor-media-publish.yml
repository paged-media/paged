name: editor / media-publish

# Puts the paged.media films and loops on the module host (editor ADR 224):
# modules.paged.media/media/<dir>/<name>, R2 bucket `paged-modules`, the same
# host the wasm modules live on (ADR 220). The takes are recorded and encoded
# on a workstation; their encoded files travel here as the assets of a DRAFT
# release of this repository (drafts are not public and create no tag). Each
# asset is named `<dir>__<file>`, e.g. `films__draw.av1.0123456789.mp4`, and
# goes to `media/<dir>/<file>`.
#
# File names carry their content hash, so an object already on the host is the
# same file: it is skipped. Nothing is ever overwritten or deleted. Every file
# must then answer a range request with 206, which the site's <video> needs.
#
# Run: gh workflow run editor-media-publish.yml -f release=<draft release id>

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Id of the draft release whose assets are the media files"
        required: true

permissions:
  # Reading a draft release's assets needs write access to the repository.
  contents: write

concurrency:
  group: media-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: upload what the host does not have, then check every range
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          host=https://modules.paged.media/media
          mkdir -p media
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets" \
            --jq '.[] | "\(.id) \(.name)"' > assets.txt
          test -s assets.txt || { echo "::error::release $RELEASE has no assets"; exit 1; }
          up=0; there=0
          while read -r id name; do
            case "$name" in
              *__*) ;;
              *) echo "::error::$name is not named <dir>__<file>"; exit 1 ;;
            esac
            key="${name%%__*}/${name#*__}"
            case "$key" in
              *.mp4) type=video/mp4 ;;
              *.webm) type=video/webm ;;
              *) echo "::error::$name is not a video"; exit 1 ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$host/$key")
            if [ "$code" = 200 ]; then
              echo "= $key"; there=$((there + 1))
            else
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "media/$name"
              npx -y wrangler@4 r2 object put "paged-modules/media/$key" --remote \
                --file "media/$name" --content-type "$type" \
                --cache-control "public, max-age=31536000, immutable"
              echo "+ $key"; up=$((up + 1))
            fi
            range=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' "$host/$key")
            if [ "$range" != 206 ]; then
              echo "::error::$host/$key answers a range request with $range"; exit 1
            fi
          done < assets.txt
          echo "$up uploaded, $there already there" | tee -a "$GITHUB_STEP_SUMMARY"
