# Evidence for the state matrix (stage plugin.image): run the unit suites
# and upload their results as artifacts for the private paged-media/state
# repo to pull (see the step comments for why the direction is inverted).
# Runs on main only — this is the post-merge evidence feed, distinct from
# ci.yml's pre-merge gate.
#
# The (source, suite) pairs fed from here — (plugin-image, vitest) and
# (plugin-image, nextest) — must be registered in the state repo's
# ingest/suites.yaml; the convert step requires that pair to exist there
# (using the registered name is load-bearing). Both suites' junit carries
# no @feat: tags yet, so state applies its ingest/test-map.yaml bridge at
# convert time.
#
# MONOREPO (step A3): ported from paged-media/plugin-image
# .github/workflows/publish-state.yml. It publishes evidence ARTIFACTS only
# (nothing to npm), so it stays enabled. The vitest job's sibling
# paged-media/plugin-sdk checkout is gone: only the manifest package's
# scripts read the plugin-cli, and this job runs `vitest` directly.
name: image / publish-state

on:
  push:
    branches: [main]
    paths:
      - "modules/image/**"
      - ".github/workflows/image-publish-state.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: image-publish-state-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modules/image

jobs:
  # TS unit evidence: vitest with the JUnit reporter, per workspace package,
  # concatenated into one report. (Pre-monorepo: nested plugin-image/ +
  # plugin-sdk/ checkouts; now one checkout, run in modules/image.)
  vitest:
    name: vitest evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      - name: vitest (junit per package; red results still publish)
        # The state matrix wants every red row, so don't let a failing
        # test abort before the junit emits (|| true). --no-bail keeps a
        # failing package from stopping the rest. Only the glue package
        # runs vitest (manifest's "test" is a manifest validate), so only
        # glue's test script gets the reporter flags.
        run: |
          set -uo pipefail
          bun run --filter './glue' test \
            --reporter=junit --outputFile=junit.xml || true
          cat ./*/junit.xml > junit-all.xml 2>/dev/null || true
          [ -s junit-all.xml ] # at least one package must have produced results
        env:
          # wasm-exec.spec.ts must run against the committed artifact
          # here too — a missing artifact publishes as a red row, never
          # as a silent skip.
          REQUIRE_REAL_WASM: "1"

      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-image,
      # suite=vitest, format=nextest-junit).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/image/junit-all.xml
          if-no-files-found: error
          retention-days: 14

  # Rust unit evidence: cargo-nextest under the [profile.ci] in
  # .config/nextest.toml (fail-fast off, junit.path = junit.xml →
  # target/nextest/ci/junit.xml).
  nextest:
    name: nextest evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      # `toolchain:` is REQUIRED — dtolnay/rust-toolchain does NOT read
      # rust-toolchain.toml, and @master exits 1 with "'toolchain' is a
      # required input" when it is omitted (that, not the tests, is why
      # this job has been red). Mirror rust-toolchain.toml; bump together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0" # mirrors rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/image -> target
          prefix-key: v0-rust-image
      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: nextest (workspace) → JUnit
        # Red results must still publish (the state matrix wants the ✗), so
        # don't let a test failure abort before the junit emits. nextest
        # writes target/nextest/ci/junit.xml from [profile.ci.junit].
        run: cargo nextest run --workspace --profile ci || true

      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-image,
      # suite=nextest, format=nextest-junit).
      - name: upload nextest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: modules/image/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
