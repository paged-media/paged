name: publish / ci
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# MONOREPO (step A3): ported from paged-media/plugin-publish
# .github/workflows/ci.yml; runs in modules/publish.
on:
  push:
    branches: [main]
    paths:
      - "modules/publish/**"
      # pdf-import path-depends on the engine's model crates and idml-import
      # (and through them on more engine crates and on engine/core's
      # workspace settings), so an engine change can break it.
      - "engine/core/Cargo.toml"
      - "engine/core/crates/**"
      # The engine's wasm packages the bundle specs boot (workspace:*), the
      # rest of what builds them, and the extension contract.
      - "engine/core/Cargo.lock"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/actions/module-wasm/**"
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      - ".github/workflows/publish-ci.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/publish/docs/**/*.md"
  pull_request:
    paths:
      - "modules/publish/**"
      # pdf-import path-depends on the engine's model crates and idml-import
      # (and through them on more engine crates and on engine/core's
      # workspace settings), so an engine change can break it.
      - "engine/core/Cargo.toml"
      - "engine/core/crates/**"
      # The engine's wasm packages the bundle specs boot (workspace:*), the
      # rest of what builds them, and the extension contract.
      - "engine/core/Cargo.lock"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
      - ".github/actions/module-wasm/**"
      - "platform/extensions/packages/plugin-api/**"
      - "platform/extensions/packages/plugin-sdk/**"
      - ".github/workflows/publish-ci.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/publish/docs/**/*.md"

defaults:
  run:
    working-directory: modules/publish

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# pdf-import builds on the engine's crates by path (engine/core/crates/), at
# the same commit. Path dependencies are not lint-capped the way registry and
# git dependencies are, so RUSTFLAGS=-Dwarnings above also fails this
# workflow on a warning in any engine crate it compiles.
jobs:
  check:
    name: fmt + clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/publish -> target
          prefix-key: v0-rust-publish
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build (native)
        run: cargo build --workspace --all-targets

      # The pdf-import mapper SHIPS as wasm in the pdf bundle. (The IDML
      # adapter's own wasm32 lint is core-ci.yml's `clippy (wasm32)` now that
      # it lives in engine/core.)
      - name: build (wasm32)
        run: cargo build -p pdf-import --target wasm32-unknown-unknown

      # The engine patches flo_curves (engine/core/Cargo.toml, C-21), and a
      # [patch] applies only in the workspace that declares it. Depending on
      # an engine crate that reaches flo_curves (paged-mutate and everything
      # above it) would build the UNPATCHED crates.io release here, whose
      # boolean ops can panic. So flo_curves must not be in this graph.
      - name: guard (no flo_curves in the graph)
        run: |
          set -euo pipefail
          # Any resolution error fails here, so the check below can only
          # fail for the one reason it is about.
          cargo tree --locked --target all > /dev/null
          # `cargo tree -i` exits non-zero when the package is not in the
          # graph at all, which is the passing case.
          if out=$(cargo tree --locked --target all -i flo_curves 2>/dev/null) && [ -n "$out" ]; then
            echo "::error title=flo_curves in the publish graph::the engine's flo_curves [patch] does not apply here; drop the dependency path below"
            echo "$out"
            exit 1
          fi
          echo "ok: flo_curves is not in the graph"

  # The TS side — the paged.publish plugin bundle (packages/publish-bundle),
  # which consumes the published @paged-media/plugin-api + plugin-sdk canaries.
  bundle:
    name: bundles typecheck + build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # pdf-bundle's build bundles the pdf-import mapper's glue
      # (packages/pdf-bundle/bin/pdf_import.js), a build output since B3b.
      - name: module wasm (publish)
        uses: ./.github/actions/module-wasm
        with: { module: publish }
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      - run: bun run --filter './packages/*' typecheck
      - run: bun run --filter './packages/*' build
      - name: validate every bundle manifest
        run: |
          set -e
          for m in packages/*/manifest.json; do
            echo "== validate $m =="
            node "$GITHUB_WORKSPACE/platform/extensions/packages/plugin-cli/bin/paged-plugin.mjs" validate "$m"
          done

  # Test evidence — the suites this repo has always had and CI never ran.
  # `check` covers fmt/clippy/build and `bundle` covers typecheck/build, so a
  # green run said nothing about whether the Rust tests (pdf-import; the
  # idml-import ones run in core-ci.yml since the adapter moved to
  # engine/core) or the pdf-bundle unit specs (bun test) still passed. The state matrix
  # read plugin.publish "never published" for the same reason.
  #
  # Evidence hand-off is INVERTED (2026-07-26): this repo is PUBLIC and the
  # state repo is PRIVATE, so it cannot resolve state's publish-results action
  # from a public workflow. We upload; state pulls (siblings-pull.yml).
  tests:
    name: tests (evidence)
    runs-on: ubuntu-latest
    # A cold engine wasm build (a cache miss) adds most of the time.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Mirrors rust-toolchain.toml — dtolnay's action does NOT read that
          # file and hard-fails without an explicit toolchain.
          toolchain: "1.99.1"
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/publish -> target
          prefix-key: v0-rust-publish
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest

      # Red results must still publish (the matrix wants the ✗), so the run
      # does not abort here — the gate at the end fails the build once the
      # artifacts are safely uploaded.
      - name: nextest → JUnit
        run: |
          set -uo pipefail
          cargo nextest run --profile ci || echo "RUST_FAILED=1" >> "$GITHUB_ENV"
          test -s target/nextest/ci/junit.xml

      - name: upload nextest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: modules/publish/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14

      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The engine's wasm packages (canvas-wasm, workspace:*), which the
      # bundles' command specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
      # The pdf-import mapper wasm (packages/pdf-bundle/bin/pdf_import*,
      # build output), which pdf-bundle's mapper specs load.
      - name: module wasm (publish)
        uses: ./.github/actions/module-wasm
        with: { module: publish }
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # Only packages that DECLARE a test script (both do today). bun test
      # writes its own JUnit shape; tooling/js/bun-junit.mjs rewrites it into
      # the vitest shape the evidence has always had (classname = spec path,
      # name = "describe > title"), so the uploaded test ids stay the same.
      - name: bun test → JUnit
        run: |
          set -uo pipefail
          for d in packages/*/; do
            bun -e "process.exit(require('./${d}package.json').scripts?.test ? 0 : 1)" \
              2>/dev/null || continue
            echo "== bun test in $d"
            (cd "$d" && bun run test --reporter=junit --reporter-outfile=junit.bun.xml) \
              || echo "TS_FAILED=1" >> "$GITHUB_ENV"
            bun ../../tooling/js/bun-junit.mjs --out "${d}junit.xml" "${d}junit.bun.xml" \
              || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          done
          ls packages/*/junit.xml

      # PER-PACKAGE artifacts, one junit.xml each — never cat them together.
      # The old merged junit-all.xml carried package-RELATIVE classnames, so
      # the state matrix could not tell a pdf-bundle test from a
      # publish-bundle one and its declared plugin-pdf/vitest lane sat
      # "never published" (state ingest/artifacts.yaml, 2026-08-17 audit).
      # Artifact names pair with state's pull table: vitest-junit-<package>.
      - name: upload pdf-bundle JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-pdf-bundle
          path: modules/publish/packages/pdf-bundle/junit.xml
          if-no-files-found: error
          retention-days: 14

      # The artifact names keep their `vitest-` prefix: the evidence pull
      # addresses them by name.
      - name: upload publish-bundle JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-publish-bundle
          path: modules/publish/packages/publish-bundle/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: tests failed
        if: ${{ env.RUST_FAILED == '1' || env.TS_FAILED == '1' }}
        run: exit 1
      # A silent fallback to the default linker fails here: mold stamps
      # the .comment section of what it links.
      - name: mold linked the test binaries
        if: runner.os == 'Linux'
        run: |
          bin=$(find "${CARGO_TARGET_DIR:-target}/debug/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.so' | head -1)
          test -n "$bin" || { echo "::error::no test binary in target/debug/deps"; exit 1; }
          readelf -p .comment "$bin" | grep -q mold || { echo "::error::$bin was not linked by mold"; exit 1; }
          echo "mold linked $bin"
