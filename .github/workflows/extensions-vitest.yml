# Test evidence for the state matrix (plugin.api lane).
#
# This workspace has 271 tests across 27 files — including the headless
# conformance harness that boots the REAL published engine wasm — and until
# now NOTHING ran them in CI. The repo's workflows are cla / contract-guard /
# notify-docs / publish; a green merge told you the version was bumped and the
# package published, never that the contract still worked. The matrix
# consequently reported plugin-sdk/vitest "silent for 876h" while the suite was
# green on every developer's machine.
#
# Evidence hand-off is INVERTED (2026-07-26): this repo is PUBLIC and the state
# repo is PRIVATE, so it cannot call state's publish-results action — GitHub
# refuses to resolve a private repo's action from a public workflow, which
# killed every wire that tried. We upload the JUnit; state PULLS it
# (siblings-pull.yml, driven by state's ingest/artifacts.yaml).
#
# MONOREPO (step A3): ported from paged-media/plugin-sdk
# .github/workflows/vitest.yml; runs in platform/extensions.
name: extensions / bun test
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  # A re-dispatch on the same wip/* branch cancels its older dispatched run,
  # running or not: only a work branch's newest commit needs checking.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/wip/')) }}

on:
  push:
    branches: [main]
    paths:
      # The test fonts (Space Grotesk) are read from the engine's corpus.
      - "engine/core/corpus/fonts/**"
      - "platform/extensions/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!platform/extensions/docs/**/*.md"
      - "platform/shared/test-kit/**"
      # First-party packages that ride this job because they boot the engine
      # it builds: @paged-media/ai and paged-node.
      - "platform/shared/ai/**"
      - "apps/cli/**"
      # paged-node's merge goldens read paged.data's InDesign Data Merge lane.
      - "modules/data/conformance/indesign-merge/**"
      # paged-node's suite (the `cli` job) loads every built-in from source
      # and boots its engine wasm (.github/actions/module-wasm).
      - "modules/*/packages/*/src/**"
      - "modules/image/glue/src/**"
      - "modules/*/scripts/build-wasm.sh"
      - ".github/actions/module-wasm/**"
      # The tool versions (Bun, Node, moon).
      - ".prototools"
      - ".github/workflows/extensions-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # The engine wasm packages the harness boots (workspace:*), and what
      # builds them (.github/actions/engine-wasm).
      - "engine/core/crates/**"
      # The shared formatting crate (engine/core/crates/paged-fmt), compiled into the engine.
      - "engine/core/crates/paged-fmt/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/rust/**"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
  pull_request:
    paths:
      # The test fonts (Space Grotesk) are read from the engine's corpus.
      - "engine/core/corpus/fonts/**"
      - "platform/extensions/**"
      # The TypeScript base every package's tsconfig extends.
      - "tsconfig.base.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!platform/extensions/docs/**/*.md"
      - "platform/shared/test-kit/**"
      # First-party packages that ride this job because they boot the engine
      # it builds: @paged-media/ai and paged-node.
      - "platform/shared/ai/**"
      - "apps/cli/**"
      # paged-node's merge goldens read paged.data's InDesign Data Merge lane.
      - "modules/data/conformance/indesign-merge/**"
      # paged-node's suite (the `cli` job) loads every built-in from source
      # and boots its engine wasm (.github/actions/module-wasm).
      - "modules/*/packages/*/src/**"
      - "modules/image/glue/src/**"
      - "modules/*/scripts/build-wasm.sh"
      - ".github/actions/module-wasm/**"
      # The tool versions (Bun, Node, moon).
      - ".prototools"
      - ".github/workflows/extensions-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # The engine wasm packages the harness boots (workspace:*), and what
      # builds them (.github/actions/engine-wasm).
      - "engine/core/crates/**"
      # The shared formatting crate (engine/core/crates/paged-fmt), compiled into the engine.
      - "engine/core/crates/paged-fmt/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/rust/**"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
  workflow_dispatch:

permissions:
  contents: read
  # .github/actions/engine-wasm asks for the `engine / wasm` run of the commit
  # (it waits for that build instead of building the engine a second time).
  actions: read

defaults:
  run:
    working-directory: platform/extensions

jobs:
  vitest:
    name: bun test
    runs-on: ubuntu-latest
    # A cold engine wasm build (a cache miss) takes most of this.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The engine's wasm packages, which the harness specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm

      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # plugin-api vendors the engine's wire types and capability catalog.
      # Both sources are in this checkout now: the wire is the .d.ts of the
      # canvas-wasm workspace package built above, the catalog is
      # engine/core's catalog.json. A wire or catalog change in the engine
      # without a resync fails here. The typed core commands are generated
      # from the engine's wire schema (crates/paged-wire/schema, ADR 187).
      - name: vendored wire, catalog and core commands match the engine
        run: |
          bun scripts/sync-wire.mjs --check
          bun scripts/sync-catalog.mjs --check
          bun scripts/gen-core-commands.mjs --check

      # The contract and the SDK with its tests (plugin-sdk's tsconfig
      # includes test/), against the engine's wire types built above.
      - name: typecheck (plugin-api, plugin-sdk and its tests)
        run: bun run --filter './packages/plugin-*' typecheck

      # Build BEFORE the suite: react-free-import.spec.ts asserts on the
      # SHIPPED artifact (no static react import, no AWAITED react import),
      # and skips itself when `dist` is absent — so without this the guard
      # was inert in CI. The build is also the top-level-await gate: its
      # declaration compile runs at `"module": "ES2020"` (Vite's
      # dep-optimizer floor), where TypeScript rejects a top-level await
      # (TS1378). See DESIGN.md §5.1.
      - run: bun run --filter @paged-media/plugin-sdk build

      # The harness specs boot canvas-wasm, the workspace package the step
      # above filled, so this is a real engine run, not a mock.
      #
      # Red results must still publish (the matrix wants the ✗), so the run
      # does not abort the job here — the gate at the end fails the build after
      # the artifact is safely uploaded. Only plugin-sdk emits JUnit; plugin-api
      # is type-only and the paged-plugin bin's specs live in plugin-sdk, so a run over every package
      # would produce nothing for them.
      # bun's report, rewritten into the vitest shape the evidence has
      # always had (tooling/js/bun-junit.mjs), so the artifact keeps its
      # name and its test ids.
      - name: bun test → JUnit
        run: |
          set -uo pipefail
          ( cd packages/plugin-sdk && bun run test --reporter=junit --reporter-outfile=junit.bun.xml ) \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          bun ../../tooling/js/bun-junit.mjs --out packages/plugin-sdk/junit.xml packages/plugin-sdk/junit.bun.xml \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          test -s packages/plugin-sdk/junit.xml

      # @paged-media/ai (platform/shared/ai): the agent loop and the proxy
      # against the real engine, with the model replaced by canned turns (no
      # key, no network). Not part of the contract; it rides this job for the
      # engine.
      - name: ai package suite
        run: |
          ( cd ../shared/ai && bun run test --reporter=junit --reporter-outfile=junit.bun.xml ) \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"

      # The shared test kit (platform/shared/test-kit): the gesture kit's
      # editor half, the engine's transform maths as properties, the gesture
      # invariants per kind and the gesture fuzzer (25 seeded sequences a
      # fixture), all against the real engine this job built. Its public
      # half is plugin-sdk's, so it rides this job.
      - name: shared test kit suite
        run: |
          ( cd ../shared/test-kit && bun run test --reporter=junit --reporter-outfile=junit.bun.xml ) \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"

      # The two suites above as evidence, one artifact each (ai-junit,
      # test-kit-junit), in the vitest shape the plugin-sdk report has
      # (tooling/js/bun-junit.mjs). A suite that wrote no report fails the
      # job. paged-node's (cli-junit) comes from the `cli` job below.
      - name: ai and test-kit JUnit
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          set -uo pipefail
          for dir in platform/shared/ai platform/shared/test-kit; do
            bun tooling/js/bun-junit.mjs --out "$dir/junit.xml" "$dir/junit.bun.xml" \
              || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          done
      - name: upload ai JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-junit
          path: platform/shared/ai/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: upload test-kit JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-kit-junit
          path: platform/shared/test-kit/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: upload JUnit results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-junit
          path: platform/extensions/packages/plugin-sdk/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: tests failed
        if: ${{ env.TESTS_FAILED == '1' }}
        run: exit 1

  # paged-node (apps/cli): the WHOLE suite and its typecheck. Until
  # 2026-11-28 the job above ran four of its specs, because the others load
  # the built-ins from source and boot their engine wasm, which that job does
  # not build; they reported `unavailable` there and nothing else ran them.
  # This job restores (or builds) the engine's packages and every module's
  # wasm, as `tests / contracts + system` does, so no spec has a reason to
  # skip for a missing wasm (REQUIRE_REAL_DOCX holds the doc specs to that);
  # what still skips is listed in the job summary.
  cli:
    name: paged-node (typecheck + the whole suite)
    runs-on: ubuntu-latest
    # Cache hits make this minutes; a cold engine or module build takes the rest.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm
        with: { artifact: "false" }
      - name: module wasm (doc)
        uses: ./.github/actions/module-wasm
        with: { module: doc }
      - name: module wasm (slide)
        uses: ./.github/actions/module-wasm
        with: { module: slide }
      - name: module wasm (sheet)
        uses: ./.github/actions/module-wasm
        with: { module: sheet }
      - name: module wasm (data)
        uses: ./.github/actions/module-wasm
        with: { module: data }
      - name: module wasm (web)
        uses: ./.github/actions/module-wasm
        with: { module: web }
      - name: module wasm (draw)
        uses: ./.github/actions/module-wasm
        with: { module: draw }
      - name: module wasm (image)
        uses: ./.github/actions/module-wasm
        with: { module: image }
      - name: module wasm (publish)
        uses: ./.github/actions/module-wasm
        with: { module: publish }

      # cli-open-import reads the gitignored engine/core/corpus/generated/*.idml
      # fixtures, which paged-gen writes (as core / ci does before its tests).
      - name: rust toolchain (for paged-gen)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-28
        with:
          toolchain: stable
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - name: cache cargo + paged-gen build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            engine/core/target
          key: paged-rust-${{ runner.os }}-${{ hashFiles('engine/core/Cargo.lock') }}
          restore-keys: paged-rust-${{ runner.os }}-
      - name: generate the engine's fixtures
        working-directory: engine/core
        run: bash scripts/regen-fixtures.sh

      - name: typecheck
        run: bun run typecheck

      # bin.spec.ts runs the built bin and skips itself without dist/.
      - name: build the bin
        run: bun run build

      # Every spec under test/. Red results still upload: the gate is the
      # last step.
      - name: bun test → JUnit
        env:
          REQUIRE_REAL_DOCX: "1"
        run: |
          set -uo pipefail
          bun run test --reporter=junit --reporter-outfile=junit.bun.xml \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          bun ../../tooling/js/bun-junit.mjs --out junit.xml junit.bun.xml \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          test -s junit.xml

      # Skipped is not passed: the job summary names every skipped case.
      # With every wasm built, the expected ones are the lane that needs a
      # packed @paged-media/publish (PAGED_PUBLISH_BUNDLE) and the cases that
      # need a running ML host; anything else is a build output the specs
      # did not find.
      - name: skipped cases, in the job summary
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          test -s junit.bun.xml || exit 0
          SKIPPED=$(grep -c '<skipped' junit.bun.xml || true)
          {
            echo "### paged-node: $SKIPPED skipped test case(s)"
            grep -B1 '<skipped' junit.bun.xml | grep -o 'name="[^"]*"' | sort -u | sed 's/^/- /' | head -100
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SKIPPED" != "0" ]; then
            echo "::warning::$SKIPPED paged-node test case(s) were skipped (not run, not passed); the job summary lists them."
          fi

      - name: upload cli JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-junit
          path: apps/cli/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: tests failed
        if: ${{ env.TESTS_FAILED == '1' }}
        run: exit 1
