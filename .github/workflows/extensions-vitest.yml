# Test evidence for the state matrix (plugin.api lane).
#
# This workspace has 271 tests across 27 files — including the headless
# conformance harness that boots the REAL published engine wasm — and until
# now NOTHING ran them in CI. The repo's workflows are cla / contract-guard /
# notify-docs / publish; a green merge told you the version was bumped and the
# package published, never that the contract still worked. The matrix
# consequently reported plugin-sdk/vitest "silent for 876h" while the suite was
# green on every developer's machine.
#
# Evidence hand-off is INVERTED (2026-07-26): this repo is PUBLIC and the state
# repo is PRIVATE, so it cannot call state's publish-results action — GitHub
# refuses to resolve a private repo's action from a public workflow, which
# killed every wire that tried. We upload the JUnit; state PULLS it
# (siblings-pull.yml, driven by state's ingest/artifacts.yaml).
#
# MONOREPO (step A3): ported from paged-media/plugin-sdk
# .github/workflows/vitest.yml; runs in platform/extensions.
name: extensions / bun test
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - "platform/extensions/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!platform/extensions/docs/**/*.md"
      - ".github/workflows/extensions-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # The engine wasm packages the harness boots (workspace:*), and what
      # builds them (.github/actions/engine-wasm).
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
  pull_request:
    paths:
      - "platform/extensions/**"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!platform/extensions/docs/**/*.md"
      - ".github/workflows/extensions-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # The engine wasm packages the harness boots (workspace:*), and what
      # builds them (.github/actions/engine-wasm).
      - "engine/core/crates/**"
      - "engine/core/Cargo.*"
      - "engine/core/rust-toolchain.toml"
      - "engine/core/scripts/build-wasm-packages.sh"
      - "engine/core/packages/**"
      - ".cargo/config.toml"
      - "tooling/bootstrap.sh"
      - ".github/actions/engine-wasm/**"
      - ".github/actions/wasm-tools/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: platform/extensions

jobs:
  vitest:
    name: bun test
    runs-on: ubuntu-latest
    # A cold engine wasm build (a cache miss) takes most of this.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      - name: cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The engine's wasm packages, which the harness specs boot.
      - name: engine wasm packages
        uses: ./.github/actions/engine-wasm

      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile

      # plugin-api vendors the engine's wire types and capability catalog.
      # Both sources are in this checkout now: the wire is the .d.ts of the
      # canvas-wasm workspace package built above, the catalog is
      # engine/core's catalog.json. A wire or catalog change in the engine
      # without a resync fails here. The typed core commands are generated
      # from the engine's wire schema (crates/paged-wire/schema, ADR 187).
      - name: vendored wire, catalog and core commands match the engine
        run: |
          bun scripts/sync-wire.mjs --check
          bun scripts/sync-catalog.mjs --check
          bun scripts/gen-core-commands.mjs --check

      # Build BEFORE the suite: react-free-import.spec.ts asserts on the
      # SHIPPED artifact (no static react import, no AWAITED react import),
      # and skips itself when `dist` is absent — so without this the guard
      # was inert in CI. The build is also the top-level-await gate: its
      # declaration compile runs at `"module": "ES2020"` (Vite's
      # dep-optimizer floor), where TypeScript rejects a top-level await
      # (TS1378). See DESIGN.md §5.1.
      - run: bun run --filter @paged-media/plugin-sdk build

      # The harness specs boot canvas-wasm, the workspace package the step
      # above filled, so this is a real engine run, not a mock.
      #
      # Red results must still publish (the matrix wants the ✗), so the run
      # does not abort the job here — the gate at the end fails the build after
      # the artifact is safely uploaded. Only plugin-sdk emits JUnit; plugin-api
      # is type-only and plugin-cli has no suite, so a run over every package
      # would produce nothing for them.
      # bun's report, rewritten into the vitest shape the evidence has
      # always had (tooling/js/bun-junit.mjs), so the artifact keeps its
      # name and its test ids.
      - name: bun test → JUnit
        run: |
          set -uo pipefail
          ( cd packages/plugin-sdk && bun run test --reporter=junit --reporter-outfile=junit.bun.xml ) \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          bun ../../tooling/js/bun-junit.mjs --out packages/plugin-sdk/junit.xml packages/plugin-sdk/junit.bun.xml \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          test -s packages/plugin-sdk/junit.xml

      # @paged-media/ai: the agent loop and the proxy against the real
      # engine, with the model replaced by canned turns (no key, no network).
      - name: ai package suite
        run: ( cd packages/ai && bun run test ) || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"

      - name: upload JUnit results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: platform/extensions/packages/plugin-sdk/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: tests failed
        if: ${{ env.TESTS_FAILED == '1' }}
        run: exit 1
