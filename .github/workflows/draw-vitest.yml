# The test gate for this repo, and the CI evidence for the feature
# registry (plugin.draw stage). It runs every package's vitest — the
# draw-bundle suite boots the REAL engine wasm, pinned as its own
# devDependency — then the contract-import lint and the typecheck, and
# FAILS when any of them is red. The JUnit is uploaded first either way,
# for the registry to pull (see the step comment for why the direction is
# inverted); vitest's JUnit carries no @feat: tags, the registry applies
# its test-map bridge at convert time.
#
# Runs on pull requests too. It used to run on push to main only, with a
# red suite reported as a green job.
name: draw / vitest
# MONOREPO (step A3): ported from paged-media/plugin-draw
# .github/workflows/vitest.yml. The old lane checked the repo out under
# plugin-draw/ and ran some commands from its parent; it now runs in
# modules/draw, so `plugin-draw/<x>` became `<x>` and `--dir plugin-draw`
# was dropped.
on:
  push:
    branches: [main]
    paths:
      - "modules/draw/**"
      - ".github/workflows/draw-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/draw/docs/**/*.md"
  pull_request:
    paths:
      - "modules/draw/**"
      - ".github/workflows/draw-vitest.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      # Prose under docs/ builds and tests nothing (test inputs are not .md there).
      - "!modules/draw/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draw-vitest-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modules/draw

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The `paged-media/sdk` sibling checkout is GONE. It existed to
      # satisfy a pnpm `link:` chain that was retired when this repo moved
      # to the published contract (53d94c4, "the contract becomes a
      # PEER") — it has been checking out a repo it no longer needs, and
      # under a token it did not need either.
      #
      # It also never solved the real problem: the headless conformance
      # harness drives a REAL engine, and `@paged-media/canvas-wasm` is a
      # devDependency of plugin-sdk, which a consumer never installs. So
      # every one of the 41 specs calling `openHost()` failed here with
      # "canvas-wasm is not resolvable for the headless harness (tried 3
      # anchors)" while passing on any developer machine that happened to
      # have an editor checkout next door. draw-bundle now carries its
      # own canvas-wasm devDependency and the harness probes it first.
      # Bun and Node at the versions in /.prototools, installed by proto.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # One install for the whole root workspace (bun.lock).
      - name: bun install (root workspace)
        working-directory: .
        run: bun install --frozen-lockfile
      # Red results must still upload (the registry wants the failure), so
      # the run does not abort here. It records the failure instead, and the
      # gate at the END of the job fails it once the artifact is safe. This
      # step used to end in `|| true` with no such gate, so a red suite was
      # a green job — and `publish.yml` shipped from it.
      - name: vitest (junit per package; red results still upload)
        run: |
          set -uo pipefail
          bun run --filter './packages/*' test \
            --reporter=junit --outputFile=junit.xml \
            || echo "TS_FAILED=1" >> "$GITHUB_ENV"
          cat packages/*/junit.xml > junit-all.xml 2>/dev/null || true
          [ -s junit-all.xml ] # at least one package must have produced results
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-draw,
      # suite=vitest, format=nextest-junit).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: modules/draw/junit-all.xml
          if-no-files-found: error
          retention-days: 14
      # The two gates the root `bun run test` / `bun run typecheck` scripts carry
      # and this job used to bypass by calling vitest directly: the
      # contract-import lint (plugin-api is the ONLY sanctioned contract
      # import) and the typecheck that holds `wire-compat.ts`.
      - name: contract-import lint
        if: ${{ !cancelled() }}
        run: node scripts/check-contract-imports.mjs
      - name: typecheck
        if: ${{ !cancelled() }}
        run: bun run --filter './packages/*' typecheck
      - name: tests failed
        if: ${{ !cancelled() && env.TS_FAILED == '1' }}
        run: exit 1
