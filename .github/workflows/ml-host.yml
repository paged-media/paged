name: ml-host / rust
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# paged-ml-host's Rust workspace (apps/ml-host): the local generative-image
# sidecar. Self-contained (no path dependency on another workspace), so only
# its own files and the root Cargo config trigger it. The tests drive a fake
# `sd` shell script; no model, runtime or network is needed.
on:
  push:
    branches: [main]
    paths:
      - "apps/ml-host/**"
      - ".github/workflows/ml-host.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      - "!apps/ml-host/**/*.md"
  pull_request:
    paths:
      - "apps/ml-host/**"
      - ".github/workflows/ml-host.yml"
      # The root Cargo config and its linker/wrapper scripts apply to every build.
      - ".cargo/config.toml"
      - "tooling/rust/**"
      - "!apps/ml-host/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ml-host

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # A bound on a hang (the default is six hours); generous for a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-28
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/ml-host -> target
          prefix-key: v0-rust-ml-host
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          manifest-path: apps/ml-host/Cargo.toml

  test:
    runs-on: ubuntu-latest
    # A bound on a hang (the default is six hours); generous for a cold cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-28
        with:
          toolchain: 1.99.1
      - name: mold (the Rust linker on Linux, .cargo/config.toml)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/ml-host -> target
          prefix-key: v0-rust-ml-host
          # Only main writes the cache; pull requests restore main's (A10).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: nextest
      - name: nextest (junit)
        run: cargo nextest run --workspace --locked --profile ci --no-fail-fast --no-tests=fail
      - name: upload nextest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-junit
          path: apps/ml-host/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
