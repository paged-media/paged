name: supply chain
concurrency:
  # A newer push to a pull request cancels the older run. Main pushes share
  # one group per event type: a running main run always finishes, and a newer
  # push replaces the one still waiting, so direct pushes queue at most one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependency policy for the whole repository (docs/migration/renovate.md):
#
#   rust   cargo deny (licenses, advisories, bans, sources) and cargo audit
#          over EVERY Cargo workspace, found from the tracked Cargo.lock
#          files (tooling/supply-chain/rust-audit.mjs). The component
#          workflows keep their own cargo-deny steps as pre-merge gates for
#          their paths; this job is the one that sees all of them, and the
#          daily schedule is what catches an advisory published against a
#          lockfile nobody touched.
#   js     bun audit over /bun.lock, failing on any advisory that
#          tooling/supply-chain/bun-audit-allowlist.json does not name, or
#          names past its expiry (tooling/supply-chain/bun-audit.mjs).
#   renovate  the Renovate config validates (.github/renovate.json5).
on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"
      - "bun.lock"
      - "**/package.json"
      - "tooling/supply-chain/**"
      - ".github/renovate.json5"
      - ".github/workflows/supply-chain.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"
      - "bun.lock"
      - "**/package.json"
      - "tooling/supply-chain/**"
      - ".github/renovate.json5"
      - ".github/workflows/supply-chain.yml"
  schedule:
    # Daily: advisories are published against code that did not change.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (cargo deny + cargo audit, every workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Bun runs the script; proto installs the /.prototools versions.
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"

      # Every workspace pins the same toolchain (rust-toolchain.toml); cargo
      # deny only needs `cargo metadata` from it, nothing is compiled.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      # Pinned scanner versions (Renovate bumps them, .github/renovate.json5).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: cargo deny + cargo audit
        run: bun tooling/supply-chain/rust-audit.mjs

  js:
    name: js (bun audit, allowlist with expiry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # bun audit reads /bun.lock; no install needed.
      - name: bun audit
        run: bun tooling/supply-chain/bun-audit.mjs

  renovate:
    name: renovate config validates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
          proto-version: "0.63.1"
      # The validator ships with Renovate itself; a pinned release, fetched
      # here only (never installed in the repository).
      - name: renovate-config-validator
        run: npx --yes --package renovate@44.132.6 -- renovate-config-validator --strict .github/renovate.json5
