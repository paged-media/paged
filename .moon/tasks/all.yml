# The shared task vocabulary, inherited by every project:
#
#   moon run <project>:fmt | check | lint | test | build
#   moon run :test                      # every project
#
# Each one runs the project's Rust half (rust.yml) and/or JS half
# (node.yml); a half the project does not have is skipped (`optional`).
# `wasm` is defined per project, next to its build script.
#
# These aggregates do not run under `moon ci`: CI runs the underlying tasks,
# each selected by its own inputs.
$schema: "../cache/schemas/tasks.json"

tasks:
  fmt:
    description: "Formatting checks (rust-fmt, js-fmt)."
    toolchains: ["system"]
    deps:
      - target: "~:rust-fmt"
        optional: true
      - target: "~:js-fmt"
        optional: true
    inputs: []
    options:
      runInCI: false

  # bun fmt over the project directory: JS/TS, JSON, CSS, HTML, Markdown and
  # YAML (bunfig.toml [fmt], /.prettierignore). Every project has such
  # files, so this is not limited to the `node` projects. tooling/js/fmt.sh
  # runs the pinned Bun canary from the repository root over git's file list.
  js-fmt:
    description: "bun fmt --check over the project (tooling/js/fmt.sh)."
    toolchains: ["system"]
    script: 'bash "$workspaceRoot/tooling/js/fmt.sh" --check .'
    inputs:
      - "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,css,html,md,yml,yaml}"
      - "/bunfig.toml"
      - "/.prettierignore"
      - "/tooling/js/bun-canary-version"
      - "/tooling/js/fmt.sh"
    options:
      # CI checks the whole repository, root files included, in its own job
      # (.github/workflows/fmt.yml); `moon ci` does not run it a second time.
      runInCI: false

  check:
    description: "Type checks (rust-check, js-check)."
    toolchains: ["system"]
    deps:
      - target: "~:rust-check"
        optional: true
      - target: "~:js-check"
        optional: true
    inputs: []
    options:
      runInCI: false

  lint:
    description: "Lints (rust-lint, js-lint)."
    toolchains: ["system"]
    deps:
      - target: "~:rust-lint"
        optional: true
      - target: "~:js-lint"
        optional: true
    inputs: []
    options:
      runInCI: false

  test:
    description: "Tests (rust-test, js-test)."
    toolchains: ["system"]
    deps:
      - target: "~:rust-test"
        optional: true
      - target: "~:js-test"
        optional: true
    inputs: []
    options:
      runInCI: false

  build:
    description: "Builds (rust-build, js-build)."
    toolchains: ["system"]
    deps:
      - target: "~:rust-build"
        optional: true
      - target: "~:js-build"
        optional: true
    inputs: []
    options:
      runInCI: false
