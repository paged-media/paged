# Rust tasks, inherited by every project tagged `rust` (one per Cargo
# workspace). Each runs in the project root, so rustup picks that
# workspace's rust-toolchain.toml and cargo that workspace's target/.
#
# Names carry a `rust-` prefix because a module can hold a Cargo workspace and
# JS packages in one project; the shared vocabulary (`fmt`, `check`, `lint`,
# `test`, `build`) is in all.yml and runs both halves.
#
# Nothing here declares `target/` as an output: Moon never caches it.
$schema: '../cache/schemas/tasks.json'

inheritedBy:
  tags: ['rust']

fileGroups:
  # What a compile reads. A project whose directory contains another
  # project overrides this group to exclude it.
  rust-sources:
    - '**/*.rs'
    - '**/Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain*'
    - '/.cargo/*.toml'
  rust-fmt-config:
    - '*rustfmt.toml'
  # What tests may read: sources plus fixtures, corpora and registries.
  rust-tests:
    - '**/*'
    - '!docs/**'
    - '!**/*.md'
    - '/.cargo/*.toml'

taskOptions:
  # A project that redefines one of these tasks replaces its command line
  # instead of appending to it.
  mergeArgs: 'replace'

tasks:
  rust-fmt:
    description: 'rustfmt check over the whole workspace.'
    toolchains: ['rust']
    command: 'cargo fmt --all --check'
    inputs:
      - '@group(rust-sources)'
      - '@group(rust-fmt-config)'

  rust-check:
    description: 'cargo check of every target. Local only: rust-lint type-checks the same targets in CI.'
    toolchains: ['rust']
    command: 'cargo check --workspace --all-targets'
    inputs:
      - '@group(rust-sources)'
    options:
      runInCI: false

  rust-lint:
    description: 'clippy with the flags the component CI uses.'
    toolchains: ['rust']
    command: 'cargo clippy --workspace --all-targets -- -D warnings'
    inputs:
      - '@group(rust-sources)'
      - '*clippy.toml'

  rust-test:
    description: >-
      cargo-nextest over the workspace, then the doctests (nextest does not run
      them). Under CI it uses the workspace's `ci` nextest profile when
      .config/nextest.toml defines one.
    toolchains: ['rust']
    script: >-
      profile=default;
      if [ -n "${CI:-}" ] && grep -qs '^\[profile\.ci\]' .config/nextest.toml; then profile=ci; fi;
      cargo nextest run --workspace --profile "$profile"
      && cargo test --doc --workspace
    inputs:
      - '@group(rust-tests)'
    options:
      cache: false

  rust-build:
    description: 'Native debug build of the workspace. Local only.'
    toolchains: ['rust']
    command: 'cargo build --workspace'
    inputs:
      - '@group(rust-sources)'
    options:
      runInCI: false
