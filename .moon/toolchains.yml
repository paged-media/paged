# Moon toolchains (Node + Bun + Rust).
#
# Moon must not rewrite tracked files. Every sync that would touch a
# package.json, lockfile, tsconfig.json or rust-toolchain.toml is off, and
# the `typescript` toolchain is not enabled (it syncs project references
# into tsconfig.json). See docs/adr/PM-0006-proto-moon-mcp.md.
$schema: "./cache/schemas/toolchains.json"

javascript:
  packageManager: "bun"
  # One Bun workspace at the repository root (package.json `workspaces`,
  # bun.lock): Moon installs it once, at the root, like the component CI.
  installDependencies: true
  inferTasksFromScripts: false
  syncPackageManagerField: false
  syncProjectWorkspaceDependencies: false
  dedupeOnLockfileChange: false

node:
  # 24.22.0, from /.prototools. Package scripts run through Bun; their
  # `node`, Playwright's runner, wrangler and npm publish run on Node.
  versionFromPrototools: true

bun:
  # 1.4.3, from /.prototools.
  versionFromPrototools: true
  # A stale lockfile fails the install instead of being rewritten.
  installArgs: ["--frozen-lockfile"]

rust:
  # No version: every Cargo workspace keeps its own rust-toolchain.toml,
  # which rustup honours per directory. With a version here Moon would
  # write it into those files.
  syncToolchainConfig: false
  addMsrvConstraint: false
