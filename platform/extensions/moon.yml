$schema: '../../.moon/cache/schemas/project.json'

# The public extension contract and SDK: JS packages plugin-api, plugin-sdk,
# plugin-cli, ai and cli.
language: 'typescript'
layer: 'library'
stack: 'frontend'
tags: ['node', 'sdk']

project:
  title: 'platform/extensions'
  description: 'Extension contract (plugin-api), runtime SDK, manifest CLI, ai and cli packages.'

# plugin-sdk's harness specs boot the engine's canvas-wasm (workspace:*);
# scripts/sync-catalog.mjs reads engine/core's catalog.json and
# scripts/sync-wire.mjs the .d.ts of the canvas-wasm workspace package.
dependsOn:
  - id: 'core'
    scope: 'development'

tasks:
  js-build:
    description: 'Every package `build` script (tsup/tsc to dist/). extensions-vitest builds before testing.'
    outputs:
      - 'packages/*/dist/**/*'
    options:
      runInCI: true

  js-test:
    deps: ['~:js-build']

  catalog-check:
    description: 'The vendored capability catalog matches engine/core (scripts/sync-catalog.mjs --check).'
    toolchains: ['system']
    command: 'node scripts/sync-catalog.mjs --check'
    inputs:
      - 'scripts/sync-catalog.mjs'
      - 'packages/plugin-api/src/catalog.json'
      - project: 'core'
        filter: ['crates/paged-introspect/catalog.json']
    # extensions-vitest runs it with sync-wire.mjs --check.
