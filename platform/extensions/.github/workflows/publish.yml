# Canary publish via OIDC TRUSTED PUBLISHING (tokenless). No NPM_TOKEN: the
# runner mints a short-lived OIDC token (id-token: write) that npm trusts because
# each package has this repo+workflow configured as a Trusted Publisher on npmjs.
#
# Why pnpm pack → npm publish: OIDC trusted publishing is an npm-CLI feature
# (>= 11.5.1), while `pnpm pack` is what converts workspace:* deps + applies
# publishConfig. So we pack with pnpm (correct tarball) and upload with npm (OIDC).
#
# Pre-1.0: every version is a -canary.N prerelease under the `canary` dist-tag.
# Unchanged versions skip; bump a package's version to release it.
#
# One-time npm setup per package (plugin-api, plugin-sdk, plugin-cli):
#   npmjs.com → package → Trusted Publisher → GitHub Actions →
#     org: paged-media, repo: plugin-sdk, workflow: publish.yml, action: npm publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for trusted publishing
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # >= 22.14 required for OIDC trusted publishing
      - name: upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Build BEFORE the suite: react-free-import.spec.ts asserts on the
      # SHIPPED artifact and skips itself when `dist` is absent, so building
      # afterwards left that guard inert on every publish. `pnpm pack` does
      # NOT run prepublishOnly, so this step produces the published dist too.
      - run: pnpm -r build
      - run: pnpm -r test
      - name: wire vendoring lockstep (hard gate)
        run: |
          set -e
          WIRE=packages/plugin-api/src/wire.d.ts
          VER=$(sed -n 's#^// Synced from @paged-media/canvas-wasm@##p' "$WIRE")
          test -n "$VER" || { echo "wire.d.ts has no version stamp"; exit 1; }
          echo "vendored wire stamped @paged-media/canvas-wasm@$VER"
          mkdir -p .wire-src
          printf '{"name":"wire-src-scratch","private":true}' > .wire-src/package.json
          ( cd .wire-src && npm install "@paged-media/canvas-wasm@$VER" --no-audit --no-fund --no-package-lock )
          PAGED_CANVAS_WASM_FROM="$PWD/.wire-src" node scripts/sync-wire.mjs --check
      # ADR 019's own "still open" item, finally armed. sync-catalog.mjs
      # has sat beside sync-wire.mjs since ADR 019 and was never run by
      # anything, which is how the vendored catalog reached 30 host
      # functions against the engine's 144, 176 settable paths against
      # 202, and four phantom paths no engine has ever accepted.
      #
      # It resolves the SAME version the wire is stamped with — the two
      # packages ship from one core tag — and understands three
      # outcomes, not two: in sync, drifted, or deliberately LEADING the
      # publish while a protocol bump is in flight. The lead must be
      # recorded in catalog.provenance.json with a reason, and it is
      # checked for rot in the other direction too: once the published
      # package catches up, the marker must go or this fails.
      - name: capability-catalog vendoring lockstep (hard gate)
        run: |
          set -e
          VER=$(sed -n 's#^// Synced from @paged-media/canvas-wasm@##p' packages/plugin-api/src/wire.d.ts)
          test -n "$VER" || { echo "wire.d.ts has no version stamp"; exit 1; }
          mkdir -p .catalog-src
          printf '{"name":"catalog-src-scratch","private":true}' > .catalog-src/package.json
          ( cd .catalog-src && npm install "@paged-media/introspect-wasm@$VER" --no-audit --no-fund --no-package-lock )
          PAGED_INTROSPECT_WASM_FROM="$PWD/.catalog-src" node scripts/sync-catalog.mjs --check
      - name: publish changed versions via OIDC (canary)
        run: |
          set -e
          for dir in packages/plugin-api packages/plugin-sdk packages/plugin-cli; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            tgz="$RUNNER_TEMP/$(echo "$name" | sed 's#@##; s#/#-#')-${version}.tgz"
            ( cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" )
            echo "publish $name@$version via OIDC ($tgz)"
            npm publish "$tgz" --tag canary --access public
          done
