# cargo-deny configuration for paged-ooxml (platform/shared/ooxml).
# Run:  cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# The crate is a path dependency of modules/doc, modules/slide and
# modules/sheet; each of those workspaces checks the graph it builds with its
# own deny.toml. This file checks the crate's standalone graph (every
# feature), under the same policy.

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # zip 8.6.0 reaches this crate only through `ooxmlsdk` 0.12.0 (its
    # `parts` feature, which `mce` requires), with the `dom` feature on; no
    # ooxmlsdk release has moved to zip >= 9 yet (0.13.2 still requires zip
    # ^8.6). The crate's own zip dependency is zip 9. All three advisories
    # (2026-10-09/10) are about `ZipArchive::extract` /
    # `ZipStreamReader::extract` writing an archive to the file system.
    # Neither this crate nor ooxmlsdk 0.12.0 calls either function. Remove
    # these three when ooxmlsdk depends on zip >= 9 (modules/doc/deny.toml
    # carries the same three).
    { id = "RUSTSEC-2026-0367", reason = "zip 8 via ooxmlsdk only; extract() is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 via ooxmlsdk only; extract() is never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 via ooxmlsdk only; extract() is never called" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# paged is AGPL-3.0-only OR PMEL (ADR PM-0001). Dependencies must be
# permissively licensed (weak copyleft MPL-2.0 at most) so the whole work can
# be distributed under both: the AGPL and the commercial PMEL. No GPL/AGPL
# dependency can pass this gate. ooxmlsdk and its dependencies are MIT /
# Apache-2.0.
allow = [
    "MPL-2.0",
    "LicenseRef-PMEL",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
exceptions = []

# The crate is AGPL-3.0-only OR LicenseRef-PMEL (ADR PM-0001) and unpublished.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
