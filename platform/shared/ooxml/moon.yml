$schema: "../../../.moon/cache/schemas/project.json"

# paged-ooxml: the shared OOXML foundation (OPC container and its memory
# budget, rels, content types, byte splicing, the XML helpers, DrawingML
# colour, and the ooxmlsdk typed DOM behind the `dom` feature). A path
# dependency of modules/doc, modules/slide and modules/sheet, which list its
# sources in their own rust-sources file group.
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "shared"]

project:
  title: "platform/shared/ooxml"
  description: "Shared OOXML foundation of doc, slide and sheet: OPC with a zip-bomb budget, rels, splice, XML helpers, colour."

tasks:
  # A member of the engine's Cargo workspace (docs/development/one-workspace.md):
  # cargo finds the workspace from the crate's manifest, so the tasks select the
  # crate with -p instead of the inherited --workspace / --all.
  rust-fmt:
    command: "cargo fmt -p paged-ooxml --check"
  rust-check:
    command: "cargo check -p paged-ooxml --all-targets --all-features"
  rust-build:
    command: "cargo build -p paged-ooxml --all-features"
  rust-lint:
    command: "cargo clippy -p paged-ooxml --all-targets --all-features -- -D warnings"
  rust-test:
    script: >-
      cargo nextest run -p paged-ooxml --all-features
      && cargo test --doc -p paged-ooxml --all-features
