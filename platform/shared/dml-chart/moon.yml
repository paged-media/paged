$schema: "../../../.moon/cache/schemas/project.json"

# dml-chart: the DrawingML chart model and reader shared by paged.sheet and
# paged.slide (their layout profiles stay in the modules). A path dependency
# of modules/sheet and modules/slide, which list its sources in their own
# rust-sources file group.
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "shared"]

project:
  title: "platform/shared/dml-chart"
  description: "Shared DrawingML chart model and reader of sheet and slide."

dependsOn:
  - id: "ooxml"
    scope: "production"

tasks:
  # A member of the engine's Cargo workspace (docs/development/one-workspace.md):
  # cargo finds the workspace from the crate's manifest, so the tasks select the
  # crate with -p instead of the inherited --workspace / --all.
  rust-fmt:
    command: "cargo fmt -p dml-chart --check"
  rust-check:
    command: "cargo check -p dml-chart --all-targets --all-features"
  rust-build:
    command: "cargo build -p dml-chart --all-features"
  rust-lint:
    command: "cargo clippy -p dml-chart --all-targets --all-features -- -D warnings"
  rust-test:
    script: >-
      cargo nextest run -p dml-chart --all-features
      && cargo test --doc -p dml-chart --all-features
