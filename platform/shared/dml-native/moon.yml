$schema: "../../../.moon/cache/schemas/project.json"

# dml-native: the one DrawingML-to-engine mapper (slide ADR 722). It lowers
# paged-ooxml's neutral resolved paint onto paged-model. A path dependency
# of modules/slide, modules/doc (doc ADR 618) and modules/sheet (sheet ADR 527),
# which list its sources in their own rust-sources file group.
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "shared"]

project:
  title: "platform/shared/dml-native"
  description: "Shared DrawingML paint and effect mapper of slide, doc and sheet onto the engine model."

dependsOn:
  - id: "ooxml"
    scope: "production"
  - id: "core"
    scope: "production"

fileGroups:
  rust-sources:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain*"
    - "/.cargo/*.toml"
    - "/platform/shared/ooxml/src/**/*.rs"
    - "/platform/shared/ooxml/Cargo.toml"
    - "/engine/core/Cargo.toml"
    - "/engine/core/crates/paged-model/**/*.rs"
    - "/engine/core/crates/paged-model/Cargo.toml"

tasks:
  # A member of the engine's Cargo workspace (docs/development/one-workspace.md):
  # cargo finds the workspace from the crate's manifest, so the tasks select the
  # crate with -p instead of the inherited --workspace / --all.
  rust-fmt:
    command: "cargo fmt -p dml-native --check"
  rust-check:
    command: "cargo check -p dml-native --all-targets --all-features"
  rust-build:
    command: "cargo build -p dml-native --all-features"
  rust-lint:
    command: "cargo clippy -p dml-native --all-targets --all-features -- -D warnings"
  rust-test:
    script: >-
      cargo nextest run -p dml-native --all-features
      && cargo test --doc -p dml-native --all-features
