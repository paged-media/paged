[package]
name = "dml-native"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only OR LicenseRef-PMEL"
publish = false
description = "The one DrawingML-to-engine mapper of paged.slide and paged.doc: paged-ooxml's neutral resolved paint (fills, gradients with alpha stops, patterns, lines, effect lists, picture effects) lowered onto paged-model (swatches, gradient swatches and placement, strokes, drop shadow and FrameEffects), with a loss report for what the engine cannot hold yet, and the inverse for the save paths."

# A workspace of its own, as platform/shared/ooxml and dml-chart are: the
# modules take it as a path dependency (docs/adr/PM-0005). It builds on the
# engine's model crate, a path dependency at the same commit (PM-0014).
[workspace]

[features]
default = []
# A zip backend for paged-ooxml, which requires one, in this crate's own
# build and tests only. The modules choose theirs through their own
# paged-ooxml dependency and never enable this.
standalone = ["paged-ooxml/deflate"]

[dependencies]
paged-ooxml = { path = "../ooxml" }
paged-model = { path = "../../../engine/core/crates/paged-model" }

[dev-dependencies]
paged-ooxml = { path = "../ooxml", features = ["deflate"] }

[lints.clippy]
all = "warn"
