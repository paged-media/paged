$schema: "../../../.moon/cache/schemas/project.json"

# dml-geom: DrawingML preset and custom geometry, adjust handles, connection
# sites and the live-preset arithmetic, shared by paged.slide and (for its
# shapes) paged.doc (PM-0014: the lowest layer every consumer reaches). A path
# dependency of modules/slide, which lists its sources in its own
# rust-sources file group.
language: "rust"
layer: "library"
stack: "systems"
tags: ["rust", "shared"]

project:
  title: "platform/shared/dml-geom"
  description: "Shared DrawingML geometry: presets, handles, connection sites, live presets."

dependsOn:
  - id: "ooxml"
    scope: "production"

tasks:
  # A member of the engine's Cargo workspace (docs/development/one-workspace.md):
  # cargo finds the workspace from the crate's manifest, so the tasks select the
  # crate with -p instead of the inherited --workspace / --all.
  rust-fmt:
    command: "cargo fmt -p dml-geom --check"
  rust-check:
    command: "cargo check -p dml-geom --all-targets --all-features"
  rust-build:
    command: "cargo build -p dml-geom --all-features"
  rust-lint:
    command: "cargo clippy -p dml-geom --all-targets --all-features -- -D warnings"
  rust-test:
    script: >-
      cargo nextest run -p dml-geom --all-features
      && cargo test --doc -p dml-geom --all-features
